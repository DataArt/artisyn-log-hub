[package]
name = "agentbook-core"
description = "AgentBook pure domain model, state file types and algorithms (no I/O, no clock)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "agentbook_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

# Doc-driven algorithm table tests (`npm run test:algo`): rows in docs/algorithm-examples/agentbook-*.json.
[[test]]
name = "algo"
path = "tests/algo.rs"
