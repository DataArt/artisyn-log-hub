# AgentBook release (agentbook/, a separate Rust desktop product — never part of Log Hub's release
# pipeline, image or install kit): builds AgentBook.exe and AgentBook-Setup.exe on a Windows runner
# and attaches both, plus SHA256SUMS, to a GitHub release tagged `agentbook-v<version>`.
#
# Trigger: manual "Run workflow" only (workflow_dispatch, no inputs), from the default branch.
# Version: `[workspace.package] version` in agentbook/Cargo.toml (agentbook/scripts/version.mjs).
# A release for that version that already exists fails the run: bump the version first. A tag that
# already exists must point at this commit.
# The release is never marked "latest": that stays Log Hub's (its install scripts and release.yml
# rely on it). `agentbook-v*` tags are not strict `vX.Y.Z` tags, so Log Hub's release-version.js
# ignores them. Neither exe is code-signed (External surface, Distribution).
# Jobs: build (windows-2025: lint, algorithm tests, npm run build) -> publish (tag + release).
name: agentbook-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentbook-release
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: agentbook
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require the default branch
        working-directory: .
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::agentbook-release runs only on refs/heads/$DEFAULT_BRANCH, got $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          set -eu
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Version
        id: version
        run: |
          set -eu
          version=$(node scripts/version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "AgentBook $version"

      - name: Lint
        run: npm run lint

      - name: Algorithm tests
        run: npm run test:algo

      - name: Build (AgentBook.exe, AgentBook-Setup.exe)
        run: npm run build

      - name: Collect the exes and SHA256SUMS
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/agentbook"
          cp target/release/AgentBook.exe target/release/AgentBook-Setup.exe "$RUNNER_TEMP/agentbook/"
          (cd "$RUNNER_TEMP/agentbook" && sha256sum AgentBook.exe AgentBook-Setup.exe > SHA256SUMS)
          cat "$RUNNER_TEMP/agentbook/SHA256SUMS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentbook-exes
          path: ${{ runner.temp }}/agentbook
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentbook-exes
          path: ${{ runner.temp }}/agentbook

      # Through the REST API (no checkout holds a write credential). A tag that already exists
      # (a re-run after a failed release step) must point at this commit.
      - name: Create the tag
        run: |
          set -eu
          tag="agentbook-v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::release $tag already exists: bump [workspace.package] version in agentbook/Cargo.toml"
            exit 1
          fi
          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            if [ "$existing" != "$SHA" ]; then
              echo "::error::tag $tag already exists on $existing, not on $SHA"
              exit 1
            fi
            echo "tag $tag already exists on $SHA"
          else
            gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SHA"
          fi

      - name: Create the release
        run: |
          set -eu
          tag="agentbook-v$VERSION"
          dir="$RUNNER_TEMP/agentbook"
          {
            echo "AgentBook $VERSION for Windows (x64)."
            echo
            echo "- \`AgentBook-Setup.exe\`: installs AgentBook for the current user (no admin rights) into"
            echo "  \`%LOCALAPPDATA%\\Programs\\AgentBook\\\` with a Start-menu shortcut. Running a newer setup keeps"
            echo "  your folders and laptops."
            echo "- \`AgentBook.exe\`: the same program, runs without installation."
            echo
            echo "Neither file is code-signed: Windows SmartScreen may ask you to confirm (More info, Run anyway)."
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat "$dir/SHA256SUMS"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --verify-tag --latest=false --title "AgentBook $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$dir/AgentBook.exe" "$dir/AgentBook-Setup.exe" "$dir/SHA256SUMS"
          echo "Released $tag" >> "$GITHUB_STEP_SUMMARY"
