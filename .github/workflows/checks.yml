# Fast checks (FR-5): typechecks and algorithm tests of every package — the gate for a merge into
# main / release and the first gate of every release run.
#
# Triggers: pull_request into main or release (no path filter — this is a required check, and a
# required check that a path filter skips never reports), and workflow_call from release.yml
# (job `checks`), so a release is never built from a commit that fails these checks.
# Required check: the job `fast-checks` — the status-check name in the `protect-main-release`
# ruleset next to `scan`.
#
# The job `db-state` is the one exception to "no DB": see its own comment below. The job
# `work-hub-fast` checks the separate Work Hub product (work-hub/): see its own comment below.
#
# fast-checks: no secrets, no DB, no dev app: the same `static` checks as .claude/repo_config/repo-health-checks.json
# (minus lint). A called workflow does not inherit the caller's `env`, hence its own BUN_VERSION.
# No top-level concurrency: a release run must never be cancelled by a PR run (or vice versa).
# Rules: docs/tasks/todo/2026-10-20-github-release-pipeline/impl-plan.md (Design Decisions 1-2).
name: checks

on:
  pull_request:
    branches: [main, release]
  workflow_call:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  fast-checks:
    name: fast-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      # The server tsBuildInfoFile writes to ../tmp.
      - name: Create tmp/
        run: mkdir -p tmp

      - name: Install dependencies
        run: |
          set -eu
          npm ci --ignore-scripts
          (cd server && npm ci --ignore-scripts)
          (cd client && bun install --frozen-lockfile --ignore-scripts)

      # A broken user-docs link, dataset figure or site placeholder fails the PR here, not only the
      # post-merge Pages deploy (pages.yml). Generator in --check mode writes nothing.
      - name: User docs and site
        run: |
          set -eu
          node scripts/user-docs/generate-help.js --check
          npm run build:site -- --out tmp/site-check

      - name: Client typecheck
        working-directory: client
        run: bun run typecheck

      - name: Client algorithm tests
        working-directory: client
        run: bun run test

      - name: Server typecheck
        working-directory: server
        run: npm run typecheck

      - name: Server algorithm tests
        working-directory: server
        run: npm run test

      - name: Tests typecheck
        run: npm run typecheck:tests

      - name: Build-script tests
        run: npm run test:scripts

      - name: Hook algorithm tests
        working-directory: hook
        run: npm test

  # Work Hub (work-hub/, NFR-4/NFR-5): its own product with its own toolchain, so its own job — it
  # is never part of fast-checks, the root build or Log Hub's dist/. The same `static` checks as the
  # work-hub-* entries of .claude/repo_config/repo-health-checks.json except the release build: lint
  # (rustfmt, clippy, eslint, agent-name and licence checks), typecheck and the algorithm tests. No
  # DB, no Docker: the Rust build embeds the SPA with allow_missing, so web/dist is not needed.
  # Rust comes from work-hub/rust-toolchain.toml (1.92.0 + rustfmt + clippy) through the rustup
  # preinstalled on the runner — `rustup toolchain install` with no argument reads that file.
  work-hub-fast:
    name: work-hub-fast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: work-hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          set -eu
          rustup toolchain install
          rustc --version
          cargo --version

      # The web eslint cache is written to ../../tmp (the repo's tmp/).
      - name: Create tmp/
        working-directory: .
        run: mkdir -p tmp

      - name: Install dependencies
        run: |
          set -eu
          npm ci --ignore-scripts
          (cd web && bun install --frozen-lockfile --ignore-scripts)

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Algorithm tests
        run: npm run test:algo

  # docs/knowledgebase/db_state.sql must match the migrations: a new migration without a regenerated
  # file (or a hand edit of it) fails here. Its own job, because fast-checks runs without a DB. The
  # generator migrates a throw-away database on the service Postgres with the server's own
  # `npm run migrate` and compares the DDL it reads back. Keep the Postgres major in step with the
  # dev DB and the production image: the catalog's DDL text can differ between majors.
  # Required check: `db-state`, next to `fast-checks` in the `protect-main-release` ruleset.
  db-state:
    name: db-state
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.7@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install dependencies
        run: |
          set -eu
          npm ci --ignore-scripts
          (cd server && npm ci --ignore-scripts)

      - name: db_state.sql is up to date
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run db:state -- --check
