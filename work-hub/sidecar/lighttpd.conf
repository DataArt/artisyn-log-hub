server.modules = ("mod_alias", "mod_cgi")
server.document-root = "/var/www"
server.port = 80
server.username = "lighttpd"
server.groupname = "lighttpd"
# No access log module: the proxy never logs request headers (capabilities) or bodies.
alias.url = ("/git" => "/usr/local/bin/wh-git-cgi")
$HTTP["url"] =~ "^/git(/|$)" {
  cgi.assign = ("" => "")
}
