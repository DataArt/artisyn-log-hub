<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="1440" height="720" fill="#ffffff"/>
  <!-- top nav -->
  <rect x="0" y="0" width="1440" height="48" fill="#fafafa"/>
  <line x1="0" y1="48" x2="1440" y2="48" stroke="#e5e5e5"/>
  <circle cx="24" cy="24" r="8" fill="#3b4bd8"/>
  <text x="44" y="29" font-size="14" font-weight="600" fill="#111">[local] Artisyn Log Hub</text>
  <text x="196" y="29" font-size="12" fill="#888">dev</text>
  <circle cx="1060" cy="24" r="7" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="1205" y="29" font-size="13" fill="#666" text-anchor="end">admin@example.com</text>
  <text x="1349" y="29" font-size="13" font-weight="600" fill="#111">Edit email</text>

  <!-- sidebar -->
  <rect x="0" y="49" width="320" height="671" fill="#ffffff"/>
  <line x1="321" y1="49" x2="321" y2="720" stroke="#e5e5e5" stroke-width="4"/>
  <rect x="0" y="90" width="320" height="28" fill="#f5f5f5"/>
  <text x="12" y="109" font-size="12" fill="#888">TEAMS</text>
  <text x="50" y="142" font-size="14" fill="#333">Platform Team</text>
  <text x="50" y="174" font-size="14" fill="#333">LogHub Demo</text>
  <text x="34" y="206" font-size="14" fill="#333">+  Add Team</text>
  <rect x="0" y="222" width="320" height="28" fill="#f5f5f5"/>
  <text x="30" y="241" font-size="12" fill="#888">MY REPOS</text>
  <text x="12" y="274" font-size="13" fill="#333">https://github.com/acme/web-app</text>
  <text x="12" y="306" font-size="13" fill="#333">https://github.com/acme/api-server</text>
  <text x="34" y="338" font-size="14" fill="#333">Import repo sessions</text>

  <!-- removed accordion marker -->
  <rect x="6" y="352" width="308" height="34" rx="4" fill="#fff5f5" stroke="#dc2626" stroke-dasharray="5 4"/>
  <text x="30" y="374" font-size="12" fill="#dc2626" text-decoration="line-through">TEAMS AS ADMIN</text>
  <text x="150" y="374" font-size="11" fill="#dc2626">removed (FR-5)</text>

  <text x="34" y="414" font-size="14" fill="#333">My API Keys</text>
  <rect x="0" y="428" width="320" height="28" fill="#f5f5f5"/>
  <text x="30" y="447" font-size="12" fill="#888">INSTALLED HOOKS</text>
  <circle cx="16" cy="476" r="3" fill="#16a34a"/>
  <text x="26" y="481" font-size="13" fill="#333">https://github.com/acme/web-app</text>
  <text x="294" y="481" font-size="10" fill="#16a34a">OK</text>
  <text x="34" y="520" font-size="14" fill="#333">Admin Panel</text>

  <!-- note on sidebar -->
  <rect x="12" y="560" width="296" height="120" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="24" y="582" font-size="12" font-weight="600" fill="#5b21b6">Admin's sidebar (FR-3, FR-4, FR-5)</text>
  <text x="24" y="602" font-size="12" fill="#5b21b6">Teams: only teams the admin is a member of.</text>
  <text x="24" y="620" font-size="12" fill="#5b21b6">My Repos: only repos the admin owns.</text>
  <text x="24" y="638" font-size="12" fill="#5b21b6">Other users' private repos never appear here,</text>
  <text x="24" y="656" font-size="12" fill="#5b21b6">only as rows in Admin Panel → Repos.</text>

  <!-- Teams page -->
  <circle cx="358" cy="86" r="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="377" y="94" font-size="20" font-weight="600" fill="#111">Teams</text>
  <rect x="446" y="76" width="94" height="22" rx="11" fill="#fff5f5" stroke="#dc2626" stroke-dasharray="4 3"/>
  <text x="456" y="91" font-size="11" fill="#dc2626" text-decoration="line-through">View as Admin</text>
  <text x="552" y="91" font-size="11" fill="#dc2626">badge removed (FR-5)</text>

  <rect x="349" y="126" width="1067" height="68" rx="6" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="366" y="156" font-size="14" font-weight="600" fill="#111">Platform Team</text>
  <text x="366" y="176" font-size="12" fill="#666">Owner</text>
  <text x="1346" y="166" font-size="14" fill="#dc2626">Delete</text>

  <rect x="349" y="204" width="1067" height="68" rx="6" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="366" y="234" font-size="14" font-weight="600" fill="#111">LogHub Demo</text>
  <text x="366" y="254" font-size="12" fill="#666">Member</text>

  <!-- removed section -->
  <rect x="349" y="296" width="1067" height="104" rx="6" fill="#fff5f5" stroke="#dc2626" stroke-dasharray="6 4"/>
  <text x="366" y="322" font-size="14" fill="#dc2626" text-decoration="line-through">Teams as Admin</text>
  <rect x="366" y="334" width="700" height="50" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="382" y="356" font-size="13" fill="#dc2626" text-decoration="line-through">Other-Team</text>
  <text x="382" y="374" font-size="11" fill="#dc2626" text-decoration="line-through">Admin</text>
  <text x="1086" y="364" font-size="12" fill="#dc2626">Whole section removed (FR-5).</text>
  <text x="1086" y="382" font-size="12" fill="#dc2626">Non-member teams are not listed.</text>

  <rect x="349" y="430" width="640" height="104" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="366" y="454" font-size="12" font-weight="600" fill="#5b21b6">Teams page for an admin = same as for any user</text>
  <text x="366" y="474" font-size="12" fill="#5b21b6">Lists only teams the admin belongs to, with their team role (Owner / Manager /</text>
  <text x="366" y="492" font-size="12" fill="#5b21b6">ADLC trainer / Member). Team detail opens with that role's rights only —</text>
  <text x="366" y="510" font-size="12" fill="#5b21b6">no "Viewing as Admin" mode. Non-member team info: see Open Questions.</text>
</svg>
