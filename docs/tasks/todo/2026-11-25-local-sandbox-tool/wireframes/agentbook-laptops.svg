<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1000" viewBox="0 0 1040 1000" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <!-- Wireframe: AgentBook folder view for one shared folder - laptop cards (FR-2, FR-4, FR-6, FR-8, FR-11, FR-12), and the Sleep confirmation for a laptop with attached sessions. Light theme. Laptop icons: the kawaii character from agentbook-laptop-icons.svg. -->
  <defs>
    <symbol id="lt-work" viewBox="0 0 72 48">
      <rect x="8" y="3" width="48" height="33" rx="6" fill="#eef1fb" stroke="#3358cc" stroke-width="2.5"/>
      <ellipse cx="24" cy="18" rx="3.2" ry="4.2" fill="#1e293b"/>
      <ellipse cx="40" cy="18" rx="3.2" ry="4.2" fill="#1e293b"/>
      <circle cx="25.2" cy="16.3" r="1.3" fill="#fff"/>
      <circle cx="41.2" cy="16.3" r="1.3" fill="#fff"/>
      <ellipse cx="17.5" cy="25.5" rx="3.6" ry="2" fill="#fda4af" opacity="0.8"/>
      <ellipse cx="46.5" cy="25.5" rx="3.6" ry="2" fill="#fda4af" opacity="0.8"/>
      <path d="M28.5 25 Q32 29.5 35.5 25" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <rect x="2" y="36" width="60" height="7" rx="3.5" fill="#3358cc"/>
      <rect x="26" y="36" width="12" height="2.5" rx="1.2" fill="#c7d2fe"/>
    </symbol>
    <symbol id="lt-sleep" viewBox="0 0 72 48">
      <rect x="8" y="11" width="48" height="25" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
      <path d="M19.5 21 Q24 25 28.5 21" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <path d="M35.5 21 Q40 25 44.5 21" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="17.5" cy="27.5" rx="3.6" ry="2" fill="#fda4af" opacity="0.7"/>
      <ellipse cx="46.5" cy="27.5" rx="3.6" ry="2" fill="#fda4af" opacity="0.7"/>
      <path d="M30 29 Q32 31 34 29" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="2" y="36" width="60" height="7" rx="3.5" fill="#94a3b8"/>
      <rect x="26" y="36" width="12" height="2.5" rx="1.2" fill="#e2e8f0"/>
      <text x="56" y="14" font-size="8" font-weight="700" fill="#818cf8">z</text>
      <text x="62" y="8" font-size="11" font-weight="700" fill="#6366f1">Z</text>
    </symbol>
  </defs>
  <rect width="1040" height="1000" fill="#ffffff"/>

  <!-- Window title bar -->
  <rect x="0" y="0" width="1040" height="32" fill="#f4f4f5"/>
  <line x1="0" y1="32" x2="1040" y2="32" stroke="#e4e4e7"/>
  <text x="14" y="21" fill="#52525b">AgentBook</text>
  <text x="960" y="21" fill="#71717a">—   ☐   ✕</text>

  <!-- Top bar -->
  <line x1="0" y1="80" x2="1040" y2="80" stroke="#e4e4e7"/>
  <circle cx="26" cy="56" r="9" fill="#3358cc"/>
  <text x="44" y="61" font-weight="600" font-size="15" fill="#09090b">AgentBook</text>
  <text x="130" y="61" fill="#71717a">›</text>
  <text x="146" y="61" fill="#3358cc">All folders</text>
  <text x="222" y="61" fill="#71717a">›</text>
  <text x="238" y="61" fill="#09090b">📁 q3-analysis</text>
  <text x="960" y="61" fill="#09090b">ⓘ Help</text>

  <!-- Shared folder card -->
  <rect x="24" y="100" width="992" height="76" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="44" y="128" font-size="15" font-weight="600" fill="#09090b">⇄ 📁 Shared folder: q3-analysis</text>
  <text x="44" y="150" fill="#52525b">C:\Users\anna\Projects\q3-analysis  ·  you and the agent both see it, changes are instant</text>
  <text x="44" y="166" font-size="12" fill="#71717a">Agent starts in: q3-analysis/reports (has .claude/)  ·  Equipment: from the project (.devcontainer)</text>
  <rect x="712" y="124" width="130" height="30" rx="6" fill="#fff" stroke="#d4d4d8"/>
  <text x="728" y="144" fill="#09090b">🔑 Variables…</text>
  <rect x="852" y="124" width="144" height="30" rx="6" fill="#fff" stroke="#d4d4d8"/>
  <text x="866" y="144" fill="#09090b">Open in Explorer ↗</text>

  <!-- Section header -->
  <text x="24" y="212" font-size="11" font-weight="600" fill="#71717a">LAPTOPS  (2)</text>
  <rect x="860" y="192" width="156" height="32" rx="6" fill="#3358cc"/>
  <use href="#lt-work" x="874" y="201" width="21" height="14"/>
  <text x="900" y="213" fill="#fff" font-weight="600">+ Get a laptop</text>

  <!-- ===== Laptop card 1: Working ===== -->
  <rect x="24" y="236" width="488" height="300" rx="8" fill="#fff" stroke="#3358cc"/>
  <use href="#lt-work" x="40" y="250" width="54" height="36"/>
  <text x="104" y="268" font-size="15" font-weight="600" fill="#09090b">Q3 reports</text>
  <text x="194" y="268" fill="#71717a">✎ rename</text>
  <rect x="412" y="250" width="80" height="28" rx="6" fill="#fff" stroke="#d4d4d8"/>
  <text x="428" y="269" fill="#09090b">⏾ Sleep</text>
  <circle cx="108" cy="286" r="5" fill="#16a34a"/>
  <text x="118" y="291" fill="#166534" font-weight="600">Working</text>
  <text x="182" y="291" fill="#52525b">·  2 Claude Desktop sessions attached</text>
  <line x1="44" y1="306" x2="492" y2="306" stroke="#e4e4e7"/>
  <text x="44" y="328" font-size="11" font-weight="600" fill="#71717a">REPOS IN SHARED FOLDER</text>
  <text x="44" y="348" fill="#09090b">repo-a: feature/q3 · 3 uncommitted</text>
  <text x="44" y="368" fill="#09090b">repo-b: main · clean</text>
  <text x="44" y="396" font-size="11" font-weight="600" fill="#71717a">GIVEN FOLDERS</text>
  <text x="44" y="416" fill="#09090b">📁 D:\Mockups\q3</text>
  <text x="196" y="416" fill="#52525b">✎ Can change</text>
  <text x="44" y="436" fill="#09090b">📁 D:\Data\exports</text>
  <text x="196" y="436" fill="#52525b">👁 View only</text>
  <line x1="44" y1="456" x2="492" y2="456" stroke="#e4e4e7"/>
  <rect x="44" y="472" width="146" height="34" rx="6" fill="#3358cc"/>
  <text x="62" y="494" fill="#fff" font-weight="600">Open laptop  ↗</text>
  <rect x="200" y="472" width="190" height="34" rx="6" fill="#fff" stroke="#3358cc"/>
  <text x="216" y="494" fill="#3358cc" font-weight="600">⧉ Another laptop like this</text>
  <rect x="452" y="472" width="40" height="34" rx="6" fill="#eef1fb" stroke="#3358cc"/>
  <text x="464" y="494" fill="#09090b">⋯</text>
  <!-- open "⋯" menu (opens upward over the empty right side of the card) -->
  <rect x="300" y="320" width="192" height="144" rx="6" fill="#fff" stroke="#d4d4d8"/>
  <text x="314" y="344" fill="#09090b">✎ Rename</text>
  <text x="314" y="372" fill="#09090b">🔑 Variables…</text>
  <text x="314" y="400" fill="#92400e">📁 Give a folder now…</text>
  <line x1="300" y1="416" x2="492" y2="416" stroke="#e4e4e7"/>
  <text x="314" y="446" fill="#991b1b">✕ Remove laptop…</text>

  <!-- ===== Laptop card 2: Sleeping ===== -->
  <rect x="528" y="236" width="488" height="300" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
  <use href="#lt-sleep" x="544" y="250" width="54" height="36"/>
  <text x="608" y="268" font-size="15" font-weight="600" fill="#52525b">Mockups</text>
  <text x="680" y="268" fill="#71717a">✎ rename</text>
  <rect x="876" y="250" width="120" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="890" y="270" fill="#92400e" font-weight="600">⏰☕ Wake up</text>
  <circle cx="612" cy="286" r="5" fill="#a1a1aa"/>
  <text x="622" y="291" fill="#71717a" font-weight="600">Sleeping</text>
  <text x="686" y="291" fill="#71717a">·  put to sleep at 11:20</text>
  <line x1="548" y1="306" x2="996" y2="306" stroke="#e4e4e7"/>
  <text x="548" y="328" font-size="11" font-weight="600" fill="#71717a">REPOS IN SHARED FOLDER</text>
  <text x="548" y="348" fill="#52525b">repo-a: main · clean</text>
  <text x="548" y="368" fill="#52525b">repo-b: main · clean</text>
  <text x="548" y="396" font-size="11" font-weight="600" fill="#71717a">GIVEN FOLDERS</text>
  <text x="548" y="416" fill="#71717a">None yet</text>
  <line x1="548" y1="456" x2="996" y2="456" stroke="#e4e4e7"/>
  <rect x="548" y="472" width="146" height="34" rx="6" fill="#3358cc"/>
  <text x="566" y="494" fill="#fff" font-weight="600">Open laptop  ↗</text>
  <rect x="704" y="472" width="190" height="34" rx="6" fill="#fff" stroke="#3358cc"/>
  <text x="720" y="494" fill="#3358cc" font-weight="600">⧉ Another laptop like this</text>
  <rect x="956" y="472" width="40" height="34" rx="6" fill="#fff" stroke="#d4d4d8"/>
  <text x="968" y="494" fill="#09090b">⋯</text>
  <text x="548" y="526" font-size="12" fill="#71717a">"Open laptop" wakes it and opens Claude Desktop; "Wake up" only wakes it.</text>

  <!-- Help notes -->
  <rect x="24" y="556" width="992" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="580" fill="#1e40af" font-weight="600">ⓘ Good to know</text>
  <text x="44" y="600" fill="#1e40af">Changes in shared and given folders appear on your computer at once. Commit and push from your computer as usual.</text>
  <text x="44" y="618" fill="#1e40af">Laptops with the same shared folder work on the same files. Don't give two laptops the same job.</text>

  <!-- Status bar -->
  <line x1="0" y1="652" x2="1040" y2="652" stroke="#e4e4e7"/>
  <circle cx="30" cy="672" r="5" fill="#16a34a"/>
  <text x="42" y="677" font-size="12" fill="#52525b">Docker engine: Rancher Desktop  ·  Claude Desktop 2.2560.0  ·  OpenSSH 9.5</text>

  <!-- ===== STATE: Sleep on a laptop with attached sessions ===== -->
  <text x="24" y="708" font-size="12" font-weight="600" fill="#71717a">STATE: "⏾ Sleep" on "Q3 reports" while 2 Claude Desktop sessions are attached</text>
  <rect x="220" y="722" width="600" height="232" rx="10" fill="#fff" stroke="#d4d4d8"/>
  <use href="#lt-work" x="244" y="738" width="30" height="20"/>
  <text x="282" y="754" font-size="16" font-weight="600" fill="#09090b">Put "Q3 reports" to sleep?</text>
  <text x="792" y="754" fill="#71717a">✕</text>
  <text x="244" y="782" fill="#52525b">Someone is still using this laptop in Claude Desktop.</text>
  <rect x="244" y="796" width="552" height="70" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="260" y="822" fill="#92400e">⚠ 2 Claude Desktop sessions disconnect; the agent stops mid-task.</text>
  <text x="260" y="848" fill="#92400e">⚠ Programs the agent left running (servers, builds) stop.</text>
  <text x="244" y="890" fill="#166534">✓ Files and what the agent installed stay. Wake it up any time.</text>
  <line x1="220" y1="906" x2="820" y2="906" stroke="#e4e4e7"/>
  <text x="244" y="937" font-size="12" fill="#71717a">With no session attached, Sleep acts at once.</text>
  <rect x="598" y="918" width="84" height="30" rx="6" fill="#fff" stroke="#d4d4d8"/>
  <text x="618" y="938" fill="#09090b">Cancel</text>
  <rect x="690" y="918" width="106" height="30" rx="6" fill="#3358cc"/>
  <text x="706" y="938" fill="#fff" font-weight="600">⏾ Sleep now</text>

  <text x="24" y="986" font-size="12" fill="#71717a">Wireframe — FR-2, FR-4, FR-6, FR-8, FR-11, FR-12, AC-11. Explicit Sleep / Wake up (no automatic sleep); Variables, on-the-go give and Remove in "⋯".</text>
</svg>
