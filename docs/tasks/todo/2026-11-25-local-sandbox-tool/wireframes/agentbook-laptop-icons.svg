<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <!-- Wireframe: the AgentBook kawaii laptop character (FR-11) in its four states. The same <symbol> set is used in every AgentBook wireframe (tiles, cards, dialogs, buttons). Light theme. -->
  <defs>
    <symbol id="lt-work" viewBox="0 0 72 48">
      <rect x="8" y="3" width="48" height="33" rx="6" fill="#eef1fb" stroke="#3358cc" stroke-width="2.5"/>
      <ellipse cx="24" cy="18" rx="3.2" ry="4.2" fill="#1e293b"/>
      <ellipse cx="40" cy="18" rx="3.2" ry="4.2" fill="#1e293b"/>
      <circle cx="25.2" cy="16.3" r="1.3" fill="#fff"/>
      <circle cx="41.2" cy="16.3" r="1.3" fill="#fff"/>
      <ellipse cx="17.5" cy="25.5" rx="3.6" ry="2" fill="#fda4af" opacity="0.8"/>
      <ellipse cx="46.5" cy="25.5" rx="3.6" ry="2" fill="#fda4af" opacity="0.8"/>
      <path d="M28.5 25 Q32 29.5 35.5 25" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <rect x="2" y="36" width="60" height="7" rx="3.5" fill="#3358cc"/>
      <rect x="26" y="36" width="12" height="2.5" rx="1.2" fill="#c7d2fe"/>
    </symbol>
    <symbol id="lt-sleep" viewBox="0 0 72 48">
      <rect x="8" y="11" width="48" height="25" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
      <path d="M19.5 21 Q24 25 28.5 21" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <path d="M35.5 21 Q40 25 44.5 21" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="17.5" cy="27.5" rx="3.6" ry="2" fill="#fda4af" opacity="0.7"/>
      <ellipse cx="46.5" cy="27.5" rx="3.6" ry="2" fill="#fda4af" opacity="0.7"/>
      <path d="M30 29 Q32 31 34 29" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="2" y="36" width="60" height="7" rx="3.5" fill="#94a3b8"/>
      <rect x="26" y="36" width="12" height="2.5" rx="1.2" fill="#e2e8f0"/>
      <text x="56" y="14" font-size="8" font-weight="700" fill="#818cf8">z</text>
      <text x="62" y="8" font-size="11" font-weight="700" fill="#6366f1">Z</text>
    </symbol>
    <symbol id="lt-build" viewBox="0 0 72 48">
      <rect x="8" y="3" width="48" height="33" rx="6" fill="#eef1fb" stroke="#3358cc" stroke-width="2.5"/>
      <ellipse cx="24" cy="17" rx="3.2" ry="4.2" fill="#1e293b"/>
      <ellipse cx="40" cy="17" rx="3.2" ry="4.2" fill="#1e293b"/>
      <circle cx="25.2" cy="15.3" r="1.3" fill="#fff"/>
      <circle cx="41.2" cy="15.3" r="1.3" fill="#fff"/>
      <ellipse cx="17.5" cy="25" rx="3.6" ry="2" fill="#fda4af" opacity="0.8"/>
      <ellipse cx="46.5" cy="25" rx="3.6" ry="2" fill="#fda4af" opacity="0.8"/>
      <ellipse cx="32" cy="27" rx="2.2" ry="2.6" fill="#1e293b"/>
      <rect x="2" y="36" width="60" height="7" rx="3.5" fill="#3358cc"/>
      <rect x="26" y="36" width="12" height="2.5" rx="1.2" fill="#c7d2fe"/>
      <path d="M64 1 l1.8 5 l5 1.8 l-5 1.8 l-1.8 5 l-1.8 -5 l-5 -1.8 l5 -1.8 z" fill="#facc15"/>
    </symbol>
    <symbol id="lt-fail" viewBox="0 0 72 48">
      <rect x="8" y="3" width="48" height="33" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
      <path d="M19.5 12.5 L27.5 10" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M36.5 10 L44.5 12.5" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
      <ellipse cx="24" cy="18" rx="2.6" ry="3.2" fill="#475569"/>
      <ellipse cx="40" cy="18" rx="2.6" ry="3.2" fill="#475569"/>
      <ellipse cx="17.5" cy="25.5" rx="3.6" ry="2" fill="#fda4af" opacity="0.6"/>
      <ellipse cx="46.5" cy="25.5" rx="3.6" ry="2" fill="#fda4af" opacity="0.6"/>
      <path d="M28.5 29 Q32 25.5 35.5 29" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <path d="M44.5 21.5 q2.2 3.4 0 5 q-2.2 -1.6 0 -5 z" fill="#93c5fd"/>
      <rect x="2" y="36" width="60" height="7" rx="3.5" fill="#94a3b8"/>
      <rect x="26" y="36" width="12" height="2.5" rx="1.2" fill="#e2e8f0"/>
    </symbol>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>

  <text x="24" y="36" font-size="18" font-weight="600" fill="#09090b">The AgentBook laptop — one kawaii character, four states</text>
  <text x="24" y="58" fill="#52525b">The same drawing is used on home-screen tiles, laptop cards, dialogs and buttons.</text>

  <!-- Big icons: columns centred at 130, 370, 610, 850 -->
  <use href="#lt-work" x="50" y="86" width="180" height="120"/>
  <use href="#lt-sleep" x="290" y="86" width="180" height="120"/>
  <use href="#lt-build" x="530" y="86" width="180" height="120"/>
  <use href="#lt-fail" x="770" y="86" width="180" height="120"/>

  <text x="130" y="238" text-anchor="middle" font-weight="600" fill="#166534">Working</text>
  <text x="130" y="258" text-anchor="middle" font-size="12" fill="#71717a">lit blue screen, open eyes</text>
  <text x="130" y="274" text-anchor="middle" font-size="12" fill="#71717a">with highlights, blush, smile</text>

  <text x="370" y="238" text-anchor="middle" font-weight="600" fill="#52525b">Sleeping</text>
  <text x="370" y="258" text-anchor="middle" font-size="12" fill="#71717a">grey lid half-closed, eyes shut</text>
  <text x="370" y="274" text-anchor="middle" font-size="12" fill="#71717a">(arcs), blush, small "z Z"</text>

  <text x="610" y="238" text-anchor="middle" font-weight="600" fill="#3358cc">Getting equipment…</text>
  <text x="610" y="258" text-anchor="middle" font-size="12" fill="#71717a">eyes open, small "o" mouth,</text>
  <text x="610" y="274" text-anchor="middle" font-size="12" fill="#71717a">sparkle — build in progress</text>

  <text x="850" y="238" text-anchor="middle" font-weight="600" fill="#991b1b">Not started</text>
  <text x="850" y="258" text-anchor="middle" font-size="12" fill="#71717a">worried brows, frown,</text>
  <text x="850" y="274" text-anchor="middle" font-size="12" fill="#71717a">tiny tear — build failed</text>

  <!-- Small sizes -->
  <line x1="24" y1="300" x2="936" y2="300" stroke="#e4e4e7"/>
  <text x="24" y="324" font-size="11" font-weight="600" fill="#71717a">SIZES USED IN THE WIREFRAMES  (card 54 px · tile 36 px · button 21 px)</text>
  <use href="#lt-work" x="64" y="340" width="54" height="36"/>
  <use href="#lt-work" x="128" y="352" width="36" height="24"/>
  <use href="#lt-work" x="174" y="362" width="21" height="14"/>
  <use href="#lt-sleep" x="304" y="340" width="54" height="36"/>
  <use href="#lt-sleep" x="368" y="352" width="36" height="24"/>
  <use href="#lt-sleep" x="414" y="362" width="21" height="14"/>
  <use href="#lt-build" x="544" y="340" width="54" height="36"/>
  <use href="#lt-build" x="608" y="352" width="36" height="24"/>
  <use href="#lt-build" x="654" y="362" width="21" height="14"/>
  <use href="#lt-fail" x="784" y="340" width="54" height="36"/>
  <use href="#lt-fail" x="848" y="352" width="36" height="24"/>
  <use href="#lt-fail" x="894" y="362" width="21" height="14"/>

  <!-- State buttons -->
  <text x="24" y="410" font-size="11" font-weight="600" fill="#71717a">STATE BUTTONS</text>
  <rect x="150" y="396" width="80" height="28" rx="6" fill="#fff" stroke="#d4d4d8"/>
  <text x="166" y="415" fill="#09090b">⏾ Sleep</text>
  <text x="240" y="415" font-size="12" fill="#71717a">on a Working laptop</text>
  <rect x="400" y="396" width="116" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="414" y="415" fill="#92400e" font-weight="600">⏰☕ Wake up</text>
  <text x="526" y="415" font-size="12" fill="#71717a">on a Sleeping laptop (no automatic sleep)</text>

  <text x="24" y="456" font-size="12" fill="#71717a">Wireframe — FR-11 laptop state icons, kawaii style. Same character in every state; used on cards, tiles, dialogs, buttons and the tray/taskbar.</text>
</svg>
