<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <!-- Wireframe: AgentBook first-launch dependency download (FR-10), with the failure state. Light theme. -->
  <rect width="1040" height="620" fill="#ffffff"/>

  <!-- Window title bar -->
  <rect x="0" y="0" width="1040" height="32" fill="#f4f4f5"/>
  <line x1="0" y1="32" x2="1040" y2="32" stroke="#e4e4e7"/>
  <text x="14" y="21" fill="#52525b">AgentBook</text>
  <text x="960" y="21" fill="#71717a">—   ☐   ✕</text>

  <!-- Top bar -->
  <line x1="0" y1="80" x2="1040" y2="80" stroke="#e4e4e7"/>
  <circle cx="26" cy="56" r="9" fill="#3358cc"/>
  <text x="44" y="61" font-weight="600" font-size="15" fill="#09090b">AgentBook</text>
  <text x="960" y="61" fill="#09090b">ⓘ Help</text>

  <text x="120" y="124" font-size="20" font-weight="600" fill="#09090b">Downloading what AgentBook needs (first launch only)</text>
  <text x="120" y="148" fill="#52525b">This happens once. Next time AgentBook starts right away. Total: 142 MB.</text>

  <!-- Table header -->
  <text x="120" y="186" font-size="11" font-weight="600" fill="#71717a">WHAT</text>
  <text x="440" y="186" font-size="11" font-weight="600" fill="#71717a">VERSION</text>
  <text x="560" y="186" font-size="11" font-weight="600" fill="#71717a">SIZE</text>
  <text x="660" y="186" font-size="11" font-weight="600" fill="#71717a">PROGRESS</text>
  <line x1="120" y1="196" x2="920" y2="196" stroke="#e4e4e7"/>

  <!-- Row 1: done -->
  <circle cx="132" cy="220" r="8" fill="#16a34a"/>
  <text x="127" y="224" fill="#fff" font-size="11" font-weight="700">✓</text>
  <text x="150" y="217" fill="#09090b" font-weight="600">Node.js runtime</text>
  <text x="150" y="233" font-size="12" fill="#71717a">runs the devcontainer tool</text>
  <text x="440" y="224" fill="#09090b">22.11.0</text>
  <text x="560" y="224" fill="#09090b">31 MB</text>
  <rect x="660" y="214" width="200" height="8" rx="4" fill="#16a34a"/>
  <text x="872" y="224" font-size="12" fill="#166534">done</text>
  <line x1="120" y1="248" x2="920" y2="248" stroke="#f4f4f5"/>

  <!-- Row 2: in progress -->
  <circle cx="132" cy="272" r="8" fill="#3358cc"/>
  <text x="128" y="276" fill="#fff" font-size="11" font-weight="700">↓</text>
  <text x="150" y="269" fill="#09090b" font-weight="600">@devcontainers/cli</text>
  <text x="150" y="285" font-size="12" fill="#71717a">builds a project's own Equipment (.devcontainer)</text>
  <text x="440" y="276" fill="#09090b">0.72.0</text>
  <text x="560" y="276" fill="#09090b">6 MB</text>
  <rect x="660" y="266" width="200" height="8" rx="4" fill="#e4e4e7"/>
  <rect x="660" y="266" width="120" height="8" rx="4" fill="#3358cc"/>
  <text x="872" y="276" font-size="12" fill="#3358cc">60 %</text>
  <line x1="120" y1="300" x2="920" y2="300" stroke="#f4f4f5"/>

  <!-- Row 3: waiting -->
  <circle cx="132" cy="324" r="8" fill="#e4e4e7"/>
  <text x="150" y="321" fill="#52525b" font-weight="600">Standard Equipment</text>
  <text x="150" y="337" font-size="12" fill="#71717a">Ubuntu LTS with git, curl, Node.js</text>
  <text x="440" y="328" fill="#52525b">24.04</text>
  <text x="560" y="328" fill="#52525b">105 MB</text>
  <rect x="660" y="318" width="200" height="8" rx="4" fill="#e4e4e7"/>
  <text x="872" y="328" font-size="12" fill="#71717a">waiting</text>
  <line x1="120" y1="352" x2="920" y2="352" stroke="#e4e4e7"/>

  <!-- Overall -->
  <text x="120" y="380" fill="#09090b" font-weight="600">Overall</text>
  <rect x="190" y="372" width="670" height="10" rx="5" fill="#e4e4e7"/>
  <rect x="190" y="372" width="170" height="10" rx="5" fill="#3358cc"/>
  <text x="872" y="381" font-size="12" fill="#52525b">35 MB of 142 MB</text>
  <text x="120" y="404" font-size="12" fill="#71717a">Every file is checked before use. Uses your computer's proxy settings.</text>

  <rect x="120" y="420" width="100" height="34" rx="6" fill="#fff" stroke="#d4d4d8"/>
  <text x="146" y="442" fill="#09090b">Cancel</text>
  <text x="236" y="442" fill="#3358cc" text-decoration="underline">What is this? (built-in help)</text>

  <!-- Failure state -->
  <text x="120" y="490" font-size="12" font-weight="600" fill="#71717a">STATE: a download fails</text>
  <rect x="120" y="500" width="800" height="68" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="146" cy="528" r="11" fill="#dc2626"/>
  <text x="141" y="533" fill="#fff" font-weight="700">✕</text>
  <text x="168" y="526" font-weight="600" fill="#991b1b">Could not download Standard Equipment — no internet connection.</text>
  <text x="168" y="546" font-size="12" fill="#b91c1c">Nothing half-downloaded is kept. Check the connection and press Retry.</text>
  <text x="168" y="561" font-size="12" fill="#b91c1c">If only the devcontainer tool is missing, folders without a .devcontainer still work.</text>
  <rect x="836" y="516" width="70" height="30" rx="6" fill="#dc2626"/>
  <text x="852" y="536" fill="#fff" font-weight="600">Retry</text>

  <text x="24" y="604" font-size="12" fill="#71717a">Wireframe — FR-10, AC-17, NFR Offline first. Before and during the first-launch download the user sees exactly what is downloaded: name, version, size, progress.</text>
</svg>
