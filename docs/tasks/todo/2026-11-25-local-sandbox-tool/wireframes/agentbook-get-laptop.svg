<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <!-- Wireframe: "Get a laptop" dialog with given folders chosen up front (FR-8, FR-11), and the same dialog opened from "Another laptop like this", with the warning about copied "Only for one laptop" variable values (FR-11, FR-12, AC-15). Light theme. -->
  <defs>
    <symbol id="lt-work" viewBox="0 0 72 48">
      <rect x="8" y="3" width="48" height="33" rx="6" fill="#eef1fb" stroke="#3358cc" stroke-width="2.5"/>
      <ellipse cx="24" cy="18" rx="3.2" ry="4.2" fill="#1e293b"/>
      <ellipse cx="40" cy="18" rx="3.2" ry="4.2" fill="#1e293b"/>
      <circle cx="25.2" cy="16.3" r="1.3" fill="#fff"/>
      <circle cx="41.2" cy="16.3" r="1.3" fill="#fff"/>
      <ellipse cx="17.5" cy="25.5" rx="3.6" ry="2" fill="#fda4af" opacity="0.8"/>
      <ellipse cx="46.5" cy="25.5" rx="3.6" ry="2" fill="#fda4af" opacity="0.8"/>
      <path d="M28.5 25 Q32 29.5 35.5 25" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <rect x="2" y="36" width="60" height="7" rx="3.5" fill="#3358cc"/>
      <rect x="26" y="36" width="12" height="2.5" rx="1.2" fill="#c7d2fe"/>
    </symbol>
  </defs>
  <rect width="1040" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1040" height="640" fill="#09090b" fill-opacity="0.35"/>

  <!-- ===== Dialog A: Get a laptop (fresh) ===== -->
  <rect x="24" y="24" width="480" height="560" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
  <use href="#lt-work" x="48" y="46" width="27" height="18"/>
  <text x="82" y="60" font-size="16" font-weight="600" fill="#09090b">Get a laptop</text>
  <text x="476" y="60" fill="#71717a">✕</text>
  <text x="48" y="88" fill="#52525b">It sees the shared folder q3-analysis. You can rename it later.</text>

  <text x="48" y="122" font-size="12" font-weight="600" fill="#09090b">Name</text>
  <rect x="48" y="130" width="432" height="34" rx="6" fill="#fff" stroke="#3358cc" stroke-width="2"/>
  <text x="60" y="152" fill="#09090b">Laptop 3</text>
  <line x1="118" y1="138" x2="118" y2="156" stroke="#09090b"/>
  <text x="48" y="182" font-size="12" fill="#71717a">Suggested name; type any text. A duplicate name gets a short note.</text>

  <text x="48" y="218" font-size="12" font-weight="600" fill="#09090b">Give folders  <tspan font-weight="400" fill="#71717a">(optional — best done now, no restart later)</tspan></text>
  <rect x="48" y="228" width="432" height="34" rx="6" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="60" y="250" fill="#09090b">📁 D:\Mockups\q3</text>
  <text x="300" y="250" fill="#52525b">✎ Can change ⌄</text>
  <text x="460" y="250" fill="#991b1b">✕</text>
  <rect x="48" y="270" width="186" height="30" rx="6" fill="#fff" stroke="#d4d4d8" stroke-dasharray="4 3"/>
  <text x="62" y="290" fill="#09090b">📁+ Add a folder…</text>
  <text x="48" y="322" font-size="12" fill="#71717a">The agent works on the real folders; it could change or delete files there.</text>

  <text x="48" y="358" font-size="12" fill="#71717a">Equipment: from the project (.devcontainer) · first start builds it.</text>
  <text x="48" y="378" font-size="12" fill="#71717a">The first time you open a laptop, Claude asks whether you trust it — once.</text>

  <line x1="24" y1="518" x2="504" y2="518" stroke="#e4e4e7"/>
  <text x="48" y="555" font-size="12" fill="#71717a">Enter = Get it and open</text>
  <rect x="234" y="534" width="84" height="32" rx="6" fill="#fff" stroke="#d4d4d8"/>
  <text x="254" y="555" fill="#09090b">Cancel</text>
  <rect x="326" y="534" width="154" height="32" rx="6" fill="#3358cc"/>
  <text x="342" y="555" fill="#fff" font-weight="600">Get it and open  ↗</text>

  <!-- ===== Dialog B: Another laptop like this ===== -->
  <rect x="536" y="24" width="480" height="560" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
  <use href="#lt-work" x="560" y="42" width="21" height="14"/>
  <use href="#lt-work" x="570" y="50" width="21" height="14"/>
  <text x="600" y="60" font-size="16" font-weight="600" fill="#09090b">Another laptop like "Q3 reports"</text>
  <text x="988" y="60" fill="#71717a">✕</text>
  <text x="560" y="88" fill="#52525b">Same setup, fresh laptop: nothing the agent installed is copied.</text>

  <text x="560" y="122" font-size="12" font-weight="600" fill="#09090b">Name</text>
  <rect x="560" y="130" width="432" height="34" rx="6" fill="#fff" stroke="#3358cc" stroke-width="2"/>
  <text x="572" y="152" fill="#09090b">Q3 reports 2</text>

  <text x="560" y="196" font-size="12" font-weight="600" fill="#09090b">Copied from "Q3 reports" — change anything</text>
  <rect x="560" y="206" width="432" height="128" rx="6" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="576" y="230" fill="#52525b">⇄ Shared folder: q3-analysis</text>
  <text x="576" y="254" fill="#09090b">📁 D:\Mockups\q3</text>
  <text x="812" y="254" fill="#52525b">✎ Can change ⌄</text>
  <text x="972" y="254" fill="#991b1b">✕</text>
  <text x="576" y="278" fill="#09090b">📁 D:\Data\exports</text>
  <text x="812" y="278" fill="#52525b">👁 View only ⌄</text>
  <text x="972" y="278" fill="#991b1b">✕</text>
  <text x="576" y="302" fill="#52525b">Equipment: from the project</text>
  <text x="576" y="324" fill="#3358cc">📁+ Add a folder…</text>

  <rect x="560" y="346" width="432" height="56" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="576" y="368" font-size="12" fill="#1e40af">Not copied: programs the agent installed, open sessions, chat history.</text>
  <text x="576" y="388" font-size="12" fill="#1e40af">Both laptops work on the same shared folder — give them different jobs.</text>

  <!-- Copied "Only for one laptop" values warning -->
  <rect x="560" y="414" width="432" height="88" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="576" y="438" fill="#92400e" font-weight="600">⚠ 3 variables set only for "Q3 reports" will be copied:</text>
  <text x="576" y="462" font-family="Consolas, monospace" font-size="12" fill="#92400e">JIRA_PAT ••••••  CONFLUENCE_PAT ••••••  REPORT_YEAR=2026</text>
  <text x="576" y="488" font-size="12" fill="#92400e">Hidden values stay hidden. Change them later in Variables…</text>

  <line x1="536" y1="518" x2="1016" y2="518" stroke="#e4e4e7"/>
  <rect x="746" y="534" width="84" height="32" rx="6" fill="#fff" stroke="#d4d4d8"/>
  <text x="766" y="555" fill="#09090b">Cancel</text>
  <rect x="838" y="534" width="154" height="32" rx="6" fill="#3358cc"/>
  <text x="854" y="555" fill="#fff" font-weight="600">Get it and open  ↗</text>

  <text x="24" y="620" font-size="12" fill="#e4e4e7">Wireframe — FR-8, FR-11, FR-12, AC-14, AC-15. Left: given folders are picked at creation. Right: "Another laptop like this" copies config only and warns about copied per-laptop values.</text>
</svg>
