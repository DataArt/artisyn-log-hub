<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <!-- Wireframe: giving a folder to a working laptop "on the go" (FR-8) with the full list of consequences, and the confirmation for a drive root / home folder. Light theme. -->
  <defs>
    <symbol id="lt-work" viewBox="0 0 72 48">
      <rect x="8" y="3" width="48" height="33" rx="6" fill="#eef1fb" stroke="#3358cc" stroke-width="2.5"/>
      <ellipse cx="24" cy="18" rx="3.2" ry="4.2" fill="#1e293b"/>
      <ellipse cx="40" cy="18" rx="3.2" ry="4.2" fill="#1e293b"/>
      <circle cx="25.2" cy="16.3" r="1.3" fill="#fff"/>
      <circle cx="41.2" cy="16.3" r="1.3" fill="#fff"/>
      <ellipse cx="17.5" cy="25.5" rx="3.6" ry="2" fill="#fda4af" opacity="0.8"/>
      <ellipse cx="46.5" cy="25.5" rx="3.6" ry="2" fill="#fda4af" opacity="0.8"/>
      <path d="M28.5 25 Q32 29.5 35.5 25" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <rect x="2" y="36" width="60" height="7" rx="3.5" fill="#3358cc"/>
      <rect x="26" y="36" width="12" height="2.5" rx="1.2" fill="#c7d2fe"/>
    </symbol>
  </defs>
  <rect width="1040" height="660" fill="#ffffff"/>

  <!-- Window title bar -->
  <rect x="0" y="0" width="1040" height="32" fill="#f4f4f5"/>
  <line x1="0" y1="32" x2="1040" y2="32" stroke="#e4e4e7"/>
  <text x="14" y="21" fill="#52525b">AgentBook</text>
  <text x="960" y="21" fill="#71717a">—   ☐   ✕</text>
  <rect x="0" y="32" width="1040" height="628" fill="#09090b" fill-opacity="0.35"/>

  <!-- ===== Dialog A: give a folder on the go ===== -->
  <rect x="24" y="56" width="480" height="560" rx="10" fill="#ffffff" stroke="#fde68a"/>
  <use href="#lt-work" x="48" y="78" width="27" height="18"/>
  <text x="82" y="92" font-size="16" font-weight="600" fill="#09090b">Give "Q3 reports" a folder now?</text>
  <text x="476" y="92" fill="#71717a">✕</text>
  <text x="48" y="118" fill="#52525b">This laptop is working. Giving it a folder now restarts it.</text>

  <text x="48" y="150" font-size="12" font-weight="600" fill="#09090b">Folder</text>
  <rect x="48" y="158" width="230" height="32" rx="6" fill="#fff" stroke="#d4d4d8"/>
  <text x="60" y="179" fill="#09090b">D:\Mockups\q3</text>
  <rect x="286" y="158" width="76" height="32" rx="6" fill="#fff" stroke="#d4d4d8"/>
  <text x="298" y="179" fill="#09090b">Browse…</text>
  <rect x="370" y="158" width="110" height="32" rx="6" fill="#fff" stroke="#d4d4d8"/>
  <text x="380" y="179" fill="#52525b">✎ Can change ⌄</text>

  <rect x="48" y="206" width="432" height="196" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="64" y="230" fill="#92400e" font-weight="600">What happens if you continue</text>
  <text x="64" y="256" fill="#92400e">⚠ The laptop restarts.</text>
  <text x="64" y="280" fill="#92400e">⚠ 2 Claude Desktop sessions disconnect; the agent's</text>
  <text x="84" y="298" fill="#92400e">current task is interrupted.</text>
  <text x="64" y="322" fill="#92400e">⚠ Programs the agent left running (servers, builds) stop.</text>
  <text x="64" y="346" fill="#92400e">⚠ Programs the agent installed outside its home may be lost.</text>
  <text x="64" y="370" fill="#92400e">⚠ The agent works on the real folder; it could change or</text>
  <text x="84" y="388" fill="#92400e">delete files there.</text>

  <rect x="48" y="418" width="432" height="68" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="442" fill="#1e40af" font-weight="600">Calmer option</text>
  <text x="64" y="462" fill="#1e40af">Get another laptop like this one, with this folder added.</text>
  <text x="64" y="478" font-size="12" fill="#1e40af">"Q3 reports" keeps working untouched.</text>

  <line x1="24" y1="506" x2="504" y2="506" stroke="#e4e4e7"/>
  <rect x="48" y="522" width="230" height="32" rx="6" fill="#3358cc"/>
  <text x="62" y="543" fill="#fff" font-weight="600">⧉ Another laptop like this  ↗</text>
  <rect x="286" y="522" width="194" height="32" rx="6" fill="#fff" stroke="#f59e0b"/>
  <text x="300" y="543" fill="#92400e" font-weight="600">Restart and give folder</text>
  <text x="48" y="584" font-size="12" fill="#71717a">Cancel keeps everything as it is. Changing a folder's mode or</text>
  <text x="48" y="600" font-size="12" fill="#71717a">taking a folder away shows the same list.</text>

  <!-- ===== Dialog B: confirm whole disk / home ===== -->
  <rect x="536" y="56" width="480" height="300" rx="10" fill="#ffffff" stroke="#fecaca"/>
  <text x="560" y="92" font-size="16" font-weight="600" fill="#991b1b">⚠ Give the agent your whole disk?</text>
  <text x="988" y="92" fill="#71717a">✕</text>
  <text x="560" y="120" fill="#09090b">You chose  C:\  — the system drive.</text>
  <text x="560" y="144" fill="#52525b">The agent would see everything on it: your home folder,</text>
  <text x="560" y="162" fill="#52525b">other projects, saved passwords and keys.</text>
  <text x="560" y="190" fill="#52525b">Usually you want a smaller folder, for example</text>
  <text x="560" y="208" fill="#52525b">C:\Users\anna\Desktop\Q3 data.</text>
  <text x="560" y="242" font-size="12" fill="#71717a">Same question for your home folder (C:\Users\anna) or any folder above it,</text>
  <text x="560" y="258" font-size="12" fill="#71717a">both in "Get a laptop" and on the go.</text>
  <line x1="536" y1="288" x2="1016" y2="288" stroke="#e4e4e7"/>
  <rect x="676" y="304" width="150" height="32" rx="6" fill="#3358cc"/>
  <text x="692" y="325" fill="#fff" font-weight="600">Pick another folder</text>
  <rect x="834" y="304" width="158" height="32" rx="6" fill="#fff" stroke="#fecaca"/>
  <text x="850" y="325" fill="#991b1b">Give the whole disk</text>

  <text x="24" y="644" font-size="12" fill="#e4e4e7">Wireframe — FR-8, AC-7, AC-14. Left: on-the-go give, opened from the card's "⋯" menu; every consequence is listed. Right: drive root / home / ancestor.</text>
</svg>
