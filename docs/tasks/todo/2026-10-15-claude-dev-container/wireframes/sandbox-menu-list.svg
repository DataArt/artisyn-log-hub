<rect x="8" y="466" width="851.1999999999999" height="162" rx="6" fill="#fffbe6" stroke="#e3c96b"/>
<text x="24" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#5c4b00">Notes</text>
<text x="24" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• `claude-docker` with no arguments opens this full-screen menu (alternate screen); without a TTY it prints a hint and exits 1.</text>
<text x="24" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• Columns come from `--list` (FR-E6); rows idle longer than the threshold get an amber ⚠ on LAST ACTIVE and the reminder below (FR-E4).</text>
<text x="24" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• The detail block shows the selected sandbox: branch ← base branch, container name, worktree path.</text>
<text x="24" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• Enter = continue (claude --continue), R = Claude session picker (--resume); both leave the menu and hand the terminal to</text>
<text x="24" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">   docker exec -it … claude; when Claude exits the user is back in the shell, not in the menu.</text>
<text x="24" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• On the "+ New sandbox" row the footer shrinks to: ↑↓ select · Enter create · P prune · Q quit. Esc / Q / Ctrl+C leave without changes.</text>
</svg>
