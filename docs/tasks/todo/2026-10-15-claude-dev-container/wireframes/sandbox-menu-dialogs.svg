<rect x="8" y="772" width="851.1999999999999" height="142" rx="6" fill="#fffbe6" stroke="#e3c96b"/>
<text x="24" y="794" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#5c4b00">Notes</text>
<text x="24" y="816" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• Only one dialog is shown at a time, under the list; the three variants are stacked here for reference.</text>
<text x="24" y="836" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• Amber box = confirmation of a destructive action (D, M, T with live sessions, anything with --force); it names what will be lost.</text>
<text x="24" y="856" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• Red box = refusal / message (merge touching files outside docs/, merge or remove with a running claude session); any key closes.</text>
<text x="24" y="876" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• Cyan box = text input ("+ New sandbox", opened with Enter on that row); the name is validated inline ([a-z0-9-], not an existing one).</text>
<text x="24" y="896" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• Confirmed actions call the same code path as the matching command-line flag (--remove, --merge, --stop).</text>
</svg>
