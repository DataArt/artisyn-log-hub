<text x="433.59999999999997" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#57606a">Terminal — scripts/claude-docker.ps1</text>
<text x="35.8" y="59" fill="#8e24aa" font-weight="bold" xml:space="preserve">✻ Prune plan</text>
<text x="145.0" y="59" fill="#8a8f98" xml:space="preserve">inactive sandboxes (no running claude session)</text>
<line x1="28" y1="73" x2="839.2" y2="73" stroke="#c9ced6"/>
<text x="35.8" y="95" fill="#c62828" font-weight="bold" xml:space="preserve">Will remove</text>
<text x="129.4" y="95" fill="#8a8f98" xml:space="preserve">(container, volumes, worktree, branch)</text>
<text x="51.4" y="113" fill="#c62828" xml:space="preserve">✗</text>
<text x="67.0" y="113" fill="#1f2328" xml:space="preserve">r3-otel-port</text>
<text x="293.2" y="113" fill="#8a8f98" xml:space="preserve">no changes, no commits · 2 d ago</text>
<text x="51.4" y="131" fill="#c62828" xml:space="preserve">✗</text>
<text x="67.0" y="131" fill="#1f2328" xml:space="preserve">r4-old-review</text>
<text x="293.2" y="131" fill="#8a8f98" xml:space="preserve">no changes, no commits · 9 d ago</text>
<text x="51.4" y="149" fill="#c62828" xml:space="preserve">✗</text>
<text x="67.0" y="149" fill="#1f2328" xml:space="preserve">r6-merged-review</text>
<text x="293.2" y="149" fill="#8a8f98" xml:space="preserve">merged into main · 12 d ago</text>
