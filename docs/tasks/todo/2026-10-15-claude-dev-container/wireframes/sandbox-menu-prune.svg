<text x="51.4" y="203" fill="#2e7d32" xml:space="preserve">✓</text>
<text x="67.0" y="203" fill="#1f2328" xml:space="preserve">r2-sysctx-review</text>
<text x="293.2" y="203" fill="#00838f" xml:space="preserve">has work: 1 file</text>
<text x="527.2" y="203" fill="#8a8f98" xml:space="preserve">→ M merge · F removes anyway, keeps branch</text>
<text x="51.4" y="221" fill="#2e7d32" xml:space="preserve">✓</text>
<text x="67.0" y="221" fill="#1f2328" xml:space="preserve">r5-forgotten-spike</text>
<text x="293.2" y="221" fill="#00838f" xml:space="preserve">has work: 4 files, 2 commits</text>
<text x="527.2" y="221" fill="#8a8f98" xml:space="preserve">→ M merge · F removes anyway, keeps branch</text>
<text x="51.4" y="239" fill="#2e7d32" xml:space="preserve">✓</text>
<text x="67.0" y="239" fill="#1f2328" xml:space="preserve">r1-claude-dev-container</text>
<text x="293.2" y="239" fill="#8a8f98" xml:space="preserve">active claude session</text>
<line x1="28" y1="253" x2="839.2" y2="253" stroke="#c9ced6"/>
<text x="35.8" y="275" fill="#1f2328" xml:space="preserve">Remove 3 sandbox(es)?</text>
<text x="207.4" y="275" fill="#1f2328" font-weight="bold" xml:space="preserve">y</text>
<text x="223.0" y="275" fill="#8a8f98" xml:space="preserve">yes</text>
<text x="262.0" y="275" fill="#1f2328" font-weight="bold" xml:space="preserve">F</text>
<text x="277.6" y="275" fill="#8a8f98" xml:space="preserve">yes, including ones with work</text>
<text x="519.4" y="275" fill="#1f2328" font-weight="bold" xml:space="preserve">Esc</text>
<text x="550.6" y="275" fill="#8a8f98" xml:space="preserve">back</text>
<rect x="8" y="322" width="851.1999999999999" height="142" rx="6" fill="#fffbe6" stroke="#e3c96b"/>
<text x="24" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#5c4b00">Notes</text>
<text x="24" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• P on the list opens the same plan that --prune prints (FR-E5); nothing is removed before y or F.</text>
<text x="24" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• Will remove = nothing to lose: clean worktree, branch merged into its base or without own commits → full --remove incl. branch.</text>
<text x="24" y="406" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• Will keep = has work (changed files / unmerged commits, with the merge hint) or a live claude session.</text>
<text x="24" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• F = --force: also removes the ones with work, keeping their branches. Orphan resources (no worktree) are listed under Will remove.</text>
<text x="24" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#3d3a2e" xml:space="preserve">• Esc returns to the list unchanged; after y / F the list shows "✓ pruned N sandbox(es)" in its status line.</text>
</svg>
