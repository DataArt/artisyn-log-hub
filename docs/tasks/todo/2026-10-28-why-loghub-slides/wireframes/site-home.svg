<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title>Log Hub site - Home page (FR-1, FR-3, FR-11)</title>
  <rect width="1440" height="1000" fill="#f3f4f6"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#111827">Site Home - dataart.github.io/artisyn-log-hub/ (desktop 1280 wide + phone 375)</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Wireframe. Same neutral theme as the deck. Text is placeholder copy; final wording is set at implementation.</text>

  <!-- Desktop page -->
  <g transform="translate(40,96)">
    <rect width="980" height="780" fill="#ffffff" stroke="#d1d5db"/>
    <!-- top nav -->
    <rect width="980" height="56" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="24" y="18" width="20" height="20" rx="4" fill="#1e3a5f"/>
    <text x="54" y="34" font-size="15" font-weight="700" fill="#111827">Artisyn Log Hub</text>
    <g font-size="13" fill="#374151">
      <text x="300" y="34" font-weight="700" fill="#1e3a5f">Home</text>
      <line x1="300" y1="44" x2="340" y2="44" stroke="#1e3a5f" stroke-width="2"/>
      <text x="364" y="34">Features</text>
      <text x="444" y="34">Get started</text>
      <text x="538" y="34">Configuration</text>
      <text x="646" y="34">Using Log Hub</text>
      <text x="756" y="34">Data &amp; security</text>
      <text x="876" y="34">Deck</text>
    </g>

    <!-- hero: thesis -->
    <text x="64" y="132" font-size="12" font-weight="600" fill="#1e3a5f" letter-spacing="1.5">SELF-HOSTED ANALYTICS FOR CLAUDE CODE</text>
    <text x="64" y="176" font-size="34" font-weight="700" fill="#111827">This session cost $8. Is that good?</text>
    <text x="64" y="212" font-size="16" fill="#374151">You already control what AI work costs per month, per day and per session - that is right and useful.</text>
    <text x="64" y="236" font-size="16" fill="#374151">But the number alone does not say whether it is a lot or a little, good or bad,</text>
    <text x="64" y="260" font-size="16" fill="#374151">how to make it cheaper - or when to spend more for better quality. Log Hub answers that.</text>
    <rect x="64" y="284" width="150" height="40" rx="6" fill="#1e3a5f"/>
    <text x="139" y="309" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Get started</text>
    <rect x="228" y="284" width="190" height="40" rx="6" fill="#ffffff" stroke="#1e3a5f"/>
    <text x="323" y="309" font-size="14" font-weight="600" fill="#1e3a5f" text-anchor="middle">Why Log Hub (deck)</text>
    <text x="436" y="309" font-size="14" fill="#0969da">GitHub ↗</text>

    <!-- three questions -->
    <g transform="translate(64,360)">
      <rect width="272" height="150" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
      <text x="20" y="34" font-size="15" font-weight="700" fill="#111827">Why it costs this much</text>
      <text x="20" y="62" font-size="13" fill="#374151">Context growth, cache reads,</text>
      <text x="20" y="82" font-size="13" fill="#374151">sub-agents - the driving factors</text>
      <text x="20" y="102" font-size="13" fill="#374151">of each session's cost.</text>
      <text x="20" y="134" font-size="13" fill="#0969da">Features → A</text>
    </g>
    <g transform="translate(354,360)">
      <rect width="272" height="150" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
      <text x="20" y="34" font-size="15" font-weight="700" fill="#111827">Does the harness work?</text>
      <text x="20" y="62" font-size="13" fill="#374151">What CLAUDE.md, rules, skills and</text>
      <text x="20" y="82" font-size="13" fill="#374151">MCP add to every turn - and what</text>
      <text x="20" y="102" font-size="13" fill="#374151">is actually used.</text>
      <text x="20" y="134" font-size="13" fill="#0969da">Features → B</text>
    </g>
    <g transform="translate(644,360)">
      <rect width="272" height="150" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
      <text x="20" y="34" font-size="15" font-weight="700" fill="#111827">What it really brings</text>
      <text x="20" y="62" font-size="13" fill="#374151">Changes, productivity and tool</text>
      <text x="20" y="82" font-size="13" fill="#374151">value - per session and across</text>
      <text x="20" y="102" font-size="13" fill="#374151">the team, with anomalies.</text>
      <text x="20" y="134" font-size="13" fill="#0969da">Features → C, D, E</text>
    </g>

    <!-- visual slot -->
    <rect x="64" y="540" width="852" height="140" rx="6" fill="#fafafa" stroke="#9ca3af" stroke-dasharray="6 4"/>
    <text x="490" y="606" font-size="13" fill="#6b7280" text-anchor="middle">Visual slot - simple diagram now, product screenshot later (separate task)</text>
    <text x="490" y="626" font-size="11" fill="#6b7280" font-style="italic" text-anchor="middle">Illustrative example</text>

    <!-- foundation strip -->
    <text x="64" y="716" font-size="13" fill="#374151">Self-hosted · Docker + Postgres · one-command install · hook via npx · your data stays in-house</text>
    <line x1="0" y1="740" x2="980" y2="740" stroke="#e5e7eb"/>
    <text x="64" y="764" font-size="12" fill="#6b7280">MIT licence · GitHub · Releases · Not affiliated with Anthropic</text>
  </g>

  <!-- Phone -->
  <g transform="translate(1080,96)">
    <rect width="320" height="640" rx="20" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="52" rx="20" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="18" y="16" width="18" height="18" rx="4" fill="#1e3a5f"/>
    <text x="44" y="31" font-size="13" font-weight="700" fill="#111827">Log Hub</text>
    <g fill="#374151"><rect x="276" y="18" width="22" height="2.5"/><rect x="276" y="25" width="22" height="2.5"/><rect x="276" y="32" width="22" height="2.5"/></g>
    <text x="18" y="96" font-size="20" font-weight="700" fill="#111827">This session cost $8.</text>
    <text x="18" y="122" font-size="20" font-weight="700" fill="#111827">Is that good?</text>
    <text x="18" y="152" font-size="13" fill="#374151">You control the cost - right and</text>
    <text x="18" y="170" font-size="13" fill="#374151">useful. The number alone does not</text>
    <text x="18" y="188" font-size="13" fill="#374151">say what to do next.</text>
    <rect x="18" y="206" width="284" height="38" rx="6" fill="#1e3a5f"/>
    <text x="160" y="230" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Get started</text>
    <rect x="18" y="254" width="284" height="38" rx="6" fill="#ffffff" stroke="#1e3a5f"/>
    <text x="160" y="278" font-size="13" font-weight="600" fill="#1e3a5f" text-anchor="middle">Why Log Hub (deck)</text>
    <rect x="18" y="310" width="284" height="84" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="32" y="338" font-size="14" font-weight="700" fill="#111827">Why it costs this much</text>
    <rect x="18" y="404" width="284" height="84" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="32" y="432" font-size="14" font-weight="700" fill="#111827">Does the harness work?</text>
    <rect x="18" y="498" width="284" height="84" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="32" y="526" font-size="14" font-weight="700" fill="#111827">What it really brings</text>
  </g>

  <g transform="translate(40,906)" font-size="13" fill="#374151">
    <text font-size="15" font-weight="600" fill="#111827">Notes</text>
    <text y="26">1. Hero = the same thesis as README and deck slide 2 (FR-11): cost control acknowledged, the $8 session as the shared example. Top nav on every page (FR-1, FR-3).</text>
    <text y="50">2. Three cards = the three questions; each links into Features. Phone: nav collapses to a menu button, single column, no horizontal scroll (NFR).</text>
    <text y="74">3. Home and Features are site-only text; every other section is generated from the shared page set (FR-2). All links relative - the site lives under /artisyn-log-hub/.</text>
  </g>
</svg>
