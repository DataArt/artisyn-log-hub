<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title>Why Log Hub deck - title slide and opening thesis slide (FR-11)</title>
  <rect width="1440" height="900" fill="#f3f4f6"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#111827">Deck opening: title slide (1) and thesis slide (2) - 16:9, light neutral theme</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Wireframe. Own neutral theme (not the corporate kit). Text is placeholder copy, final wording is set at implementation.</text>

  <!-- Slide 1: title -->
  <g transform="translate(40,100)">
    <text x="0" y="-10" font-size="12" fill="#6b7280">Slide 1 - title</text>
    <rect width="640" height="360" fill="#ffffff" stroke="#d1d5db"/>
    <rect width="8" height="360" fill="#1e3a5f"/>
    <text x="48" y="150" font-size="34" font-weight="700" fill="#111827">Artisyn Log Hub</text>
    <text x="48" y="188" font-size="18" fill="#374151">Why AI coding costs what it costs -</text>
    <text x="48" y="212" font-size="18" fill="#374151">and whether it pays off</text>
    <line x1="48" y1="244" x2="160" y2="244" stroke="#1e3a5f" stroke-width="2"/>
    <text x="48" y="272" font-size="12" fill="#6b7280">Self-hosted analytics for Claude Code sessions</text>
    <!-- footer -->
    <text x="48" y="338" font-size="11" fill="#9ca3af">dataart.github.io/artisyn-log-hub</text>
    <text x="604" y="338" font-size="11" fill="#9ca3af" text-anchor="end">1 / N</text>
  </g>

  <!-- Slide 2: thesis -->
  <g transform="translate(740,100)">
    <text x="0" y="-10" font-size="12" fill="#6b7280">Slide 2 - first content slide: the thesis (same as README pitch and site Home, FR-10/FR-11)</text>
    <rect width="660" height="360" fill="#ffffff" stroke="#d1d5db"/>
    <text x="40" y="44" font-size="11" font-weight="600" fill="#1e3a5f" letter-spacing="1.5">THE PROBLEM</text>
    <text x="40" y="84" font-size="24" font-weight="700" fill="#111827">This session cost $8. Is that good?</text>
    <!-- left: what you already control (acknowledged, not greyed out) -->
    <rect x="40" y="108" width="176" height="180" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="54" y="130" font-size="12" font-weight="600" fill="#374151">You already control</text>
    <text x="54" y="146" font-size="11" fill="#6b7280">right and useful</text>
    <g font-size="13" fill="#111827">
      <text x="54" y="180">$2,900 / month</text>
      <text x="54" y="206">$140 / day</text>
      <text x="54" y="240" font-size="22" font-weight="700">$8 / session</text>
    </g>
    <text x="54" y="274" font-size="11" fill="#16a34a">✓ cost is tracked</text>
    <!-- middle: the questions the number does not answer -->
    <path d="M222 198 L238 198" stroke="#6b7280" stroke-width="2"/>
    <path d="M238 192 L246 198 L238 204 Z" fill="#6b7280"/>
    <rect x="250" y="108" width="176" height="180" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 3"/>
    <text x="264" y="130" font-size="12" font-weight="600" fill="#6b7280">The number does not say</text>
    <g font-size="13" fill="#374151">
      <text x="264" y="162">A lot or a little?</text>
      <text x="264" y="188">Good or bad?</text>
      <text x="264" y="214">How to make it cheaper?</text>
      <text x="264" y="240">Or spend more for</text>
      <text x="264" y="258">better quality?</text>
    </g>
    <!-- arrow -->
    <path d="M432 198 L448 198" stroke="#1e3a5f" stroke-width="2"/>
    <path d="M448 192 L456 198 L448 204 Z" fill="#1e3a5f"/>
    <!-- right: what Log Hub answers -->
    <rect x="460" y="108" width="170" height="180" rx="6" fill="#eef2f7" stroke="#1e3a5f"/>
    <text x="474" y="130" font-size="12" font-weight="600" fill="#1e3a5f">Log Hub answers</text>
    <g font-size="12" fill="#111827">
      <text x="474" y="160">• Why it costs this much</text>
      <text x="474" y="184">• Which factors drive it</text>
      <text x="474" y="208">• Does the harness work</text>
      <text x="486" y="224">as designed</text>
      <text x="474" y="248">• What each tool brings</text>
      <text x="474" y="276" fill="#374151" font-size="11">per session and team</text>
    </g>
    <text x="40" y="316" font-size="10" fill="#6b7280" font-style="italic">Illustrative example - not a measured result</text>
    <text x="620" y="338" font-size="11" fill="#9ca3af" text-anchor="end">2 / N</text>
  </g>

  <!-- Annotations -->
  <g transform="translate(40,500)" font-size="13" fill="#374151">
    <text font-size="15" font-weight="600" fill="#111827">Notes</text>
    <text y="28">1. One message per slide (FR-5): a single headline sentence states the message; body is a short visual, not a paragraph.</text>
    <text y="52">2. Slide 2 carries the README / Home thesis (FR-11): cost control is acknowledged as right (left, solid, green check) - not greyed out as useless;</text>
    <text y="70">   the $8 session raises questions the number cannot answer (middle); Log Hub answers them (right, accent). The $8 session is the shared example.</text>
    <text y="94">3. Every illustrative number carries a small italic "Illustrative example" label (FR-7); month / day / session figures come from one dataset.</text>
    <text y="118">4. Footer: site URL (left) and slide counter (right); kept on every slide. No logos of third parties, no private data (FR-7).</text>
    <text y="142">5. Navigation: keyboard arrows / space, S = speaker view with notes, ?print-pdf for PDF export (FR-5). No visible chrome besides slide controls.</text>
    <text y="166">6. Palette: white slide on light grey stage, near-black text #111827, secondary #374151 / #6b7280, single navy accent #1e3a5f.</text>
  </g>
</svg>
