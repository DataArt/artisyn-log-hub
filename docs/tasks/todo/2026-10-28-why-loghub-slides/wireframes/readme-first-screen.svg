<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>README.md first screen on GitHub with the "why" pitch block (FR-10)</title>
  <rect width="1280" height="860" fill="#ffffff"/>
  <!-- GitHub README card -->
  <rect x="40" y="30" width="900" height="660" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="40" y="30" width="900" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="58" font-size="14" font-weight="600" fill="#1f2328">README</text>
  <text x="140" y="58" font-size="14" fill="#59636e">MIT license</text>
  <text x="240" y="58" font-size="14" fill="#59636e">Security</text>

  <!-- Title -->
  <text x="72" y="124" font-size="30" font-weight="600" fill="#1f2328">Artisyn Log Hub</text>
  <line x1="72" y1="140" x2="908" y2="140" stroke="#d1d9e0"/>
  <!-- NEW pitch block -->
  <rect x="62" y="154" width="856" height="226" rx="6" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="770" y="144" width="140" height="22" rx="11" fill="#1e3a5f"/>
  <text x="840" y="159" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">NEW - pitch block</text>
  <text x="72" y="190" font-size="16" fill="#1f2328">You know what AI work costs per month, per day and per session - controlling that is right and useful.</text>
  <text x="72" y="214" font-size="16" font-weight="700" fill="#1f2328">But a session cost $8: a lot or a little, good or bad - and how to change it?</text>
  <text x="72" y="248" font-size="16" fill="#1f2328">Log Hub answers the questions behind the number - per session and across the team:</text>
  <g font-size="16" fill="#1f2328">
    <text x="88" y="276">•  <tspan font-weight="600">why</tspan> it costs that much, and which factors drive it;</text>
    <text x="88" y="300">•  whether your <tspan font-weight="600">harness</tspan> (CLAUDE.md, rules, skills, MCP) works as designed;</text>
    <text x="88" y="324">•  what each <tspan font-weight="600">tool</tspan> really brings.</text>
  </g>
  <text x="72" y="360" font-size="16" fill="#1f2328">→ <tspan fill="#0969da" text-decoration="underline">Site: features, install, configuration</tspan>  ·  <tspan fill="#0969da" text-decoration="underline">Deck: Why Log Hub</tspan> <tspan fill="#59636e">(dataart.github.io/artisyn-log-hub)</tspan></text>

  <!-- badges -->
  <rect x="72" y="394" width="150" height="20" rx="3" fill="#555"/><rect x="152" y="394" width="70" height="20" fill="#2da44e"/>
  <text x="80" y="408" font-size="11" fill="#fff">Security scan</text><text x="160" y="408" font-size="11" fill="#fff">passing</text>
  <rect x="230" y="394" width="160" height="20" rx="3" fill="#555"/><rect x="320" y="394" width="70" height="20" fill="#2da44e"/>
  <text x="238" y="408" font-size="11" fill="#fff">security-scans</text><text x="328" y="408" font-size="11" fill="#fff">passing</text>


  <!-- existing description -->
  <text x="72" y="452" font-size="16" fill="#59636e">Artisyn Log Hub is a self-hosted server and web viewer for <tspan fill="#0969da">Claude Code</tspan> sessions. A Claude Code</text>
  <text x="72" y="476" font-size="16" fill="#59636e">hook, installed into a project, uploads the session transcripts ... (existing text, kept)</text>
  <!-- disclaimer -->
  <rect x="72" y="498" width="4" height="46" fill="#d1d9e0"/>
  <text x="88" y="516" font-size="15" fill="#59636e"><tspan font-weight="700">Disclaimer.</tspan> This project is not affiliated with or endorsed by Anthropic, ...</text>
  <text x="88" y="538" font-size="15" fill="#59636e">"Claude" and "Claude Code" are trademarks of Anthropic.</text>
  <text x="72" y="578" font-size="16" fill="#59636e"><tspan font-weight="700">Read What is collected before you install the hook.</tspan> It uploads complete session</text>
  <text x="72" y="600" font-size="16" fill="#59636e">transcripts, including file contents and command output.</text>
  <text x="72" y="648" font-size="22" font-weight="600" fill="#9ca3af">Quick start (minimal)</text>
  <line x1="40" y1="672" x2="940" y2="672" stroke="#cf222e" stroke-dasharray="5 4"/>
  <text x="936" y="666" font-size="11" fill="#cf222e" text-anchor="end">fold - end of first screen (~1280 x 720)</text>

  <!-- About sidebar (existing) -->
  <text x="980" y="54" font-size="16" font-weight="600" fill="#1f2328">About</text>
  <text x="980" y="84" font-size="14" fill="#1f2328">Self-hosted server and web viewer</text>
  <text x="980" y="104" font-size="14" fill="#1f2328">for Claude Code session telemetry,</text>
  <text x="980" y="124" font-size="14" fill="#1f2328">plus the hook and installer that</text>
  <text x="980" y="144" font-size="14" fill="#1f2328">collect it</text>
  <text x="980" y="180" font-size="14" fill="#59636e">Readme</text>
  <text x="980" y="206" font-size="14" fill="#59636e">MIT license</text>
  <text x="980" y="232" font-size="14" fill="#59636e">Security policy</text>
  <text x="980" y="270" font-size="11" fill="#6b7280">(existing sidebar, unchanged)</text>

  <g transform="translate(40,730)" font-size="13" fill="#374151">
    <text font-size="15" font-weight="600" fill="#111827">Notes</text>
    <text y="26">1. Pitch block is the very first content, directly under the title and above the badges; at most 8 rendered lines. Dashed frame marks new content only.</text>
    <text y="50">2. Thesis (FR-10): cost control is acknowledged as right; the $8 session shows a number alone is not an answer. Links to site and deck - same story as Home and slide 2 (FR-11).</text>
    <text y="74">3. Minimal README: description, disclaimer, one-line "What is collected" warning (links to the site), minimal quick start, links to the site. Install/config sections move to user-docs/.</text>
    <text y="98">4. Rendered by GitHub - the wireframe mimics GitHub's light theme; no custom styling is possible in README.</text>
  </g>
</svg>
