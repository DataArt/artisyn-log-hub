<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title>Why Log Hub deck - content slide template with reserved visual slot (FR-5, FR-7)</title>
  <rect width="1440" height="960" fill="#f3f4f6"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#111827">Content slide template - block A example ("Why it costs this much")</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Same grid for blocks A-F. Right column is the visual slot: a simple diagram today, a product screenshot later without re-layout.</text>

  <!-- Desktop slide -->
  <g transform="translate(40,100)">
    <text x="0" y="-10" font-size="12" fill="#6b7280">Laptop / projector - 16:9 (1280 x 720 scaled)</text>
    <rect width="960" height="540" fill="#ffffff" stroke="#d1d5db"/>
    <!-- block marker -->
    <text x="56" y="62" font-size="13" font-weight="600" fill="#1e3a5f" letter-spacing="1.5">A · WHY IT COSTS THIS MUCH</text>
    <!-- progress of blocks -->
    <g transform="translate(640,50)" font-size="11" font-weight="600">
      <rect width="34" height="18" rx="9" fill="#e5e7eb"/><text x="17" y="13" text-anchor="middle" fill="#6b7280">P</text>
      <rect x="40" width="34" height="18" rx="9" fill="#1e3a5f"/><text x="57" y="13" text-anchor="middle" fill="#ffffff">A</text>
      <rect x="80" width="34" height="18" rx="9" fill="#e5e7eb"/><text x="97" y="13" text-anchor="middle" fill="#6b7280">B</text>
      <rect x="120" width="34" height="18" rx="9" fill="#e5e7eb"/><text x="137" y="13" text-anchor="middle" fill="#6b7280">C</text>
      <rect x="160" width="34" height="18" rx="9" fill="#e5e7eb"/><text x="177" y="13" text-anchor="middle" fill="#6b7280">D</text>
      <rect x="200" width="34" height="18" rx="9" fill="#e5e7eb"/><text x="217" y="13" text-anchor="middle" fill="#6b7280">E</text>
      <rect x="240" width="34" height="18" rx="9" fill="#e5e7eb"/><text x="257" y="13" text-anchor="middle" fill="#6b7280">F</text>
    </g>
    <!-- headline -->
    <text x="56" y="116" font-size="32" font-weight="700" fill="#111827">Context growth, not output, drives the bill</text>
    <!-- left text column -->
    <g font-size="17" fill="#374151">
      <text x="56" y="186">• Every turn re-reads the whole context</text>
      <text x="56" y="226">• One large file or Bash output inflates</text>
      <text x="74" y="248">every turn after it</text>
      <text x="56" y="288">• Log Hub shows which call did it</text>
    </g>
    <!-- key figure -->
    <rect x="56" y="330" width="320" height="96" rx="6" fill="#eef2f7"/>
    <text x="76" y="376" font-size="36" font-weight="700" fill="#1e3a5f">78%</text>
    <text x="176" y="366" font-size="13" fill="#374151">of session cost is</text>
    <text x="176" y="386" font-size="13" fill="#374151">re-reading context</text>
    <text x="76" y="412" font-size="10" fill="#6b7280" font-style="italic">Illustrative example</text>

    <!-- visual slot -->
    <rect x="440" y="150" width="464" height="300" rx="6" fill="#fafafa" stroke="#9ca3af" stroke-dasharray="6 4"/>
    <text x="456" y="172" font-size="11" fill="#6b7280">VISUAL SLOT 464 x 300 - diagram now, screenshot later</text>
    <!-- simple diagram: stacked context growth -->
    <g transform="translate(470,190)">
      <line x1="0" y1="230" x2="400" y2="230" stroke="#9ca3af"/>
      <line x1="0" y1="0" x2="0" y2="230" stroke="#9ca3af"/>
      <g fill="#c7d2e0">
        <rect x="20" y="200" width="36" height="30"/><rect x="70" y="190" width="36" height="40"/>
        <rect x="120" y="180" width="36" height="50"/><rect x="170" y="90" width="36" height="140"/>
        <rect x="220" y="80" width="36" height="150"/><rect x="270" y="70" width="36" height="160"/>
        <rect x="320" y="60" width="36" height="170"/>
      </g>
      <rect x="170" y="90" width="36" height="88" fill="#1e3a5f"/>
      <path d="M206 120 L250 30" stroke="#1e3a5f" stroke-width="1.5"/>
      <rect x="236" y="6" width="160" height="40" rx="4" fill="#ffffff" stroke="#1e3a5f"/>
      <text x="246" y="22" font-size="11" fill="#111827" font-weight="600">Step 4: Bash output</text>
      <text x="246" y="38" font-size="11" fill="#374151">+38k tokens, kept to the end</text>
      <text x="200" y="250" font-size="10" fill="#6b7280" text-anchor="middle">turns -&gt;</text>
    </g>

    <!-- footer -->
    <line x1="56" y1="490" x2="904" y2="490" stroke="#e5e7eb"/>
    <text x="56" y="514" font-size="12" fill="#9ca3af">dataart.github.io/artisyn-log-hub</text>
    <text x="904" y="514" font-size="12" fill="#9ca3af" text-anchor="end">5 / N</text>
    <!-- nav controls -->
    <g transform="translate(860,450)" fill="#9ca3af">
      <path d="M0 10 L10 0 L10 20 Z"/><path d="M30 0 L40 10 L30 20 Z"/>
    </g>
  </g>

  <!-- Phone -->
  <g transform="translate(1060,100)">
    <text x="0" y="-10" font-size="12" fill="#6b7280">Phone - 375 px wide, columns stack</text>
    <rect width="340" height="680" rx="28" fill="#111827"/>
    <rect x="12" y="14" width="316" height="652" rx="18" fill="#ffffff"/>
    <g transform="translate(28,50)">
      <text font-size="10" font-weight="600" fill="#1e3a5f" letter-spacing="1.2">A · WHY IT COSTS THIS MUCH</text>
      <text y="36" font-size="20" font-weight="700" fill="#111827">Context growth, not</text>
      <text y="60" font-size="20" font-weight="700" fill="#111827">output, drives the bill</text>
      <g font-size="15" fill="#374151">
        <text y="100">• Every turn re-reads the</text><text x="14" y="120">whole context</text>
        <text y="150">• One large output inflates</text><text x="14" y="170">every turn after it</text>
        <text y="200">• Log Hub shows which call</text><text x="14" y="220">did it</text>
      </g>
      <rect y="244" width="284" height="70" rx="6" fill="#eef2f7"/>
      <text x="14" y="286" font-size="28" font-weight="700" fill="#1e3a5f">78%</text>
      <text x="90" y="278" font-size="12" fill="#374151">of session cost is</text>
      <text x="90" y="296" font-size="12" fill="#374151">re-reading context</text>
      <rect y="330" width="284" height="184" rx="6" fill="#fafafa" stroke="#9ca3af" stroke-dasharray="6 4"/>
      <text x="142" y="426" font-size="11" fill="#6b7280" text-anchor="middle">Visual slot (scales to width)</text>
      <text y="540" font-size="10" fill="#6b7280" font-style="italic">Illustrative example</text>
      <text x="284" y="586" font-size="11" fill="#9ca3af" text-anchor="end">5 / N</text>
    </g>
  </g>

  <!-- Annotations -->
  <g transform="translate(40,700)" font-size="13" fill="#374151">
    <text font-size="15" font-weight="600" fill="#111827">Notes</text>
    <text y="28">1. Block marker (top-left) and P/A-F progress pills (top-right) tell a C-level reader where they are in the storyline (FR-6).</text>
    <text y="52">2. Headline = the one message of the slide. Body: at most 3 short bullets and one key figure; at most 40 words of body text (FR-5).</text>
    <text y="76">3. Visual slot has a fixed box; a later screenshot drops in with no redesign (FR-7). No screenshots in this task.</text>
    <text y="100">4. Phone: same order, single column, body text at least 16 px (NFR), no horizontal scroll; the visual slot scales to the width.</text>
    <text y="124">5. Detail that does not fit (detector ids, report names, Tools/MCP signals) goes to speaker notes (S key), not onto the slide.</text>
    <text y="148">6. Light theme only; one navy accent; neutral greys. Numbers labelled "Illustrative example".</text>
  </g>
</svg>
