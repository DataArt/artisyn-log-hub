<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Segoe UI, Inter, Arial, sans-serif">
  <style>
    .t { font-size: 13px; fill: #111827; }
    .s { font-size: 12px; fill: #111827; }
    .xs { font-size: 11px; fill: #111827; }
    .m { fill: #6b7280; }
    .cap { font-size: 10.5px; fill: #6b7280; letter-spacing: .4px; }
    .mono { font-family: Consolas, 'JetBrains Mono', monospace; }
    .b { font-weight: 600; }
    .line { stroke: #e5e7eb; stroke-width: 1; }
  </style>
  <rect width="1440" height="900" fill="#ffffff"/>

  <!-- Top bar -->
  <rect width="1440" height="48" fill="#fafafa"/>
  <line x1="0" y1="48" x2="1440" y2="48" class="line"/>
  <circle cx="24" cy="24" r="7" fill="#3b4fd8"/>
  <text x="44" y="29" class="t b">[local] Artisyn Log Hub</text><text x="198" y="29" class="xs m">dev</text>
  <text x="1226" y="29" class="t m">dt@dataart.com</text><text x="1350" y="29" class="t b">Edit email</text>

  <!-- Sidebar (simplified) -->
  <rect x="0" y="49" width="320" height="851" fill="#ffffff"/>
  <line x1="320" y1="49" x2="320" y2="900" stroke="#e5e7eb" stroke-width="4"/>
  <rect x="0" y="90" width="320" height="24" fill="#f9fafb"/><text x="12" y="107" class="cap">TEAMS</text>
  <text x="34" y="142" class="t m">LogHubLocal</text>
  <text x="34" y="174" class="t m">LogHub Demo</text>
  <rect x="0" y="254" width="320" height="24" fill="#f9fafb"/><text x="30" y="271" class="cap">MY REPOS</text>
  <rect x="0" y="316" width="320" height="32" fill="#f3f4f6"/>
  <text x="12" y="337" class="t b">https://github.com/DataArt/artisyn-log-hub</text>
  <text x="12" y="369" class="t m">https://github.com/denistsyplakov/at-scanner</text>

  <!-- Repo header + tabs -->
  <text x="341" y="76" class="t mono">https://github.com/DataArt/artisyn-log-hub</text>
  <text x="1290" y="76" class="s m">Sessions: 44  Users: 1</text>
  <line x1="324" y1="94" x2="1440" y2="94" class="line"/>
  <text x="385" y="117" class="t m">Sessions</text>
  <text x="460" y="117" class="t m">Analytics</text>
  <text x="539" y="117" class="t m">Reports</text>
  <text x="611" y="117" class="t m">OKF</text>
  <text x="663" y="117" class="t b">Settings</text>
  <rect x="655" y="128" width="66" height="2" fill="#111827"/>
  <line x1="324" y1="131" x2="1440" y2="131" class="line"/>
  <text x="353" y="162" class="t m">Display</text>
  <text x="421" y="162" class="t m">File Categories</text>
  <text x="537" y="162" class="t b">Analysis</text>
  <rect x="528" y="173" width="68" height="2" fill="#111827"/>
  <text x="610" y="162" class="t m">Session Attributes</text>
  <text x="747" y="162" class="t m">Maintenance</text>
  <text x="851" y="162" class="t m">Import/Export</text>
  <line x1="324" y1="176" x2="1440" y2="176" class="line"/>

  <!-- Existing settings (collapsed for context) -->
  <text x="349" y="222" class="t b">High cache-creation threshold (tokens per turn)</text>
  <rect x="349" y="234" width="192" height="32" rx="4" fill="#fff" stroke="#e5e7eb"/><text x="362" y="255" class="t">25000</text>
  <text x="349" y="290" class="xs m">… existing description and Save …</text>
  <line x1="349" y1="310" x2="1021" y2="310" class="line"/>
  <rect x="349" y="334" width="13" height="13" rx="2" fill="#fff" stroke="#9ca3af"/>
  <text x="371" y="345" class="t b">Turn-End Cost Advisor</text>
  <text x="369" y="368" class="xs m">After each turn, ask the model for a one-line cost-saving suggestion. Runs on every enabled session regardless of cost.</text>
  <line x1="349" y1="390" x2="1021" y2="390" class="line"/>

  <!-- NEW: KB usage analysis block (FR-19, FR-19a, FR-21, FR-22a) -->
  <rect x="337" y="400" width="700" height="360" rx="6" fill="none" stroke="#c7d2fe" stroke-dasharray="5 3"/>
  <rect x="880" y="392" width="150" height="18" rx="4" fill="#eef2ff"/><text x="890" y="405" class="xs" fill="#3730a3">NEW (FR-19, 19a, 21)</text>

  <rect x="349" y="420" width="13" height="13" rx="2" fill="#3b4fd8"/><text x="351" y="431" class="xs b" fill="#fff">✓</text>
  <text x="371" y="431" class="t b">KB (OKF) usage analysis</text>
  <rect x="540" y="419" width="62" height="16" rx="8" fill="#f5f3ff"/><text x="548" y="431" class="xs" fill="#5b21b6">sonnet</text>
  <text x="369" y="454" class="xs m">After each user prompt, ask the model which KB reads were useful, wasteful or wrong, what could have helped</text>
  <text x="369" y="470" class="xs m">but was not read, and what the KB lacks. Results appear on the OKF tab of the session and the repository.</text>

  <rect x="369" y="482" width="640" height="78" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="381" y="502" class="s b" fill="#92400e">⚠ Can be relatively expensive</text>
  <text x="381" y="520" class="xs" fill="#78350f">A separate LLM call (sonnet) after every prompt of a session above the threshold, on your own Claude account —</text>
  <text x="381" y="536" class="xs" fill="#78350f">typically $0.15–0.70 and 1–3 min per run; it reads the KB indexes, your prompts and some KB files itself.</text>
  <text x="381" y="552" class="xs b" fill="#78350f">Last 7 days (personal scope): 23 runs · $3.42</text>

  <!-- Cost threshold (FR-19, FR-21) — replaces the former sub-option checkboxes -->
  <text x="389" y="596" class="s b">Skip sessions cheaper than</text>
  <rect x="569" y="580" width="90" height="28" rx="4" fill="#fff" stroke="#e5e7eb"/><text x="581" y="599" class="t">1.00</text>
  <text x="667" y="599" class="s">USD</text>
  <text x="709" y="599" class="xs m">default $1</text>
  <text x="389" y="626" class="xs m">No analysis runs until the session (sub-agents included) has cost at least this much; the first run then covers the whole session.</text>
  <text x="389" y="650" class="xs m">Always included: turns with no KB reads (once per new prompt) and reading the KB files and documents it needs —</text>
  <text x="389" y="666" class="xs m">so the analysis is never partial. Runs where the model read files are marked "fallback used".</text>

  <text x="349" y="700" class="xs m">Resolution: personal → team → off. Model override: hook key in log-hub.json (like advisorModel).</text>
  <rect x="349" y="718" width="53" height="32" rx="6" fill="#3b4fd8"/><text x="362" y="739" class="t b" fill="#fff">Save</text>
  <text x="414" y="739" class="xs m">Team scope: "Managed by team owner" + read-only checkbox and threshold, team 7-day spend shown instead.</text>
</svg>
