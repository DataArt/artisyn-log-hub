<!-- callouts -->
<g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
  <circle cx="946" cy="255" r="10" fill="#f97316"/><text x="946" y="259">1</text>
  <circle cx="946" cy="508" r="10" fill="#f97316"/><text x="946" y="512">2</text>
  <circle cx="946" cy="318" r="10" fill="#f97316"/><text x="946" y="322">3</text>
</g>

<!-- notes -->
<rect x="24" y="620" width="1392" height="250" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
<text x="40" y="644" class="t b" font-size="12">Wireframe notes</text>
<g class="note">
  <text x="40" y="668"><tspan class="b" fill="#c2410c">1</tspan>  FR-3 fallback order for the model shown in the waterfall chip and the details "model" row:</text>
  <text x="58" y="686" class="mono" font-size="11">matched otel_calls.model  →  span attribute gen_ai.response.model  →  span attribute model  →  nothing</text>
  <text x="58" y="704">No new label or source hint — the value looks exactly like case A, so a session from an older Claude Code (C) shows the same model as before.</text>
  <text x="40" y="730"><tspan class="b" fill="#c2410c">2</tspan>  FR-4 token rule: gen_ai.usage.input_tokens (red) already includes prompt-cache tokens. The "tokens in / out" and "cache read / write" rows keep using the</text>
  <text x="58" y="748">native input_tokens / cache_read_tokens / cache_creation_tokens; gen_ai.usage.* appears only in the raw JSON and is never added to the cache figures.</text>
  <text x="40" y="774"><tspan class="b" fill="#c2410c">3</tspan>  The cost row stays "no matching api_request yet" until the call arrives — the gen_ai.* fallback never prices a span.</text>
  <text x="40" y="800">For a team-no-prompts caller viewing another member's session, attributes are masked ("hidden for your role"), so the fallback cannot read</text>
  <text x="58" y="818">gen_ai.response.model; the model row then shows only the matched call's model, as today.</text>
  <text x="40" y="844" class="s">Dashed blue = the only visible difference this task introduces (case B). Cases A and C render exactly as today.</text>
</g>
</svg>
