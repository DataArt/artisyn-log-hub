<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<title>Span details — model fallback and gen_ai.* attributes (FR-3, FR-4)</title>
<defs>
  <style>
    .t{font-size:13px;fill:#111827}
    .m{font-size:12px;fill:#6b7280}
    .s{font-size:11px;fill:#6b7280}
    .mono{font-family:'JetBrains Mono',Consolas,monospace}
    .b{font-weight:600}
    .k{font-size:12px;fill:#6b7280}
    .v{font-size:12px;fill:#111827;font-family:'JetBrains Mono',Consolas,monospace}
