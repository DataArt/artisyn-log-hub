    <text x="12" y="198" class="k">tokens in / out</text><text x="140" y="198" class="v">8 / 1 402</text>
    <text x="12" y="218" class="k">cache read / write</text><text x="140" y="218" class="v">71 900 / 0</text>
    <text x="12" y="238" class="k">cost</text><text x="140" y="238" class="v">no matching api_request yet</text>
