    <text x="12" y="134" class="k">request_id</text><text x="140" y="134" class="v">req_011CVq…2mB</text>
    <rect x="6" y="140" width="428" height="22" rx="3" fill="#eff6ff"/>
    <text x="12" y="155" class="k">model</text><text x="140" y="155" class="v">claude-opus-5-5</text>
    <text x="12" y="178" class="k">tokens in / out</text><text x="140" y="178" class="v">5 / 880</text>
    <text x="12" y="198" class="k">cache read / write</text><text x="140" y="198" class="v">60 112 / 0</text>
    <text x="12" y="218" class="k">cost</text><text x="140" y="218" class="v">no matching api_request yet</text>
