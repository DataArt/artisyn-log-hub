</defs>
<rect width="1440" height="900" fill="#ffffff"/>

<text x="24" y="36" class="t b" font-size="16">Session → OTEL → Traces: llm_request span, three cases</text>
<text x="24" y="58" class="m">Waterfall row model label and the span details "model" field both come from otelSpanModel(span, call). Only the fallback order changes.</text>

