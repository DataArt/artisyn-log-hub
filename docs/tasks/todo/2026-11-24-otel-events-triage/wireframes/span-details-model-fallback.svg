<!-- ===================== Column C ===================== -->
<g transform="translate(968 84)">
  <text x="0" y="14" class="t b">C · Older Claude Code (no gen_ai.* keys)</text>
  <text x="0" y="32" class="s">Claude Code &lt; 2.1.331, or hook &lt; 2.29.0 / traces off</text>
  <rect x="0" y="44" width="440" height="30" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="10" y="64" class="m mono" fill="#111827">llm_request</text>
  <rect x="104" y="51" width="64" height="16" rx="8" fill="#eef2ff"/><text x="136" y="63" font-size="10" fill="#3730a3" text-anchor="middle" class="mono">opus-5-5</text>
  <text x="180" y="64" class="m mono">—</text>
