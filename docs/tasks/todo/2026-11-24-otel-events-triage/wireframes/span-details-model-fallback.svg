  <text x="12" y="108" class="m">span <tspan class="mono b" fill="#111827">claude_code.llm_request</tspan> · 7f3a…c901</text>
  <text x="424" y="108" class="m" text-anchor="end">✕</text>
  <g>
    <text x="12" y="134" class="k">request_id</text><text x="140" y="134" class="v">req_011CVx…9qT</text>
    <text x="12" y="154" class="k">query_source</text><text x="140" y="154" class="v">repl_main_thread</text>
    <rect x="6" y="160" width="428" height="22" rx="3" fill="#eff6ff"/>
    <text x="12" y="175" class="k">model</text><text x="140" y="175" class="v">claude-opus-5-5 · ttft 1 840 ms</text>
    <text x="12" y="198" class="k">tokens in / out</text><text x="140" y="198" class="v">12 / 1 906</text>
    <text x="12" y="218" class="k">cache read / write</text><text x="140" y="218" class="v">84 210 / 2 044</text>
    <text x="12" y="238" class="k">cost</text><text x="140" y="238" class="v">$0.21  (api_request by request_id)</text>
    <text x="12" y="258" class="k">duration</text><text x="140" y="258" class="v">12.9 s</text>
    <text x="12" y="278" class="k">data</text><text x="140" y="278" class="v">confirmed by the regular upload</text>
    <text x="12" y="298" class="k">attributes</text><text x="140" y="298" font-size="12" fill="#1d4ed8">show all raw (18) ▸</text>
  </g>
  <text x="12" y="340" class="s">model source: otel_calls.model (the matched api_request)</text>
  <text x="12" y="358" class="s">→ unchanged by this task</text>
</g>

