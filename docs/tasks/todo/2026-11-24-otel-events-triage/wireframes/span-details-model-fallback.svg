  <rect x="0" y="86" width="440" height="230" rx="6" fill="#fff" stroke="#e5e7eb"/>
  <text x="12" y="108" class="m">span <tspan class="mono b" fill="#111827">claude_code.llm_request</tspan> · 3c07…a19e</text>
  <text x="424" y="108" class="m" text-anchor="end">✕</text>
