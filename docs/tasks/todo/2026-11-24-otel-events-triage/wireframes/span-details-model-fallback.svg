  <rect x="230" y="54" width="120" height="10" rx="2" fill="#3b82f6"/><text x="430" y="64" class="s mono" text-anchor="end">9.4 s</text>
  <rect x="0" y="86" width="440" height="420" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="12" y="108" class="m">span <tspan class="mono b" fill="#111827">claude_code.llm_request</tspan> · 91be…04d2</text>
  <text x="424" y="108" class="m" text-anchor="end">✕</text>
  <g>
    <text x="12" y="134" class="k">request_id</text><text x="140" y="134" class="v">req_011CW2…k7P</text>
    <text x="12" y="154" class="k">query_source</text><text x="140" y="154" class="v">repl_main_thread</text>
