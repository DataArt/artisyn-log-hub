  <!-- annotations -->
  <text x="349" y="700" class="note">FR-1 Same views and controls as the repository Analytics tab, computed over all the team's linked repositories.</text>
  <text x="349" y="716" class="note">Additive totals (cost, tokens, sessions, work time…) = sum over the linked repositories for the same filters (AC FR-1);</text>
  <text x="349" y="732" class="note">ratios and distinct counts (cache-read ratio, users) recomputed over the merged population — open question.</text>
  <text x="349" y="752" class="note">FR-3 Counts only sessions of acknowledged members visible under the team access mode —</text>
  <text x="349" y="768" class="note">same population as the team Spend tab (caller-independent vs viewer-dependent: open question).</text>
  <text x="349" y="788" class="note">Attribute filters / attr:&lt;key&gt; group-by: excluded or limited to keys shared by all repos — open question.</text>
  <text x="349" y="808" class="note">URL: #/teams/:teamId?ttab=analytics&amp;ar=1m&amp;… (filter state alongside ttab).</text>
