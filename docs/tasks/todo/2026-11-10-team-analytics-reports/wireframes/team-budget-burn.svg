  <text x="349" y="276" class="mono t" font-size="15" font-weight="700">$642.00 <tspan class="muted" font-weight="400">of $1,500.00</tspan> · 43 %</text>
  <text x="580" y="276" font-size="13" class="muted">November 2026 · day 10 of 30 · burn $64.20 / day · forecast <tspan class="mono" fill="#b45309" font-weight="700">$1,926</tspan></text>
  <text x="349" y="296" font-size="11" class="muted">Same spend as the team Spend tab (AC FR-4) — acknowledged members, all linked repositories.</text>

