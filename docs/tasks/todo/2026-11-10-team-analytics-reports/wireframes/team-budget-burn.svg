<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, Segoe UI, Arial, sans-serif">
  <style>
    .t { fill: #111827; }
    .muted { fill: #6b7280; }
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    .link { fill: #2563eb; }
    .note { fill: #92400e; font-size: 11px; }
    .lbl { font-size: 11px; fill: #6b7280; letter-spacing: 0.5px; }
    .ax { font-size: 10px; fill: #374151; }
    .btn { fill: #ffffff; stroke: #d1d5db; }
    .new { fill: #eef2ff; stroke: #6366f1; stroke-dasharray: 3,2; }
  </style>
  <rect width="1440" height="900" fill="#ffffff"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1440" height="48" fill="#fafafa"/>
  <line x1="0" y1="48" x2="1440" y2="48" stroke="#e5e7eb"/>
  <circle cx="24" cy="24" r="8" fill="#4f46e5"/>
  <text x="44" y="29" font-size="14" font-weight="600" class="t">[local] Artisyn Log Hub <tspan class="muted" font-size="12" font-weight="400">dev</tspan></text>
  <text x="262" y="29" font-size="14" font-weight="600" class="t">Home</text>
  <text x="858" y="29" font-size="14" class="muted">LogHubLocal</text>
  <rect x="948" y="13" width="72" height="22" rx="11" fill="#ea580c"/>
  <text x="984" y="28" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Restricted</text>
  <text x="1042" y="29" font-size="14" font-weight="600" class="t">All views</text>
  <text x="1150" y="29" font-size="15" class="t">?</text>
  <text x="1186" y="30" font-size="14" class="muted">🔔</text>
  <text x="1226" y="29" font-size="14" class="muted">dt@dataart.com</text>
  <text x="1350" y="29" font-size="14" font-weight="600" class="t">Edit email</text>

  <!-- sidebar (abridged) -->
  <rect x="0" y="49" width="320" height="851" fill="#ffffff"/>
  <line x1="321" y1="49" x2="321" y2="900" stroke="#e5e7eb" stroke-width="4"/>
  <text x="12" y="108" class="lbl">TEAMS</text>
  <rect x="0" y="153" width="320" height="32" fill="#f3f4f6"/>
  <text x="50" y="174" font-size="14" font-weight="700" class="t">LogHubLocal</text>
  <text x="32" y="203" font-size="12" class="t">https://gitlab.dataart.com/da/cml/artisyn-log-hub</text>
  <text x="32" y="225" font-size="12" class="t">https://github.com/DataArt/artisyn-log-hub</text>
  <text x="32" y="247" font-size="12" class="t">https://github.com/denistsyplakov/at-scanner</text>
  <text x="12" y="359" class="lbl">MY REPOS</text>

  <!-- team header -->
  <text x="349" y="94" font-size="20" font-weight="600" class="t">LogHubLocal</text>
  <text x="1424" y="92" font-size="13" class="muted" text-anchor="end">3 linked repositories · 4 members (2 acknowledged)</text>

  <!-- team tabs: Analytics active -->
  <g font-size="14">
    <text x="377" y="148" class="muted">Members</text>
    <text x="459" y="148" class="muted">Repositories</text>
    <text x="559" y="148" class="muted">Invitations</text>
    <text x="648" y="148" class="muted">OTEL</text>
    <text x="701" y="148" class="muted">Spend</text>
    <text x="764" y="148" font-weight="700" class="t">Analytics</text>
    <text x="856" y="148" class="muted">Reports</text>
    <text x="934" y="148" class="muted">Settings</text>
