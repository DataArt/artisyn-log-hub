  <g stroke="#e5e7eb">
    <line x1="390" y1="660" x2="1340" y2="660"/>
    <line x1="390" y1="600" x2="1340" y2="600"/>
    <line x1="390" y1="540" x2="1340" y2="540"/>
    <line x1="390" y1="480" x2="1340" y2="480"/>
    <line x1="390" y1="420" x2="1340" y2="420"/>
  </g>
  <line x1="390" y1="410" x2="390" y2="660" stroke="#9ca3af"/>
  <g class="ax" text-anchor="end">
    <text x="382" y="664">$0</text><text x="382" y="604">$500</text><text x="382" y="544">$1,000</text>
    <text x="382" y="484">$1,500</text><text x="382" y="424">$2,000</text>
  </g>
  <g class="ax" text-anchor="middle">
    <text x="422" y="678">1</text><text x="550" y="678">5</text><text x="710" y="678">10</text>
    <text x="870" y="678">15</text><text x="1030" y="678">20</text><text x="1190" y="678">25</text><text x="1340" y="678">30</text>
  </g>
  <line x1="710" y1="410" x2="710" y2="660" stroke="#9ca3af" stroke-dasharray="2,3"/>
  <text x="714" y="420" class="ax" fill="#6b7280">today</text>

  <line x1="390" y1="507" x2="1340" y2="507" stroke="#f59e0b" stroke-dasharray="6,4"/>
  <text x="1346" y="511" font-size="10" fill="#b45309">75 %</text>
  <line x1="390" y1="480" x2="1340" y2="480" stroke="#dc2626" stroke-width="2"/>
  <text x="1346" y="478" font-size="10" font-weight="700" fill="#dc2626">$1,500</text>

  <polygon points="390,660 422,653 454,645 486,638 518,630 550,618 582,610 614,602 646,595 678,592 710,583 710,660" fill="#4f46e5" fill-opacity="0.08"/>
  <polyline points="390,660 422,653 454,645 486,638 518,630 550,618 582,610 614,602 646,595 678,592 710,583" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  <line x1="710" y1="583" x2="1340" y2="429" stroke="#4f46e5" stroke-width="2" stroke-dasharray="7,5"/>
  <circle cx="1340" cy="429" r="4" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="1332" y="420" font-size="11" font-weight="700" fill="#b45309" text-anchor="end">forecast $1,926 · 128 %</text>

  <!-- tooltip -->
  <rect x="726" y="590" width="250" height="64" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="738" y="608" font-size="11" font-weight="700" class="t">10 Nov (today)</text>
  <text x="738" y="624" font-size="11" class="t">Cumulative <tspan class="mono">$642.00</tspan> · 43 %</text>
  <text x="738" y="640" font-size="11" class="t">This day <tspan class="mono">$71.00</tspan> · 3 repos · <tspan class="link">22 sessions →</tspan></text>

  <!-- empty-state inset -->
  <rect x="349" y="704" width="420" height="96" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="4,3"/>
  <text x="365" y="726" font-size="12" font-weight="700" class="t">Team has no budget</text>
  <text x="365" y="746" font-size="12" class="muted">Picker reads "No budget"; chart shows cumulative team spend of the</text>
  <text x="365" y="762" font-size="12" class="muted">current calendar month only (no budget / threshold / forecast lines).</text>
  <text x="365" y="780" font-size="12" class="link">Set a team budget in Settings › Budgets →</text>
  <text x="365" y="796" class="note">Empty state vs fallback to Spend view — open question.</text>

  <!-- annotations -->
  <text x="790" y="720" class="note">FR-4 Budget burn view at team scope, same chart as the repository version</text>
  <text x="790" y="736" class="note">(task 2026-11-05-budgets-threshold-alerts), driven by the team's budgets.</text>
  <text x="790" y="756" class="note">Time window and Group by greyed for this view (as in the repo version).</text>
  <text x="790" y="772" class="note">Repositories / Users filters narrow the cumulative line only;</text>
  <text x="790" y="788" class="note">budget, threshold and forecast lines stay for the whole team scope.</text>
</svg>
