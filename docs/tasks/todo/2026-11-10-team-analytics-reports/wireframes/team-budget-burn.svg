  <g font-size="14">
    <g opacity="0.4">
      <rect x="349" y="190" width="250" height="36" rx="6" class="btn"/>
      <text x="362" y="213" class="t">1d</text><text x="401" y="213" class="t">2d</text><text x="442" y="213" class="t">3d</text>
      <text x="482" y="213" class="t">1w</text><text x="525" y="213" class="t">2w</text><text x="568" y="213" class="t">1m</text>
      <rect x="611" y="190" width="75" height="36" rx="6" class="btn"/><text x="624" y="213" class="t">Custom</text>
