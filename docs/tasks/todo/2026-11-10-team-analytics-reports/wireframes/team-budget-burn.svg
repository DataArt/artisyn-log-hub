  <rect x="1219" y="230" width="199" height="128" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="1231" y="248" class="lbl">TEAM BUDGETS</text>
  <rect x="1220" y="254" width="197" height="24" fill="#f3f4f6"/>
  <text x="1231" y="271" font-size="13" class="t">✓ Team · Month $1,500</text>
  <text x="1231" y="295" font-size="13" class="t">Team · Week $400</text>
