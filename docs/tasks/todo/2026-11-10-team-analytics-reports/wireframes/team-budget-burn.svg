    <rect x="1077" y="190" width="130" height="36" rx="6" class="btn"/><text x="1090" y="213" class="t" font-weight="600">Budget burn ⌄</text>
    <rect x="1219" y="190" width="199" height="36" rx="6" class="new"/><text x="1232" y="213" class="t">Team · Month $1,500 ⌄</text>
  </g>

