  <!-- annotations -->
  <text x="598" y="780" class="note">FR-2 Same report catalog as the repository Reports tab, computed over all the team's linked repositories, with on-page preview and PDF download.</text>
  <text x="598" y="796" class="note">FR-3 Only sessions of acknowledged members visible under the team access mode are counted.</text>
  <text x="598" y="812" class="note">FR-4 "Budget" report shows the team's budgets; spend equals the team Spend tab (AC FR-4).</text>
  <text x="598" y="828" class="note">Greyed items (Change Surface, OKF Usage): repository-bound — offered at team scope or not is an open question.</text>
  <text x="598" y="844" class="note">No linked repos / no data: Generate and Download as PDF disabled with an empty-state hint, or a "No data in this period" report — open question.</text>
</svg>
