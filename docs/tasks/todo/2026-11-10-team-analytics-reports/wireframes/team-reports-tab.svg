    <text x="606" y="634" class="t">https://gitlab.dataart.com/da/cml/artisyn-log-hub</text><text x="1150" y="634" text-anchor="end" class="t">157</text><text x="1381" y="634" text-anchor="end" class="mono t">$873.34</text>
    <line x1="598" y1="646" x2="1389" y2="646" stroke="#f3f4f6"/>
    <text x="606" y="672" class="t">https://github.com/DataArt/artisyn-log-hub</text><text x="1150" y="672" text-anchor="end" class="t">121</text><text x="1381" y="672" text-anchor="end" class="mono t">$451.20</text>
    <line x1="598" y1="684" x2="1389" y2="684" stroke="#f3f4f6"/>
    <text x="606" y="710" class="t">https://github.com/denistsyplakov/at-scanner</text><text x="1150" y="710" text-anchor="end" class="t">34</text><text x="1381" y="710" text-anchor="end" class="mono t">$87.82</text>
