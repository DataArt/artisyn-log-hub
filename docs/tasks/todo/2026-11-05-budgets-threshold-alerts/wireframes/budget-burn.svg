    .note { fill: #92400e; font-size: 11px; }
    .lbl { font-size: 11px; fill: #6b7280; letter-spacing: 0.5px; }
    .ax { font-size: 10px; fill: #374151; }
    .btn { fill: #ffffff; stroke: #d1d5db; }
  </style>
  <rect width="1440" height="900" fill="#ffffff"/>

  <!-- top bar (as in the current app) -->
  <rect x="0" y="0" width="1440" height="48" fill="#fafafa"/>
  <line x1="0" y1="48" x2="1440" y2="48" stroke="#e5e7eb"/>
  <circle cx="24" cy="24" r="8" fill="#4f46e5"/>
  <text x="44" y="29" font-size="14" font-weight="600" class="t">[local] Artisyn Log Hub <tspan class="muted" font-size="12" font-weight="400">dev</tspan></text>
  <text x="262" y="29" font-size="14" font-weight="600" class="t">Home</text>
  <text x="858" y="29" font-size="14" class="muted">LogHubLocal</text>
  <rect x="948" y="13" width="72" height="22" rx="11" fill="#ea580c"/>
  <text x="984" y="28" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Restricted</text>
  <text x="1042" y="29" font-size="14" font-weight="600" class="t">All views</text>
  <text x="1150" y="29" font-size="15" class="t">?</text>
  <text x="1186" y="30" font-size="14" class="muted">🔔</text>
  <text x="1226" y="29" font-size="14" class="muted">dt@dataart.com</text>
  <text x="1350" y="29" font-size="14" font-weight="600" class="t">Edit email</text>

  <!-- sidebar (abridged) -->
  <rect x="0" y="49" width="320" height="851" fill="#ffffff"/>
  <line x1="321" y1="49" x2="321" y2="900" stroke="#e5e7eb" stroke-width="4"/>
  <text x="12" y="108" class="lbl">TEAMS</text>
  <text x="50" y="173" font-size="14" font-weight="700" class="t">LogHubLocal</text>
  <rect x="0" y="186" width="320" height="24" fill="#f3f4f6"/>
  <text x="32" y="203" font-size="12" font-weight="700" class="t">https://gitlab.dataart.com/da/cml/artisyn-log-hub</text>
  <text x="12" y="359" class="lbl">MY REPOS</text>
  <text x="12" y="392" font-size="14" class="muted">https://github.com/DataArt/artisyn-log-hub</text>

  <!-- repo header -->
  <text x="341" y="82" class="mono t" font-size="14" font-weight="700">https://gitlab.dataart.com/da/cml/artisyn-log-hub</text>
  <text x="1262" y="82" font-size="13" class="muted">Sessions: 1551   Users: 1</text>
  <line x1="325" y1="105" x2="1440" y2="105" stroke="#e5e7eb"/>

  <!-- tabs: Analytics active -->
  <rect x="341" y="113" width="22" height="22" rx="4" fill="none" stroke="#d1d5db"/>
  <text x="385" y="129" font-size="14" class="muted">Sessions</text>
  <text x="460" y="129" font-size="14" font-weight="700" class="t">Analytics</text>
  <line x1="452" y1="142" x2="525" y2="142" stroke="#111827" stroke-width="2"/>
  <text x="544" y="129" font-size="14" class="muted">Spend</text>
  <text x="608" y="129" font-size="14" class="muted">Reports</text>
  <text x="676" y="129" font-size="14" class="muted">Tools/MCP</text>
  <text x="757" y="129" font-size="14" class="muted">OKF</text>
  <text x="800" y="129" font-size="14" class="muted">OTEL</text>
  <text x="850" y="129" font-size="14" class="muted">Settings</text>
  <line x1="325" y1="143" x2="1440" y2="143" stroke="#e5e7eb"/>

  <!-- controls row (existing AnalyticsControls) -->
  <g font-size="14">
    <rect x="341" y="167" width="250" height="36" rx="6" class="btn"/>
    <text x="354" y="190" class="t">1d</text><text x="393" y="190" class="t">2d</text><text x="434" y="190" class="t">3d</text>
    <text x="474" y="190" class="t">1w</text><text x="517" y="190" class="t">2w</text>
    <rect x="548" y="168" width="42" height="34" fill="#f3f4f6"/><text x="560" y="190" class="t">1m</text>
    <rect x="603" y="167" width="75" height="36" rx="6" class="btn"/><text x="616" y="190" class="t">Custom</text>
    <rect x="690" y="167" width="125" height="36" rx="6" class="btn"/><text x="703" y="190" class="t">No grouping ⌄</text>
    <rect x="827" y="167" width="102" height="36" rx="6" class="btn"/><text x="840" y="190" class="t">Branches ⌄</text>
    <rect x="941" y="167" width="80" height="36" rx="6" class="btn"/><text x="954" y="190" class="t">Users ⌄</text>
    <rect x="1033" y="167" width="130" height="36" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-dasharray="3,2"/><text x="1046" y="190" class="t" font-weight="600">Budget burn ⌄</text>
    <text x="1175" y="190" class="muted">📌</text>
    <rect x="1203" y="167" width="190" height="36" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-dasharray="3,2"/><text x="1216" y="190" class="t">Budget: Month $300 ⌄</text>
  </g>
  <text x="1033" y="220" class="note">NEW view in the view selector</text>
  <text x="1203" y="220" class="note">NEW budget picker (only this view)</text>
  <text x="341" y="220" class="note">Layout toggle hidden for this view (line chart, no horizontal ranking) — like the usage table views.</text>

  <!-- summary strip -->
  <text x="341" y="256" class="mono t" font-size="15" font-weight="700">$151.00 <tspan class="muted" font-weight="400">of $300.00</tspan> · 50 %</text>
  <text x="560" y="256" font-size="13" class="muted">November 2026 · day 10 of 30 · resets on 1 Dec · burn $15.10 / day · forecast <tspan class="mono" fill="#b45309" font-weight="700">$453.00</tspan> · runs out ~20 Nov</text>
  <rect x="1220" y="241" width="118" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1279" y="256" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">⚠ Overspend risk</text>
  <text x="341" y="276" font-size="11" class="muted">Reference only — Log Hub does not stop usage. Spend = per session tree the larger of hook-upload and OTEL cost (same numbers as the Spend view).</text>

  <!-- ============ chart ============ -->
  <!-- y gridlines: $0..$500, y = 620 - $*0.64 -->
  <g stroke="#e5e7eb">
    <line x1="380" y1="620" x2="1340" y2="620"/>
    <line x1="380" y1="556" x2="1340" y2="556"/>
    <line x1="380" y1="492" x2="1340" y2="492"/>
    <line x1="380" y1="428" x2="1340" y2="428"/>
    <line x1="380" y1="364" x2="1340" y2="364"/>
    <line x1="380" y1="300" x2="1340" y2="300"/>
  </g>
  <line x1="380" y1="296" x2="380" y2="620" stroke="#9ca3af"/>
  <g class="ax" text-anchor="end">
    <text x="372" y="624">$0</text><text x="372" y="560">$100</text><text x="372" y="496">$200</text>
    <text x="372" y="432">$300</text><text x="372" y="368">$400</text><text x="372" y="304">$500</text>
  </g>
  <text x="372" y="290" class="ax" text-anchor="end" fill="#6b7280">USD</text>

  <!-- x axis: day of period, x = 380 + d*32 -->
  <g class="ax" text-anchor="middle">
    <text x="412" y="638">1</text><text x="540" y="638">5</text><text x="700" y="638">10</text>
    <text x="860" y="638">15</text><text x="1020" y="638">20</text><text x="1180" y="638">25</text><text x="1340" y="638">30</text>
  </g>
  <text x="860" y="656" class="ax" text-anchor="middle" fill="#6b7280">November 2026 (budget period, Europe/Berlin)</text>

  <!-- today marker -->
  <line x1="700" y1="300" x2="700" y2="620" stroke="#9ca3af" stroke-dasharray="2,3"/>
  <text x="704" y="312" class="ax" fill="#6b7280">today</text>

  <!-- threshold lines (budget's own list) -->
  <line x1="380" y1="476" x2="1340" y2="476" stroke="#f59e0b" stroke-dasharray="6,4"/>
  <text x="1346" y="480" font-size="10" fill="#b45309">75 %</text>
  <line x1="380" y1="447.2" x2="1340" y2="447.2" stroke="#f97316" stroke-dasharray="6,4"/>
  <text x="1346" y="451" font-size="10" fill="#c2410c">90 %</text>

  <!-- budget line (100 %) -->
  <line x1="380" y1="428" x2="1340" y2="428" stroke="#dc2626" stroke-width="2"/>
  <text x="1346" y="424" font-size="10" font-weight="700" fill="#dc2626">$300</text>
  <text x="1346" y="436" font-size="10" fill="#dc2626">100 %</text>

  <!-- previous period, cumulative (muted, for comparison) -->
  <polyline points="380,620 540,601 700,568.8 860,545 1020,517.6 1180,492 1340,467.7" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="1,3"/>
  <text x="1300" y="462" font-size="10" fill="#6b7280" text-anchor="end">October $238</text>

  <!-- cumulative spend (solid) -->
  <polygon points="380,620 412,614.9 444,607.2 476,600.2 508,595.7 540,575.2 572,567.5 604,557.3 636,546.4 668,534.9 700,523.4 700,620" fill="#4f46e5" fill-opacity="0.08"/>
  <polyline points="380,620 412,614.9 444,607.2 476,600.2 508,595.7 540,575.2 572,567.5 604,557.3 636,546.4 668,534.9 700,523.4" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  <g fill="#4f46e5">
    <circle cx="412" cy="614.9" r="3"/><circle cx="444" cy="607.2" r="3"/><circle cx="476" cy="600.2" r="3"/>
    <circle cx="508" cy="595.7" r="3"/><circle cx="572" cy="567.5" r="3"/>
    <circle cx="604" cy="557.3" r="3"/><circle cx="636" cy="546.4" r="3"/><circle cx="668" cy="534.9" r="3"/><circle cx="700" cy="523.4" r="4"/>
  </g>
  <!-- anomaly day (FR-5): ≥ 2× daily average -->
  <circle cx="540" cy="575.2" r="5" fill="#f97316" stroke="#ffffff" stroke-width="1.5"/>
  <text x="548" y="594" font-size="10" font-weight="700" fill="#c2410c">▲ 5 Nov +$32 · 2.1× avg</text>

  <!-- forecast (dashed) -->
  <line x1="700" y1="523.4" x2="1340" y2="330.1" stroke="#4f46e5" stroke-width="2" stroke-dasharray="7,5"/>
  <circle cx="1340" cy="330.1" r="4" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="1332" y="322" font-size="11" font-weight="700" fill="#b45309" text-anchor="end">forecast $453 · 151 %</text>

  <!-- crossing markers on the forecast -->
  <circle cx="856.8" cy="476" r="3.5" fill="#f59e0b"/>
  <circle cx="952.9" cy="447.2" r="3.5" fill="#f97316"/>
  <circle cx="1015.8" cy="428" r="4.5" fill="#dc2626"/>
  <text x="1012" y="416" font-size="10" fill="#dc2626" text-anchor="end">runs out ~20 Nov</text>

  <!-- tooltip at today -->
  <rect x="716" y="552" width="196" height="64" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="728" y="570" font-size="11" font-weight="700" class="t">10 Nov (today)</text>
  <text x="728" y="586" font-size="11" class="t">Cumulative <tspan class="mono">$151.00</tspan> · 50 %</text>
  <text x="728" y="602" font-size="11" class="t">This day <tspan class="mono">$18.00</tspan> · <tspan class="link">6 sessions →</tspan></text>

  <!-- legend -->
  <g font-size="12">
    <line x1="380" y1="684" x2="404" y2="684" stroke="#4f46e5" stroke-width="2.5"/><text x="410" y="688" class="t">Cumulative spend</text>
    <line x1="530" y1="684" x2="554" y2="684" stroke="#4f46e5" stroke-width="2" stroke-dasharray="7,5"/><text x="560" y="688" class="t">Linear forecast</text>
    <line x1="666" y1="684" x2="690" y2="684" stroke="#dc2626" stroke-width="2"/><text x="696" y="688" class="t">Budget</text>
    <line x1="756" y1="684" x2="780" y2="684" stroke="#f59e0b" stroke-dasharray="6,4"/><text x="786" y="688" class="t">Thresholds</text>
    <line x1="870" y1="684" x2="894" y2="684" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="1,3"/><text x="900" y="688" class="t">Previous period</text>
    <circle cx="1018" cy="684" r="5" fill="#f97316"/><text x="1028" y="688" class="t">Anomaly day (≥ 2× avg)</text>
  </g>

  <!-- annotations -->
  <text x="341" y="726" class="note">FR-12 "Budget burn": cumulative spend per day of the selected budget's period against the budget line; linear forecast to period end dashed (FR-3 formulas);</text>
  <text x="341" y="742" class="note">threshold lines from the budget's own "Notify at" list. With no filters the last solid point equals the budget spend (FR-2) and the Spend view's bar.</text>
  <text x="341" y="762" class="note">Budget picker: lists the scope's budgets (default Month, else Week, else Day). X axis = that budget's current period; ‹ › for previous periods is an open question.</text>
  <text x="341" y="778" class="note">Branches / Users filters narrow the cumulative line (label becomes "Cumulative spend (filtered)"); budget and threshold lines stay for the whole scope.</text>
  <text x="341" y="794" class="note">Group by branch / user: the cumulative area is stacked per group; the forecast stays one dashed line for the total.</text>
  <text x="341" y="814" class="note">No budget on the scope: picker reads "No budget", chart shows cumulative spend for the tab's time window only (no budget / threshold / forecast lines)</text>
  <text x="341" y="830" class="note">and a hint "Set a budget in Settings › Budgets" (link only for users who may manage the scope).</text>
  <text x="341" y="850" class="note">Team page has no Analytics tab today — a team budget's burn chart is shown on the team Spend tab (open question).</text>
</svg>
