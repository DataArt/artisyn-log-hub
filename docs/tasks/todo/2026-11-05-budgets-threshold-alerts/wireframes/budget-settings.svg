  <text x="878" y="954" font-size="12" class="link" text-anchor="middle">Load older events</text>
  <text x="361" y="984" class="note">FR-10: window opened by "Budget event log" above. Written when the event happens (edit transaction or threshold job); kept after deletion.</text>

  <!-- footnotes -->
  <text x="341" y="1022" class="note">Event types: Created · Edited (old → new amount, period, thresholds, time zone) · Deleted · Threshold crossed · Email sent / skipped (mail not configured) / failed.</text>
  <text x="341" y="1038" class="note">Actor = the user's email, or "system · threshold job" for events written by the periodic job.</text>
  <text x="341" y="1054" class="note">Visible to whoever can see this scope's budgets (FR-7, FR-10); a user without access to the scope cannot read the log. Time shown in the viewer's browser time zone.</text>
  <text x="341" y="1070" class="note">Personal repository Settings and team settings have the same "Budget event log" button and window, listing only that scope's budget events.</text>
</svg>
