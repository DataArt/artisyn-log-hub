  <rect x="250" y="467" width="98" height="15" rx="7" fill="#ecfdf5" stroke="#16a34a"/><text x="256" y="478" font-size="10" fill="#15803d">§ section read ×2</text>
  <rect x="420" y="470" width="16" height="6" class="bar"/>
  <text x="500" y="478" class="mono">1 / 1</text><text x="590" y="478" class="mono">0</text>

