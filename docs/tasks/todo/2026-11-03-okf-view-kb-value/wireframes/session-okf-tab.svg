  <text x="410" y="267" class="muted" font-size="11"><tspan class="mono">ls docs/knowledgebase/x.md</tspan> without a read — not an entry</text>
  <rect x="404" y="254" width="370" height="20" rx="3" class="new"/><text x="780" y="268" class="newlbl">FR-8</text>

