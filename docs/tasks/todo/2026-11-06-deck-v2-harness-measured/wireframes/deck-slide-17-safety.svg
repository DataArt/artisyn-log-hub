1a' font-weight='700'>What the harness exposed</text><text x='142' y='240' font-family='Segoe UI, Arial, sans-serif' font-size='15' fill='#333333'>Full capture of context and tool I/O,</text><text x='142' y='262' font-family='Segoe UI, Arial, sans-serif' font-size='15' fill='#333333'>so a leak can be traced.</text><rect x='80' y='288' width='640' height='96' rx='0' fill='#faf8f3' stroke='#1a1a1a' stroke-width='1.2'/><rect x='80' y='288' width='44' height='96' rx='0' fill='#1f5a43' stroke='none' stroke-width='1.5'/><text x='102' y='344' font-family='JetBrains Mono, Consolas, monospace' font-size='22' fill='#fff' font-weight='700' text-anchor='middle'>b</text><text x='142' y='320' font-family='JetBrains Mono, Consolas, monospace' font-size='18' fill='#1a1a1a' font-weight='700'>The injection surface, visible</text><text x='142' y='348' font-family='Segoe UI, Arial, sans-serif' font-size='15' fill='#333333'>Permission denials and every tool answer;</text><text x='142' y='370' font-family='Segoe UI, Arial, sans-serif' font-size='15' fill='#333333'>poisoned MCP tools: ≈ 1/3 comply (MCPTox, 2026).</text><rect x='80' y='396' width='640' height='96' rx='0' fill='#faf8f3' stroke='#1a1a1a' stroke-width='1.2'/><rect x='80' y='396' width='44' height='96' rx='0' fill='#1f5a43' stroke='none' stroke-width='1.5'/><text x='102' y='452' font-family='JetBrains Mono, Consolas, monospace' font-size='22' fill='#fff' font-weight='700' text-anchor='middle'>c</text><text x='142' y='428' font-family='JetBrains Mono, Consolas, monospace' font-size='18' fill='#1a1a1a' font-weight='700'>Our own example</text><text x='142' y='456' font-family='Segoe UI, Arial, sans-serif' font-size='15' fill='#333333'>Hook 2.31.1 runs the post-turn evaluator</text><text x='142' y='478' font-family='Segoe UI, Arial, sans-serif' font-size='15' fill='#333333'>without tools, MCP or skills.</text><text x='80' y='520' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'>three layers replace F1 headline content; study figure attributed in text only</text><rect x='760' y='180' width='440' height='312' rx='0' fill='#eceee6' stroke='#1f5a43' stroke-width='1.2'/><text x='784' y='214' font-family='JetBrains Mono, Consolas, monospace' font-size='14' fill='#1f5a43' font-weight='700' letter-spacing='1'>DATA STAYS ON YOUR HOST</text><text x='784' y='256' font-family='Segoe UI, Arial, sans-serif' font-size='16' fill='#1a1a1a'>✓  Self-hosted · Docker + Postgres</text><text x='784' y='296' font-family='Segoe UI, Arial, sans-serif' font-size='16' fill='#1a1a1a'>✓  No external service, no telemetry out</text><text x='784' y='336' font-family='Segoe UI, Arial, sans-serif' font-size='16' fill='#1a1a1a'>✓  Your SMTP for e-mail</text><text x='784' y='376' font-family='Segoe UI, Arial, sans-serif' font-size='16' fill='#1a1a1a'>✓  Access by role · retention you set</text><text x='760' y='520' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'>F1 seal-board, trimmed to 4 rows</text></g><line x1='80' y1='654' x2='1200' y2='654' stroke='#d9d4c7' stroke-width='1'/><text x='80' y='680' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#6b6b6b'>https://dataart.github.io/artisyn-log-hub/</text><text x='1130' y='690' font-family='Segoe UI, Arial, sans-serif' font-size='15' fill='#6b6b6b' text-anchor='middle'>17 / 21</text><text x='1196' y='693' font-family='Segoe UI, Arial, sans-serif' font-size='44' fill='#b8c9bf'>‹</text><text x='1240' y='693' font-family='Segoe UI, Arial, sans-serif' font-size='44' fill='#1f5a43'>›</text></svg>