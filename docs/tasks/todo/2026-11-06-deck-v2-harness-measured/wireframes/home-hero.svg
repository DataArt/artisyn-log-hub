<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='1010' viewBox='0 0 1280 1010'><rect x='0' y='0' width='1280' height='1010' rx='0' fill='#f4f1ea' stroke='none' stroke-width='1.5'/><line x1='0' y1='52' x2='1280' y2='52' stroke='#d9d4c7' stroke-width='1'/><text x='24' y='32' font-family='JetBrains Mono, Consolas, monospace' font-size='17' fill='#1f5a43' font-weight='700'>Artisyn Log Hub</text><text x='203' y='32' font-family='JetBrains Mono, Consolas, monospace' font-size='13' fill='#1f5a43' font-weight='700'>Home</text><text x='257' y='32' font-family='JetBrains Mono, Consolas, monospace' font-size='13' fill='#1a1a1a'>Features</text><text x='343' y='32' font-family='JetBrains Mono, Consolas, monospace' font-size='13' fill='#1a1a1a'>Get started</text><text x='453' y='32' font-family='JetBrains Mono, Consolas, monospace' font-size='13' fill='#1a1a1a'>Configuration</text><text x='579' y='32' font-family='JetBrains Mono, Consolas, monospace' font-size='13' fill='#1a1a1a'>Using Log Hub</text><text x='705' y='32' font-family='JetBrains Mono, Consolas, monospace' font-size='13' fill='#1a1a1a'>Data &amp; security</text><text x='847' y='32' font-family='JetBrains Mono, Consolas, monospace' font-size='13' fill='#1a1a1a'>Questions</text><text x='941' y='32' font-family='JetBrains Mono, Consolas, monospace' font-size='13' fill='#1a1a1a'>Deck</text><text x='995' y='32' font-family='JetBrains Mono, Consolas, monospace' font-size='13' fill='#1a1a1a'>GitHub ↗</text><text x='64' y='112' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#a0700f'>// SELF-HOSTED ANALYTICS FOR CLAUDE CODE</text><text x='64' y='160' font-family='JetBrains Mono, Consolas, monospace' font-size='34' fill='#1f5a43' font-weight='700'>It ran alone for 10 minutes,</text><text x='64' y='204' font-family='JetBrains Mono, Consolas, monospace' font-size='34' fill='#1f5a43' font-weight='700'>cost $8 and shipped the</text><text x='64' y='248' font-family='JetBrains Mono, Consolas, monospace' font-size='34' fill='#1f5a43' font-weight='700'>feature. All good?</text><text x='64' y='272' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'>hook headline: duration / cost from dataset (session.durationMin, session.total)</text><text x='64' y='306' font-family='Segoe UI, Arial, sans-serif' font-size='17' fill='#333333'>A harness is what makes Claude Code effective: CLAUDE.md, rules,</text><text x='64' y='334' font-family='Segoe UI, Arial, sans-serif' font-size='17' fill='#333333'>skills, hooks, agents, MCP, a knowledge base. It moves quality, cost,</text><text x='64' y='362' font-family='Segoe UI, Arial, sans-serif' font-size='17' fill='#333333'>speed, how long the agent works alone, and safety. Today it is tuned</text><text x='64' y='390' font-family='Segoe UI, Arial, sans-serif' font-size='17' fill='#333333'>as a black box. You already control the cost — right and useful.</text><text x='64' y='418' font-family='Segoe UI, Arial, sans-serif' font-size='17' fill='#333333'>Log Hub answers the next questions: what each element does to each</text><text x='64' y='446' font-family='Segoe UI, Arial, sans-serif' font-size='17' fill='#333333'>of the five.</text><rect x='64' y='486' width='140' height='42' rx='0' fill='#1f5a43' stroke='#1f5a43' stroke-width='1.5'/><text x='134' y='512' font-family='JetBrains Mono, Consolas, monospace' font-size='13' fill='#fff' font-weight='700' text-anchor='middle'>GET STARTED</text><rect x='216' y='486' width='200' height='42' rx='0' fill='none' stroke='#1f5a43' stroke-width='1.5'/><text x='316' y='512' font-family='JetBrains Mono, Consolas, monospace' font-size='13' fill='#1f5a43' font-weight='700' text-anchor='middle'>WHY LOG HUB (DECK)</text><rect x='428' y='486' width='116' height='42' rx='0' fill='none' stroke='#1f5a43' stroke-width='1.5'/><text x='486' y='512' font-family='JetBrains Mono, Consolas, monospace' font-size='13' fill='#1f5a43' font-weight='700' text-anchor='middle'>GITHUB ↗</text><text x='64' y='576' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#a0700f' letter-spacing='1'>FIVE QUESTIONS BEHIND "ALL GOOD"</text><rect x='64' y='590' width='220' height='120' rx='0' fill='#fbfaf6' stroke='#1f5a43' stroke-width='1.2'/><rect x='64' y='590' width='220' height='4' rx='0' fill='#1f5a43' stroke='none' stroke-width='1.5'/><text x='80' y='618' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700'>01 · QUALITY</text><text x='80' y='648' font-family='JetBrains Mono, Consolas, monospace' font-size='15' fill='#1a1a1a' font-weight='700'>Right thing built?</text><text x='80' y='696' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#1f5a43'>Features → C, H</text><rect x='296' y='590' width='220' height='120' rx='0' fill='#fbfaf6' stroke='#1f5a43' stroke-width='1.2'/><rect x='296' y='590' width='220' height='4' rx='0' fill='#1f5a43' stroke='none' stroke-width='1.5'/><text x='312' y='618' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700'>02 · COST</text><text x='312' y='648' font-family='JetBrains Mono, Consolas, monospace' font-size='15' fill='#1a1a1a' font-weight='700'>Was $8 good?</text><text x='312' y='696' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#1f5a43'>Features → A</text><rect x='528' y='590' width='220' height='120' rx='0' fill='#fbfaf6' stroke='#1f5a43' stroke-width='1.2'/><rect x='528' y='590' width='220' height='4' rx='0' fill='#1f5a43' stroke='none' stroke-width='1.5'/><text x='544' y='618' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700'>03 · SPEED</text><text x='544' y='648' font-family='JetBrains Mono, Consolas, monospace' font-size='15' fill='#1a1a1a' font-weight='700'>Was it fast?</text><text x='544' y='696' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#1f5a43'>Features → I</text><rect x='760' y='590' width='220' height='120' rx='0' fill='#fbfaf6' stroke='#1f5a43' stroke-width='1.2'/><rect x='760' y='590' width='220' height='4' rx='0' fill='#1f5a43' stroke='none' stroke-width='1.5'/><text x='776' y='618' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700'>04 · AUTONOMY</text><text x='776' y='648' font-family='JetBrains Mono, Consolas, monospace' font-size='15' fill='#1a1a1a' font-weight='700'>How far alone?</text><text x='776' y='696' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#1f5a43'>Features → I</text><rect x='992' y='590' width='220' height='120' rx='0' fill='#fbfaf6' stroke='#1f5a43' stroke-width='1.2'/><rect x='992' y='590' width='220' height='4' rx='0' fill='#1f5a43' stroke='none' stroke-width='1.5'/><text x='1008' y='618' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700'>05 · SAFETY</text><text x='1008' y='648' font-family='JetBrains Mono, Consolas, monospace' font-size='15' fill='#1a1a1a' font-weight='700'>What did it read</text><text x='1008' y='668' font-family='JetBrains Mono, Consolas, monospace' font-size='15' fill='#1a1a1a' font-weight='700'>and send?</text><text x='1008' y='696' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#1f5a43'>Features → E</text><text x='64' y='730' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'>row of five tiles, each a link into its Features block; wraps to 2 columns / stacked at 375 px; no horizontal scroll</text><rect x='708' y='92' width='508' height='470' rx='0' fill='#f8f6f0' stroke='#d9d4c7' stroke-width='1.5'/><text x='726' y='122' font-family='JetBrains Mono, Consolas, monospace' font-size='13' fill='#1a1a1a'>One session, $8.00 — and what to do about it</text><text x='1198' y='122' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#6b6b6b' text-anchor='end'>65 turns · 10 min</text><text x='726' y='142' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'>"Illustrative example" label removed (FR-1a)</text><line x1='726' y1='152' x2='1198' y2='152' stroke='#d9d4c7' stroke-width='1' stroke-dasharray='3 3'/><text x='726' y='174' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1a1a1a' font-weight='700'>01 WHERE THE MONEY WENT</text><rect x='726' y='184' width='42.48' height='10' rx='0' fill='#1f5a43' stroke='none' stroke-width='1.5'/><rect x='768.48' y='184' width='80.24000000000001' height='10' rx='0' fill='#4f8a6e' stroke='none' stroke-width='1.5'/><rect x='848.72' y='184' width='155.76000000000002' height='10' rx='0' fill='#a0700f' stroke='none' stroke-width='1.5'/><rect x='1004.48' y='184' width='89.68' height='10' rx='0' fill='#c9a96a' stroke='none' stroke-width='1.5'/><rect x='1094.16' y='184' width='103.84' height='10' rx='0' fill='#9aa39b' stroke='none' stroke-width='1.5'/><line x1='726' y1='212' x2='1198' y2='212' stroke='#d9d4c7' stroke-width='1' stroke-dasharray='3 3'/><text x='726' y='234' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1a1a1a' font-weight='700'>02 HOW THE HARNESS WORKED</text><text x='726' y='258' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1a1a1a'>system context per turn</text><text x='1198' y='258' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1a1a1a' font-weight='700' text-anchor='end'>48,000 tokens</text><text x='726' y='280' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1a1a1a'>MCP servers used / loaded</text><text x='1198' y='280' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1a1a1a' font-weight='700' text-anchor='end'>2 / 5</text><text x='726' y='302' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1a1a1a'>skills used / loaded</text><text x='1198' y='302' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1a1a1a' font-weight='700' text-anchor='end'>3 / 14</text><text x='726' y='324' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700'>KB articles read · pointer yield</text><text x='1198' y='324' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700' text-anchor='end'>6 · 0.31</text><text x='1222' y='324' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'>← new</text><text x='726' y='346' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700'>MCP calls · errors</text><text x='1198' y='346' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700' text-anchor='end'>41 · 3</text><text x='1222' y='346' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'>← new</text><line x1='726' y1='376' x2='1198' y2='376' stroke='#d9d4c7' stroke-width='1' stroke-dasharray='3 3'/><text x='726' y='398' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1a1a1a' font-weight='700'>03 AGAINST THE REPO AND THE TEAM</text><rect x='726' y='414' width='472' height='134' rx='0' fill='none' stroke='#1f5a43' stroke-width='1.2'/><rect x='726' y='414' width='4' height='134' rx='0' fill='#1f5a43' stroke='none' stroke-width='1.5'/><text x='742' y='436' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700'>→ WHAT TO DO</text><text x='742' y='460' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#333333'>1. Unload the MCP servers and skills never touched …</text><text x='742' y='480' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#333333'>2. Start a fresh session at the task boundary …</text><text x='742' y='500' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#333333'>3. Check the workflow that spawns sub-agents …</text><text x='742' y='520' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#1f5a43' font-weight='700'>4. Promote the KB article read in 84 % of sessions</text><text x='742' y='540' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#1f5a43' font-weight='700'>    to CLAUDE.md; fix the failing MCP tool.</text><text x='708' y='578' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'>worked example kept; step 02 + "what to do" gain KB and tools lines (FR-6)</text><text x='64' y='800' font-family='JetBrains Mono, Consolas, monospace' font-size='17' fill='#1f5a43' font-weight='700' letter-spacing='1.5'>SEE IT IN ACTION</text><rect x='64' y='816' width='1152' height='120' rx='0' fill='#fff' stroke='#d9d4c7' stroke-width='1.5'/><text x='640' y='884' font-family='Segoe UI, Arial, sans-serif' font-size='14' fill='#6b6b6b' text-anchor='middle'>carousel — unchanged (Live view / Session Map clips optional)</text><text x='64' y='980' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#7a4fb5' font-style='italic'>↓ continues: harness anatomy strip → dimension cards → footer line (see home-anatomy-and-cards.svg)</text></svg>