<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>

  <text x="24" y="34" font-size="18" font-weight="700" fill="#111827">F6 · New user with no data: "Get started" instead of empty widgets</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">Each step links to the page where it is done or to the bundled help article (works offline).</text>

  <rect x="24" y="72" width="952" height="332" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="25" y="73" width="950" height="36" rx="7" fill="#fafafa"/>
  <circle cx="44" cy="91" r="6" fill="#3b4fd0"/>
  <text x="58" y="95" font-size="12.5" font-weight="600" fill="#111827">Artisyn Log Hub</text>
  <text x="772" y="95" font-size="12" fill="#6b7280">new.user@dataart.com</text>
  <text x="908" y="95" font-size="12" font-weight="600" fill="#111827">Edit email</text>
  <line x1="24" y1="109" x2="976" y2="109" stroke="#e5e7eb"/>

  <line x1="190" y1="110" x2="190" y2="403" stroke="#e5e7eb" stroke-width="3"/>
  <rect x="25" y="120" width="164" height="22" fill="#f9fafb"/>
  <text x="36" y="135" font-size="10" fill="#9ca3af" letter-spacing="0.6">MY REPOS</text>
  <text x="36" y="162" font-size="11.5" fill="#9ca3af">No repositories yet</text>

  <text x="212" y="142" font-size="20" font-weight="700" fill="#111827">Home</text>

  <rect x="212" y="158" width="744" height="226" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="232" y="188" font-size="16" font-weight="700" fill="#111827">Get started</text>
  <text x="232" y="208" font-size="12" fill="#374151">Your sessions show up here after three steps.</text>

  <!-- step 1 -->
  <rect x="232" y="224" width="704" height="44" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <circle cx="256" cy="246" r="12" fill="#2563eb"/><text x="256" y="251" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="280" y="244" font-size="13" font-weight="600" fill="#111827">Install the hook</text>
  <text x="280" y="260" font-size="11.5" fill="#6b7280">Create an API key and run the installer</text>
  <rect x="806" y="234" width="118" height="24" rx="6" fill="#2563eb"/>
  <text x="818" y="250" font-size="12" font-weight="600" fill="#ffffff">API Keys › Install</text>

  <!-- step 2 -->
  <rect x="232" y="276" width="704" height="44" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <circle cx="256" cy="298" r="12" fill="#2563eb"/><text x="256" y="303" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="280" y="296" font-size="13" font-weight="600" fill="#111827">Run a Claude Code session in your repository</text>
  <text x="280" y="312" font-size="11.5" fill="#6b7280">The hook uploads it when the session ends</text>
  <text x="924" y="302" text-anchor="end" font-size="12" fill="#2563eb">Help: Your first session →</text>

  <!-- step 3 -->
  <rect x="232" y="328" width="704" height="44" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <circle cx="256" cy="350" r="12" fill="#2563eb"/><text x="256" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="280" y="348" font-size="13" font-weight="600" fill="#111827">Open the repository from the left panel</text>
  <text x="280" y="364" font-size="11.5" fill="#6b7280">Cost, tools and context of every session</text>
  <text x="924" y="354" text-anchor="end" font-size="12" fill="#2563eb">Help: Connecting a Repository →</text>
</svg>
