  <text x="720" y="128" font-size="10.5" fill="#6b7280" letter-spacing="0.6">TOP-LEVEL MODULES</text>
  <text x="720" y="154" font-size="19" font-weight="700" fill="#111827" font-family="Consolas, monospace">2</text>
  <text x="720" y="176" font-size="10.5" fill="#6b7280">client / doc</text>
  <!-- cell 6 -->
  <text x="889" y="128" font-size="10.5" fill="#6b7280" letter-spacing="0.6">COMMON ANCESTOR</text>
  <text x="889" y="154" font-size="19" font-weight="700" fill="#111827" font-family="Consolas, monospace">depth 0</text>
  <text x="889" y="176" font-size="10.5" fill="#6b7280">repo root — reaches everywhere</text>
  <!-- callout A -->
  <line x1="456" y1="188" x2="456" y2="206" stroke="#ea580c" stroke-width="1"/>
  <text x="44" y="220" font-size="12" fill="#ea580c">3 files across 2 top-level folders is flagged “scattered” — reads as a very focused change, not a scattered one.</text>

  <!-- ============ PANEL B: AFTER ============ -->
  <text x="24" y="260" font-size="13" font-weight="700" fill="#111827">2 · AFTER (fixed) — same session: few files + few top-level folders ⇒ not scattered (FR-1…FR-3 / AC-1)</text>
  <rect x="24" y="270" width="1052" height="92" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <line x1="203" y1="284" x2="203" y2="348" stroke="#e5e7eb"/>
  <line x1="372" y1="284" x2="372" y2="348" stroke="#e5e7eb"/>
