<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="660" fill="#ffffff"/>

  <text x="24" y="34" font-size="18" font-weight="700" fill="#111827">T-120 — Change surface tab, headline row: revised “scattered” classification</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">Reported session eeee5555… (3 files, 2 top-level modules: client / doc). Only the Concentration cell changes — the rest of the tab layout stays as-is.</text>

  <!-- ============ PANEL A: BEFORE ============ -->
  <text x="24" y="92" font-size="13" font-weight="700" fill="#111827">1 · BEFORE (current bug) — small focused change lands in the scattered band</text>
  <rect x="24" y="102" width="1052" height="92" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <!-- separators -->
  <line x1="203" y1="116" x2="203" y2="180" stroke="#e5e7eb"/>
  <line x1="372" y1="116" x2="372" y2="180" stroke="#e5e7eb"/>
  <line x1="541" y1="116" x2="541" y2="180" stroke="#e5e7eb"/>
  <line x1="710" y1="116" x2="710" y2="180" stroke="#e5e7eb"/>
  <line x1="879" y1="116" x2="879" y2="180" stroke="#e5e7eb"/>
  <!-- cell 1 -->
  <text x="44" y="128" font-size="10.5" fill="#6b7280" letter-spacing="0.6">CHANGED FILES</text>
  <text x="44" y="154" font-size="19" font-weight="700" fill="#111827" font-family="Consolas, monospace">3</text>
  <text x="44" y="176" font-size="10.5" fill="#6b7280">distinct paths, whole tree</text>
