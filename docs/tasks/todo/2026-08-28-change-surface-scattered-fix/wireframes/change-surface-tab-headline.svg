  <line x1="710" y1="284" x2="710" y2="348" stroke="#e5e7eb"/>
  <line x1="879" y1="284" x2="879" y2="348" stroke="#e5e7eb"/>
  <text x="44" y="296" font-size="10.5" fill="#6b7280" letter-spacing="0.6">CHANGED FILES</text>
  <text x="44" y="322" font-size="19" font-weight="700" fill="#111827" font-family="Consolas, monospace">3</text>
