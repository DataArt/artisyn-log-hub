  <text x="213" y="296" font-size="10.5" fill="#6b7280" letter-spacing="0.6">FOLDERS TOUCHED</text>
  <text x="213" y="322" font-size="19" font-weight="700" fill="#111827" font-family="Consolas, monospace">3</text>
  <text x="213" y="344" font-size="10.5" fill="#6b7280">full dir paths, siblings distinct</text>
  <rect x="378" y="276" width="157" height="80" rx="6" fill="none" stroke="#16a34a" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="388" y="296" font-size="10.5" fill="#6b7280" letter-spacing="0.6">CONCENTRATION</text>
  <text x="388" y="322" font-size="19" font-weight="700" fill="#111827" font-family="Consolas, monospace">62 / 100</text>
  <text x="388" y="344" font-size="11" font-weight="600" fill="#16a34a">focused</text>
  <text x="551" y="296" font-size="10.5" fill="#6b7280" letter-spacing="0.6">LINES +/−</text>
  <text x="551" y="322" font-size="19" font-weight="700" font-family="Consolas, monospace"><tspan fill="#16a34a">+36</tspan> <tspan fill="#dc2626">−2</tspan></text>
  <text x="551" y="344" font-size="10.5" fill="#6b7280">diff-based, 3 of 3 files covered</text>
  <text x="720" y="296" font-size="10.5" fill="#6b7280" letter-spacing="0.6">TOP-LEVEL MODULES</text>
  <text x="720" y="322" font-size="19" font-weight="700" fill="#111827" font-family="Consolas, monospace">2</text>
  <text x="720" y="344" font-size="10.5" fill="#6b7280">client / doc</text>
  <text x="889" y="296" font-size="10.5" fill="#6b7280" letter-spacing="0.6">COMMON ANCESTOR</text>
  <text x="889" y="322" font-size="19" font-weight="700" fill="#111827" font-family="Consolas, monospace">depth 0</text>
  <text x="889" y="344" font-size="10.5" fill="#6b7280">repo root — reaches everywhere</text>
  <line x1="456" y1="356" x2="456" y2="374" stroke="#16a34a" stroke-width="1"/>
  <text x="44" y="388" font-size="12" fill="#16a34a">Rule now weighs top-level folders touched + total files changed. Score “62 / focused” is illustrative — any non-“scattered” band and exact numbers are an open question.</text>

  <!-- ============ PANEL C: NO REGRESSION ============ -->
  <text x="24" y="428" font-size="13" font-weight="700" fill="#111827">3 · AFTER — genuinely scattered session stays scattered (FR-4 / AC-2, no regression)</text>
  <rect x="24" y="438" width="1052" height="92" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <line x1="203" y1="452" x2="203" y2="516" stroke="#e5e7eb"/>
  <line x1="372" y1="452" x2="372" y2="516" stroke="#e5e7eb"/>
  <line x1="541" y1="452" x2="541" y2="516" stroke="#e5e7eb"/>
  <line x1="710" y1="452" x2="710" y2="516" stroke="#e5e7eb"/>
  <line x1="879" y1="452" x2="879" y2="516" stroke="#e5e7eb"/>
