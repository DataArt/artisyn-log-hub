  <text x="388" y="128" font-size="10.5" fill="#6b7280" letter-spacing="0.6">CONCENTRATION</text>
  <text x="388" y="154" font-size="19" font-weight="700" fill="#111827" font-family="Consolas, monospace">28 / 100</text>
  <text x="388" y="176" font-size="11" font-weight="600" fill="#ea580c">scattered</text>
  <!-- cell 4 -->
  <text x="551" y="128" font-size="10.5" fill="#6b7280" letter-spacing="0.6">LINES +/−</text>
  <text x="551" y="154" font-size="19" font-weight="700" font-family="Consolas, monospace"><tspan fill="#16a34a">+36</tspan> <tspan fill="#dc2626">−2</tspan></text>
  <text x="551" y="176" font-size="10.5" fill="#6b7280">diff-based, 3 of 3 files covered</text>
