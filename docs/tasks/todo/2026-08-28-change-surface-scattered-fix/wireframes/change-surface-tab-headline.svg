  <text x="44" y="490" font-size="19" font-weight="700" fill="#111827" font-family="Consolas, monospace">14</text>
  <text x="44" y="512" font-size="10.5" fill="#6b7280">distinct paths, whole tree</text>
  <text x="213" y="464" font-size="10.5" fill="#6b7280" letter-spacing="0.6">FOLDERS TOUCHED</text>
  <text x="213" y="490" font-size="19" font-weight="700" fill="#111827" font-family="Consolas, monospace">11</text>
  <text x="213" y="512" font-size="10.5" fill="#6b7280">full dir paths, siblings distinct</text>
  <rect x="378" y="444" width="157" height="80" rx="6" fill="none" stroke="#ea580c" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="388" y="464" font-size="10.5" fill="#6b7280" letter-spacing="0.6">CONCENTRATION</text>
  <text x="388" y="490" font-size="19" font-weight="700" fill="#111827" font-family="Consolas, monospace">8 / 100</text>
