  <text x="720" y="490" font-size="19" font-weight="700" fill="#111827" font-family="Consolas, monospace">6</text>
  <text x="720" y="512" font-size="10.5" fill="#6b7280">client / server / doc / hook / …</text>
  <text x="889" y="464" font-size="10.5" fill="#6b7280" letter-spacing="0.6">COMMON ANCESTOR</text>
  <text x="889" y="490" font-size="19" font-weight="700" fill="#111827" font-family="Consolas, monospace">depth 0</text>
  <text x="889" y="512" font-size="10.5" fill="#6b7280">repo root — reaches everywhere</text>
  <line x1="456" y1="524" x2="456" y2="542" stroke="#ea580c" stroke-width="1"/>
  <text x="44" y="556" font-size="12" fill="#374151">Many files across many unrelated top-level folders: still classified “scattered” — the threshold is refined, the band is not removed.</text>

  <!-- footer rule box -->
  <rect x="24" y="576" width="1052" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="44" y="600" font-size="12" font-weight="700" fill="#374151">New guard (FR-3, sketch):  topLevelFolders ≤ N  AND  changedFiles ≤ M   ⇒   band is never “scattered”.</text>
  <text x="44" y="622" font-size="12" fill="#6b7280">Exact N / M, whether “top-level folders” means topLevelModules (T = 2 here) or foldersTouched (K = 3), and whether the 2-files/2-modules pinned case flips — open questions.</text>
</svg>
