<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
  <style>
    .h1    { font-size: 15px; fill: #111827; font-weight: 600; }
    .h2    { font-size: 12px; fill: #111827; font-weight: 600; }
    .note  { font-size: 10px; fill: #6b7280; font-style: italic; }
    .ts    { font-size: 12px; fill: #111827; font-weight: 600; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
    .cost  { font-size: 12px; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
    .mono  { font-size: 11px; fill: #111827; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
    .monoB { font-size: 12px; fill: #111827; font-weight: 600; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
    .prompt{ font-size: 11px; fill: #6b7280; }
    .chip  { font-size: 9px; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
    .muted { font-size: 10px; fill: #9ca3af; }
    .ann   { font-size: 10px; fill: #b45309; }
    .txt   { font-size: 11px; fill: #374151; }
    .sec   { font-size: 9px; fill: #6b7280; letter-spacing: 0.06em; }
  </style>
  <rect width="1100" height="660" fill="#ffffff"/>

  <text x="24" y="28" class="h1">Session list — filter by tag and group by tag value (FR-6, AC-6)</text>
  <text x="24" y="45" class="note">Same left panel as today (SessionListPanel.tsx: view-mode select + AttributeFilterPopover, SessionItem rows). Light theme.</text>

  <!-- ============ LEFT: group by tag ============ -->
  <text x="24" y="80" class="h2">A. "By tag: feature" — group per value</text>
  <rect x="24" y="90" width="320" height="530" fill="#ffffff" stroke="#e5e7eb" rx="4"/>

  <rect x="32" y="98" width="304" height="24" rx="4" fill="#ffffff" stroke="#6366f1"/>
  <text x="42" y="114" class="txt">By tag: feature</text>
  <text x="320" y="114" class="txt">⌄</text>
  <rect x="32" y="128" width="304" height="22" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <text x="42" y="143" class="txt">⚲ Filter: all sessions</text>
  <line x1="24" y1="158" x2="344" y2="158" stroke="#e5e7eb"/>

  <!-- group 1 -->
  <text x="38" y="180" class="txt">⌄</text>
  <text x="54" y="180" class="monoB">checkout-v2</text>
  <circle cx="320" cy="176" r="8" fill="#f3f4f6"/>
  <text x="316" y="180" class="muted">3</text>
  <text x="54" y="196" class="muted">2026-11-21 12:47:03 · 21.4s · $0.3669</text>
  <line x1="24" y1="206" x2="344" y2="206" stroke="#f3f4f6"/>
  <text x="40" y="226" class="ts">2026-11-21 12:47:03</text>
  <text x="194" y="226" class="muted">|</text>
  <text x="206" y="226" class="cost" fill="#c2410c">$0.1178</text>
  <text x="40" y="243" class="prompt">Read kb-v03/index.md with the Read tool, …</text>
  <rect x="40" y="250" width="44" height="15" rx="3" fill="#dcfce7"/>
  <text x="46" y="261" class="chip" fill="#166534">master</text>
  <rect x="90" y="250" width="124" height="15" rx="7" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="96" y="261" class="chip" fill="#3730a3">feature=checkout-v2</text>
  <line x1="24" y1="274" x2="344" y2="274" stroke="#f3f4f6"/>
  <text x="40" y="294" class="ts">2026-11-21 12:44:34</text>
  <text x="194" y="294" class="muted">|</text>
  <text x="206" y="294" class="cost" fill="#c2410c">$0.1375</text>
  <text x="40" y="311" class="prompt">Read kb-broken/index.md and kb-v03/billi…</text>
  <rect x="40" y="318" width="44" height="15" rx="3" fill="#dcfce7"/>
  <text x="46" y="329" class="chip" fill="#166534">master</text>
  <rect x="90" y="318" width="124" height="15" rx="7" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="96" y="329" class="chip" fill="#3730a3">feature=checkout-v2</text>
  <rect x="220" y="318" width="22" height="15" rx="7" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="225" y="329" class="chip" fill="#3730a3">+1</text>
  <line x1="24" y1="342" x2="344" y2="342" stroke="#f3f4f6"/>
  <text x="54" y="360" class="muted">… 1 more</text>

  <!-- group 2 -->
  <line x1="24" y1="372" x2="344" y2="372" stroke="#e5e7eb"/>
  <text x="38" y="394" class="txt">›</text>
  <text x="54" y="394" class="monoB">checkout-v3</text>
  <circle cx="320" cy="390" r="8" fill="#f3f4f6"/>
  <text x="316" y="394" class="muted">1</text>
  <text x="54" y="410" class="muted">2026-11-21 12:44:34 · 9.8s · $0.1375</text>

  <!-- group 3 -->
  <line x1="24" y1="420" x2="344" y2="420" stroke="#e5e7eb"/>
  <text x="38" y="442" class="txt">›</text>
  <text x="54" y="442" class="monoB">search-rework</text>
  <circle cx="320" cy="438" r="8" fill="#f3f4f6"/>
  <text x="316" y="442" class="muted">2</text>
  <text x="54" y="458" class="muted">2026-11-20 18:02:11 · 41.0s · $0.5120</text>

  <!-- untagged -->
  <line x1="24" y1="468" x2="344" y2="468" stroke="#e5e7eb"/>
  <text x="38" y="490" class="txt">›</text>
  <text x="54" y="490" font-size="12" fill="#6b7280" font-style="italic">(untagged)</text>
  <circle cx="320" cy="486" r="8" fill="#f3f4f6"/>
  <text x="316" y="490" class="muted">1</text>
  <text x="54" y="506" class="muted">2026-11-21 01:13:48 · 4.2s · $0.1116</text>
  <line x1="24" y1="516" x2="344" y2="516" stroke="#e5e7eb"/>

  <text x="32" y="545" class="ann">▲ untagged = sessions without the chosen key</text>
  <text x="32" y="559" class="ann">   (exact meaning: open question)</text>
  <text x="32" y="577" class="ann">▲ a session with two values appears in both groups</text>
  <text x="32" y="591" class="ann">   (fan-out vs split: open question)</text>

  <!-- ============ MIDDLE: view mode select open ============ -->
  <text x="372" y="80" class="h2">B. View-mode select — new "By tag" options</text>
  <rect x="372" y="90" width="300" height="24" rx="4" fill="#ffffff" stroke="#6366f1"/>
  <text x="382" y="106" class="txt">By branch</text>
  <text x="656" y="106" class="txt">⌄</text>
  <rect x="372" y="118" width="300" height="168" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <text x="384" y="138" class="txt">By branch</text>
  <text x="384" y="158" class="txt">By date</text>
  <text x="384" y="178" class="txt">By user</text>
  <text x="384" y="198" class="txt">Plain list</text>
  <line x1="372" y1="208" x2="672" y2="208" stroke="#e5e7eb"/>
  <text x="384" y="224" class="sec">BY TAG</text>
  <rect x="373" y="230" width="298" height="20" fill="#eef2ff"/>
  <text x="384" y="244" class="txt">By tag: feature</text>
  <text x="384" y="264" class="txt">By tag: team</text>
  <text x="384" y="280" class="muted">keys known for this repo + period</text>
  <text x="372" y="306" class="ann">▲ section shown only when the repo has tagged sessions</text>

  <!-- ============ RIGHT: filter popover ============ -->
  <text x="700" y="80" class="h2">C. Filter popover — new TAGS section</text>
  <rect x="700" y="90" width="300" height="22" rx="4" fill="#ffffff" stroke="#6366f1"/>
  <text x="710" y="105" class="txt">⚲ Filter: feature=checkout-v2</text>
  <text x="984" y="105" class="txt">✕</text>
  <rect x="700" y="116" width="376" height="330" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="714" y="138" class="sec">SESSION ATTRIBUTES (existing)</text>
  <text x="714" y="156" class="txt">kind ›</text>
  <text x="714" y="174" class="txt">area ›</text>
  <line x1="700" y1="186" x2="1076" y2="186" stroke="#e5e7eb"/>
  <text x="714" y="206" class="sec">TAGS</text>
  <text x="714" y="226" class="mono">feature</text>
  <text x="1054" y="226" class="muted">6</text>
  <text x="730" y="246" class="mono">(any value)</text>
  <text x="1054" y="246" class="muted">6</text>
  <rect x="701" y="252" width="374" height="22" fill="#eef2ff"/>
  <text x="716" y="267" class="txt">✓</text>
  <text x="730" y="267" class="mono">checkout-v2</text>
  <text x="1054" y="267" class="muted">3</text>
  <text x="730" y="288" class="mono">checkout-v3</text>
  <text x="1054" y="288" class="muted">1</text>
  <text x="730" y="308" class="mono">search-rework</text>
  <text x="1054" y="308" class="muted">2</text>
  <text x="730" y="328" class="mono" fill="#6b7280">(no feature tag)</text>
  <text x="1054" y="328" class="muted">1</text>
  <text x="714" y="352" class="mono">team</text>
  <text x="1054" y="352" class="muted">2</text>
  <text x="730" y="372" class="mono">payments</text>
  <text x="1054" y="372" class="muted">2</text>
  <line x1="700" y1="386" x2="1076" y2="386" stroke="#e5e7eb"/>
  <text x="714" y="406" class="muted">Counts = sessions in the current scope and period you can see.</text>
  <text x="714" y="422" class="muted">Pick again to clear.</text>

  <text x="700" y="470" class="ann">▲ key-only ("any value") filter and AND/OR of several tag filters are open questions</text>
  <text x="700" y="486" class="ann">▲ the same picker feeds Analytics / Spend group-by keys</text>
  <text x="700" y="502" class="ann">▲ filter is URL-backed (e.g. tag=feature:checkout-v2), like attr=</text>

  <!-- result list sketch -->
  <text x="700" y="534" class="h2">Result: only feature=checkout-v2 sessions</text>
  <rect x="700" y="544" width="376" height="76" fill="#ffffff" stroke="#e5e7eb" rx="4"/>
  <text x="714" y="566" class="ts">2026-11-21 12:47:03</text>
  <text x="868" y="566" class="muted">|</text>
  <text x="880" y="566" class="cost" fill="#c2410c">$0.1178</text>
  <rect x="714" y="574" width="124" height="15" rx="7" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="720" y="585" class="chip" fill="#3730a3">feature=checkout-v2</text>
  <line x1="700" y1="596" x2="1076" y2="596" stroke="#f3f4f6"/>
  <text x="714" y="612" class="muted">… 2 more sessions</text>
</svg>
