<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1440" height="640" fill="#ffffff"/>
  <text x="16" y="24" font-size="12" font-weight="600" fill="#7c3aed">Chart carousel pages (FR-5) — source: otel_cost_buckets, 5-minute grain, last 2 hours; pages with no data for the node are skipped</text>

  <!-- 1 cost over time -->
