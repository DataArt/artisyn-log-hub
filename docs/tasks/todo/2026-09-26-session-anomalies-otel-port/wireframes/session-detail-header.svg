  <text x="820" y="288" font-size="12" fill="#047857">span 1m 8s</text>

  <!-- Notes -->
  <rect x="24" y="362" width="1072" height="92" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="40" y="384" font-size="13" font-weight="700" fill="#92400e">FR-5 notes</text>
  <text x="40" y="404" class="note">- No new fields or controls. START in the header and the row time in the sessions list use the same adjusted start.</text>
  <text x="40" y="422" class="note">- Leading /clear and other non-prompt startup events are skipped. Which built-in commands count, and the fallback when there is no real prompt, are open questions.</text>
  <text x="40" y="440" class="note">- END, WORK TIME, tokens and cost are unchanged. Sample values are illustrative.</text>
</svg>
