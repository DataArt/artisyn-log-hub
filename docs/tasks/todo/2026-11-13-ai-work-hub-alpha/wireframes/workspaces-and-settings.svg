<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="876" viewBox="0 0 1200 876">
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="876" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="56" fill="#f4f4f5"/><line x1="0" y1="56" x2="1200" y2="56" stroke="#e4e4e7" stroke-width="1"/>
<text xml:space="preserve" x="24" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#c2410c" font-weight="700">WIREFRAME</text><text xml:space="preserve" x="112" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#18181b" font-weight="700">Workspaces list and workspace settings</text>
<text xml:space="preserve" x="24" y="45" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#71717a">Landing page after login (same login forms as Log Hub): only the user’s own workspaces. 1200 px, light theme.</text>
<rect x="24" y="72" width="1152" height="40" rx="0" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="40" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#18181b" font-weight="700">Artisyn AI Work Hub</text><text xml:space="preserve" x="204" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#52525b">› Workspaces</text><text xml:space="preserve" x="846" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">History</text><text xml:space="preserve" x="906" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Settings</text><text xml:space="preserve" x="1160" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#52525b" text-anchor="end">dt@dataart.com · Logout</text><text xml:space="preserve" x="48" y="152" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#18181b" font-weight="700">My workspaces</text><rect x="420" y="132" width="140" height="28" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="490" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" text-anchor="middle">+ New workspace</text><rect x="48" y="182" width="512" height="84" rx="8" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="66" y="210" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#18181b" font-weight="700">expenses-dashboard</text><text xml:space="preserve" x="66" y="230" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">started empty · no remote repository</text><text xml:space="preserve" x="66" y="250" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">working branch main · 2 open workstreams</text><rect x="460" y="210" width="76" height="28" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/><text xml:space="preserve" x="498" y="228" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Open</text><rect x="48" y="278" width="512" height="84" rx="8" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="66" y="306" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#18181b" font-weight="700">payroll-reports</text><text xml:space="preserve" x="66" y="326" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">cloned from git@github.com:acme/payroll-reports.git</text><text xml:space="preserve" x="66" y="346" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">working branch main · no open workstreams</text><rect x="460" y="306" width="76" height="28" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="498" y="324" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" text-anchor="middle">Open</text><line x1="584" y1="112" x2="584" y2="776" stroke="#e4e4e7" stroke-width="1"/><rect x="608" y="132" width="544" height="470" rx="8" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="632" y="164" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#18181b" font-weight="700">Workspace settings — expenses-dashboard</text><text xml:space="preserve" x="632" y="196" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#52525b" font-weight="700">Name</text><rect x="632" y="204" width="496" height="34" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="644" y="226" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b">expenses-dashboard</text><text xml:space="preserve" x="632" y="254" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">Shown in the workspace list and the top bar.</text><text xml:space="preserve" x="632" y="280" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#52525b" font-weight="700">Working branch</text><rect x="632" y="288" width="496" height="34" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="644" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b">main</text><text xml:space="preserve" x="632" y="338" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">The version the workspace opens on; new workstreams start from it.</text><text xml:space="preserve" x="632" y="364" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#52525b" font-weight="700">Repository</text><rect x="632" y="372" width="496" height="34" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="644" y="394" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b">none — started empty</text><text xml:space="preserve" x="632" y="422" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">A workspace is exactly one git repository; a remote can be connected later.</text><text xml:space="preserve" x="632" y="448" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#52525b" font-weight="700">Container</text><rect x="632" y="456" width="496" height="34" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="644" y="478" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b">Work Hub default</text><text xml:space="preserve" x="632" y="506" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">Used because the repository has no devcontainer of its own.</text><rect x="1028" y="552" width="100" height="28" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/><text xml:space="preserve" x="1078" y="570" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Save</text><rect x="24" y="72" width="1152" height="704" rx="0" fill="none" stroke="#a1a1aa" stroke-width="1"/><circle cx="550" cy="224" r="10" fill="#c2410c"/><text xml:space="preserve" x="550" y="228" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="1140" cy="305" r="10" fill="#c2410c"/><text xml:space="preserve" x="1140" y="309" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="1140" cy="473" r="10" fill="#c2410c"/><text xml:space="preserve" x="1140" y="477" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="36" cy="806" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text xml:space="preserve" x="54" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Everything is personal: the list holds only this user’s workspaces. "Open" goes to the IDE page on the working branch.</text><circle cx="36" cy="828" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text xml:space="preserve" x="54" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">The working branch is the one setting the alpha needs; the workspace opens on it.</text><circle cx="36" cy="850" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text xml:space="preserve" x="54" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">A repository without a devcontainer definition gets Work Hub’s own empty default container.</text>
</svg>
