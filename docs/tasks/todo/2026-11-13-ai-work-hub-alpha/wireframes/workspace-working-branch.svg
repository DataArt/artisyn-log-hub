 UI', Arial, sans-serif" font-size="11" fill="#71717a">docs/requirements.md · main · edited by hand · saved</text><rect x="24" y="72" width="1152" height="704" rx="0" fill="none" stroke="#a1a1aa" stroke-width="1"/><circle cx="132" cy="120" r="10" fill="#c2410c"/><text xml:space="preserve" x="132" y="124" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="472.4" cy="134" r="10" fill="#c2410c"/><text xml:space="preserve" x="472.4" y="138" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="264" cy="206" r="10" fill="#c2410c"/><text xml:space="preserve" x="264" y="210" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="614" cy="173" r="10" fill="#c2410c"/><text xml:space="preserve" x="614" y="177" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><circle cx="36" cy="806" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text xml:space="preserve" x="54" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Workstream switcher sits above the tab row. With no open workstream it shows only the working branch.</text><circle cx="36" cy="828" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text xml:space="preserve" x="54" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">"Open workstream" asks for a name; everything else (container, worktree, agent) is prepared automatically.</text><circle cx="36" cy="850" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text xml:space="preserve" x="54" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Project tree. Click opens a file in a tab; files can be dragged in, out and between folders.</text><circle cx="36" cy="872" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><text xml:space="preserve" x="54" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Text files are edited by hand right here, on the working branch too — e.g. correcting a requirements file the agent wrote. Saving commits at once: a commit is just "save the document".</text>
