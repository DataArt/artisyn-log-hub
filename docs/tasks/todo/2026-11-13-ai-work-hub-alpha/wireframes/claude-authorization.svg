<rect width="1200" height="898" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="56" fill="#f4f4f5"/><line x1="0" y1="56" x2="1200" y2="56" stroke="#e4e4e7" stroke-width="1"/>
<text xml:space="preserve" x="24" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#c2410c" font-weight="700">WIREFRAME</text><text xml:space="preserve" x="112" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#18181b" font-weight="700">New workspace › Claude login</text>
<text xml:space="preserve" x="24" y="45" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#71717a">Asked right after a workspace is created: the Claude login is per workspace — make a new one or copy it from another workspace of the user. 1200 px, light theme.</text>
<rect x="24" y="72" width="1152" height="40" rx="0" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="40" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#18181b" font-weight="700">Artisyn AI Work Hub</text><text xml:space="preserve" x="204" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#52525b">› Workspaces</text><text xml:space="preserve" x="846" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">History</text><text xml:space="preserve" x="906" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Settings</text><text xml:space="preserve" x="1160" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#52525b" text-anchor="end">dt@dataart.com · Logout</text><text xml:space="preserve" x="48" y="152" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#18181b" font-weight="700">My workspaces</text><rect x="420" y="132" width="140" height="28" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="490" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" text-anchor="middle">+ New workspace</text><rect x="48" y="182" width="512" height="84" rx="8" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="66" y="210" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#18181b" font-weight="700">expenses-dashboard</text><text xml:space="preserve" x="66" y="230" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">started empty · no remote repository</text><text xml:space="preserve" x="66" y="250" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">working branch main · 2 open workstreams</text><rect x="460" y="210" width="76" height="28" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/><text xml:space="preserve" x="498" y="228" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Open</text><rect x="48" y="278" width="512" height="84" rx="8" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="66" y="306" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#18181b" font-weight="700">payroll-reports</text><text xml:space="preserve" x="66" y="326" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">started empty · Claude login ✓</text><text xml:space="preserve" x="66" y="346" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">working branch main · no open workstreams</text><rect x="460" y="306" width="76" height="28" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="498" y="324" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" text-anchor="middle">Open</text><rect x="24" y="72" width="1152" height="704" rx="0" fill="none" stroke="#a1a1aa" stroke-width="1"/><rect x="24" y="72" width="1152" height="704" fill="#18181b" opacity="0.35"/><rect x="150" y="150" width="900" height="500" rx="10" fill="#fff" stroke="#d4d4d8" stroke-width="1" filter="url(#shadow)"/><text xml:space="preserve" x="174" y="186" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#18181b" font-weight="700">Claude login for “expenses-dashboard”</text><text xml:space="preserve" x="174" y="210" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#71717a">This workspace needs a Claude login. It is asked once — every workstream in the workspace will use it.</text><text xml:space="preserve" x="174" y="228" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#71717a">Claude itself is already installed for you.</text><rect x="174" y="246" width="470" height="330" rx="8" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="190" y="274" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#18181b" font-weight="700">New login</text><text xml:space="preserve" x="190" y="292" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#71717a">Sign in to Claude — takes a minute</text><rect x="190" y="306" width="438" height="112" rx="6" fill="#fdfdfc" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="204" y="328" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#71717a">$ claude auth login</text><text xml:space="preserve" x="204" y="350" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#4f46e5" font-weight="700"> ❯ 1. Claude account with subscription</text><text xml:space="preserve" x="204" y="370" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">   2. Anthropic Console account</text><text xml:space="preserve" x="204" y="398" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b"> Paste code here if prompted &gt; ▍</text><text xml:space="preserve" x="190" y="442" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">Opens a terminal tab in the workspace with Claude’s own login.</text><text xml:space="preserve" x="190" y="460" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">Choose with the arrows and Enter, open the link, paste the code back.</text><rect x="190" y="532" width="190" height="28" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/><text xml:space="preserve" x="285" y="550" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Start login in a terminal</text><rect x="664" y="246" width="362" height="330" rx="8" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="680" y="274" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#18181b" font-weight="700">Copy from my workspace</text><text xml:space="preserve" x="680" y="292" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#71717a">Your workspaces that already have a Claude login</text><rect x="680" y="306" width="330" height="52" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="700" cy="328" r="7" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="700" cy="328" r="3.5" fill="#4f46e5"/><text xml:space="preserve" x="718" y="332" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#18181b" font-weight="700">payroll-reports</text><text xml:space="preserve" x="718" y="352" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">logged in 2 Nov</text><rect x="680" y="368" width="330" height="52" rx="8" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><circle cx="700" cy="390" r="7" fill="#fff" stroke="#a1a1aa" stroke-width="1.5"/><text xml:space="preserve" x="718" y="394" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#18181b" font-weight="700">budget-2027</text><text xml:space="preserve" x="718" y="414" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">logged in 28 Oct</text><rect x="880" y="532" width="130" height="28" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/><text xml:space="preserve" x="945" y="550" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Copy from there</text><text xml:space="preserve" x="174" y="622" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#4f46e5">Not now — only view and edit files</text><circle cx="1034" cy="180" r="10" fill="#c2410c"/><text xml:space="preserve" x="1034" y="184" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="632" cy="346" r="10" fill="#c2410c"/><text xml:space="preserve" x="632" y="350" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="1014" cy="332" r="10" fill="#c2410c"/><text xml:space="preserve" x="1014" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="400" cy="618" r="10" fill="#c2410c"/><text xml:space="preserve" x="400" y="622" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><circle cx="36" cy="806" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text xml:space="preserve" x="54" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Shown right when the user creates a workspace (= a git repository): the Claude login is per workspace.</text><circle cx="36" cy="828" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text xml:space="preserve" x="54" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">New login: runs  claude auth login  in a terminal tab attached to the workspace container (see the next sketch) — Claude’s own scenario, nothing re-drawn.</text><circle cx="36" cy="850" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text xml:space="preserve" x="54" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Or copy the login from another workspace of the same user. The list is absent for a user’s first workspace.</text><circle cx="36" cy="872" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><text xml:space="preserve" x="54" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Skipping keeps files viewable and editable; the question stays available. Once logged in, every workstream inherits the login and is not asked again while it works.</text>
</svg>
