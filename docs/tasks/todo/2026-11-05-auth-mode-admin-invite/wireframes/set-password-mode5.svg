<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#111827">Set / reset password page — one flow for every emailed link (FR4, FR6, FR8, FR9)</text>
  <text x="24" y="56" font-size="13" fill="#6b7280">Reuses the existing ResetPasswordPage (/reset-password?token=…); same form for bootstrap, admin-created user, resend and "Forgot password?".</text>

  <!-- Panel A -->
  <text x="40" y="100" font-size="13" font-weight="600" fill="#374151">A. Valid link</text>
  <rect x="40" y="112" width="360" height="400" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="64" y="150" width="312" height="290" rx="6" fill="#fafafa"/>
  <text x="84" y="184" font-size="15" font-weight="600" fill="#111827">Set your password</text>
  <text x="84" y="204" font-size="11" fill="#6b7280">(title "Reset password" for an account that</text>
  <text x="84" y="218" font-size="11" fill="#6b7280">already has one — wording is a proposal)</text>
  <rect x="84" y="234" width="272" height="34" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="96" y="256" font-size="13" fill="#6b7280">New password</text>
  <rect x="84" y="280" width="272" height="34" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="96" y="302" font-size="13" fill="#6b7280">Confirm new password</text>
  <text x="84" y="334" font-size="11" fill="#6b7280">Existing password policy applies.</text>
  <rect x="84" y="350" width="272" height="36" rx="6" fill="#3451cc"/>
  <text x="220" y="373" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Set password</text>
  <text x="220" y="414" font-size="12" fill="#6b7280" text-anchor="middle" text-decoration="underline">Back to log in</text>
  <text x="64" y="470" font-size="11" fill="#6b7280">On success: password saved, every other</text>
  <text x="64" y="486" font-size="11" fill="#6b7280">outstanding link for the account is revoked,</text>
  <text x="64" y="502" font-size="11" fill="#6b7280">redirect to Log in.</text>

  <!-- Panel B -->
  <text x="420" y="100" font-size="13" font-weight="600" fill="#374151">B. Expired / used / superseded link</text>
  <rect x="420" y="112" width="360" height="400" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="444" y="150" width="312" height="290" rx="6" fill="#fafafa"/>
  <text x="464" y="184" font-size="15" font-weight="600" fill="#111827">Set your password</text>
  <rect x="464" y="204" width="272" height="34" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="476" y="226" font-size="13" fill="#6b7280">New password</text>
  <rect x="464" y="250" width="272" height="34" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="476" y="272" font-size="13" fill="#6b7280">Confirm new password</text>
  <text x="464" y="306" font-size="12" fill="#dc2626">This link has expired or was already used.</text>
  <text x="464" y="322" font-size="12" fill="#dc2626">Request a new one with "Forgot password?".</text>
  <rect x="464" y="340" width="272" height="36" rx="6" fill="#3451cc"/>
  <text x="600" y="363" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Set password</text>
  <text x="600" y="404" font-size="12" fill="#6b7280" text-anchor="middle" text-decoration="underline">Back to log in</text>
  <text x="444" y="470" font-size="11" fill="#6b7280">Error shown after submit (AC9 "clear message").</text>
  <text x="444" y="486" font-size="11" fill="#6b7280">Lifetime: 24 h for no-password accounts,</text>
  <text x="444" y="502" font-size="11" fill="#6b7280">1 h for "Forgot password?" (see Open Questions).</text>

  <!-- Panel C: email -->
  <text x="800" y="100" font-size="13" font-weight="600" fill="#374151">C. Email (plain, never contains a password)</text>
  <rect x="800" y="112" width="360" height="400" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="800" y="112" width="360" height="64" rx="8" fill="#f9fafb"/>
  <text x="820" y="138" font-size="12" fill="#6b7280">From: Log Hub &lt;SMTP_FROM&gt;</text>
  <text x="820" y="160" font-size="13" font-weight="600" fill="#111827">Set your Log Hub password</text>
  <text x="820" y="206" font-size="12" fill="#111827">An account was created for you on Log Hub</text>
  <text x="820" y="224" font-size="12" fill="#111827">(bob@corp.local). Choose your password:</text>
  <rect x="820" y="242" width="200" height="32" rx="6" fill="#3451cc"/>
  <text x="920" y="263" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Set password</text>
  <text x="820" y="296" font-size="11" fill="#6b7280">PUBLIC_BASE_URL/#/reset-password?token=…</text>
  <text x="820" y="322" font-size="12" fill="#111827">The link works once and expires in 24 hours.</text>
  <text x="820" y="340" font-size="12" fill="#111827">If it expired, use "Forgot password?" on the</text>
  <text x="820" y="358" font-size="12" fill="#111827">login page.</text>
  <line x1="820" y1="384" x2="1140" y2="384" stroke="#e5e7eb"/>
  <text x="820" y="406" font-size="11" fill="#6b7280">Variants: admin bootstrap ("You are the administrator…"),</text>
  <text x="820" y="422" font-size="11" fill="#6b7280">admin-created user / resend (above), forgot password</text>
  <text x="820" y="438" font-size="11" fill="#6b7280">(existing reset email, 1 h). Link built from</text>
  <text x="820" y="454" font-size="11" fill="#6b7280">PUBLIC_BASE_URL only, never the Host header.</text>
</svg>
