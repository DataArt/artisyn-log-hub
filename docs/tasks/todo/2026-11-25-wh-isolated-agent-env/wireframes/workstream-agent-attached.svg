  <text x="365" y="75" font-size="12" fill="#166534">Desktop</text>
  <text x="440" y="75" fill="#09090b">+ Open workstream</text>
  <!-- callout -->
  <path d="M356 86 L356 100" stroke="#a1a1aa" stroke-dasharray="3 3"/>

  <!-- Sidebar -->
  <rect x="0" y="92" width="256" height="548" fill="#fafafa"/>
  <line x1="256" y1="92" x2="256" y2="640" stroke="#e4e4e7"/>
  <text x="12" y="115" font-size="11" fill="#71717a" font-weight="600">FILES</text>
  <line x1="0" y1="128" x2="256" y2="128" stroke="#e4e4e7"/>
  <text x="16" y="152" fill="#09090b">▸ 📁 docs</text>
  <text x="16" y="180" fill="#09090b">▸ 📁 inputs</text>
  <text x="34" y="208" fill="#09090b">📄 README.md</text>
  <rect x="0" y="218" width="255" height="28" fill="#f0fdf4"/>
