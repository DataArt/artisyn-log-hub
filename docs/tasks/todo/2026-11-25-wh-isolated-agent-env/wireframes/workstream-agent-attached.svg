  <text x="160" y="29" fill="#71717a">›</text>
  <text x="175" y="29" fill="#71717a">Requirements pack</text>
  <text x="900" y="29" fill="#09090b">History</text>
  <text x="990" y="29" fill="#09090b">Settings</text>
  <rect x="1126" y="9" width="138" height="30" rx="6" fill="#fff" stroke="#e4e4e7"/>
  <text x="1135" y="29" fill="#52525b">dt@dataart.com ⌄</text>

  <!-- Switcher with attached indicator on chip -->
  <rect x="0" y="48" width="1280" height="44" fill="#fafafa"/>
  <line x1="0" y1="92" x2="1280" y2="92" stroke="#e4e4e7"/>
  <rect x="12" y="56" width="170" height="28" rx="14" fill="#fff" stroke="#d4d4d8"/>
  <text x="26" y="75" fill="#52525b">main (working branch)</text>
