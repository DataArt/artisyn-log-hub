<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <!-- Wireframe: workstream page while an external Claude Desktop agent is attached (FR-5, AC-5). -->
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Top bar -->
  <line x1="0" y1="48" x2="1280" y2="48" stroke="#e4e4e7"/>
