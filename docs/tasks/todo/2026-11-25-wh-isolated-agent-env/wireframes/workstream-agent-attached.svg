  <!-- Tab bar -->
  <rect x="256" y="92" width="1024" height="36" fill="#fafafa"/>
  <line x1="256" y1="128" x2="1280" y2="128" stroke="#e4e4e7"/>
  <rect x="256" y="92" width="110" height="36" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="274" y="115" fill="#71717a">💬 Chat</text>
  <rect x="366" y="92" width="196" height="37" fill="#ffffff" stroke="#e4e4e7"/>
  <line x1="366" y1="92" x2="562" y2="92" stroke="#3358cc" stroke-width="2"/>
  <text x="382" y="115" fill="#09090b" font-weight="600">🖥 Claude Desktop  ●  ✕</text>
  <rect x="1140" y="98" width="128" height="24" rx="5" fill="#fff" stroke="#e4e4e7"/>
  <text x="1152" y="114" font-size="12" fill="#09090b">⎋ Close workstream</text>

  <!-- Content -->
  <text x="296" y="172" font-size="20" font-weight="600" fill="#09090b">Work on this workstream from Claude Desktop</text>

  <!-- Connected status -->
  <rect x="296" y="192" width="944" height="96" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="320" cy="220" r="7" fill="#16a34a"/>
  <text x="336" y="225" font-size="15" fill="#166534" font-weight="600">Claude Desktop is connected</text>
  <text x="336" y="248" fill="#166534">1 session · since 13:42 · last action 20 seconds ago</text>
  <text x="336" y="270" fill="#166534">Commands and file changes run inside this workstream only.</text>
  <rect x="1090" y="208" width="134" height="32" rx="6" fill="#fff" stroke="#fecaca"/>
  <text x="1108" y="229" fill="#991b1b">⊘ Disconnect</text>

  <!-- Recent activity -->
  <text x="296" y="322" font-size="15" font-weight="600" fill="#09090b">What Claude did here</text>
  <rect x="296" y="334" width="944" height="168" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
  <line x1="296" y1="370" x2="1240" y2="370" stroke="#f4f4f5"/>
  <line x1="296" y1="404" x2="1240" y2="404" stroke="#f4f4f5"/>
  <line x1="296" y1="438" x2="1240" y2="438" stroke="#f4f4f5"/>
  <line x1="296" y1="472" x2="1240" y2="472" stroke="#f4f4f5"/>
  <text x="316" y="357" fill="#71717a">13:44</text><text x="380" y="357" fill="#09090b">Created file  pricing-summary.md</text>
  <text x="316" y="391" fill="#71717a">13:43</text><text x="380" y="391" fill="#09090b">Ran a command  (read inputs/q4.xlsx)</text>
  <text x="316" y="425" fill="#71717a">13:43</text><text x="380" y="425" fill="#09090b">Read file  inputs/q4.xlsx</text>
  <text x="316" y="459" fill="#71717a">13:42</text><text x="380" y="459" fill="#09090b">Connected</text>
  <text x="316" y="493" fill="#3358cc" text-decoration="underline">Show all in History</text>

  <!-- Note about chat tab -->
  <rect x="296" y="518" width="944" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="316" y="541" fill="#1e40af">ℹ While Claude Desktop is connected, the built-in Chat agent of this workstream is paused.</text>
  <text x="316" y="560" fill="#1e40af">Disconnect to use Chat again. (Exclusive-mode rule is an open question.)</text>

  <text x="296" y="610" font-size="12" fill="#71717a">Wireframe — FR-5 / AC-5: "external agent attached" indicator on the workstream chip, the tab, and the status card.</text>
</svg>
