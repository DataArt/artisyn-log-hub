<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <!-- Wireframe: workstream page, new pinned tab "Claude Desktop" with connection instructions (FR-5, AC-5). Mechanism-neutral. -->
  <rect width="1280" height="760" fill="#ffffff"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="48" fill="#ffffff"/>
  <line x1="0" y1="48" x2="1280" y2="48" stroke="#e4e4e7"/>
  <text x="16" y="29" font-weight="600" font-size="14" fill="#09090b">Artisyn AI Work Hub</text>
  <text x="160" y="29" fill="#71717a">›</text>
  <text x="175" y="29" fill="#71717a">Requirements pack</text>
  <text x="900" y="29" fill="#09090b">History</text>
  <text x="990" y="29" fill="#09090b">Settings</text>
  <rect x="1126" y="9" width="138" height="30" rx="6" fill="#fff" stroke="#e4e4e7"/>
  <text x="1135" y="29" fill="#52525b">dt@dataart.com ⌄</text>

  <!-- Workstream switcher -->
  <rect x="0" y="48" width="1280" height="44" fill="#fafafa"/>
  <line x1="0" y1="92" x2="1280" y2="92" stroke="#e4e4e7"/>
  <rect x="12" y="56" width="170" height="28" rx="14" fill="#fff" stroke="#d4d4d8"/>
  <text x="26" y="75" fill="#52525b">main (working branch)</text>
  <rect x="190" y="56" width="178" height="28" rx="14" fill="#eef1fb" stroke="#3358cc"/>
  <text x="204" y="75" fill="#3358cc">💬 Q4 pricing analysis</text>
  <text x="392" y="75" fill="#09090b">+ Open workstream</text>

  <!-- Sidebar -->
  <rect x="0" y="92" width="256" height="668" fill="#fafafa"/>
  <line x1="256" y1="92" x2="256" y2="760" stroke="#e4e4e7"/>
  <text x="12" y="115" font-size="11" fill="#71717a" font-weight="600">FILES</text>
  <line x1="0" y1="128" x2="256" y2="128" stroke="#e4e4e7"/>
  <text x="16" y="152" fill="#09090b">▸ 📁 docs</text>
  <text x="16" y="180" fill="#09090b">▸ 📁 inputs</text>
  <text x="34" y="208" fill="#09090b">📄 README.md</text>

  <!-- Tab bar -->
  <rect x="256" y="92" width="1024" height="36" fill="#fafafa"/>
  <line x1="256" y1="128" x2="1280" y2="128" stroke="#e4e4e7"/>
  <rect x="256" y="92" width="110" height="36" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="274" y="115" fill="#71717a">💬 Chat</text>
  <rect x="366" y="92" width="180" height="37" fill="#ffffff" stroke="#e4e4e7"/>
  <line x1="366" y1="92" x2="546" y2="92" stroke="#3358cc" stroke-width="2"/>
  <text x="382" y="115" fill="#09090b" font-weight="600">🖥 Claude Desktop  ✕</text>
  <rect x="1140" y="98" width="128" height="24" rx="5" fill="#fff" stroke="#e4e4e7"/>
  <text x="1152" y="114" font-size="12" fill="#09090b">⎋ Close workstream</text>

  <!-- Content -->
  <text x="296" y="172" font-size="20" font-weight="600" fill="#09090b">Work on this workstream from Claude Desktop</text>
  <text x="296" y="196" fill="#52525b">Claude runs on your computer, but every command and every file change happens here, inside this workstream's container.</text>
  <text x="296" y="214" fill="#52525b">Nothing is written to your own computer.</text>

  <!-- Status card -->
  <rect x="296" y="232" width="944" height="44" rx="8" fill="#f4f4f5" stroke="#e4e4e7"/>
  <circle cx="318" cy="254" r="6" fill="#a1a1aa"/>
  <text x="334" y="259" fill="#09090b" font-weight="600">Not connected</text>
  <text x="440" y="259" fill="#71717a">No Claude Desktop session is using this workstream right now.</text>

  <!-- Step 1 -->
  <rect x="296" y="292" width="944" height="128" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
  <circle cx="324" cy="320" r="13" fill="#3358cc"/>
  <text x="319" y="325" fill="#fff" font-weight="700">1</text>
  <text x="348" y="325" font-size="15" font-weight="600" fill="#09090b">Connect Claude Desktop</text>
  <text x="348" y="348" fill="#52525b">Click the button. Claude Desktop opens and asks you to confirm — click "Allow". That's all.</text>
  <rect x="348" y="364" width="232" height="36" rx="6" fill="#3358cc"/>
  <text x="368" y="387" fill="#fff" font-weight="600">Open in Claude Desktop  ↗</text>
  <text x="600" y="387" fill="#71717a">or</text>
  <rect x="626" y="364" width="210" height="36" rx="6" fill="#fff" stroke="#d4d4d8"/>
  <text x="646" y="387" fill="#09090b">⧉ Copy connection text</text>
  <text x="852" y="381" font-size="12" fill="#71717a">Paste it into a new Claude Desktop</text>
  <text x="852" y="396" font-size="12" fill="#71717a">Code session if the button does nothing.</text>

  <!-- Step 2 -->
  <rect x="296" y="432" width="944" height="92" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
  <circle cx="324" cy="460" r="13" fill="#3358cc"/>
  <text x="319" y="465" fill="#fff" font-weight="700">2</text>
  <text x="348" y="465" font-size="15" font-weight="600" fill="#09090b">Ask Claude to work</text>
  <text x="348" y="488" fill="#52525b">Type your request in Claude Desktop as usual. This page turns green while Claude is connected,</text>
  <text x="348" y="506" fill="#52525b">and the files Claude creates appear in the Files tree on the left.</text>

  <!-- Access key -->
  <rect x="296" y="536" width="944" height="86" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="316" y="562" fill="#1e40af" font-weight="600">🔑 Access key for this workstream</text>
  <text x="316" y="584" fill="#1e40af">Created 25 Nov 2026, 13:40 · expires in 30 days · works only for this workstream and only for you.</text>
  <text x="316" y="604" fill="#1e40af">Shown once — if you lost it, create a new one (the old one stops working).</text>
  <rect x="1000" y="552" width="104" height="30" rx="6" fill="#fff" stroke="#bfdbfe"/>
  <text x="1016" y="572" fill="#09090b">↻ New key</text>
  <rect x="1114" y="552" width="110" height="30" rx="6" fill="#fff" stroke="#fecaca"/>
  <text x="1134" y="572" fill="#991b1b">⊘ Revoke</text>

  <!-- Prereq / help -->
  <rect x="296" y="634" width="944" height="70" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="316" y="660" fill="#92400e" font-weight="600">⚠ Before you start</text>
  <text x="316" y="682" fill="#92400e">You need Claude Desktop with the Code tab enabled (version shown in Help). Nothing else to install.</text>
  <text x="1060" y="682" fill="#3358cc" text-decoration="underline">Step-by-step help</text>

  <text x="296" y="736" font-size="12" fill="#71717a">Wireframe — FR-5 / AC-5. Button and text wording are placeholders until the connection mechanism is chosen.</text>
</svg>
