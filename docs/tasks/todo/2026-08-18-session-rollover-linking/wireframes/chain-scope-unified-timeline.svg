<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="760" viewBox="0 0 1060 760" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
  <style>
    .h1    { font-size: 15px; fill: #111827; font-weight: 600; }
    .h2    { font-size: 12px; fill: #111827; font-weight: 600; }
    .lbl   { font-size: 9px;  fill: #6b7280; letter-spacing: .09em; }
    .val   { font-size: 12px; fill: #111827; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
    .txt   { font-size: 11px; fill: #374151; }
    .note  { font-size: 10px; fill: #6b7280; font-style: italic; }
    .muted { font-size: 10px; fill: #9ca3af; }
    .chip  { font-size: 9px;  font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
    .ann   { font-size: 10px; fill: #b45309; }
    .tab   { font-size: 12px; fill: #6b7280; }
    .tabon { font-size: 12px; fill: #111827; font-weight: 600; }
  </style>
  <rect width="1060" height="760" fill="#ffffff"/>

  <text x="24" y="28" class="h1">T-102 · Option B (follow-on) — chain scope toggle &amp; unified timeline</text>
  <text x="24" y="45" class="note">Option B (follow-on, deferred). Everything here is opt-in: the default scope stays "This session", so no existing number moves without a click.</text>

  <!-- ===== header with scope toggle ===== -->
  <rect x="24" y="60" width="1012" height="196" rx="4" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- scope toggle -->
  <text x="44" y="86" class="lbl">SCOPE</text>
  <rect x="96" y="74" width="120" height="22" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <text x="112" y="89" class="txt">This session</text>
  <rect x="216" y="74" width="146" height="22" rx="4" fill="#eef2ff" stroke="#6366f1"/>
  <text x="230" y="89" class="txt" fill="#3730a3">⇄ Whole chain (2)</text>
  <text x="378" y="89" class="muted">URL: &amp;scope=chain · sticky per session, defaults to "This session"</text>

  <!-- combined stats -->
  <line x1="24" y1="108" x2="1036" y2="108" stroke="#f3f4f6"/>
  <text x="44"  y="130" class="lbl">CHAIN START</text>
  <text x="44"  y="146" class="val">2026-08-17 22:21:49</text>
  <text x="204" y="130" class="lbl">CHAIN END</text>
  <text x="204" y="146" class="val">2026-08-18 11:00:09</text>
  <text x="364" y="130" class="lbl">SESSIONS</text>
  <text x="364" y="146" class="val">2</text>
  <text x="440" y="130" class="lbl">PROMPTS</text>
  <text x="440" y="146" class="val">11</text>
  <text x="524" y="130" class="lbl">WORK TIME</text>
  <text x="524" y="146" class="val">1:42:06</text>
  <text x="676" y="130" class="lbl">CHAIN COST</text>
  <text x="676" y="146" class="val">$20.9000</text>
  <rect x="770" y="134" width="120" height="15" rx="7" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="778" y="145" class="chip" fill="#3730a3">chain total · display</text>

  <!-- de-dup warning -->
  <rect x="36" y="162" width="988" height="34" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="50" y="183" font-size="12" fill="#b45309">⚠</text>
  <text x="70" y="183" class="txt" fill="#92400e">Sub-agent cost is counted once. The workflow's agent-* sessions are parented to aaaa1111, so bbbb2222 contributes only its own hook event stream — a chain sum must not re-add them.</text>

  <!-- per-session breakdown -->
  <text x="44" y="220" class="lbl">CONTRIBUTIONS</text>
  <text x="150" y="221" class="val" fill="#2563eb">aaaa1111</text>
  <text x="230" y="221" class="txt">$8.5600 · 8 prompts</text>
  <text x="380" y="221" class="muted">incl. 30 sub-agent sessions</text>
  <text x="540" y="221" class="val">bbbb2222</text>
  <text x="620" y="221" class="txt">$12.3400 · 3 prompts</text>
  <text x="770" y="221" class="muted">sub-agent events only, no sub-agent rows</text>
  <text x="44"  y="243" class="note">Every contribution row links back to its own session; the chain view never becomes the only place a figure is visible.</text>

  <!-- ===== tabs ===== -->
  <circle cx="52" cy="286" r="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="47" y="290" font-size="10" fill="#6b7280">☆</text>
  <text x="82" y="290" class="tab">Summary</text>
  <text x="160" y="290" class="tabon">Logs</text>
  <line x1="158" y1="300" x2="192" y2="300" stroke="#111827" stroke-width="2"/>
  <text x="212" y="290" class="tab">Call Tree</text>
  <text x="290" y="290" class="tab">Charts</text>
  <text x="352" y="290" class="tab">Usage</text>
  <text x="408" y="290" class="tab">Info</text>
  <text x="470" y="290" class="muted">tabs unchanged; each renders the selected scope</text>

  <!-- ===== unified timeline ===== -->
  <rect x="24" y="312" width="1012" height="330" rx="4" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- segment 1 header -->
  <rect x="36" y="324" width="988" height="24" rx="4" fill="#f3f4f6"/>
  <text x="50" y="340" class="txt" fill="#374151">▸ Session 1 of 2 ·</text>
  <text x="152" y="340" class="val" fill="#2563eb" font-size="11">aaaa1111</text>
  <text x="222" y="340" class="txt">· 22:21:49 → 02:21:49 · 8 prompts · $8.5600</text>
  <text x="960" y="340" class="muted">open →</text>

  <!-- turns -->
  <rect x="52" y="358" width="956" height="34" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="66" y="379" class="txt" font-weight="600">#1</text>
  <text x="96" y="379" class="txt">/adlc-lh:implement-deep 2026-08-01-upload-retry</text>
  <text x="880" y="379" class="val" font-size="11">$0.6420</text>
  <rect x="52" y="398" width="956" height="34" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="66" y="419" class="txt" font-weight="600">#2</text>
  <text x="96" y="419" class="txt">Workflow → 30 sub-agents (chunk 1…12)</text>
  <text x="880" y="419" class="val" font-size="11">$7.4100</text>
  <text x="66" y="450" class="muted">… turns #3 … #8 …</text>

  <!-- rollover boundary -->
  <line x1="52" y1="470" x2="392" y2="470" stroke="#6366f1" stroke-dasharray="4 3"/>
  <rect x="392" y="459" width="278" height="22" rx="11" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="406" y="474" class="chip" fill="#3730a3">⇄ rollover · new session id · 5s gap</text>
  <line x1="670" y1="470" x2="1008" y2="470" stroke="#6366f1" stroke-dasharray="4 3"/>

  <!-- segment 2 header -->
  <rect x="36" y="490" width="988" height="24" rx="4" fill="#f3f4f6"/>
  <text x="50" y="506" class="txt" fill="#374151">▸ Session 2 of 2 ·</text>
  <text x="152" y="506" class="val" font-size="11">bbbb2222</text>
  <text x="222" y="506" class="txt">· 02:21:54 → 11:00:09 · 3 prompts · $12.3400</text>
  <text x="920" y="506" class="muted">you are here</text>

  <rect x="52" y="524" width="956" height="34" rx="4" fill="#f8f9ff" stroke="#c7d2fe"/>
  <text x="66" y="545" class="txt" font-weight="600">#9</text>
  <text x="96" y="545" class="txt" fill="#6b7280" font-style="italic">&lt;task-notification&gt; — synthetic continuation event, not a user prompt</text>
  <text x="880" y="545" class="val" font-size="11">$0.0000</text>
  <rect x="52" y="564" width="956" height="34" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="66" y="585" class="txt" font-weight="600">#10</text>
  <text x="96" y="585" class="txt">check the retry backoff …</text>
  <text x="880" y="585" class="val" font-size="11">$4.7700</text>
  <text x="66" y="616" class="muted">… turn #11 …</text>

  <text x="24" y="666" class="ann">▲ Turn numbering is continuous across the chain in chain scope; in single-session scope it stays exactly as today (#1…#3 for bbbb2222), so no permalink or deep-link breaks.</text>

  <!-- scope guard rails -->
  <text x="24" y="700" class="h2">Scope guard rails (must be settled before any of this is built)</text>
  <rect x="24" y="710" width="1012" height="42" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="728" class="txt">· Session list, Analytics, Reports, cost-by-branch and the executive summary keep counting one DB row = one session until a written product decision says otherwise.</text>
  <text x="40" y="744" class="txt">· "Whole chain" is a rendering scope in the detail pane only — it never writes a merged row, never rewrites session_stats, and is always reversible with one click.</text>
</svg>
