  <!-- ================= HOVER TOOLTIP ================= -->
  <text x="24" y="404" class="h2">Chain marker hover (reuses HoverPopover / ViewportPopover — no new popup machinery)</text>
  <rect x="24" y="416" width="330" height="126" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="40" y="438" class="h2">Continuation chain · 2 sessions</text>
  <line x1="40" y1="446" x2="338" y2="446" stroke="#f3f4f6"/>
  <text x="40" y="466" class="txt">1.</text>
  <text x="58" y="466" class="cost" fill="#2563eb">aaaa1111</text>
  <text x="130" y="466" class="txt">02:21:49 · $8.5600</text>
  <text x="298" y="466" class="muted">origin</text>
  <text x="40" y="486" class="txt">2.</text>
  <text x="58" y="486" class="cost" fill="#111827">bbbb2222</text>
  <text x="130" y="486" class="txt">11:00:09 · $12.3400</text>
  <text x="288" y="486" class="muted">this one</text>
  <line x1="40" y1="498" x2="338" y2="498" stroke="#f3f4f6"/>
  <text x="40" y="516" class="txt">Kind</text>
  <text x="110" y="516" class="txt">rollover (5s gap)</text>
  <text x="40" y="532" class="txt">Chain total</text>
  <text x="110" y="532" class="cost" fill="#111827">$20.9000</text>
  <text x="212" y="532" class="muted">display only</text>

  <text x="380" y="438" class="note">Rules carried from ui-principles.md:</text>
  <text x="380" y="458" class="note">· light surfaces only; indigo (#6366f1 / #eef2ff) is the continuation accent, reused from the existing refresh banner.</text>
  <text x="380" y="476" class="note">· the ⇄ marker appears in every list mode (branch / date / user / plain) and in BranchSection rows.</text>
  <text x="380" y="494" class="note">· attribute chips, cost colouring and cost thresholds are untouched.</text>
  <text x="380" y="512" class="note">· no clickable link inside the row itself — clicking the row still opens that session; navigation between chain members happens in the detail breadcrumb.</text>
  <text x="380" y="530" class="note">· "Chain total" in the tooltip is a rendered sum, never a stored/aggregated figure (Option A adds no aggregation).</text>

  <!-- ================= EMPTY / UNRESOLVED ================= -->
  <text x="24" y="580" class="h2">Marker states</text>
  <rect x="24" y="592" width="1012" height="88" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="614" font-size="12" fill="#4338ca">⇄</text>
  <text x="60" y="614" class="txt">resolved link in either direction — indigo marker + left edge bar, hover shows the chain</text>
  <text x="40" y="638" font-size="12" fill="#b45309">⚠</text>
  <text x="60" y="638" class="txt">unverified candidate — amber marker, tooltip says "possible continuation, unverified"; no chain list, no inherited prompt</text>
  <text x="40" y="662" class="muted">(none)</text>
  <text x="100" y="662" class="txt">no link — row renders exactly as today, including its own first prompt whatever it is</text>
</svg>
