  <rect width="1060" height="700" fill="#ffffff"/>

  <text x="24" y="28" class="h1">T-102 · Session list — rollover chain marker &amp; inherited first prompt</text>
  <text x="24" y="45" class="note">Same SessionItem row geometry as today (session-list-helpers.tsx). Only two additions: the ⇄ chain marker and the inherited-prompt line.</text>

