    .ts    { font-size: 12px; fill: #111827; font-weight: 600; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
    .cost  { font-size: 12px; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
    .prompt{ font-size: 11px; fill: #6b7280; }
    .chip  { font-size: 9px; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
