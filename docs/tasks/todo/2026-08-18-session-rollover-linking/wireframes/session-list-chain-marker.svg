  <text x="196" y="300" class="muted">|</text>
  <text x="212" y="300" class="cost" fill="#16a34a">$3.1972</text>
  <text x="40" y="318" class="prompt">add retry handling to the upload worker and…</text>

  <text x="24" y="362" class="ann">▲ The 11:00 row's "first prompt" is a synthetic &lt;task-notification&gt; block — the real prompt lives in the 02:21 row.</text>

