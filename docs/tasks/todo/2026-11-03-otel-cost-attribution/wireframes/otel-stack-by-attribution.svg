  <text x="462" y="530" font-size="11" fill="#f9fafb">skill / MCP names also need OTEL_LOG_TOOL_DETAILS=1.</text>
  <text x="20" y="564" font-size="11" fill="#b45309">Calls without the attribute (old CC, no skill / MCP / effort) form an explicit "not reported" group (gray, with tooltip) — the stack still sums to Total OTEL cost.</text>

