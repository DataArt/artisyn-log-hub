    <rect x="566" y="580" width="170" height="96" rx="4" fill="#fff" stroke="#111827"/>
    <text x="582" y="604" fill="#4b5563" text-decoration="underline">API calls</text>
    <text x="582" y="630" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#111827">4,749</text>
    <text x="582" y="650" fill="#6b7280">3 models</text>
    <rect x="748" y="580" width="170" height="96" rx="4" fill="#fff" stroke="#111827"/>
    <text x="764" y="604" fill="#4b5563" text-decoration="underline">Hidden cost</text>
    <text x="764" y="630" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#111827">$13.08</text>
    <text x="764" y="650" fill="#6b7280">4.7 % · 348 calls</text>
