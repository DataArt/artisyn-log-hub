  <!-- Legend -->
  <g font-size="12" fill="#111827">
    <circle cx="26" cy="472" r="5" fill="#3b82f6"/><text x="36" y="476">adlc-lh:implement-deep</text>
    <circle cx="196" cy="472" r="5" fill="#8b5cf6"/><text x="206" y="476">adlc-lh:review-deep</text>
    <circle cx="346" cy="472" r="5" fill="#14b8a6"/><text x="356" y="476">changelog</text>
    <circle cx="446" cy="472" r="5" fill="#d1d5db" stroke="#9ca3af"/><text x="456" y="476" font-style="italic">not reported ⓘ</text>
