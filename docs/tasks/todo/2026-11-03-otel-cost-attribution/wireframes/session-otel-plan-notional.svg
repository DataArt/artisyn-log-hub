<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <!-- Session tabs -->
  <rect x="20" y="14" width="110" height="24" rx="4" fill="#fff" stroke="#d1d5db"/>
  <text x="30" y="30" font-size="12" fill="#111827">Cost ▾</text>
  <g font-size="14" fill="#4b5563">
    <text x="150" y="30">Summary</text><text x="230" y="30">Statistics</text><text x="316" y="30">Call Tree</text>
    <text x="398" y="30">Context Growth</text>
    <text x="518" y="30" fill="#111827" font-weight="600">OTEL</text><text x="574" y="30">More ▾</text>
  </g>
  <rect x="510" y="40" width="50" height="2" fill="#111827"/>
  <line x1="0" y1="42" x2="1000" y2="42" stroke="#e5e7eb"/>

  <!-- Status line (existing) -->
  <text x="20" y="72" font-size="12" fill="#374151">Cost: Claude Code estimate (cost_usd) · hook 2.23.0 · traces off</text>
  <rect x="384" y="58" width="108" height="22" rx="11" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="396" y="73" font-size="12" fill="#1d4ed8">ⓘ Realtime data</text>
  <circle cx="508" cy="69" r="4" fill="#d1d5db"/><text x="518" y="73" font-size="12" fill="#6b7280">Session ended</text>

  <!-- NEW plan / provider row -->
  <text x="20" y="106" font-size="12" fill="#6b7280">Account</text>
  <g font-size="12">
    <rect x="76" y="92" width="88" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="84" y="107" fill="#6b7280">plan <tspan fill="#111827" font-weight="600">max</tspan></text>
    <rect x="172" y="92" width="118" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="180" y="107" fill="#6b7280">seat <tspan fill="#111827" font-weight="600">individual</tspan></text>
    <rect x="298" y="92" width="130" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="306" y="107" fill="#6b7280">provider <tspan fill="#111827" font-weight="600">firstParty</tspan></text>
    <rect x="436" y="92" width="264" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="444" y="107" fill="#6b7280">base URL <tspan fill="#111827" font-family="Consolas, monospace">https://proxy.corp.example/v1</tspan></text>
  </g>
  <rect x="14" y="86" width="694" height="34" rx="5" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="716" y="98" font-size="11" fill="#b45309">NEW (FR-4): plan / seat type / provider /</text>
  <text x="716" y="111" font-size="11" fill="#b45309">custom base URL, latest value. Row hidden when</text>
  <text x="716" y="124" font-size="11" fill="#b45309">all four are null (CC &lt; 2.1.317); null chips omitted.</text>

  <!-- Notional banner -->
  <rect x="20" y="138" width="960" height="34" rx="4" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="34" y="160" font-size="12" fill="#5b21b6">ⓘ  Claude Code reports plan <tspan font-weight="600">max</tspan>. On a subscription plan OTEL amounts are list-price equivalents, not billed money.</text>
  <text x="826" y="160" font-size="12" fill="#1d4ed8" text-decoration="underline">What is this?</text>
  <rect x="14" y="132" width="972" height="46" rx="5" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="20" y="194" font-size="11" fill="#b45309">NEW (FR-5): shown whenever a plan is reported, with the raw plan value; no fixed list of subscription plans. Absent plan → no note.</text>

  <!-- Chart heading + controls (compressed) -->
  <text x="20" y="226" font-size="14" font-weight="600" fill="#111827">Session cost over time</text>
  <text x="186" y="226" font-size="12" fill="#6b7280">session tree · by event.timestamp</text>
  <rect x="20" y="238" width="960" height="140" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-dasharray="4 3"/>
  <text x="380" y="300" font-size="12" fill="#9ca3af">Chart controls + stacked chart (see otel-stack-by-attribution.svg)</text>
  <text x="380" y="318" font-size="12" fill="#9ca3af">Amounts unchanged (no prefix): "$3.80"</text>

  <!-- KPI tiles with notional marker -->
  <g font-size="12">
    <rect x="20" y="396" width="230" height="96" rx="4" fill="#fff" stroke="#111827"/>
    <text x="36" y="420" fill="#4b5563" text-decoration="underline">OTEL cost</text>
    <rect x="104" y="408" width="70" height="18" rx="9" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="113" y="421" font-size="11" fill="#5b21b6">plan: max</text>
    <text x="36" y="452" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#111827">$12.20</text>
    <text x="36" y="476" fill="#6b7280">2 models</text>

    <rect x="262" y="396" width="230" height="96" rx="4" fill="#fff" stroke="#111827"/>
    <text x="278" y="420" fill="#4b5563" text-decoration="underline">Hidden</text>
    <text x="278" y="452" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#111827">$1.28</text>
    <text x="278" y="476" fill="#6b7280">10.5 % · 28 calls</text>

    <rect x="504" y="396" width="230" height="96" rx="4" fill="#fff" stroke="#111827"/>
    <text x="520" y="420" fill="#4b5563" text-decoration="underline">API calls</text>
    <text x="520" y="452" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#111827">135</text>

    <rect x="746" y="396" width="234" height="96" rx="4" fill="#fff" stroke="#111827"/>
    <text x="762" y="420" fill="#4b5563" text-decoration="underline">Turns</text>
    <text x="762" y="452" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#111827">0</text>
    <text x="762" y="476" fill="#6b7280">none running</text>
  </g>
  <rect x="14" y="390" width="484" height="108" rx="5" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="20" y="516" font-size="11" fill="#b45309">The OTEL cost tile carries a "plan: &lt;value&gt;" chip (tooltip repeats the note above); amounts keep their normal format — the plan is not classified as subscription / API.</text>

  <!-- Repo / team tab plan-mix note -->
  <rect x="20" y="540" width="960" height="84" rx="4" fill="#fff" stroke="#e5e7eb"/>
  <text x="36" y="564" font-size="12" font-weight="600" fill="#111827">Repository / team OTEL tab — Total OTEL cost tile, plan-mix note (planMix)</text>
  <rect x="36" y="576" width="200" height="36" rx="4" fill="#fff" stroke="#111827"/>
  <text x="46" y="599" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#111827">$278.95</text>
  <text x="250" y="590" font-size="12" fill="#5b21b6">Mix of plans: max · 12 sessions · $96.40 — pro · 3 · $10.20 — not reported · 40 · $172.35</text>
  <text x="250" y="608" font-size="11" fill="#6b7280">On subscription plans cost_usd is list-price equivalent, not billed. Shown when ≥ 1 session in range reports a plan; otherwise the tile is unchanged.</text>
</svg>
