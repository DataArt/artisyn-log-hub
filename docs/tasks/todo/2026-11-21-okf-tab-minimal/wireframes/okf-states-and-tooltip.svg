<text x="24" y="34" font-weight="600" font-size="16">OKF tab — states and tooltips</text><text x="24" y="54" font-size="12" fill="#57606a">Panels A–C use example values (local prod has no version or format problems); panels D–F use local-prod numbers.</text><rect x="24" y="76" width="760" height="210" rx="6" fill="#fff" stroke="#d0d7de"/><text x="40" y="100" font-weight="600">A · Versions — expanded, two folders behind</text><text x="768" y="100" text-anchor="end" font-size="12" fill="#57606a">current format: 0.3</text><text x="40" y="134" font-size="12.5" font-family="Consolas, monospace">docs/knowledgebase</text><text x="384" y="134" text-anchor="end" fill="#57606a">129 files</text><text x="404" y="134" font-weight="600" fill="#1a7f37">0.3</text><text x="504" y="134" font-size="12" fill="#9a6700"></text><text x="40" y="162" font-size="12.5" font-family="Consolas, monospace">docs/product-kb</text><text x="384" y="162" text-anchor="end" fill="#57606a">39 files</text><text x="404" y="162" font-weight="600" fill="#9a6700">0.1</text><text x="504" y="162" font-size="12" fill="#9a6700">older than the current format 0.3</text><text x="40" y="190" font-size="12.5" font-family="Consolas, monospace">docs/product-kb/competitive-watch</text><text x="384" y="190" text-anchor="end" fill="#57606a">3 files</text><text x="404" y="190" font-weight="600" fill="#9a6700">not declared</text><text x="504" y="190" font-size="12" fill="#9a6700">older than the current format 0.3</text><text x="40" y="218" font-size="12.5" font-family="Consolas, monospace">docs/kb-local   (not in git)</text><text x="384" y="218" text-anchor="end" fill="#57606a">4 files</text><text x="404" y="218" font-weight="600" fill="#1a7f37">0.3</text><text x="504" y="218" font-size="12" fill="#9a6700"></text><rect x="808" y="76" width="768" height="210" rx="6" fill="#fff" stroke="#d0d7de"/><text x="824" y="100" font-weight="600">B · Wrong format — 9 of 169 articles</text><text x="824" y="130" font-weight="600">▾ No front matter</text><text x="1552" y="130" text-anchor="end">3</text><text x="844" y="150" font-size="12" font-family="Consolas, monospace">docs/knowledgebase/old-notes.md</text><text x="844" y="168" font-size="12" font-family="Consolas, monospace">docs/knowledgebase/scratch.md  ·  docs/product-kb/ideas/raw.md</text><text x="824" y="198" font-weight="600">▸ No "type" in the front matter</text><text x="1552" y="198" text-anchor="end">2</text><text x="824" y="222" font-weight="600">▸ Old "timestamp" key (format 0.1)</text><text x="1552" y="222" text-anchor="end">2</text><text x="824" y="246" font-weight="600">▸ Deprecated</text><text x="1552" y="246" text-anchor="end">1</text><text x="824" y="270" font-weight="600">▸ Past its "stale after" date</text><text x="1552" y="270" text-anchor="end">1</text><rect x="24" y="304" width="1552" height="116" rx="6" fill="#fff" stroke="#d0d7de"/><text x="40" y="328" font-weight="600">C · When the data is missing — one line each</text><text x="40" y="356" fill="#57606a">Versions / Wrong format, snapshot from a hook older than 3.1.0:</text><text x="494" y="356" fill="#9a6700">Update the hook to see versions and format problems.</text><text x="40" y="380" fill="#57606a">Versions / Wrong format / Explorer, no snapshot at all:</text><text x="494" y="380" fill="#9a6700">No KB snapshot — update the hook.</text><text x="40" y="404" fill="#57606a">Summary line with no snapshot:</text><text x="494" y="404">KB read in 12 of 40 sessions · ≈ 310K tokens of context · ≈ $1.24     (no "snapshot from …" part)</text><rect x="24" y="460" width="760" height="348" rx="6" fill="#fff" stroke="#d0d7de"/><text x="40" y="486" font-weight="600" font-size="14">Explorer</text><text x="768" y="486" text-anchor="end" font-size="12" fill="#57606a">154 of 175 files opened</text><rect x="40" y="498" width="41.6" height="24" rx="12" fill="#fff" stroke="#d0d7de"/><text x="60.8" y="514" text-anchor="middle" font-weight="400" font-size="12" fill="#57606a">All</text><rect x="87.6" y="498" width="106.4" height="24" rx="12" fill="#fff" stroke="#d0d7de"/><text x="140.8" y="514" text-anchor="middle" font-weight="400" font-size="12" fill="#57606a">Opened (154)</text><rect x="200" y="498" width="142.4" height="24" rx="12" fill="#ddf4ff" stroke="#0969da"/><text x="271.2" y="514" text-anchor="middle" font-weight="600" font-size="12" fill="#0969da">Never opened (21)</text><text x="40" y="546" fill="#57606a">File / folder</text><text x="544" y="546" text-anchor="end" fill="#57606a">Files opened</text><text x="654" y="546" text-anchor="end" fill="#57606a">Sessions</text><text x="760" y="546" text-anchor="end" fill="#57606a">≈ Tokens</text><line x1="36" y1="554" x2="772" y2="554" stroke="#eaeef2"/><text x="40" y="576" font-weight="600" font-size="12.5">▾ docs/knowledgebase</text><text x="544" y="576" text-anchor="end">8 never opened</text><text x="654" y="576" text-anchor="end"></text><text x="760" y="576" text-anchor="end"></text><text x="60" y="602" font-weight="600" font-size="12.5">▸ algorithms</text><text x="544" y="602" text-anchor="end">7 never opened</text><text x="654" y="602" text-anchor="end"></text><text x="760" y="602" text-anchor="end"></text><text x="60" y="628" font-weight="600" font-size="12.5">▾ log-schema</text><text x="544" y="628" text-anchor="end">1 never opened</text><text x="654" y="628" text-anchor="end"></text><text x="760" y="628" text-anchor="end"></text><text x="80" y="654" font-weight="400" font-size="12.5" fill="#8c959f" font-family="Consolas, monospace">assistant-message-types.md</text><text x="544" y="654" text-anchor="end" fill="#8c959f"></text><text x="654" y="654" text-anchor="end" fill="#8c959f">—</text><text x="760" y="654" text-anchor="end" fill="#8c959f">—</text><text x="40" y="680" font-weight="600" font-size="12.5">▾ docs/product-kb</text><text x="544" y="680" text-anchor="end">12 never opened</text><text x="654" y="680" text-anchor="end"></text><text x="760" y="680" text-anchor="end"></text><text x="60" y="706" font-weight="600" font-size="12.5">▸ competitive-research</text><text x="544" y="706" text-anchor="end">1 never opened</text><text x="654" y="706" text-anchor="end"></text><text x="760" y="706" text-anchor="end"></text><text x="60" y="732" font-weight="600" font-size="12.5">▸ ideas</text><text x="544" y="732" text-anchor="end">1 never opened</text><text x="654" y="732" text-anchor="end"></text><text x="760" y="732" text-anchor="end"></text><text x="60" y="758" font-weight="600" font-size="12.5">▸ ux-analysis</text><text x="544" y="758" text-anchor="end">10 never opened</text><text x="654" y="758" text-anchor="end"></text><text x="760" y="758" text-anchor="end"></text><text x="40" y="784" font-weight="600" font-size="12.5">▸ docs/kb-local</text><text x="166" y="784" font-size="11.5" fill="#57606a">not in git</text><text x="544" y="784" text-anchor="end">1 never opened</text><text x="654" y="784" text-anchor="end"></text><text x="760" y="784" text-anchor="end"></text><text x="40" y="448" font-weight="600">D · Explorer with the "Never opened" filter</text><rect x="808" y="460" width="768" height="250" rx="6" fill="#fff" stroke="#d0d7de" stroke-dasharray="5 4"/><text x="824" y="448" font-weight="600">E · Tooltips</text><text x="824" y="488" font-weight="600">≈ $  (summary and hot files)</text><text x="824" y="508" font-size="12" fill="#57606a">Tokens of every read and search, priced once at the input rate of the model that read them.</text><text x="824" y="526" font-size="12" fill="#57606a">A lower bound: the same text carried in the context of later turns is not included.</text><text x="824" y="544" font-size="12" fill="#57606a">Reads by models without a price add $0 — none in this period.</text><text x="824" y="578" font-weight="600">Reads</text><text x="824" y="598" font-size="12" fill="#57606a">Read and search (grep) calls that returned text of this file.</text><text x="824" y="626" font-weight="600">≈ Tokens</text><text x="824" y="646" font-size="12" fill="#57606a">Bytes returned by those calls ÷ 4 — not the size of the file.</text><text x="824" y="674" font-weight="600">Not in this snapshot</text><text x="824" y="694" font-size="12" fill="#57606a">Files that were read but are not in the snapshot shown: deleted, renamed, or on another branch.</text><rect x="24" y="836" width="1552" height="92" rx="6" fill="#fff" stroke="#d0d7de"/><text x="40" y="860" font-weight="600">F · Explorer rows</text><text x="40" y="886" font-size="12.5" font-family="Consolas, monospace">okf-usage.md</text><text x="220" y="886" fill="#57606a">opened: sessions and ≈ tokens</text><text x="520" y="886" font-size="12.5" fill="#8c959f" font-family="Consolas, monospace">repo-url-normalization.md</text><text x="760" y="886" fill="#57606a">never opened: greyed, dashes</text><text x="1040" y="886" fill="#57606a">searches across this folder</text><text x="1260" y="886" fill="#57606a">a search over the folder, no single file</text><text x="40" y="912" font-weight="600">▸ docs/product-kb/competitive-watch</text><text x="330" y="912" fill="#57606a">a KB folder nested in another is its own root; the outer one does not include it</text><text x="960" y="912" font-size="11.5" fill="#57606a">not in git</text><text x="1040" y="912" fill="#57606a">shown to the owner, hidden in the team view</text>
