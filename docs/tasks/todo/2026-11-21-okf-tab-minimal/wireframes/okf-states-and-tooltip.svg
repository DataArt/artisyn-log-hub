<text x="24" y="34" font-weight="600" font-size="16">OKF tab — states and tooltips</text><text x="24" y="54" font-size="12" fill="#57606a">Panels A–C use example values (local prod has no version or format problems); panels D–F use local-prod numbers.</text><rect x="24" y="76" width="760" height="226" rx="6" fill="#fff" stroke="#d0d7de"/><text x="40" y="100" font-weight="600">A · Versions — expanded, two folders behind</text><text x="768" y="100" text-anchor="end" font-size="12" fill="#57606a">current format: 0.3 ⓘ</text><text x="40" y="134" font-size="12.5" font-family="Consolas, monospace">docs/knowledgebase</text><text x="384" y="134" text-anchor="end" fill="#57606a">129 files</text><text x="404" y="134" font-weight="600" fill="#1a7f37">0.3</text><text x="504" y="134" font-size="12" fill="#9a6700"></text><text x="40" y="162" font-size="12.5" font-family="Consolas, monospace">docs/product-kb</text><text x="384" y="162" text-anchor="end" fill="#57606a">39 files</text><text x="404" y="162" font-weight="600" fill="#9a6700">0.1</text><text x="504" y="162" font-size="12" fill="#9a6700">older than the current format 0.3</text><text x="40" y="190" font-size="12.5" font-family="Consolas, monospace">docs/product-kb/competitive-watch</text><text x="384" y="190" text-anchor="end" fill="#57606a">3 files</text><text x="404" y="190" font-weight="600" fill="#9a6700">not declared</text><text x="504" y="190" font-size="12" fill="#9a6700">older than the current format 0.3</text><text x="40" y="218" font-size="12.5" font-family="Consolas, monospace">docs/kb-local   (not in git)</text><text x="384" y="218" text-anchor="end" fill="#57606a">4 files</text><text x="404" y="218" font-weight="600" fill="#1a7f37">0.3</text><text x="504" y="218" font-size="12" fill="#9a6700"></text><text x="40" y="266" font-size="12" fill="#57606a">ⓘ  The format version each KB folder declares in its index.md (okf_version).</text><rect x="808" y="76" width="768" height="226" rx="6" fill="#fff" stroke="#d0d7de"/><text x="824" y="100" font-weight="600">B · Wrong format — 9 of 169 articles</text><text x="824" y="130" font-weight="600">▾ No front matter</text><text x="1552" y="130" text-anchor="end">3</text><text x="844" y="149" font-size="12" font-family="Consolas, monospace">docs/knowledgebase/old-notes.md</text><text x="844" y="166" font-size="12" font-family="Consolas, monospace">docs/knowledgebase/scratch.md  ·  docs/product-kb/ideas/raw.md</text><text x="824" y="194" font-weight="600">▸ No "type" in the front matter</text><text x="1552" y="194" text-anchor="end">2</text><text x="824" y="218" font-weight="600">▸ Old "timestamp" key (format 0.1)</text><text x="1552" y="218" text-anchor="end">2</text><text x="824" y="242" font-weight="600">▾ Deprecated</text><text x="1552" y="242" text-anchor="end">1</text><text x="844" y="261" font-size="12" font-family="Consolas, monospace">docs/knowledgebase/api-reference.md  →  replaced by server-endpoint-map.md</text><text x="824" y="286" font-weight="600">▸ Past its "stale after" date</text><text x="1552" y="286" text-anchor="end">1</text><rect x="24" y="320" width="1552" height="92" rx="6" fill="#fff" stroke="#d0d7de"/><text x="40" y="344" font-weight="600">C · When the data is missing — one line</text><text x="40" y="372" fill="#57606a">Snapshot from a hook older than 3.1.0 — Versions and Wrong format show:</text><text x="544" y="372" fill="#9a6700">Update the hook to see versions and format problems.</text><text x="924" y="372" font-size="12" fill="#57606a">(summary, hot files and explorer work as usual)</text><text x="40" y="396" fill="#57606a">No snapshot at all — the whole tab is:</text><text x="544" y="396" fill="#9a6700">No KB snapshot — update the hook.</text><text x="924" y="396" font-size="12" fill="#57606a">(no numbers: the KB folders are unknown)</text><rect x="24" y="452" width="760" height="348" rx="6" fill="#fff" stroke="#d0d7de"/><text x="40" y="478" font-weight="600" font-size="14">Explorer</text><text x="768" y="478" text-anchor="end" font-size="12" fill="#57606a">154 of 175 files opened</text><rect x="40" y="490" width="41.6" height="24" rx="12" fill="#fff" stroke="#d0d7de"/><text x="60.8" y="506" text-anchor="middle" font-weight="400" font-size="12" fill="#57606a">All</text><rect x="87.6" y="490" width="106.4" height="24" rx="12" fill="#fff" stroke="#d0d7de"/><text x="140.8" y="506" text-anchor="middle" font-weight="400" font-size="12" fill="#57606a">Opened (154)</text><rect x="200" y="490" width="142.4" height="24" rx="12" fill="#ddf4ff" stroke="#0969da"/><text x="271.2" y="506" text-anchor="middle" font-weight="600" font-size="12" fill="#0969da">Never opened (21)</text><text x="40" y="538" fill="#57606a">File / folder</text><text x="544" y="538" text-anchor="end" fill="#57606a">Never opened</text><text x="654" y="538" text-anchor="end" fill="#57606a"></text><text x="760" y="538" text-anchor="end" fill="#57606a"></text><line x1="36" y1="546" x2="772" y2="546" stroke="#eaeef2"/><text x="40" y="568" font-weight="600" font-size="12.5">▾ docs/knowledgebase</text><text x="544" y="568" text-anchor="end">8</text><text x="654" y="568" text-anchor="end"></text><text x="760" y="568" text-anchor="end"></text><text x="60" y="594" font-weight="600" font-size="12.5">▸ algorithms</text><text x="544" y="594" text-anchor="end">7</text><text x="654" y="594" text-anchor="end"></text><text x="760" y="594" text-anchor="end"></text><text x="60" y="620" font-weight="600" font-size="12.5">▾ log-schema</text><text x="544" y="620" text-anchor="end">1</text><text x="654" y="620" text-anchor="end"></text><text x="760" y="620" text-anchor="end"></text><text x="80" y="646" font-weight="400" font-size="12.5" fill="#8c959f" font-family="Consolas, monospace">assistant-message-types.md</text><text x="544" y="646" text-anchor="end" fill="#8c959f"></text><text x="654" y="646" text-anchor="end" fill="#8c959f"></text><text x="760" y="646" text-anchor="end" fill="#8c959f"></text><text x="40" y="672" font-weight="600" font-size="12.5">▾ docs/product-kb</text><text x="544" y="672" text-anchor="end">12</text><text x="654" y="672" text-anchor="end"></text><text x="760" y="672" text-anchor="end"></text><text x="60" y="698" font-weight="600" font-size="12.5">▸ competitive-research</text><text x="544" y="698" text-anchor="end">1</text><text x="654" y="698" text-anchor="end"></text><text x="760" y="698" text-anchor="end"></text><text x="60" y="724" font-weight="600" font-size="12.5">▸ ideas</text><text x="544" y="724" text-anchor="end">1</text><text x="654" y="724" text-anchor="end"></text><text x="760" y="724" text-anchor="end"></text><text x="60" y="750" font-weight="600" font-size="12.5">▸ ux-analysis</text><text x="544" y="750" text-anchor="end">10</text><text x="654" y="750" text-anchor="end"></text><text x="760" y="750" text-anchor="end"></text><text x="40" y="776" font-weight="600" font-size="12.5">▸ docs/kb-local</text><text x="166" y="776" font-size="11.5" fill="#57606a">not in git</text><text x="544" y="776" text-anchor="end">1</text><text x="654" y="776" text-anchor="end"></text><text x="760" y="776" text-anchor="end"></text><text x="40" y="440" font-weight="600">D · Explorer with the "Never opened" filter ("Not in this snapshot" is hidden here)</text><rect x="808" y="452" width="768" height="348" rx="6" fill="#fff" stroke="#d0d7de" stroke-dasharray="5 4"/><text x="824" y="440" font-weight="600">E · Tooltips</text><text x="824" y="480" font-weight="600">≈ $  and  ≈ % of spend</text><text x="824" y="500" font-size="12" fill="#57606a">For each agent: the KB share of what it put into its context × what that context cost</text><text x="824" y="518" font-size="12" fill="#57606a">(input + cache write + cache read; output is not included). Assumes KB text is carried and</text><text x="824" y="536" font-size="12" fill="#57606a">re-read from the cache like the rest of the context. Spend = total cost of the same sessions.</text><text x="824" y="554" font-size="12" fill="#57606a">All reads in this period have a cost.</text><text x="824" y="584" font-weight="600">Reads</text><text x="824" y="604" font-size="12" fill="#57606a">Read and search (grep) calls that returned text of this file.</text><text x="824" y="630" font-weight="600">≈ Tokens</text><text x="824" y="650" font-size="12" fill="#57606a">Bytes returned by those calls ÷ 4 — not the size of the file.</text><text x="824" y="676" font-weight="600">snapshot</text><text x="824" y="696" font-size="12" fill="#57606a">The list of KB files as of this branch and date. "Never opened" is measured against it.</text><text x="824" y="722" font-weight="600">Not in this snapshot</text><text x="824" y="742" font-size="12" fill="#57606a">Files that were read but are not in the snapshot shown: deleted, renamed, or on another branch.</text><text x="824" y="768" font-weight="600">searches across this folder</text><text x="824" y="788" font-size="12" fill="#57606a">Searches over the whole folder; not included in any file's numbers.</text><rect x="24" y="828" width="1552" height="92" rx="6" fill="#fff" stroke="#d0d7de"/><text x="40" y="852" font-weight="600">F · Explorer rows</text><text x="40" y="878" font-size="12.5" font-family="Consolas, monospace">okf-usage.md</text><text x="220" y="878" fill="#57606a">opened: sessions and ≈ tokens</text><text x="520" y="878" font-size="12.5" fill="#8c959f" font-family="Consolas, monospace">local-workhub.md</text><text x="760" y="878" fill="#57606a">never opened: greyed, dashes</text><text x="1040" y="878" font-size="12.5" font-family="Consolas, monospace">index.md</text><text x="1130" y="878" fill="#57606a">index files are listed here, not in hot files</text><text x="40" y="904" font-weight="600">▸ docs/product-kb/competitive-watch</text><text x="330" y="904" fill="#57606a">a KB folder nested in another is its own root; the outer one does not include it</text><text x="960" y="904" font-size="11.5" fill="#57606a">not in git</text><text x="1040" y="904" fill="#57606a">shown to its owner only; in no number of the team view</text>
</svg>
