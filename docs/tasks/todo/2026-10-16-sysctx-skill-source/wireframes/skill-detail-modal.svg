<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Inter, Segoe UI, Arial, sans-serif">
  <style>
    .mono { font-family: Consolas, 'JetBrains Mono', monospace; }
    .muted { fill: #6b7280; }
    .fg { fill: #1f2937; }
    .note { fill: #b45309; font-size: 11px; font-style: italic; }
  </style>
  <rect width="1000" height="600" fill="#f3f4f6"/>

  <!-- Plugin modal -->
  <rect x="20" y="20" width="620" height="400" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="44" y="56" font-size="15" font-weight="600" class="mono fg">adlc-lh:tracker</text>
  <text x="614" y="54" font-size="14" class="muted" text-anchor="end">✕</text>

  <rect x="44" y="76" width="572" height="32" rx="6" fill="#f1f5f9"/>
  <rect x="48" y="80" width="280" height="24" rx="4" fill="#ffffff"/>
  <text x="188" y="97" font-size="12" font-weight="600" class="fg" text-anchor="middle">Overview</text>
  <text x="474" y="97" font-size="12" class="muted" text-anchor="middle">Body</text>

  <rect x="44" y="124" width="572" height="232" rx="4" fill="#f8fafc" stroke="#e5e7eb"/>
  <g font-size="12">
    <text x="58" y="150" class="muted">Source</text>
    <rect x="154" y="138" width="50" height="18" rx="3" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="179" y="151" font-size="10" font-weight="600" fill="#6d28d9" text-anchor="middle">PLUGIN</text>

    <rect x="50" y="164" width="560" height="22" fill="#fffbeb"/>
    <text x="58" y="180" class="muted">Plugin</text>
    <text x="154" y="180" class="mono fg">adlc-lh@artisyn · v1.3.1 · 4f2a9c1</text>

    <text x="58" y="208" class="muted">Path</text>
    <text x="154" y="208" class="mono fg">adlc-lh@1.3.1/skills/tracker/SKILL.md</text>

    <text x="58" y="236" class="muted">Size</text>
    <text x="154" y="236" class="mono fg">10.4 KB · ~2.6K tok</text>

    <text x="58" y="264" class="muted">Argument</text>
    <text x="154" y="264" class="mono fg">[task-id]</text>

    <text x="58" y="292" class="muted">Description</text>
    <text x="154" y="292" class="fg">ALWAYS use this skill when working with tasks in any</text>
    <text x="154" y="308" class="fg">way: issues, bugs, task creation or updates, …</text>
  </g>
  <text x="44" y="384" font-size="11" class="muted">Body tab: full SKILL.md text from the snapshot (always present now).</text>

  <!-- User badge variant -->
  <rect x="20" y="440" width="620" height="140" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="44" y="470" font-size="13" font-weight="600" class="mono fg">deploy-helper  <tspan class="muted" font-family="Inter, Segoe UI, Arial" font-weight="400" font-size="11">(user skill — Overview fragment)</tspan></text>
  <rect x="44" y="482" width="572" height="82" rx="4" fill="#f8fafc" stroke="#e5e7eb"/>
  <g font-size="12">
    <text x="58" y="506" class="muted">Source</text>
    <rect x="154" y="494" width="40" height="18" rx="3" fill="#fffbeb" stroke="#fde68a"/>
    <text x="174" y="507" font-size="10" font-weight="600" fill="#b45309" text-anchor="middle">USER</text>
    <text x="58" y="534" class="muted">Path</text>
    <text x="154" y="534" class="mono fg">~/.claude/skills/deploy-helper/SKILL.md</text>
    <text x="58" y="556" class="muted">Size</text>
    <text x="154" y="556" class="mono fg">15.2 KB · ~3.8K tok</text>
  </g>

  <!-- annotations -->
  <g class="note">
    <line x1="610" y1="147" x2="660" y2="147" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <text x="666" y="143">Badge: PROJECT (sky) | USER (new, amber) |</text>
    <text x="666" y="157">PLUGIN (violet). BUILT-IN removed (FR-15)</text>

    <line x1="610" y1="175" x2="660" y2="185" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <text x="666" y="181">NEW row, only for plugin skills:</text>
    <text x="666" y="195">&lt;id&gt;@&lt;marketplace&gt; · v&lt;version&gt;</text>
    <text x="666" y="209">· short gitCommitSha if present (FR-15)</text>

    <line x1="610" y1="208" x2="660" y2="232" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <text x="666" y="236">Paths never absolute (FR-3):</text>
    <text x="666" y="250">plugin → &lt;id&gt;@&lt;version&gt;/…</text>
    <text x="666" y="264">user → ~/.claude/…   project → repo-relative</text>

    <text x="666" y="296">"Modified" row is dropped — the snapshot</text>
    <text x="666" y="310">carries contentHash, not mtime (FR-1, FR-4)</text>

    <line x1="610" y1="534" x2="660" y2="534" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <text x="666" y="530">user skill: no Plugin row;</text>
    <text x="666" y="544">path shown as ~/.claude/…</text>
  </g>
</svg>
