<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" font-family="monospace, sans-serif" font-size="12">
  <rect width="800" height="680" fill="#ffffff" rx="4"/>

  <!-- Title -->
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#111827">T-26 — MCP Invocation Log (per-prompt collapsible section)</text>

  <!-- ─── Prompt turn card ─── -->
  <rect x="20" y="44" width="760" height="40" fill="#f9fafb" rx="3" stroke="#e5e7eb"/>
  <text x="36" y="60" fill="#6366f1" font-size="14">✦</text>
  <text x="52" y="60" fill="#6b7280" font-size="12">2026-06-19 14:23:01</text>
  <text x="160" y="60" fill="#6b7280" font-size="12">⏱ 0:01:42</text>
  <text x="36" y="76" fill="#111827" font-size="12">▶  "add the MCP invocation log tab per requirements"</text>

  <!-- Section divider label -->
  <text x="36" y="110" fill="#9ca3af" font-size="10" font-weight="bold" letter-spacing="1">MCP CALLS</text>

  <!-- MCP section header -->
  <rect x="28" y="114" width="752" height="30" fill="#f5f3ff" rx="3" stroke="#c4b5fd"/>
  <!-- vertical accent bar -->
  <rect x="28" y="114" width="3" height="30" fill="#7c3aed" rx="1"/>
  <text x="38" y="134" fill="#7c3aed" font-size="12" font-weight="bold">⚙ MCP</text>
  <text x="96" y="134" fill="#6b7280" font-size="12">3 calls • 2 ok • 1 error</text>
  <text x="700" y="134" fill="#7c3aed" font-size="11">▲ Collapse</text>

  <!-- ─── Call card 1: Success ─── -->
  <rect x="36" y="154" width="736" height="118" fill="#fff" rx="3" stroke="#e5e7eb"/>
  <!-- green left border -->
  <rect x="36" y="154" width="3" height="118" fill="#10b981" rx="1"/>

  <!-- Call 1 header -->
  <rect x="36" y="154" width="736" height="28" fill="#f0fdf4" rx="3"/>
  <rect x="44" y="161" width="42" height="16" fill="#d1fae5" rx="2"/>
  <text x="47" y="173" fill="#065f46" font-size="10" font-weight="bold">success</text>
  <text x="94" y="173" fill="#111827" font-size="12" font-weight="bold">playwright</text>
  <text x="170" y="173" fill="#6b7280" font-size="12">:</text>
  <text x="178" y="173" fill="#111827" font-size="12">browser_snapshot</text>
  <text x="660" y="173" fill="#9ca3af" font-size="11">14:23:04   1 234 ms</text>

  <!-- Input params -->
  <text x="48" y="202" fill="#6b7280" font-size="10" font-weight="bold" letter-spacing="0.5">INPUT</text>
  <rect x="44" y="208" width="720" height="18" fill="#f9fafb" rx="2" stroke="#e5e7eb"/>
  <text x="50" y="220" fill="#374151" font-size="11">▶  { "selector": "body" }   </text>
  <text x="680" y="220" fill="#6366f1" font-size="10">[expand]</text>

  <!-- Response -->
  <text x="48" y="248" fill="#6b7280" font-size="10" font-weight="bold" letter-spacing="0.5">RESPONSE</text>
  <rect x="44" y="254" width="720" height="14" fill="#f9fafb" rx="2" stroke="#e5e7eb"/>
  <text x="50" y="264" fill="#9ca3af" font-size="10">(image/png — 312 KB)  [expand to view]</text>

  <!-- ─── Call card 2: Success ─── -->
  <rect x="36" y="282" width="736" height="82" fill="#fff" rx="3" stroke="#e5e7eb"/>
  <rect x="36" y="282" width="3" height="82" fill="#10b981" rx="1"/>
  <rect x="36" y="282" width="736" height="28" fill="#f0fdf4" rx="3"/>
  <rect x="44" y="289" width="42" height="16" fill="#d1fae5" rx="2"/>
  <text x="47" y="301" fill="#065f46" font-size="10" font-weight="bold">success</text>
  <text x="94" y="301" fill="#111827" font-size="12" font-weight="bold">postgres</text>
  <text x="160" y="301" fill="#6b7280" font-size="12">:</text>
  <text x="168" y="301" fill="#111827" font-size="12">query</text>
  <text x="660" y="301" fill="#9ca3af" font-size="11">14:23:18     88 ms</text>

  <text x="48" y="330" fill="#6b7280" font-size="10" font-weight="bold" letter-spacing="0.5">INPUT</text>
  <rect x="44" y="336" width="720" height="14" fill="#f9fafb" rx="2" stroke="#e5e7eb"/>
  <text x="50" y="346" fill="#374151" font-size="11">▶  { "query": "SELECT * FROM sessions LIMIT 10" }</text>
  <text x="48" y="360" fill="#6b7280" font-size="10" font-weight="bold" letter-spacing="0.5">RESPONSE</text>
  <rect x="44" y="0" width="0" height="0"/>
  <!-- collapsed response shown inline -->
  <text x="50" y="360" fill="#9ca3af" font-size="10">                  10 rows   [expand]</text>

  <!-- ─── Call card 3: Error ─── -->
  <rect x="36" y="374" width="736" height="140" fill="#fff7f7" rx="3" stroke="#fca5a5"/>
  <rect x="36" y="374" width="3" height="140" fill="#ef4444" rx="1"/>

  <rect x="36" y="374" width="736" height="28" fill="#fef2f2" rx="3"/>
  <rect x="44" y="381" width="34" height="16" fill="#fee2e2" rx="2"/>
  <text x="47" y="393" fill="#991b1b" font-size="10" font-weight="bold">error</text>
  <text x="86" y="393" fill="#111827" font-size="12" font-weight="bold">playwright</text>
  <text x="162" y="393" fill="#6b7280" font-size="12">:</text>
  <text x="170" y="393" fill="#111827" font-size="12">browser_click</text>
  <text x="660" y="393" fill="#9ca3af" font-size="11">14:23:41   2 108 ms</text>

  <text x="48" y="422" fill="#6b7280" font-size="10" font-weight="bold" letter-spacing="0.5">INPUT</text>
  <rect x="44" y="428" width="720" height="18" fill="#f9fafb" rx="2" stroke="#e5e7eb"/>
  <text x="50" y="440" fill="#374151" font-size="11">▶  { "selector": "#submit-btn", "button": "left" }</text>
  <text x="680" y="440" fill="#6366f1" font-size="10">[expand]</text>

  <text x="48" y="460" fill="#dc2626" font-size="10" font-weight="bold" letter-spacing="0.5">ERROR</text>
  <rect x="44" y="466" width="720" height="44" fill="#fef2f2" rx="2" stroke="#fca5a5"/>
  <text x="50" y="480" fill="#991b1b" font-size="11">TimeoutError: waiting for selector '#submit-btn' failed: </text>
  <text x="50" y="494" fill="#991b1b" font-size="11">  waiting for element to be visible   [expand full body]</text>

  <!-- ─── Legend ─── -->
  <rect x="20" y="530" width="760" height="130" fill="#f9fafb" rx="4" stroke="#e5e7eb"/>
  <text x="36" y="550" font-size="11" font-weight="bold" fill="#374151">Legend</text>

  <rect x="36" y="560" width="8" height="8" fill="#10b981" rx="1"/>
  <text x="50" y="570" fill="#374151" font-size="11">Success call — green left border, green badge</text>

  <rect x="36" y="578" width="8" height="8" fill="#ef4444" rx="1"/>
  <text x="50" y="588" fill="#374151" font-size="11">Error call — red border, red badge, red ERROR section with full message</text>

  <text x="36" y="607" fill="#374151" font-size="11">Tool name format  mcp__&lt;server&gt;__&lt;tool&gt;  →  displayed as  server : tool</text>
  <text x="36" y="624" fill="#374151" font-size="11">Duration = result event timestamp − call event timestamp (both from NDJSON)</text>
  <text x="36" y="641" fill="#374151" font-size="11">JSON payloads collapsed by default when &gt;200 chars; [expand] toggle shows full pretty-printed JSON</text>
  <text x="36" y="658" fill="#374151" font-size="11">Section header shows aggregate: N calls • N ok • N error  — hidden when 0 MCP calls in turn</text>
</svg>
