<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Segoe UI, Inter, Arial, sans-serif">
  <title>Configure tab — explicit mandate (FR-4, FR-0/FR-1, FR-8, FR-9)</title>
  <rect width="1280" height="760" fill="#ffffff"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="48" fill="#ffffff"/>
  <line x1="0" y1="48" x2="1280" y2="48" stroke="#e5e7eb"/>
  <text x="16" y="29" font-size="14" font-weight="600" fill="#111827">Artisyn AI Work Hub</text>
  <text x="160" y="29" font-size="14" fill="#9ca3af">›</text>
  <text x="176" y="29" font-size="14" fill="#6b7280">research</text>
  <text x="900" y="29" font-size="14" font-weight="600" fill="#111827">History</text>
  <text x="996" y="29" font-size="14" font-weight="600" fill="#111827">Settings</text>
  <rect x="1088" y="12" width="26" height="24" rx="4" fill="#eef0fb" stroke="#3b4fd8"/>
  <text x="1094" y="29" font-size="13" fill="#3b4fd8">⚒</text>
  <rect x="1126" y="10" width="138" height="28" rx="6" fill="#fff" stroke="#e5e7eb"/>
  <text x="1136" y="29" font-size="13" fill="#6b7280">dt@dataart.com ⌄</text>

  <!-- branch bar -->
  <rect x="0" y="48" width="1280" height="44" fill="#f9fafb"/>
  <line x1="0" y1="92" x2="1280" y2="92" stroke="#e5e7eb"/>
  <rect x="12" y="56" width="168" height="28" rx="14" fill="#eef0fb" stroke="#3b4fd8"/>
  <text x="28" y="75" font-size="13" fill="#3b4fd8">main (working branch)</text>
  <text x="200" y="75" font-size="14" font-weight="600" fill="#111827">+ Open workstream</text>

  <!-- file tree -->
  <rect x="0" y="92" width="256" height="668" fill="#fafafa"/>
  <line x1="256" y1="92" x2="256" y2="760" stroke="#e5e7eb"/>
  <text x="12" y="116" font-size="12" font-weight="600" fill="#6b7280">FILES</text>
  <text x="28" y="150" font-size="13" fill="#111827">› ▢ .devcontainer</text>
  <text x="28" y="178" font-size="13" fill="#111827">› ▢ docs</text>
  <text x="46" y="206" font-size="13" fill="#111827">▭ .gitignore</text>
  <text x="46" y="234" font-size="13" fill="#111827">▭ index.html</text>

  <!-- tab strip -->
  <rect x="256" y="92" width="1024" height="36" fill="#f9fafb"/>
  <line x1="256" y1="128" x2="1280" y2="128" stroke="#e5e7eb"/>
  <rect x="256" y="92" width="130" height="36" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="272" y="115" font-size="13" font-weight="600" fill="#111827">⚒ Configure  ×</text>

  <!-- configure bar (FR-4) -->
  <rect x="256" y="128" width="1024" height="64" fill="#ffffff"/>
  <line x1="256" y1="192" x2="1280" y2="192" stroke="#e5e7eb"/>
  <rect x="262" y="132" width="840" height="56" rx="4" fill="none" stroke="#f59e0b" stroke-dasharray="5 3"/>
  <text x="270" y="152" font-size="13" fill="#6b7280">Ask the agent to add what new workstreams need: tools, env vars, settings, the default model.</text>
  <text x="270" y="170" font-size="13" fill="#6b7280">Setup lands in the <tspan font-weight="600" fill="#374151">devcontainer</tspan> (container + .devcontainer/devcontainer.json); <tspan font-weight="600" fill="#374151">secrets go to the vault</tspan>, never into files.</text>
  <text x="270" y="186" font-size="12" fill="#9ca3af">Finish saves it for the next workstream and erases this chat.</text>
  <rect x="1116" y="144" width="150" height="32" rx="6" fill="#3b4fd8"/>
  <text x="1129" y="165" font-size="13" font-weight="600" fill="#ffffff">Finish configuration</text>

  <!-- terminal -->
  <rect x="256" y="192" width="1024" height="568" fill="#f8fafc"/>
  <g font-family="Consolas, Menlo, monospace" font-size="13">
    <text x="272" y="220" fill="#6b7280">Work Hub configure session — instructions loaded (how / through what / reaches next workstream via)</text>
    <text x="272" y="250" fill="#111827">&gt; add Playwright with Chromium and make it work, my token ghp_… as secret GH_TOKEN</text>
    <text x="272" y="282" fill="#047857">● Bash(npm i -g playwright &amp;&amp; npx playwright install --with-deps chromium)</text>
    <text x="290" y="300" fill="#6b7280">⎿ installed to /opt/ms-playwright  (kept by checkpoint on Finish)</text>
    <text x="272" y="326" fill="#047857">● Edit(.devcontainer/devcontainer.json)  containerEnv.PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright</text>
    <text x="272" y="352" fill="#047857">● Bash(wh-devcontainer validate)</text>
    <text x="290" y="370" fill="#6b7280">⎿ ok: image, containerEnv, postCreateCommand · ignored: none</text>
    <text x="272" y="396" fill="#047857">● Bash(git commit -m "devcontainer: Playwright browsers path" -- .devcontainer/)</text>
    <text x="290" y="414" fill="#6b7280">⎿ [main 4f2c9a1] 1 file changed</text>
    <text x="272" y="440" fill="#047857">● Bash(wh-secret set GH_TOKEN)   value read from prompt, never written to disk</text>
    <text x="290" y="458" fill="#6b7280">⎿ stored in vault · reaches sessions as $GH_TOKEN</text>
    <text x="272" y="492" fill="#111827">Done. Verified: devcontainer validation passed, chromium launches here.</text>
    <text x="272" y="510" fill="#111827">Not verified: a full rebuild from the definition. Commit 4f2c9a1 (local, not pushed).</text>
    <text x="272" y="528" fill="#111827">Press "Finish configuration" — the next new workstream will have all of it.</text>
    <text x="272" y="560" fill="#111827">&gt; <tspan fill="#9ca3af">▌</tspan></text>
  </g>

  <!-- annotations -->
  <g font-size="12" fill="#b45309">
    <rect x="760" y="590" width="504" height="150" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="774" y="612" font-weight="600">Notes</text>
    <text x="774" y="632">FR-4: bar text names devcontainer + vault (dashed box).</text>
    <text x="774" y="650">FR-0/FR-1: session starts with Work Hub's local instructions.</text>
    <text x="774" y="668">FR-2: in-scope actions run with no permission prompt.</text>
    <text x="774" y="686">FR-8/FR-9: agent validates, commits itself, summary says what was verified.</text>
    <text x="774" y="704">FR-3: secret via vault tool; tool names are placeholders (plan decides).</text>
    <text x="774" y="722">FR-5/FR-6: Finish ends the session and scrubs before checkpoint.</text>
  </g>
</svg>
