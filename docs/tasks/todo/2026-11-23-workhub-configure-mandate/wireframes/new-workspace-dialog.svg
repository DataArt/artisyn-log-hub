<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Inter, Arial, sans-serif">
  <title>New workspace dialog — default agent model (FR-10) and vault copy (FR-3)</title>
  <rect width="1280" height="720" fill="#ffffff"/>
  <line x1="0" y1="48" x2="1280" y2="48" stroke="#e5e7eb"/>
  <text x="16" y="29" font-size="14" font-weight="600" fill="#111827">Artisyn AI Work Hub</text>
  <text x="160" y="29" font-size="14" fill="#9ca3af">›</text>
  <text x="176" y="29" font-size="14" fill="#6b7280">Workspaces</text>
  <text x="152" y="96" font-size="18" font-weight="600" fill="#111827">Workspaces</text>
  <rect x="980" y="72" width="148" height="36" rx="6" fill="#3b4fd8"/>
  <text x="996" y="95" font-size="14" font-weight="600" fill="#ffffff">+ New workspace</text>
  <rect x="152" y="124" width="316" height="120" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <rect x="481" y="124" width="316" height="120" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <rect x="810" y="124" width="316" height="120" rx="8" fill="#fff" stroke="#e5e7eb"/>

  <!-- overlay -->
  <rect width="1280" height="720" fill="#000" opacity="0.5"/>

  <!-- dialog -->
  <rect x="384" y="130" width="512" height="470" rx="8" fill="#ffffff"/>
  <text x="409" y="165" font-size="18" fill="#111827">New workspace</text>
  <text x="866" y="166" font-size="16" fill="#6b7280">×</text>
  <text x="409" y="189" font-size="13" fill="#6b7280">The workspace starts empty, with Work Hub's default container.</text>

  <text x="409" y="225" font-size="14" font-weight="600" fill="#111827">Name</text>
  <rect x="409" y="236" width="462" height="36" rx="6" fill="#fff" stroke="#3b4fd8" stroke-width="2"/>
  <text x="421" y="259" font-size="14" fill="#111827">research</text>

  <!-- NEW: default model -->
  <rect x="400" y="282" width="480" height="110" rx="6" fill="none" stroke="#f59e0b" stroke-dasharray="5 3"/>
  <text x="409" y="308" font-size="14" font-weight="600" fill="#111827">Default agent model</text>
  <rect x="409" y="319" width="462" height="36" rx="6" fill="#fff" stroke="#d1d5db"/>
  <text x="421" y="342" font-size="14" fill="#111827">Agent default</text>
  <text x="850" y="342" font-size="14" fill="#6b7280">⌄</text>
  <text x="409" y="376" font-size="12" fill="#6b7280">Used by chats in workstreams and by Configure. Change it later in Settings,</text>
  <text x="409" y="391" font-size="12" fill="#6b7280">or ask the Configure agent ("use Opus by default").</text>

  <!-- NEW: vault secrets copy -->
  <rect x="400" y="402" width="480" height="128" rx="6" fill="none" stroke="#f59e0b" stroke-dasharray="5 3"/>
  <text x="409" y="428" font-size="14" font-weight="600" fill="#111827">Vault secrets</text>
  <text x="409" y="447" font-size="12" fill="#6b7280">Secrets belong to this workspace. Copy from my workspace:</text>
  <rect x="409" y="456" width="462" height="30" rx="6" fill="#fff" stroke="#d1d5db"/>
  <rect x="419" y="465" width="12" height="12" rx="2" fill="#fff" stroke="#9ca3af"/>
  <text x="441" y="476" font-size="13" fill="#111827">None — start with an empty vault</text>
  <rect x="409" y="490" width="462" height="30" rx="6" fill="#eef2ff" stroke="#3b4fd8"/>
  <rect x="419" y="499" width="12" height="12" rx="2" fill="#3b4fd8"/>
  <text x="441" y="510" font-size="13" fill="#111827">playground  ·  3 secrets (GH_TOKEN, NPM_TOKEN, …)</text>

  <rect x="714" y="548" width="76" height="36" rx="6" fill="#fff" stroke="#d1d5db"/>
  <text x="731" y="571" font-size="14" font-weight="600" fill="#111827">Cancel</text>
  <rect x="798" y="548" width="73" height="36" rx="6" fill="#3b4fd8"/>
  <text x="814" y="571" font-size="14" font-weight="600" fill="#ffffff">Create</text>

  <!-- hints -->
  <g>
    <rect x="920" y="282" width="320" height="120" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="934" y="304" font-size="12" font-weight="600" fill="#b45309">FR-10 (new field, dashed)</text>
    <text x="934" y="324" font-size="12" fill="#b45309">Options: "Agent default" (empty = today's</text>
    <text x="934" y="340" font-size="12" fill="#b45309">behaviour) + the models Claude offers now,</text>
    <text x="934" y="356" font-size="12" fill="#b45309">listed by the adapter. Other agents' adapters</text>
    <text x="934" y="372" font-size="12" fill="#b45309">decide (own list or free text). Sits next to</text>
    <text x="934" y="388" font-size="12" fill="#b45309">the template choice of workspace-templates.</text>
  </g>
  <g>
    <rect x="920" y="414" width="320" height="104" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="934" y="436" font-size="12" font-weight="600" fill="#b45309">FR-3 (new section, dashed)</text>
    <text x="934" y="456" font-size="12" fill="#b45309">Vault secrets are per workspace. Copying</text>
    <text x="934" y="472" font-size="12" fill="#b45309">works like "Copy from my workspace" for the</text>
    <text x="934" y="488" font-size="12" fill="#b45309">agent login. Only names are shown, never</text>
    <text x="934" y="504" font-size="12" fill="#b45309">values. Hidden when the user has no secrets.</text>
  </g>
</svg>
