<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">
  <!-- Wireframe: Logs tab with per-turn harness markup (light theme). NEW = proposed.
       Setup-neutral example: a C project; the "Signal sources" strip states which producers
       this session has, so a missing group reads as "not produced", not as "nothing happened".
       Revised in chunk 4 of the analysis: current tab bar, URL state of the toolbar, one merged
       timing chip, interjection marker without text, ⟳ divider that absorbs the compaction summary. -->
  <defs>
    <style>
      .mono{font-family:'JetBrains Mono',Consolas,monospace}
      .muted{fill:#6b7280}
      .new{fill:#0369a1;font-size:11px;font-weight:600}
      .callout{stroke:#0284c7;stroke-dasharray:4 3;fill:none}
      .lg{fill:#334155}
    </style>
  </defs>
  <rect width="1200" height="1090" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#111827">Logs tab — per-turn Signals markup (proposal)</text>
  <text x="20" y="44" class="muted" font-size="12">Light theme. Blue dashed callouts = new or changed elements. Everything else is the current Logs tab.</text>

  <!-- Panel frame -->
  <rect x="20" y="60" width="860" height="1010" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- Session tab bar (current: pinned tabs + "More" menu grouped by SESSION_GROUPS) -->
  <rect x="20" y="60" width="860" height="40" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="36" y="85" class="muted">Summary</text><text x="106" y="85" class="muted">Statistics</text><text x="182" y="85" class="muted">Call Tree</text>
  <rect x="252" y="70" width="64" height="20" rx="4" fill="#fff" stroke="#d1d5db"/><text x="262" y="84" font-size="12" fill="#374151">More ▾</text>
  <text x="334" y="85" font-weight="600" fill="#111827">Logs</text><rect x="326" y="97" width="46" height="2" fill="#111827"/>
  <text x="400" y="85" font-size="10" class="muted">More ▾ sections: Overview · Transcript · Cost &amp; context · Effects</text>

  <!-- Startup context line (current) -->
  <rect x="21" y="101" width="858" height="32" fill="#f5f3ff"/>
  <text x="40" y="122" font-weight="600" fill="#111827">Startup context</text><text x="150" y="122" class="muted" font-size="12">· 41,207 tokens</text>
  <text x="250" y="122" fill="#4f46e5" font-size="12">View anatomy →</text>

  <!-- NEW: Signals filter toolbar, state in the URL -->
  <rect x="21" y="134" width="858" height="44" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="36" y="152" font-size="12" class="muted">Signals:</text>
  <rect x="94" y="140" width="62" height="20" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/><text x="106" y="154" font-size="11" fill="#075985">Show ✓</text>
  <rect x="164" y="140" width="150" height="20" rx="10" fill="#fff" stroke="#d1d5db"/><text x="174" y="154" font-size="11" fill="#374151">Only turns with issues</text>
  <text x="330" y="154" font-size="11" class="muted">2 interjections · 1 hook error · 1 compaction · 1 edited outside</text>
  <text x="36" y="172" font-size="10" class="mono muted">URL: …&amp;tab=logs&amp;signals=issues   (Show = no param; a shared link keeps the filter)</text>

  <!-- NEW: Signal sources strip -->
  <rect x="21" y="178" width="858" height="30" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="36" y="198" font-size="11" class="muted">Signal sources:</text>
  <rect x="124" y="187" width="70" height="16" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/><text x="132" y="199" font-size="10" fill="#065f46">hooks ✓ 2</text>
  <rect x="200" y="187" width="150" height="16" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/><text x="208" y="199" font-size="10" fill="#065f46">IDE ✓ (name not recorded)</text>
  <rect x="356" y="187" width="138" height="16" rx="8" fill="#fff" stroke="#d1d5db" stroke-dasharray="3 2"/><text x="364" y="199" font-size="10" class="muted">diagnostics — none seen</text>
  <rect x="500" y="187" width="118" height="16" rx="8" fill="#fff" stroke="#d1d5db"/><text x="508" y="199" font-size="10" fill="#374151">entrypoint: cli</text>
  <rect x="624" y="187" width="96" height="16" rx="8" fill="#fff" stroke="#d1d5db"/><text x="632" y="199" font-size="10" fill="#374151">CC 2.1.314</text>

  <!-- TURN 1 -->
  <g>
    <text x="40" y="234" fill="#3b82f6">✦</text>
    <text x="56" y="234" class="muted">2026-11-11 09:14:02</text>
    <rect x="196" y="221" width="240" height="18" rx="9" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="206" y="234" font-size="11" fill="#374151" class="mono">⏱ 0:00:52 · 14 msgs · hooks 3.9s</text>
    <text x="40" y="260" fill="#111827" font-size="15">›  why does main.c not build?</text>
    <text x="56" y="286" class="mono" font-size="13"><tspan fill="#2563eb">In 16</tspan>  <tspan fill="#dc2626">Out 2,661</tspan>  <tspan fill="#2563eb">cache_r 140,151</tspan>  <tspan fill="#2563eb">cache_w 38,915</tspan></text>
    <rect x="452" y="273" width="132" height="20" rx="5" fill="#ecfdf5" stroke="#34d399"/><text x="460" y="287" class="mono" font-size="12" fill="#047857">cache_ratio 78.2%</text>
    <text x="56" y="310" class="mono" font-size="13" fill="#d97706">Context: 41.2K → 47.0K (Δ +5.8K) <tspan fill="#111827">| 953.0K left</tspan></text>
    <!-- Tools -->
    <rect x="56" y="322" width="2" height="22" fill="#fcd34d"/>
    <text x="66" y="338" class="muted">›  ⚙</text><text x="96" y="338" font-weight="600">Tools</text><text x="140" y="338" class="mono muted" font-size="12">6 calls · ~1.3K tok</text>
    <!-- NEW Signals section, collapsed, with chips: after Tools, before Files -->
    <rect x="56" y="350" width="2" height="22" fill="#38bdf8"/>
    <text x="66" y="366" class="muted">›  ⚑</text><text x="96" y="366" font-weight="600">Signals</text>
    <rect x="160" y="354" width="138" height="18" rx="9" fill="#f3f4f6" stroke="#d1d5db"/><text x="168" y="367" font-size="11" fill="#374151">opened in IDE: main.c</text>
    <rect x="306" y="354" width="130" height="18" rx="9" fill="#fffbeb" stroke="#fcd34d"/><text x="314" y="367" font-size="11" fill="#92400e">1 edited outside</text>
    <line x1="21" y1="386" x2="879" y2="386" stroke="#e5e7eb"/>
  </g>

  <!-- TURN 2 with interjection markers -->
  <g>
    <text x="40" y="410" fill="#3b82f6">✦</text>
    <text x="56" y="410" class="muted">2026-11-11 09:15:01</text>
    <rect x="196" y="397" width="248" height="18" rx="9" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="206" y="410" font-size="11" fill="#374151" class="mono">⏱ 0:04:21 · 61 msgs · hooks 4.6s</text>
    <rect x="452" y="397" width="128" height="18" rx="9" fill="#fff7ed" stroke="#fb923c"/><text x="462" y="410" font-size="11" fill="#9a3412">⏸ silent 1× nudged</text>
    <text x="40" y="436" fill="#111827" font-size="15">›  add a build task for the open .c file</text>
    <text x="56" y="462" class="mono" font-size="13"><tspan fill="#2563eb">In 22</tspan>  <tspan fill="#dc2626">Out 10,983</tspan>  <tspan fill="#2563eb">cache_r 379,870</tspan>  <tspan fill="#2563eb">cache_w 20,403</tspan></text>
    <rect x="452" y="449" width="132" height="20" rx="5" fill="#ecfdf5" stroke="#34d399"/><text x="460" y="463" class="mono" font-size="12" fill="#047857">cache_ratio 94.9%</text>
    <text x="56" y="486" class="mono" font-size="13" fill="#d97706">Context: 47.3K → 69.2K (Δ +21.9K) <tspan fill="#111827">| 930.8K left</tspan></text>

    <!-- NEW: interjection (queued_command) markers inside the turn: time + offset only, no text -->
    <rect x="56" y="498" width="640" height="44" rx="6" fill="#fff7ed" stroke="#fdba74"/>
    <text x="68" y="515" font-size="12" font-weight="600" fill="#9a3412">↯ User interjected mid-turn · 09:16:50 (+1:49 into the turn)</text>
    <text x="68" y="533" font-size="12" font-weight="600" fill="#9a3412">↯ User interjected mid-turn · 09:17:53 (+2:52 into the turn)</text>
    <text x="520" y="515" font-size="11" fill="#9a3412">queued, not a new turn</text>
    <text x="520" y="533" font-size="11" class="muted">text: Raw logs ›</text>

    <rect x="56" y="552" width="2" height="22" fill="#38bdf8"/>
    <text x="66" y="568" class="muted">›  ⚑</text><text x="96" y="568" font-weight="600">Signals</text>
    <rect x="160" y="556" width="100" height="18" rx="9" fill="#fef2f2" stroke="#fca5a5"/><text x="168" y="569" font-size="11" fill="#b91c1c">1 hook error</text>
    <rect x="268" y="556" width="120" height="18" rx="9" fill="#f3f4f6" stroke="#d1d5db"/><text x="276" y="569" font-size="11" fill="#374151">selected in IDE</text>
    <line x1="21" y1="586" x2="879" y2="586" stroke="#e5e7eb"/>
  </g>

  <!-- CHANGED: compaction divider keeps ⟳ and the current amber band, adds re-read / re-inject, absorbs the summary -->
  <g>
    <rect x="21" y="587" width="858" height="50" fill="#fffbeb" stroke="#fde68a"/>
    <text x="40" y="606" font-size="13" fill="#f59e0b">⟳</text>
    <text x="58" y="606" font-size="12" font-weight="600" fill="#b45309">Context compacted (auto) · 09:31:12</text>
    <text x="300" y="606" font-size="11" fill="#78350f" class="mono">168.4K → 29.1K tok (−83%) · 46.9s · 3 files re-read · ~22K re-injected</text>
    <text x="58" y="626" font-size="11" class="muted">Compaction summary · 10.9K chars · CC wrote it as a user line; shown here, not as a turn</text>
    <text x="640" y="626" font-size="11" fill="#4f46e5">view summary ›</text>
  </g>

  <!-- TURN 3: diagnostics only appear in sessions that have a diagnostics producer -->
  <g>
    <text x="40" y="662" fill="#3b82f6">✦</text>
    <text x="56" y="662" class="muted">2026-11-11 09:31:40</text>
    <rect x="196" y="649" width="256" height="18" rx="9" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="206" y="662" font-size="11" fill="#374151" class="mono">⏱ 0:11:30 · 212 msgs · hooks 6.1s</text>
    <rect x="460" y="649" width="96" height="18" rx="9" fill="#f5f3ff" stroke="#c4b5fd"/><text x="470" y="662" font-size="11" fill="#5b21b6">⏲ scheduled</text>
    <text x="40" y="688" fill="#111827" font-size="15">›  now split the parser into its own file</text>
    <text x="56" y="714" class="mono" font-size="13"><tspan fill="#2563eb">In 104</tspan>  <tspan fill="#dc2626">Out 55,107</tspan>  <tspan fill="#2563eb">cache_r 3,291,164</tspan>  <tspan fill="#2563eb">cache_w 142,349</tspan></text>
    <rect x="532" y="701" width="132" height="20" rx="5" fill="#ecfdf5" stroke="#34d399"/><text x="540" y="715" class="mono" font-size="12" fill="#047857">cache_ratio 95.8%</text>
    <rect x="56" y="730" width="2" height="22" fill="#84cc16"/>
    <text x="66" y="746" class="muted">›  §</text><text x="96" y="746" font-weight="600">Rules</text><text x="142" y="746" class="mono muted" font-size="12">1 file · ~1.1K tok</text>
    <rect x="56" y="758" width="2" height="22" fill="#fcd34d"/>
    <text x="66" y="774" class="muted">›  ⚙</text><text x="96" y="774" font-weight="600">Tools</text><text x="140" y="774" class="mono muted" font-size="12">24 calls · ~16.2K tok</text>
    <rect x="56" y="786" width="2" height="22" fill="#38bdf8"/>
    <text x="66" y="802" class="muted">›  ⚑</text><text x="96" y="802" font-weight="600">Signals</text>
    <rect x="160" y="790" width="120" height="18" rx="9" fill="#f3f4f6" stroke="#d1d5db"/><text x="168" y="803" font-size="11" fill="#374151">1 read truncated</text>
    <text x="66" y="830" class="muted" font-size="12">›  ▤ Code 7 files · 36.4 KB · ~12.0K tok</text>
    <text x="66" y="852" class="muted" font-size="11">(no diagnostics chip: this session has no diagnostics producer — see Signal sources)</text>
    <line x1="21" y1="868" x2="879" y2="868" stroke="#e5e7eb"/>
  </g>

  <!-- Interrupted turn: harness text is a marker, not a prompt -->
  <g>
    <rect x="21" y="869" width="858" height="28" fill="#f9fafb"/>
    <text x="40" y="888" font-size="12" fill="#6b7280">⏹ Interrupted by the user · 09:43:10 (+11:30 into the turn above)</text>
    <line x1="21" y1="897" x2="879" y2="897" stroke="#e5e7eb"/>
  </g>

  <!-- Last turn: pending harness data -->
  <g>
    <text x="40" y="922" fill="#3b82f6">✦</text>
    <text x="56" y="922" class="muted">2026-11-11 09:44:02</text>
    <rect x="196" y="909" width="226" height="18" rx="9" fill="#fff" stroke="#d1d5db" stroke-dasharray="3 2"/>
    <text x="206" y="922" font-size="11" class="muted">⏱ turn timing: not recorded yet</text>
    <text x="40" y="948" fill="#111827" font-size="15">›  run it</text>
    <text x="56" y="972" class="muted" font-size="11">Last turn not uploaded yet, or hook &lt; 2.8.0 without a later upload: "not recorded yet", never zero.</text>
    <text x="56" y="990" class="muted" font-size="11">claude -p (no turn_duration at all): "⏱ ≈ 0:00:46" = prompt → last assistant line.</text>
  </g>

  <!-- Callouts / legend -->
  <g font-size="12">
    <rect x="900" y="60" width="280" height="1010" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="914" y="84" font-weight="700" fill="#0f172a">New / changed elements</text>

    <text x="914" y="112" class="new">1 · Signals filter bar</text>
    <text x="914" y="128" class="lg">"Only turns with issues" hides clean</text>
    <text x="914" y="143" class="lg">turns. State = URL param signals=issues</text>
    <text x="914" y="158" class="lg">(DD 11). Counts for the whole session.</text>
    <path class="callout" d="M879 156 H900"/>

    <text x="914" y="188" class="new">2 · Signal sources strip</text>
    <text x="914" y="204" class="lg">Which producers this session has:</text>
    <text x="914" y="219" class="lg">hooks (count), IDE (ideName or "name</text>
    <text x="914" y="234" class="lg">not recorded"), diagnostics sources</text>
    <text x="914" y="249" class="lg">(raw source values or "none seen"),</text>
    <text x="914" y="264" class="lg">entrypoint, Claude Code version.</text>
    <path class="callout" d="M720 195 C 820 195, 860 240, 900 240"/>

    <text x="914" y="294" class="new">3 · Turn timing chip (merged)</text>
    <text x="914" y="310" class="lg">Replaces today's "⏱ work time" with</text>
    <text x="914" y="325" class="lg">one chip: turn_duration, messageCount,</text>
    <text x="914" y="340" class="lg">hooks = Σ durationMs. The tooltip keeps</text>
    <text x="914" y="355" class="lg">the hook's prompt_start/stop time.</text>
    <path class="callout" d="M436 230 C 700 230, 820 320, 900 320"/>

    <text x="914" y="385" class="new">4 · Signals section (per turn)</text>
    <text x="914" y="401" class="lg">After Tools, before Files. Chips:</text>
    <text x="914" y="416" class="lg">Hooks, IDE, Edited outside the agent,</text>
    <text x="914" y="431" class="lg">Diagnostics, Context (read truncated).</text>
    <text x="914" y="446" class="lg">Hidden if empty. Expanded:</text>
    <text x="914" y="461" class="lg">logs-turn-signals-section.svg</text>
    <path class="callout" d="M436 363 C 700 363, 820 430, 900 430"/>

    <text x="914" y="491" class="new">5 · Header chips</text>
    <text x="914" y="507" class="lg">silent-turn (A5), scheduled (A11);</text>
    <text x="914" y="522" class="lg">mode (A10) and model fallback (A12)</text>
    <text x="914" y="537" class="lg">use the same chip style.</text>
    <path class="callout" d="M580 406 C 760 406, 850 500, 900 505"/>

    <text x="914" y="567" class="new">6 · Mid-turn interjection</text>
    <text x="914" y="583" class="lg">queued_command with origin.kind human:</text>
    <text x="914" y="598" class="lg">time + offset into the turn only. The</text>
    <text x="914" y="613" class="lg">text is in the Raw logs modal (DD 8).</text>
    <path class="callout" d="M696 520 C 800 520, 850 590, 900 590"/>

    <text x="914" y="643" class="new">7 · Compaction divider</text>
    <text x="914" y="659" class="lg">Keeps ⟳ and the amber band (DD 9);</text>
    <text x="914" y="674" class="lg">adds re-read files, ~re-injected size.</text>
    <text x="914" y="689" class="lg">The CC compaction summary is folded in</text>
    <text x="914" y="704" class="lg">here instead of a 10K-char "prompt";</text>
    <text x="914" y="719" class="lg">divider sits before the next real turn.</text>
    <path class="callout" d="M860 612 C 880 612, 885 680, 900 680"/>

    <text x="914" y="749" class="new">8 · Interrupt marker</text>
    <text x="914" y="765" class="lg">"[Request interrupted by user]" renders</text>
    <text x="914" y="780" class="lg">as a marker, not as a turn.</text>
    <path class="callout" d="M560 883 C 760 883, 850 770, 900 770"/>

    <text x="914" y="810" class="new">9 · Graceful degradation</text>
    <text x="914" y="826" class="lg">Producer absent → its chips never</text>
    <text x="914" y="841" class="lg">appear, and the sources strip says so</text>
    <text x="914" y="856" class="lg">("none seen" ≠ "no problems").</text>
    <text x="914" y="871" class="lg">Unknown types render nothing. No hook</text>
    <text x="914" y="886" class="lg">change: all from the /logs payload.</text>
    <path class="callout" d="M422 918 C 700 918, 820 870, 900 870"/>

    <text x="914" y="922" font-weight="700" fill="#0f172a">Privacy / OS neutrality</text>
    <text x="914" y="940" class="lg">Paths repo-relative from file:// URIs,</text>
    <text x="914" y="955" class="lg">X:\ (any drive-letter case) or / paths;</text>
    <text x="914" y="970" class="lg">out-of-repo → basename. No email, no</text>
    <text x="914" y="985" class="lg">gitStatus, no snippets, no stderr and</text>
    <text x="914" y="1000" class="lg">no queued text inline — only in ›.</text>
    <text x="914" y="1015" class="lg">The compaction summary's transcript</text>
    <text x="914" y="1030" class="lg">path is hidden in the divider view.</text>
  </g>
</svg>
