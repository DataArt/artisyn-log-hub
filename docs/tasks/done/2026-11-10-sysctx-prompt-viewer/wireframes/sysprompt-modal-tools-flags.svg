<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1150" viewBox="0 0 1120 1150" font-family="Segoe UI, Inter, Arial, sans-serif">
  <style>
    .t{fill:#0f172a;font-size:13px}
    .b{fill:#0f172a;font-size:13px;font-weight:600}
    .m{fill:#64748b;font-size:12px}
    .s{fill:#64748b;font-size:11px}
    .sz{fill:#64748b;font-size:12px;text-anchor:end}
    .sec{fill:#0f172a;font-size:14px;font-weight:600}
    .mono{font-family:Consolas, 'JetBrains Mono', monospace;fill:#334155;font-size:12px}
    .k{font-family:Consolas, 'JetBrains Mono', monospace;fill:#7c3aed;font-size:12px}
    .v{font-family:Consolas, 'JetBrains Mono', monospace;fill:#047857;font-size:12px}
    .btn{fill:#0f172a;font-size:12px}
    .note{fill:#b45309;font-size:12px}
    .line{stroke:#e2e8f0;stroke-width:1}
    .tab{fill:#64748b;font-size:13px}
    .tabOn{fill:#4f46e5;font-size:13px;font-weight:600}
  </style>
  <rect width="1120" height="1150" fill="#ffffff"/>
  <rect width="1120" height="1150" fill="#0f172a" opacity="0.35"/>
  <text x="20" y="22" fill="#ffffff" font-size="11" font-weight="600">WIREFRAME · System prompt modal — "Tool definitions" tab, plus the "Flags" tab inset (FR-3, FR-4, FR-5, FR-6, FR-9)</text>

  <rect x="80" y="40" width="960" height="760" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="1000" y="56" width="24" height="24" rx="5" fill="#fff" stroke="#cbd5e1"/>
  <text x="1007" y="73" fill="#0f172a" font-size="14">✕</text>

  <!-- header (sticky) -->
  <text x="104" y="80" fill="#0f172a" font-size="18" font-weight="600">System prompt</text>
  <text x="104" y="101" class="m">Captured by Claude Code (prompt_snapshot). Internal, undocumented format — may change in any release.</text>
  <text x="104" y="127" class="t">13 parts · 18 tools · 156,812 B · ≈ 42,382 tokens</text>
  <rect x="756" y="110" width="138" height="28" rx="5" fill="#fff" stroke="#cbd5e1"/>
  <text x="770" y="129" class="btn">⧉ Copy as Markdown</text>
  <rect x="900" y="110" width="116" height="28" rx="5" fill="#fff" stroke="#cbd5e1"/>
  <text x="914" y="129" class="btn">⤓ Download .md</text>

  <!-- tabs -->
  <text x="104" y="170" class="tab">System prompt</text>
  <text x="228" y="170" class="tabOn">Tool definitions</text>
  <rect x="224" y="178" width="114" height="2" fill="#4f46e5"/>
  <text x="362" y="170" class="tab">Flags</text>
  <line x1="80" y1="180" x2="1040" y2="180" class="line"/>

  <!-- tab toolbar: summary + accordion controls -->
  <text x="104" y="210" class="t">18 tools · 148 KB · ≈ 40 K tokens <tspan class="m">— counted in Harness internals on the anatomy tab</tspan></text>
  <text x="104" y="228" class="s">From the first snapshot with non-empty tools · none → "No tool definitions in this session"</text>
  <rect x="826" y="194" width="84" height="26" rx="5" fill="#fff" stroke="#cbd5e1"/>
  <text x="838" y="211" class="btn">Expand all</text>
  <rect x="916" y="194" width="92" height="26" rx="5" fill="#fff" stroke="#cbd5e1"/>
  <text x="928" y="211" class="btn">Collapse all</text>

  <rect x="104" y="242" width="912" height="34" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="118" y="264" class="m">›</text><text x="134" y="264" class="b">Agent</text>
  <text x="1004" y="264" class="sz">9.8 KB · 7 %</text>

  <rect x="104" y="280" width="912" height="34" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="118" y="302" class="m">›</text><text x="134" y="302" class="b">Artifact</text>
  <text x="1004" y="302" class="sz">37 KB · 25 %</text>

  <!-- expanded tool -->
  <rect x="104" y="318" width="912" height="402" rx="6" fill="#fff" stroke="#4f46e5"/>
  <rect x="104" y="318" width="912" height="34" rx="6" fill="#eef2ff"/>
  <text x="118" y="340" fill="#4f46e5" font-size="12">⌄</text><text x="134" y="340" class="b">Bash</text>
  <text x="1004" y="340" class="sz">6.4 KB · 4 %</text>
  <line x1="104" y1="352" x2="1016" y2="352" class="line"/>

  <text x="128" y="374" class="s" font-weight="600">DESCRIPTION</text>
  <text x="128" y="396" class="t">Executes a given bash command and returns its output.</text>
  <circle cx="140" cy="414" r="2.5" fill="#0f172a"/>
  <text x="150" y="418" class="t">Prefer absolute paths; the working directory is</text>
  <rect x="440" y="405" width="20" height="18" rx="3" fill="#f1f5f9"/><text x="446" y="418" class="mono">.</text>
  <circle cx="140" cy="436" r="2.5" fill="#0f172a"/>
  <text x="150" y="440" class="t">Output wrapped in</text>
  <rect x="268" y="427" width="140" height="18" rx="3" fill="#f1f5f9"/><text x="274" y="440" class="mono">&lt;system-reminder&gt;</text>
  <text x="414" y="440" class="t">is shown as literal text</text>
  <!-- GFM table -->
  <rect x="128" y="454" width="420" height="72" fill="#fff" stroke="#e2e8f0"/>
  <rect x="128" y="454" width="420" height="24" fill="#f8fafc"/>
  <line x1="300" y1="454" x2="300" y2="526" class="line"/>
  <line x1="128" y1="478" x2="548" y2="478" class="line"/>
  <line x1="128" y1="502" x2="548" y2="502" class="line"/>
  <text x="138" y="471" class="b" font-size="12">Instead of</text><text x="310" y="471" class="b" font-size="12">Use</text>
  <text x="138" y="495" class="mono">cat / head</text><text x="310" y="495" class="t" font-size="12">Read</text>
  <text x="138" y="519" class="mono">grep / rg</text><text x="310" y="519" class="t" font-size="12">Grep</text>
  <!-- callout -->
  <path d="M554 490 L590 490" stroke="#b45309" stroke-dasharray="3 3"/>
  <text x="596" y="478" class="note">Description rendered as Markdown (GFM tables, lists, code);</text>
  <text x="596" y="494" class="note">raw HTML / tags like &lt;system-reminder&gt; are shown as text.</text>
  <text x="596" y="510" class="note">Title: name · size · share of the tools total.</text>

  <text x="128" y="550" class="s" font-weight="600">INPUT SCHEMA</text>
  <rect x="128" y="558" width="864" height="148" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="140" y="578" class="mono">{</text>
  <text x="156" y="596" class="mono">"type": "object",</text>
  <text x="156" y="614" class="mono">"required": ["command"],</text>
  <text x="156" y="632" class="mono">"properties": {</text>
  <text x="172" y="650" class="mono">"command": { "type": "string", "description": "The command to execute" },</text>
  <text x="172" y="668" class="mono">"timeout": { "type": "number", "description": "Optional timeout in milliseconds" }</text>
  <text x="156" y="686" class="mono">}</text>
  <text x="140" y="702" class="mono">}</text>
  <text x="980" y="578" class="s" text-anchor="end">json</text>

  <rect x="104" y="728" width="912" height="34" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="118" y="750" class="m">›</text><text x="134" y="750" class="b">Edit</text>
  <text x="1004" y="750" class="sz">2.1 KB · 1 %</text>
  <text x="134" y="782" class="m">⋯ 14 more tools (collapsed) ⋯</text>

  <!-- ===== Flags tab inset ===== -->
  <text x="80" y="828" fill="#ffffff" font-size="11" font-weight="600">FLAGS TAB — same modal with "Flags" active (header unchanged, body only)</text>
  <rect x="80" y="840" width="820" height="290" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="104" y="868" class="tab">System prompt</text>
  <text x="228" y="868" class="tab">Tool definitions</text>
  <text x="362" y="868" class="tabOn">Flags</text>
  <rect x="358" y="876" width="40" height="2" fill="#4f46e5"/>
  <line x1="80" y1="878" x2="900" y2="878" class="line"/>

  <text x="104" y="908" class="m">6 keys · every top-level key except systemPrompt, tools, rendered</text>
  <rect x="706" y="892" width="84" height="26" rx="5" fill="#fff" stroke="#cbd5e1"/>
  <text x="718" y="909" class="btn">Expand all</text>
  <rect x="796" y="892" width="92" height="26" rx="5" fill="#fff" stroke="#cbd5e1"/>
  <text x="808" y="909" class="btn">Collapse all</text>

  <rect x="104" y="928" width="784" height="186" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="120" y="950" class="k">cliPrefix</text><text x="280" y="950" class="v">"You are Claude Code, Anthropic's official CLI for Claude."</text>
  <line x1="104" y1="960" x2="888" y2="960" class="line"/>
  <text x="120" y="980" class="k">reminderFold</text><text x="280" y="980" class="v">true</text>
  <line x1="104" y1="990" x2="888" y2="990" class="line"/>
  <text x="120" y="1010" class="k">systemTurns</text><text x="280" y="1010" class="v">1</text>
  <line x1="104" y1="1020" x2="888" y2="1020" class="line"/>
  <text x="120" y="1040" class="k">inlineTools</text><text x="280" y="1040" class="v">false</text>
  <line x1="104" y1="1050" x2="888" y2="1050" class="line"/>
  <text x="120" y="1070" class="k">contextRendering</text>
  <rect x="280" y="1058" width="300" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="290" y="1074" class="mono">{ "mode": "attachments",</text>
  <text x="298" y="1090" class="mono">"foldReminders": true }</text>
  <text x="600" y="1074" class="note">objects as formatted JSON;</text>
  <text x="600" y="1090" class="note">unknown keys shown as they come</text>
  <text x="120" y="1108" class="s">⋯ keptReminders and any other keys follow in snapshot order ⋯</text>
</svg>
