  <!-- bar with colour bands -->
  <text x="361" y="312" class="mono t" font-size="15" font-weight="700">$41.20 <tspan class="muted" font-weight="400">of $50.00</tspan> · 82 % <tspan class="muted" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">· resets on 1 Dec 2026</tspan></text>
  <rect x="361" y="324" width="1033" height="14" rx="7" fill="#f3f4f6"/>
  <rect x="361" y="324" width="847" height="14" rx="7" fill="#f59e0b"/>
