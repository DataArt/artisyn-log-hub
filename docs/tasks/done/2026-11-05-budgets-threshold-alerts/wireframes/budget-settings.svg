  <text x="1394" y="414" font-size="16" class="muted" text-anchor="end">×</text>
  <rect x="369" y="428" width="170" height="28" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="381" y="447" font-size="12" class="t">Budget: All budgets</text><text x="525" y="447" font-size="11" class="muted">▾</text>
  <rect x="549" y="428" width="150" height="28" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="561" y="447" font-size="12" class="t">Event: All events</text><text x="685" y="447" font-size="11" class="muted">▾</text>

  <text x="369" y="482" class="lbl">TIME</text>
  <text x="509" y="482" class="lbl">ACTOR</text>
  <text x="689" y="482" class="lbl">BUDGET</text>
  <text x="819" y="482" class="lbl">EVENT</text>
  <text x="969" y="482" class="lbl">DETAILS</text>
  <line x1="369" y1="492" x2="1394" y2="492" stroke="#e5e7eb"/>

  <g>
    <text x="369" y="516" class="smallm">2026-11-09 08:40</text>
    <text x="509" y="516" class="small muted">system · threshold job</text>
    <text x="689" y="516" class="small">Monthly $1,200</text>
