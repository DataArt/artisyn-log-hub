  <text x="860" y="140" class="note">NEW team tabs "Spend" and "Settings" (tab registry, team group),</text>
  <text x="860" y="154" class="note">Spend: every member (plain members see only their own over-budget spend); Settings: team-wide access rule. Settings holds Budgets only.</text>

  <!-- ============ BUDGETS (team scope) ============ -->
  <text x="349" y="200" class="h">Budgets</text>
  <text x="349" y="220" font-size="12" class="muted">Team <tspan class="t">LogHubLocal</tspan> — spend of all the team's repositories · reference amounts only — Log Hub does not stop or limit usage.</text>
  <rect x="1053" y="186" width="130" height="30" rx="6" fill="#111827"/>
  <text x="1072" y="206" font-size="13" font-weight="600" fill="#ffffff">Budget event log</text>
