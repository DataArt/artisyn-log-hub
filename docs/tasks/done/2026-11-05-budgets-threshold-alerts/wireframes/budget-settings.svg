    <text x="969" y="660" class="small">Month · <tspan class="smallm">$1,000.00</tspan> · thresholds <tspan class="smallm">75 · 100 %</tspan> · Europe/Berlin</text>
    <line x1="369" y1="672" x2="1394" y2="672" stroke="#f3f4f6"/>

    <text x="369" y="696" class="smallm">2026-10-31 15:22</text>
    <text x="509" y="696" class="small">dt@dataart.com</text>
    <text x="689" y="696" class="small muted">Weekly $250 (deleted)</text>
    <rect x="819" y="683" width="68" height="18" rx="9" fill="#f3f4f6"/><text x="853" y="696" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">Deleted</text>
    <text x="969" y="696" class="small">Week · <tspan class="smallm">$250.00</tspan> · <tspan class="smallm">75 · 90 · 100 %</tspan> · its events are kept</text>
    <line x1="369" y1="708" x2="1394" y2="708" stroke="#f3f4f6"/>

    <text x="369" y="732" class="smallm">2026-10-30 18:00</text>
    <text x="509" y="732" class="small muted">system · threshold job</text>
    <text x="689" y="732" class="small muted">Weekly $250 (deleted)</text>
    <rect x="819" y="719" width="92" height="18" rx="9" fill="#fee2e2"/><text x="865" y="732" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Email failed</text>
    <text x="969" y="732" class="small">100 % notice · SMTP error: connection refused</text>
    <line x1="369" y1="744" x2="1394" y2="744" stroke="#e5e7eb"/>
  </g>
  <text x="881" y="774" font-size="12" class="link" text-anchor="middle">Load older events</text>
  <text x="369" y="808" class="note">FR-10: written when the event happens (edit transaction or threshold job) and kept after the budget is deleted.</text>
  <text x="369" y="824" class="note">Time in the viewer's browser time zone. Actor = user email, or "system · threshold job".</text>

  <!-- footnotes -->
  <text x="349" y="890" class="note">Event types: Created · Edited (old → new amount, period, thresholds, time zone) · Deleted · Threshold crossed · Threshold superseded (by N %) · Email sent / failed (per recipient) / skipped (mail not configured).</text>
  <text x="349" y="906" class="note">Visible to whoever can see this scope's budgets (FR-7, FR-10); a user without access to the scope, or a plain member of a restricted team, cannot read the log (403).</text>
  <text x="349" y="922" class="note">Repository Settings › Budgets (personal and team repository) has the same "Budget event log" button and window, listing only that scope's events.</text>
  <text x="349" y="938" class="note">The bell already exists in the top bar ("Notifications"); budget notices join its tray with an unread count (threshold-banner.svg).</text>
</svg>
