  <text x="439" y="256" class="lbl">AMOUNT</text>
  <text x="539" y="256" class="lbl">NOTIFY AT</text>
  <text x="669" y="256" class="lbl">TIME ZONE</text>
  <text x="799" y="256" class="lbl">CURRENT PERIOD</text>
  <line x1="349" y1="266" x2="1303" y2="266" stroke="#e5e7eb"/>
  <text x="349" y="294" class="cell">Month</text>
