    <text x="969" y="552" class="small">75 % crossed · <tspan class="smallm">$901.20 of $1,200.00</tspan> · November 2026</text>
    <line x1="369" y1="564" x2="1394" y2="564" stroke="#f3f4f6"/>

    <text x="369" y="588" class="smallm">2026-11-08 17:12</text>
    <text x="509" y="588" class="small">dt@dataart.com</text>
    <text x="689" y="588" class="small">Monthly $1,200</text>
