  <text x="1350" y="29" font-size="14" font-weight="600" class="t">Edit email</text>

  <!-- sidebar (abridged) -->
  <rect x="0" y="49" width="320" height="1011" fill="#ffffff"/>
  <line x1="321" y1="49" x2="321" y2="1060" stroke="#e5e7eb" stroke-width="4"/>
  <text x="12" y="108" class="lbl">TEAMS</text>
  <rect x="0" y="154" width="320" height="30" fill="#f3f4f6"/>
  <text x="50" y="173" font-size="14" font-weight="700" class="t">LogHubLocal</text>
  <text x="32" y="203" font-size="12" class="muted">https://gitlab.dataart.com/da/cml/artisyn-log-hub</text>
