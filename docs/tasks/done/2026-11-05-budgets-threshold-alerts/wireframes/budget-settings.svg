    <text x="969" y="588" class="small">amount <tspan class="smallm">$1,000 → $1,200</tspan> · thresholds <tspan class="smallm">75 · 100 → 75 · 90 · 100 %</tspan></text>
    <line x1="369" y1="600" x2="1394" y2="600" stroke="#f3f4f6"/>

    <text x="369" y="624" class="smallm">2026-11-06 10:05</text>
    <text x="509" y="624" class="small muted">system · threshold job</text>
    <text x="689" y="624" class="small">Monthly $1,000</text>
    <rect x="819" y="611" width="88" height="18" rx="9" fill="#dcfce7"/><text x="863" y="624" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">Email sent</text>
    <text x="969" y="624" class="small">75 % notice → anna.k@dataart.com (one event per recipient)</text>
    <line x1="369" y1="636" x2="1394" y2="636" stroke="#f3f4f6"/>

    <text x="369" y="660" class="smallm">2026-11-01 09:30</text>
