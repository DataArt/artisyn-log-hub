  <text x="12" y="392" font-size="14" class="muted">https://github.com/DataArt/artisyn-log-hub</text>

  <!-- team page header + tabs (existing: Members, Repositories, Invitations, OTEL) -->
  <text x="349" y="94" font-size="20" font-weight="700" class="t">LogHubLocal</text>
  <text x="377" y="148" font-size="14" class="muted">Members</text>
  <text x="459" y="148" font-size="14" class="muted">Repositories</text>
