  <text x="669" y="294" class="smallm">Europe/Berlin</text>
  <rect x="799" y="285" width="140" height="10" rx="5" fill="#f3f4f6"/><rect x="799" y="285" width="64" height="10" rx="5" fill="#22c55e"/>
  <text x="951" y="294" class="smallm">$548.10 · 46 %</text>
  <text x="1219" y="294" font-size="13" class="link">Edit</text>
  <text x="1255" y="294" font-size="13" fill="#dc2626">Delete</text>
  <text x="799" y="312" font-size="11" class="muted">November 2026 · resets on 1 Dec · <tspan class="link">Open spend →</tspan></text>
  <line x1="349" y1="324" x2="1303" y2="324" stroke="#e5e7eb"/>
  <text x="349" y="348" class="note">Same table and inline form as repository Settings › Budgets (budget-form.svg); scope text reads "Team". Add / Edit / Delete only for the team owner and managers;</text>
  <text x="349" y="362" class="note">others with team analytics access see it read-only (FR-7). Team budgets are only here — the repository Settings of a team repository hold that repository's own budgets.</text>

  <!-- ============ BUDGET EVENT LOG (opened by the button above) ============ -->
