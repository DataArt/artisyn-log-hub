  <text x="717" y="530" class="cellm">$151.00</text>
  <text x="807" y="530" class="cellm">50 %</text>
  <text x="887" y="530" class="cellm" fill="#b45309">$453.00 ⚠</text>
  <text x="987" y="530" class="cell">—</text>
  <text x="1147" y="530" class="cell">5 Nov</text>
  <text x="597" y="556" class="cell">Oct 2026</text>
  <text x="717" y="556" class="cellm">$238.00</text>
  <text x="807" y="556" class="cellm">79 %</text>
  <text x="887" y="556" class="cell muted">—</text>
  <text x="987" y="556" class="cellm">75 % (24 Oct)</text>
