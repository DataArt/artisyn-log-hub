  <text x="597" y="434" font-size="11" class="muted">Reference amounts only — Log Hub does not stop usage. Spend = larger of hook-upload and OTEL cost per session tree.</text>
  <line x1="597" y1="446" x2="1231" y2="446" stroke="#e5e7eb"/>

