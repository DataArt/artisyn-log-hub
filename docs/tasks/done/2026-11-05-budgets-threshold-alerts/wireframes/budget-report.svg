<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" font-family="Inter, Segoe UI, Arial, sans-serif">
  <style>
    .t { fill: #111827; }
    .muted { fill: #6b7280; }
