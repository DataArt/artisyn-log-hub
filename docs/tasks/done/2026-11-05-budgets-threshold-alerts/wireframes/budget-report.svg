  <text x="1219" y="205" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Generate</text>
  <text x="711" y="196" class="note">No Group by, no branch / user / attribute filters, no budget picker —</text>
  <text x="711" y="210" class="note">every budget of the scope is listed, so spend always equals FR-2.</text>

  <text x="565" y="268" font-size="14" font-style="italic" class="muted">On-page preview — the PDF export contains the same data in print layout</text>
  <rect x="1107" y="247" width="157" height="34" rx="6" fill="#ffffff" stroke="#2d4fd6"/>
  <text x="1185" y="269" font-size="14" font-weight="600" fill="#2d4fd6" text-anchor="middle">⤓ Download as PDF</text>

