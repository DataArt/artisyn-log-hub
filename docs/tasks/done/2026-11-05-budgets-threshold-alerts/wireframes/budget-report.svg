  <text x="597" y="772" class="cell"><tspan font-weight="700">9–15 Nov (current)</tspan> · <tspan class="mono">$32.80</tspan> · 41 % · day 2 of 7 · forecast <tspan class="mono" fill="#b45309">$114.80 ⚠</tspan> (144 %)</text>
  <text x="597" y="792" class="cell muted">2–8 Nov · <tspan class="mono">$61.20</tspan> · 77 % · 75 % crossed  ·  26 Oct–1 Nov · <tspan class="mono">$44.10</tspan> · 55 %  ·  … 7 more weeks</text>
  <line x1="597" y1="810" x2="1231" y2="810" stroke="#e5e7eb"/>

  <!-- no-budget variant -->
  <rect x="597" y="826" width="634" height="56" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-dasharray="4,3"/>
  <text x="611" y="848" font-size="12" font-weight="700" class="t">Variant — no budget on this scope</text>
  <text x="611" y="868" font-size="12" class="muted">"No budget is set for this scope." followed by spend per calendar month in the range (and its top slices).</text>

  <text x="597" y="914" class="note">FR-11: same server service as the Spend view, so spend / % / forecast match it.</text>
  <text x="597" y="930" class="note">Forecast and risk flag only for the current period; past periods show spend, % and crossed thresholds.</text>
  <text x="597" y="946" class="note">Repository-only: team budgets are on the team Spend tab (team Reports is task 2026-11-10-team-analytics-reports).</text>
