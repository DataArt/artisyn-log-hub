    .note { fill: #92400e; font-size: 11px; }
    .lbl { font-size: 11px; fill: #6b7280; letter-spacing: 0.5px; }
    .cell { font-size: 12px; fill: #111827; }
    .cellm { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #111827; }
    .nav { font-size: 14px; fill: #4b5563; }
