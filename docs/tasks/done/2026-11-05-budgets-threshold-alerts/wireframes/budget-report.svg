  <text x="597" y="582" class="cell">Sep 2026</text>
  <text x="717" y="582" class="cellm">$322.40</text>
  <text x="807" y="582" class="cellm" fill="#dc2626">107 %</text>
  <text x="887" y="582" class="cell muted">—</text>
  <text x="987" y="582" class="cellm">75 · 90 · 100 %</text>
  <text x="1147" y="582" class="cell">12, 19 Sep</text>
