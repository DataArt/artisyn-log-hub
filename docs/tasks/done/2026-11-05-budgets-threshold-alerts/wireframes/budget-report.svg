  <text x="717" y="500" class="lbl">SPEND</text>
  <text x="807" y="500" class="lbl">% USED</text>
  <text x="887" y="500" class="lbl">FORECAST</text>
  <text x="987" y="500" class="lbl">THRESHOLDS CROSSED</text>
  <text x="1147" y="500" class="lbl">ANOMALY DAYS</text>
