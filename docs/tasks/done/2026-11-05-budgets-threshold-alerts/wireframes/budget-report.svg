  <text x="1186" y="30" font-size="14" class="muted">🔔</text>
  <text x="1226" y="29" font-size="14" class="muted">dt@dataart.com</text>
  <text x="1350" y="29" font-size="14" font-weight="600" class="t">Edit email</text>

