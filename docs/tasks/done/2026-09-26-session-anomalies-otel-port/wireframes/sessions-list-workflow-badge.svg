<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, Segoe UI, Arial, sans-serif">
  <style>
    .t { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    .row-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #111827; }
    .row-prompt { font-size: 13px; fill: #6b7280; }
    .c-green { fill: #059669; }
    .c-red { fill: #991b1b; }
    .pill { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; }
    .ann-bad { font-size: 11px; fill: #dc2626; }
    .ann-ok { font-size: 11px; fill: #047857; }
    .ann-n { font-size: 11px; fill: #6b7280; }
    .note { fill: #92400e; font-size: 12px; }
  </style>
  <rect width="1120" height="620" fill="#ffffff"/>

  <text x="24" y="32" font-size="18" font-weight="700" class="t">Sessions list: FR-1 Workflow badge fix</text>
  <text x="24" y="54" font-size="12" class="muted">Wireframe, light theme. Rows copy the current list item: time | cost (mono), prompt line, branch tag + badge tags. Sample values are illustrative.</text>

  <!-- ================= TODAY ================= -->
  <text x="24" y="90" font-size="13" font-weight="700" class="muted">Today (bug)</text>
  <rect x="24" y="100" width="300" height="346" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="36" y="124" font-size="11" class="muted">v</text>
  <text x="50" y="125" class="mono" font-size="14" font-weight="700" fill="#111827">main</text>
  <rect x="294" y="113" width="20" height="16" rx="8" fill="#f3f4f6"/>
  <text x="300" y="125" font-size="11" class="muted">3</text>
  <line x1="24" y1="140" x2="324" y2="140" stroke="#e5e7eb"/>

  <!-- Row A (list shows END time) -->
  <text x="36" y="164" class="row-title">2026-09-26 19:15:10 <tspan class="c-green">| $0.1889</tspan></text>
  <text x="36" y="185" class="row-prompt">сколько время?</text>
  <rect x="36" y="193" width="42" height="20" rx="4" fill="#e7f6ef"/>
  <text x="42" y="207" class="pill" fill="#047857">main</text>
  <rect x="84" y="193" width="92" height="20" rx="4" fill="#f5edfe" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="90" y="207" class="pill" fill="#7e22ce">⚡ Workflow</text>
  <line x1="24" y1="226" x2="324" y2="226" stroke="#e5e7eb"/>
  <text x="334" y="200" class="ann-bad">&lt;row A&gt; false positive: Workflow</text>
  <text x="334" y="214" class="ann-bad">only listed in prompt_snapshot</text>

  <!-- Row B -->
  <text x="36" y="250" class="row-title">2026-09-26 18:02:44 <tspan class="c-green">| $0.0420</tspan></text>
  <text x="36" y="271" class="row-prompt">сколько время?</text>
  <rect x="36" y="279" width="42" height="20" rx="4" fill="#e7f6ef"/>
  <text x="42" y="293" class="pill" fill="#047857">main</text>
  <rect x="84" y="279" width="92" height="20" rx="4" fill="#f5edfe" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="90" y="293" class="pill" fill="#7e22ce">⚡ Workflow</text>
  <line x1="24" y1="312" x2="324" y2="312" stroke="#e5e7eb"/>
  <text x="334" y="293" class="ann-bad">&lt;row B&gt; false positive</text>

  <!-- Row D: real Workflow call -->
  <text x="36" y="336" class="row-title">2026-09-26 14:41:09 <tspan class="c-red">| $59.6377</tspan></text>
  <text x="36" y="357" class="row-prompt">/my-plugin:implement 2026-09-26-some-task…</text>
  <rect x="36" y="365" width="42" height="20" rx="4" fill="#e7f6ef"/>
  <text x="42" y="379" class="pill" fill="#047857">main</text>
  <rect x="84" y="365" width="92" height="20" rx="4" fill="#f5edfe"/>
  <text x="90" y="379" class="pill" fill="#7e22ce">⚡ Workflow</text>
  <line x1="24" y1="398" x2="324" y2="398" stroke="#e5e7eb"/>
  <text x="334" y="372" class="ann-ok">&lt;row D&gt; real tool_use(Workflow): correct</text>
  <text x="36" y="426" class="ann-n">… 16 of 19 transcript sessions badged wrongly</text>

  <!-- ================= AFTER ================= -->
  <text x="572" y="90" font-size="13" font-weight="700" class="t">After fix</text>
  <rect x="572" y="100" width="300" height="346" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="584" y="124" font-size="11" class="muted">v</text>
  <text x="598" y="125" class="mono" font-size="14" font-weight="700" fill="#111827">main</text>
  <rect x="842" y="113" width="20" height="16" rx="8" fill="#f3f4f6"/>
  <text x="848" y="125" font-size="11" class="muted">3</text>
  <line x1="572" y1="140" x2="872" y2="140" stroke="#e5e7eb"/>

  <!-- Row A' -->
  <text x="584" y="164" class="row-title">2026-09-26 19:15:10 <tspan class="c-green">| $0.1889</tspan></text>
  <text x="584" y="185" class="row-prompt">сколько время?</text>
  <rect x="584" y="193" width="42" height="20" rx="4" fill="#e7f6ef"/>
  <text x="590" y="207" class="pill" fill="#047857">main</text>
  <line x1="572" y1="226" x2="872" y2="226" stroke="#e5e7eb"/>
  <text x="882" y="200" class="ann-ok">FR-1: no Workflow badge</text>
  <text x="882" y="214" class="ann-n">row time is END, so FR-5 doesn't change it</text>

  <!-- Row B' -->
  <text x="584" y="250" class="row-title">2026-09-26 18:02:44 <tspan class="c-green">| $0.0420</tspan></text>
  <text x="584" y="271" class="row-prompt">сколько время?</text>
  <rect x="584" y="279" width="42" height="20" rx="4" fill="#e7f6ef"/>
  <text x="590" y="293" class="pill" fill="#047857">main</text>
  <line x1="572" y1="312" x2="872" y2="312" stroke="#e5e7eb"/>
  <text x="882" y="293" class="ann-ok">FR-1: no Workflow badge</text>

  <!-- Row D' unchanged -->
  <text x="584" y="336" class="row-title">2026-09-26 14:41:09 <tspan class="c-red">| $59.6377</tspan></text>
  <text x="584" y="357" class="row-prompt">/my-plugin:implement 2026-09-26-some-task…</text>
  <rect x="584" y="365" width="42" height="20" rx="4" fill="#e7f6ef"/>
  <text x="590" y="379" class="pill" fill="#047857">main</text>
  <rect x="632" y="365" width="92" height="20" rx="4" fill="#f5edfe"/>
  <text x="638" y="379" class="pill" fill="#7e22ce">⚡ Workflow</text>
  <line x1="572" y1="398" x2="872" y2="398" stroke="#e5e7eb"/>
  <text x="882" y="372" class="ann-ok">rows D, E, F keep the badge</text>
  <text x="584" y="426" class="ann-n">badge shown only for real tool_use(Workflow)</text>

  <!-- Notes -->
  <rect x="24" y="470" width="1072" height="130" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="40" y="494" font-size="13" font-weight="700" fill="#92400e">Notes</text>
  <text x="40" y="516" class="note">- FR-1: the "⚡ Workflow" tag keeps its current look (purple mono tag after the branch tag). Only which sessions get it changes: a real assistant</text>
  <text x="52" y="534" class="note">tool_use block named Workflow. A Workflow entry in a prompt_snapshot tool catalogue or any other attachment never sets it.</text>
  <text x="40" y="556" class="note">- The list row shows the session END time (formatLocalTimestamp(session.endTime)), so FR-5's start-time change is not visible here;</text>
  <text x="52" y="574" class="note">it shows in the session detail header (see the FR-5 wireframe).</text>
  <text x="40" y="592" class="note">- Rows, times and costs are illustrative; the colour of the cost follows the existing thresholds (green / blue / orange / red).</text>
</svg>
