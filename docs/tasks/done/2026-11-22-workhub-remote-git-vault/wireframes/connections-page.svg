<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Segoe UI, -apple-system, Roboto, sans-serif">
  <style>
    .t { fill:#0a0a0b; font-size:14px; }
    .m { fill:#71717a; font-size:13px; }
    .s { fill:#71717a; font-size:12px; }
    .b { font-weight:600; }
    .h1 { fill:#0a0a0b; font-size:18px; font-weight:600; }
    .note { fill:#1e40af; font-size:12px; font-style:italic; }
  </style>
  <rect width="1280" height="760" fill="#ffffff"/>

  <!-- Top bar (as today) -->
  <rect x="0" y="0" width="1280" height="47" fill="#ffffff"/>
  <line x1="0" y1="47.5" x2="1280" y2="47.5" stroke="#e4e4e7"/>
  <text x="16" y="29" class="t b">Artisyn AI Work Hub</text>
  <text x="158" y="29" class="m">›</text>
  <text x="175" y="29" class="m">Connections</text>
  <rect x="1126" y="10" width="138" height="28" rx="6" fill="#fff" stroke="#e4e4e7"/>
  <text x="1135" y="29" class="m">dt@dataart.com  ⌄</text>

  <!-- User menu (new item) -->
  <rect x="1040" y="44" width="224" height="140" rx="8" fill="#fff" stroke="#e4e4e7"/>
  <text x="1053" y="68" class="s" style="font-size:10px;letter-spacing:1px">SIGNED IN AS</text>
  <text x="1053" y="89" class="t">dt@dataart.com</text>
  <line x1="1041" y1="104" x2="1263" y2="104" stroke="#e4e4e7"/>
  <rect x="1045" y="110" width="214" height="30" rx="4" fill="#eff6ff"/>
  <text x="1055" y="130" class="t">🔑  Connections</text>
  <text x="1055" y="166" class="t">✉  Edit email</text>
  <text x="1040" y="202" class="note">New user-menu item: connections</text>
  <text x="1040" y="218" class="note">are per user, not per workspace</text>

  <!-- Page header -->
  <text x="152" y="96" class="h1">Connections</text>
  <text x="152" y="120" class="m">Git hosts Work Hub reaches for you. Secrets stay in Work Hub's vault and never enter a container.</text>
  <rect x="868" y="72" width="152" height="36" rx="6" fill="#3352cc"/>
  <text x="886" y="95" fill="#fff" font-size="14" font-weight="600">＋ Add connection</text>

  <!-- Table header -->
  <rect x="152" y="144" width="868" height="36" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="168" y="167" class="s b">NAME / PROVIDER</text>
  <text x="420" y="167" class="s b">AUTH</text>
  <text x="600" y="167" class="s b">STATUS</text>
  <text x="760" y="167" class="s b">GRANTED TO</text>
  <text x="878" y="167" class="s b">ACTIONS</text>

  <!-- Row 1: GitHub SSH key -->
  <rect x="152" y="180" width="868" height="64" fill="#fff" stroke="#e4e4e7"/>
  <rect x="168" y="196" width="28" height="28" rx="6" fill="#0a0a0b"/><text x="175" y="215" fill="#fff" font-size="12" font-weight="700">GH</text>
  <text x="206" y="207" class="t b">github-dataart</text>
  <text x="206" y="226" class="s">GitHub · github.com</text>
  <text x="420" y="207" class="t">SSH key · uploaded</text>
  <text x="420" y="226" class="s">ED25519 SHA256:k3Fq…</text>
  <rect x="600" y="198" width="86" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0"/><text x="612" y="214" fill="#166534" font-size="12">● Connected</text>
  <text x="760" y="216" class="t">2 workspaces</text>
  <text x="878" y="216" fill="#3352cc" font-size="13">Test   Edit   Delete…</text>

  <!-- Row 2: GitLab self-managed, generated key rejected by host -->
  <rect x="152" y="244" width="868" height="64" fill="#fff" stroke="#e4e4e7"/>
  <rect x="168" y="260" width="28" height="28" rx="6" fill="#e24329"/><text x="175" y="279" fill="#fff" font-size="12" font-weight="700">GL</text>
  <text x="206" y="271" class="t b">gitlab-corp</text>
  <text x="206" y="290" class="s">GitLab · https://gitlab.corp.example</text>
  <text x="420" y="271" class="t">SSH key · generated</text>
  <text x="420" y="290" class="s">public key removed on GitLab?</text>
  <rect x="600" y="262" width="138" height="22" rx="11" fill="#fffbeb" stroke="#fde68a"/><text x="611" y="278" fill="#92400e" font-size="12">▲ Rejected by host</text>
  <text x="760" y="280" class="t">1 workspace</text>
  <rect x="878" y="264" width="126" height="28" rx="6" fill="#3352cc"/><text x="891" y="283" fill="#fff" font-size="13" font-weight="600">Update key…</text>

  <!-- Row 3: Azure DevOps PAT, exposed to agent -->
  <rect x="152" y="308" width="868" height="64" fill="#fff" stroke="#e4e4e7"/>
  <rect x="168" y="324" width="28" height="28" rx="6" fill="#0078d4"/><text x="174" y="343" fill="#fff" font-size="12" font-weight="700">AZ</text>
  <text x="206" y="335" class="t b">ado-client</text>
  <text x="206" y="354" class="s">Azure DevOps · dev.azure.com/acme</text>
  <text x="420" y="335" class="t">PAT · secret set ••••a1b2</text>
  <text x="420" y="354" class="s">updated 2026-11-20</text>
  <rect x="600" y="326" width="86" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0"/><text x="612" y="342" fill="#166534" font-size="12">● Connected</text>
  <rect x="600" y="350" width="140" height="18" rx="9" fill="#fef2f2" stroke="#fecaca"/><text x="608" y="363" fill="#991b1b" font-size="11">👁 Visible to the agent</text>
  <text x="760" y="344" class="m">none · Grant…</text>
  <text x="878" y="344" fill="#3352cc" font-size="13">Test   Edit   Delete…</text>

  <!-- Row 4: generic https -->
  <rect x="152" y="372" width="868" height="64" fill="#fff" stroke="#e4e4e7"/>
  <rect x="168" y="388" width="28" height="28" rx="6" fill="#71717a"/><text x="173" y="407" fill="#fff" font-size="12" font-weight="700">git</text>
  <text x="206" y="399" class="t b">gitea-home</text>
  <text x="206" y="418" class="s">Other git server · https://git.home.lan</text>
  <text x="420" y="399" class="t">PAT · secret set ••••9f0c</text>
  <text x="420" y="418" class="s">updated 2026-11-22</text>
  <rect x="600" y="390" width="96" height="22" rx="11" fill="#fef2f2" stroke="#fecaca"/><text x="611" y="406" fill="#991b1b" font-size="12">✕ Test failed</text>
  <text x="600" y="428" fill="#991b1b" font-size="11">401: credential rejected by host</text>
  <text x="760" y="408" class="m">none · Grant…</text>
  <text x="878" y="408" fill="#3352cc" font-size="13">Test   Edit   Delete…</text>

  <!-- Notes -->
  <rect x="152" y="460" width="868" height="128" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="168" y="484" fill="#1e40af" font-size="13" font-weight="600">Wireframe notes</text>
  <text x="168" y="506" class="note">• The secret is never shown again: SSH keys show only the fingerprint, PATs "secret set" + last 4 chars (FR-1).</text>
  <text x="168" y="526" class="note">• Status comes from the last "Test" / last proxy use; a revoked key or token shows "Rejected by host" (FR-1a).</text>
  <text x="168" y="546" class="note">• "Visible to the agent" appears only when "expose to agent" is on (FR-10, off by default).</text>
  <text x="168" y="566" class="note">• "Granted to" = workspaces allowed to use the connection; Grant… edits the list; Delete… lists them first (FR-1, FR-5).</text>

  <!-- Empty state inset -->
  <text x="152" y="624" class="m b">Empty state</text>
  <rect x="152" y="636" width="868" height="96" rx="8" fill="#fafafa" stroke="#e4e4e7" stroke-dasharray="4 3"/>
  <text x="586" y="676" class="t" text-anchor="middle">No connections yet. Work Hub works fully without them.</text>
  <text x="586" y="700" class="m" text-anchor="middle">Add one to clone a repository or push workstreams to GitHub, GitLab or another git server.</text>
</svg>
