<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="Segoe UI, -apple-system, Roboto, sans-serif">
  <style>
    .t { fill:#0a0a0b; font-size:14px; }
    .m { fill:#71717a; font-size:13px; }
    .s { fill:#71717a; font-size:12px; }
    .b { font-weight:600; }
    .h { fill:#0a0a0b; font-size:18px; font-weight:500; }
    .cap { fill:#3352cc; font-size:13px; font-weight:600; }
    .note { fill:#1e40af; font-size:12px; font-style:italic; }
  </style>
  <rect width="1100" height="600" fill="#ffffff"/>
  <text x="20" y="30" fill="#0a0a0b" font-size="16" font-weight="600">Close workstream dialog: optional push to the remote (FR-8)</text>

  <text x="20" y="66" class="cap">Close dialog (existing options + new push checkbox)</text>
  <rect x="20" y="78" width="520" height="490" rx="10" fill="#fff" stroke="#e4e4e7"/>
  <text x="44" y="114" class="h">Close workstream "fix-login"</text>
  <text x="514" y="112" class="m">✕</text>

  <rect x="44" y="134" width="472" height="66" rx="8" fill="#eff6ff" stroke="#3352cc" stroke-width="2"/>
  <circle cx="62" cy="154" r="6" fill="#fff" stroke="#3352cc" stroke-width="2"/><circle cx="62" cy="154" r="3" fill="#3352cc"/>
  <text x="76" y="159" class="t b">Bring into main</text>
  <text x="76" y="180" class="s">Add all of this work to main, files the agent has not saved included,</text>
  <text x="76" y="194" class="s">and close the workstream.</text>

  <rect x="44" y="208" width="472" height="52" rx="8" fill="#fff" stroke="#e4e4e7"/>
  <circle cx="62" cy="228" r="6" fill="#fff" stroke="#a1a1aa"/>
  <text x="76" y="233" class="t">Already merged elsewhere</text>
  <text x="76" y="251" class="s">This work already reached its destination.</text>

  <rect x="44" y="268" width="472" height="52" rx="8" fill="#fff" stroke="#e4e4e7"/>
  <circle cx="62" cy="288" r="6" fill="#fff" stroke="#a1a1aa"/>
  <text x="76" y="293" class="t">Close for now</text>
  <text x="76" y="311" class="s">Stop the workstream. You can reopen it from History.</text>

  <!-- new: push -->
  <rect x="44" y="336" width="472" height="96" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
  <rect x="60" y="352" width="16" height="16" rx="3" fill="#3352cc"/><text x="63" y="365" fill="#fff" font-size="12">✓</text>
  <text x="86" y="365" class="t b">Push main to origin</text>
  <rect x="246" y="352" width="22" height="18" rx="4" fill="#0a0a0b"/><text x="249" y="365" fill="#fff" font-size="9" font-weight="700">GH</text>
  <text x="274" y="365" class="s">github-dataart</text>
  <text x="86" y="388" class="s">"Bring into main" pushes merged main; "Close for now" pushes</text>
  <text x="86" y="404" class="s">ws/fix-login; "Already merged elsewhere" offers no push.</text>
  <text x="86" y="422" class="s">Hidden when the workspace has no remote.</text>

  <rect x="320" y="516" width="88" height="36" rx="6" fill="#fff" stroke="#e4e4e7"/>
  <text x="364" y="539" class="t b" text-anchor="middle">Cancel</text>
  <rect x="418" y="516" width="98" height="36" rx="6" fill="#3352cc"/>
  <text x="467" y="539" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">Close</text>

  <!-- result toasts -->
  <text x="570" y="66" class="cap">After "Close for now" + push: pushed</text>
  <rect x="570" y="78" width="510" height="96" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="590" y="104" fill="#166534" font-size="14" font-weight="600">✓ Pushed ws/fix-login to origin</text>
  <text x="590" y="126" fill="#166534" font-size="12">github.com/DataArt/artisyn-log-hub</text>
  <rect x="590" y="136" width="170" height="28" rx="6" fill="#fff" stroke="#bbf7d0"/>
  <text x="675" y="155" fill="#3352cc" font-size="13" font-weight="600" text-anchor="middle">Create pull request ↗</text>
  <text x="774" y="155" class="s">"merge request" on GitLab (descriptor)</text>

  <text x="570" y="212" class="cap">After closing: push rejected by policy</text>
  <rect x="570" y="224" width="510" height="78" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="590" y="250" fill="#991b1b" font-size="14" font-weight="600">Push rejected</text>
  <text x="590" y="272" fill="#991b1b" font-size="12">Work Hub policy: force push to main is not allowed for connection github-dataart.</text>
  <text x="590" y="290" fill="#991b1b" font-size="12">The workstream is closed locally; retry the push from the terminal.</text>

  <text x="570" y="340" class="cap">After closing: credential rejected by the host</text>
  <rect x="570" y="352" width="510" height="78" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="590" y="378" fill="#92400e" font-size="14" font-weight="600">gitlab-corp: the host rejected the SSH key</text>
  <text x="590" y="400" fill="#92400e" font-size="12">The push did not happen. Update the key, then push from the terminal.</text>
  <text x="590" y="420" fill="#3352cc" font-size="13" font-weight="600">Update key in Connections</text>

  <text x="570" y="470" class="note">The push runs through the WH sidecar — the same path as git push in the</text>
  <text x="570" y="488" class="note">terminal; the container never holds the key or token.</text>
</svg>
