    <text x="906" y="910" fill="#6d28d9">plus the stop reason. The last step</text>
    <text x="906" y="926" fill="#6d28d9">of a turn has no delta ("—"): its</text>
    <text x="906" y="942" fill="#6d28d9">output lands in the next turn's prior</text>
    <text x="906" y="958" fill="#6d28d9">context.</text>

    <text x="906" y="994" font-weight="600">G&#160;&#160;Agent call</text>
