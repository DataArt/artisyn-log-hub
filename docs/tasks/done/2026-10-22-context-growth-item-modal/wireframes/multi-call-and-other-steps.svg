    <text x="906" y="218" fill="#6d28d9">Runs, formatted script, Raw toggle,</text>
    <text x="906" y="234" fill="#6d28d9">Copy original, output.</text>

    <text x="906" y="270" font-weight="600">C&#160;&#160;File tools (Read/Edit/Write…)</text>
    <text x="906" y="288" fill="#6d28d9">Repo-relative path, range / edit</text>
    <text x="906" y="304" fill="#6d28d9">summary from the input, bytes +</text>
    <text x="906" y="320" fill="#6d28d9">≈tokens from turn.files.</text>

    <text x="906" y="356" font-weight="600">D&#160;&#160;Error / missing output</text>
    <text x="906" y="374" fill="#6d28d9">Red "✗ error" badge, red border;</text>
    <text x="906" y="390" fill="#6d28d9">output shown as is when expanded.</text>
    <text x="906" y="406" fill="#6d28d9">No result → muted "Output not</text>
    <text x="906" y="422" fill="#6d28d9">captured", size shown as "—".</text>

    <text x="906" y="458" font-weight="600">E&#160;&#160;Delta attribution note</text>
    <text x="906" y="476" fill="#6d28d9">Step delta = this step's output + the</text>
    <text x="906" y="492" fill="#6d28d9">results of its tool calls (next step's</text>
    <text x="906" y="508" fill="#6d28d9">context − this one, FR-2a). Calls are</text>
    <text x="906" y="524" fill="#6d28d9">matched to results by tool_use id.</text>

    <text x="906" y="876" font-weight="600">F&#160;&#160;Text-only / final step</text>
