<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="260" viewBox="0 0 1440 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1440" height="260" fill="#ffffff"/>

  <!-- State A: live activity -->
  <text x="16" y="22" font-size="12" fill="#7c3aed" font-weight="600">A. Something is live for this user (FR-1): pulsing dot</text>
  <rect x="0" y="32" width="1440" height="48" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="24" cy="56" r="8" fill="#3b4cca"/>
  <text x="44" y="61" font-size="14" font-weight="600" fill="#111827">[local] Artisyn Log Hub</text>
  <text x="196" y="61" font-size="12" fill="#9ca3af">dev</text>
  <rect x="229" y="40" width="80" height="32" rx="6" fill="#f3f4f6"/>
  <text x="246" y="61" font-size="14" font-weight="600" fill="#111827">⌂ Home</text>
  <!-- Live entry with dot -->
  <rect x="317" y="40" width="72" height="32" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="333" cy="56" r="8" fill="#dc2626" fill-opacity="0.18"/>
  <circle cx="333" cy="56" r="4" fill="#dc2626"/>
  <text x="345" y="61" font-size="14" font-weight="600" fill="#111827">Live</text>
  <text x="1042" y="61" font-size="14" font-weight="600" fill="#111827">▦ All views</text>
  <circle cx="1159" cy="56" r="8" fill="none" stroke="#111827" stroke-width="1.5"/>
  <text x="1155" y="60" font-size="10" fill="#111827">?</text>
  <text x="1194" y="61" font-size="14" fill="#6b7280">🔔</text>
  <text x="1226" y="61" font-size="14" fill="#6b7280">dt@dataart.com</text>
  <text x="1349" y="61" font-size="14" font-weight="600" fill="#111827">Edit email</text>
  <!-- tooltip -->
  <path d="M353 82 l6 -6 l6 6 z" fill="#111827"/>
  <rect x="300" y="82" width="250" height="44" rx="6" fill="#111827"/>
  <text x="312" y="100" font-size="12" fill="#ffffff">Live now: 3 sessions · 5 agents · $0.42</text>
  <text x="312" y="117" font-size="11" fill="#d1d5db">Click to open the Live view</text>
  <text x="566" y="104" font-size="11" fill="#6b7280">← dot = red core + soft halo, animated pulse (respects prefers-reduced-motion)</text>

  <!-- State B: nothing live -->
  <text x="16" y="164" font-size="12" fill="#7c3aed" font-weight="600">B. Nothing is live: same entry, no dot (still clickable, opens the empty state)</text>
  <rect x="0" y="174" width="1440" height="48" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="24" cy="198" r="8" fill="#3b4cca"/>
  <text x="44" y="203" font-size="14" font-weight="600" fill="#111827">[local] Artisyn Log Hub</text>
  <text x="196" y="203" font-size="12" fill="#9ca3af">dev</text>
  <rect x="229" y="182" width="80" height="32" rx="6" fill="#f3f4f6"/>
  <text x="246" y="203" font-size="14" font-weight="600" fill="#111827">⌂ Home</text>
  <rect x="317" y="182" width="60" height="32" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="333" y="203" font-size="14" font-weight="600" fill="#6b7280">Live</text>
  <text x="1042" y="203" font-size="14" font-weight="600" fill="#111827">▦ All views</text>
  <circle cx="1159" cy="198" r="8" fill="none" stroke="#111827" stroke-width="1.5"/>
  <text x="1155" y="202" font-size="10" fill="#111827">?</text>
  <text x="1194" y="203" font-size="14" fill="#6b7280">🔔</text>
  <text x="1226" y="203" font-size="14" fill="#6b7280">dt@dataart.com</text>
  <text x="1349" y="203" font-size="14" font-weight="600" fill="#111827">Edit email</text>
</svg>
