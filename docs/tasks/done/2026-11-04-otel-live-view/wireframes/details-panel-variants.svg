  <text x="1408" y="68" font-size="15" fill="#6b7280" text-anchor="end">✕</text>
  <rect x="1100" y="82" width="308" height="30" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="1110" y="101" font-size="11" fill="#92400e">No OTEL data for 10 min — figures are final.</text>
  <rect x="1100" y="122" width="308" height="32" rx="6" fill="#2563eb"/>
  <text x="1254" y="143" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Open session ↗</text>
  <text x="1100" y="184" font-size="12" fill="#6b7280">Cost / tokens</text><text x="1408" y="184" font-size="12" text-anchor="end" fill="#9ca3af">$0.40 · 210k</text>
  <text x="1100" y="206" font-size="12" fill="#6b7280">Last activity</text><text x="1408" y="206" font-size="12" text-anchor="end" fill="#9ca3af">10 m ago</text>
  <text x="1100" y="246" font-size="11" fill="#6b7280">Stays open while selected (FR-7);</text>
  <text x="1100" y="262" font-size="11" fill="#6b7280">disappears from the tree after deselection.</text>
</svg>
