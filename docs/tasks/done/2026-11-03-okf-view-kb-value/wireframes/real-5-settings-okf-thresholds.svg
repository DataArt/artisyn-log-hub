<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <style>
      .muted{fill:#6b7280}
      .cap{fill:#6b7280;font-size:10px;letter-spacing:.5px}
      .mono{font-family:Consolas,Menlo,monospace}
      .card{fill:#fff;stroke:#e5e7eb;stroke-width:1}
      .new{fill:none;stroke:#7c3aed;stroke-width:1.5;stroke-dasharray:5 3}
      .newlbl{fill:#7c3aed;font-size:10px;font-weight:600}
      .inp{fill:#fff;stroke:#d1d5db}
      .hint{fill:#1d4ed8;font-size:10.5px}
      .row{fill:#f9fafb}
    </style>
  </defs>
  <rect width="1200" height="1000" fill="#fafafa"/>

  <!-- repo header + tabs -->
  <rect x="0" y="0" width="1200" height="44" fill="#fff" stroke="#e5e7eb"/>
  <text x="16" y="27" class="mono" font-size="14">https://github.com/DataArt/artisyn-log-hub</text>
  <text x="1060" y="27" class="muted">Sessions: 213  Users: 1</text>
  <rect x="0" y="44" width="1200" height="36" fill="#fff" stroke="#e5e7eb"/>
  <text x="44" y="67">Sessions</text><text x="116" y="67">Analytics</text><text x="190" y="67">Reports</text>
  <text x="252" y="67">Tools/MCP</text><text x="335" y="67">OKF</text><text x="384" y="67">OTEL</text>
  <rect x="424" y="50" width="62" height="26" rx="4" fill="#fff" stroke="#111"/>
  <text x="432" y="67" font-weight="600">Settings</text>

  <!-- existing settings blocks (collapsed) -->
  <rect x="16" y="96" width="1168" height="30" rx="6" class="card"/><text x="30" y="116" class="muted">› Repository analysis settings (existing)</text>
  <rect x="16" y="132" width="1168" height="30" rx="6" class="card"/><text x="30" y="152" class="muted">› Teams and visibility (existing)</text>

  <!-- OKF thresholds block -->
  <rect x="16" y="172" width="1168" height="760" rx="6" class="card"/>
  <text x="30" y="194" font-weight="600" font-size="13">OKF thresholds</text>
  <rect x="146" y="181" width="150" height="18" rx="9" fill="#fff" stroke="#e5e7eb"/><text x="154" y="194" font-size="10" class="muted">scope: personal → team → default</text>
  <text x="310" y="194" class="muted" font-size="11">Stored in repo_config.config → okf; applied when the OKF tabs are read — no recompute needed. A missing field = default.</text>
  <text x="30" y="212" class="muted" font-size="11">"On this repo" shows what the value changes on the current period (Oct 20 → Nov 3, 213 sessions); it is recomputed when you edit a field.</text>

  <text x="30" y="238" class="cap">SETTING</text><text x="300" y="238" class="cap">DEFAULT</text><text x="370" y="238" class="cap">VALUE</text><text x="450" y="238" class="cap">WHAT IT AFFECTS</text><text x="790" y="238" class="cap">ON THIS REPO (LIVE HINT)</text>
  <line x1="30" y1="244" x2="1170" y2="244" stroke="#e5e7eb"/>

  <text x="30" y="258" class="cap" fill="#7c3aed">VERDICT (EXISTING RULES, DD-23)</text>

  <rect x="24" y="264" width="1150" height="22" class="row"/>
  <text x="30" y="279" class="mono" font-size="11">SHARE_MIN_BUNDLE_FILES</text><text x="300" y="279" class="mono" font-size="11">10</text>
  <rect x="370" y="267" width="60" height="17" rx="3" class="inp"/><text x="376" y="279" class="mono" font-size="11">10</text>
  <text x="450" y="279" font-size="11">bundles judged by share (histogram, session_share, kb_flood)</text>
  <text x="790" y="279" class="hint">docs/knowledgebase (111 articles) judged · docs/kb-local (3) skipped</text>

  <text x="30" y="301" class="mono" font-size="11">SESSION_SHARE_FIX / _MESS</text><text x="300" y="301" class="mono" font-size="11">0.25 / 0.50</text>
  <rect x="370" y="289" width="30" height="17" rx="3" class="inp"/><text x="374" y="301" class="mono" font-size="10">0.25</text>
  <rect x="402" y="289" width="30" height="17" rx="3" class="inp"/><text x="406" y="301" class="mono" font-size="10">0.50</text>
  <text x="450" y="301" font-size="11">session verdict: share of a bundle one agent reads</text>
  <text x="790" y="301" class="hint">2 of 126 KB sessions above 0.25, 1 above 0.50</text>

  <rect x="24" y="308" width="1150" height="22" class="row"/>
  <text x="30" y="323" class="mono" font-size="11">REPO_MIN_KB_SESSIONS</text><text x="300" y="323" class="mono" font-size="11">5</text>
  <rect x="370" y="311" width="60" height="17" rx="3" class="inp"/><text x="376" y="323" class="mono" font-size="11">5</text>
  <text x="450" y="323" font-size="11">repo verdict shown instead of "not enough data"</text>
  <text x="790" y="323" class="hint">126 KB sessions in the period</text>

  <text x="30" y="345" class="mono" font-size="11">ALWAYS_READ_SHARE</text><text x="300" y="345" class="mono" font-size="11">0.80</text>
  <rect x="370" y="333" width="60" height="17" rx="3" class="inp"/><text x="376" y="345" class="mono" font-size="11">0.80</text>
  <text x="450" y="345" font-size="11">always_read: article read in this share of KB sessions</text>
  <text x="790" y="345" class="hint">no article (max article share 0.35, kb-local/local-prod.md); at 0.50 still none</text>

  <rect x="24" y="352" width="1150" height="22" class="row"/>
  <text x="30" y="367" class="mono" font-size="11">FLOOD_SHARE</text><text x="300" y="367" class="mono" font-size="11">0.25</text>
  <rect x="370" y="355" width="60" height="17" rx="3" class="inp"/><text x="376" y="367" class="mono" font-size="11">0.25</text>
  <text x="450" y="367" font-size="11">a session is "flooded" above this share of the bundle</text>
  <text x="790" y="367" class="hint">2 of 126 sessions (at 0.10: 5)</text>

  <text x="30" y="389" class="mono" font-size="11">FLOOD_MIN_SESSIONS</text><text x="300" y="389" class="mono" font-size="11">3</text>
  <rect x="370" y="377" width="60" height="17" rx="3" class="inp"/><text x="376" y="389" class="mono" font-size="11">3</text>
  <text x="450" y="389" font-size="11">kb_flood changes the repo verdict only from this many flooded sessions (FR-7)</text>
  <text x="790" y="389" class="hint">2 flooded &lt; 3 → info only · with 2: verdict "Something to fix"</text>
  <rect x="24" y="374" width="1150" height="22" rx="2" class="new"/>

  <rect x="24" y="396" width="1150" height="22" class="row"/>
  <text x="30" y="411" class="mono" font-size="11">FLOOD_MESS_SESSION_SHARE</text><text x="300" y="411" class="mono" font-size="11">0.20</text>
  <rect x="370" y="399" width="60" height="17" rx="3" class="inp"/><text x="376" y="411" class="mono" font-size="11">0.20</text>
  <text x="450" y="411" font-size="11">kb_flood is "mess" from this share of flooded sessions</text>
  <text x="790" y="411" class="hint">2 / 126 = 1.6 %</text>

  <text x="30" y="433" class="mono" font-size="11">COARSE_MIN_SIZE_BYTES</text><text x="300" y="433" class="mono" font-size="11">51200</text>
  <rect x="370" y="421" width="60" height="17" rx="3" class="inp"/><text x="376" y="433" class="mono" font-size="11">51200</text>
  <text x="450" y="433" font-size="11">articles big enough for coarse_article</text>
  <text x="790" y="433" class="hint">3 articles ≥ 50 KB (hook-api-versioning, hook-installation, session-log-view); at 25 KB: 14</text>

  <rect x="24" y="440" width="1150" height="22" class="row"/>
  <text x="30" y="455" class="mono" font-size="11">COARSE_MIN_SESSIONS / _MAX_READ_RATIO</text><text x="300" y="455" class="mono" font-size="11">5 / 0.10</text>
  <rect x="370" y="443" width="30" height="17" rx="3" class="inp"/><text x="378" y="455" class="mono" font-size="10">5</text>
  <rect x="402" y="443" width="30" height="17" rx="3" class="inp"/><text x="406" y="455" class="mono" font-size="10">0.10</text>
  <text x="450" y="455" font-size="11">coarse_article: whole-file reads in ≥ N sessions, avg bytes ÷ size &lt; ratio (section reads excluded, FR-4)</text>
  <text x="790" y="455" class="hint">no finding: the 3 big articles have 2–4 whole reads, ratio 0.41–0.51 (sections ×17 / ×30 / ×26)</text>

  <text x="30" y="482" class="cap" fill="#7c3aed">VALUE SIGNALS (NEW, Q5 · Q6 · Q8 · Q11)</text>

  <rect x="24" y="488" width="1150" height="22" class="row"/>
  <text x="30" y="503" class="mono" font-size="11">EXPLORED_MIN_SEARCHES</text><text x="300" y="503" class="mono" font-size="11">2</text>
  <rect x="370" y="491" width="60" height="17" rx="3" class="inp"/><text x="376" y="503" class="mono" font-size="11">2</text>
  <text x="450" y="503" font-size="11">"explored after read": searches in the article's area after reading it, per agent</text>
  <text x="790" y="503" class="hint">31 agent·article rows (1 → 67, 3 → 15)</text>

  <text x="30" y="525" class="mono" font-size="11">ROUTING_MIN_SEARCHES</text><text x="300" y="525" class="mono" font-size="11">3</text>
  <rect x="370" y="513" width="60" height="17" rx="3" class="inp"/><text x="376" y="525" class="mono" font-size="11">3</text>
  <text x="450" y="525" font-size="11">routing miss: an agent counts when it searched the area at least this often</text>
  <text x="790" y="525" class="hint">206 pairs / 27 articles (2 → 594 / 47 · 4 → 110 / 14)</text>

  <rect x="24" y="532" width="1150" height="22" class="row"/>
  <text x="30" y="547" class="mono" font-size="11">ROUTING_MIN_AGENTS</text><text x="300" y="547" class="mono" font-size="11">3</text>
  <rect x="370" y="535" width="60" height="17" rx="3" class="inp"/><text x="376" y="547" class="mono" font-size="11">3</text>
  <text x="450" y="547" font-size="11">an article is listed / counted in the tile from this many missing agents</text>
  <text x="790" y="547" class="hint">27 articles (2 → 39 · 5 → 9)</text>

  <text x="30" y="569" class="mono" font-size="11">POINTER_MAX_ARTICLES</text><text x="300" y="569" class="mono" font-size="11">3</text>
  <rect x="370" y="557" width="60" height="17" rx="3" class="inp"/><text x="376" y="569" class="mono" font-size="11">3</text>
  <text x="450" y="569" font-size="11">a path named in more articles than this is not part of any area (shared constant)</text>
  <text x="790" y="569" class="hint">393 of 440 pointers kept, 206 pairs (2 → 360 kept, 120 pairs · 5 → 423 kept, 369 pairs)</text>

  <rect x="24" y="576" width="1150" height="22" class="row"/>
  <text x="30" y="591" class="mono" font-size="11">AREA_MAX_FILES</text><text x="300" y="591" class="mono" font-size="11">30</text>
  <rect x="370" y="579" width="60" height="17" rx="3" class="inp"/><text x="376" y="591" class="mono" font-size="11">30</text>
  <text x="450" y="591" font-size="11">an article with a bigger area is a "catalog": chip + C3 hint, no routing miss</text>
  <text x="790" y="591" class="hint">1 catalog (hook-system-overview.md, 46) · at 20: 3 catalogs, 177 pairs · at 50: none, 240 pairs</text>

  <text x="30" y="613" class="mono" font-size="11">DEAD_POINTER_MIN_SHOWN</text><text x="300" y="613" class="mono" font-size="11">4</text>
  <rect x="370" y="601" width="60" height="17" rx="3" class="inp"/><text x="376" y="613" class="mono" font-size="11">4</text>
  <text x="450" y="613" font-size="11">a path is "dead" when shown as new in ≥ N reads and never followed</text>
  <text x="790" y="613" class="hint">50 dead / 106 followed (3 → 73 / 130 · 6 → 30 / 63)</text>

  <rect x="24" y="620" width="1150" height="40" class="row"/>
  <text x="30" y="635" class="mono" font-size="11">CODE_ROOTS</text><text x="300" y="635" class="mono" font-size="10">server/ client/ hook/</text><text x="300" y="648" class="mono" font-size="10">scripts/ packages/ tests/</text>
  <rect x="370" y="623" width="70" height="34" rx="3" class="inp"/><text x="376" y="635" class="mono" font-size="9">server/ client/</text><text x="376" y="648" class="mono" font-size="9">hook/ scripts/ …</text>
  <text x="450" y="635" font-size="11">top-level folders whose back-ticked file paths form an article's area (Q6)</text>
  <text x="450" y="648" class="muted" font-size="10">Log Hub specific — another repository will need its own list.</text>
  <text x="790" y="635" class="hint">440 code pointers in 95 read articles; docs/… paths (e.g. docs/tasks/todo) are not area</text>
  <text x="790" y="648" class="hint">without the docs/ exclusion task-checks-guide.md had 441 false misses</text>
  <rect x="24" y="482" width="1150" height="182" rx="2" class="new"/><text x="1080" y="676" class="newlbl">Q14 · new thresholds</text>

  <text x="30" y="694" class="cap">NOT SETTINGS (TECHNICAL LIMITS)</text>
  <text x="30" y="710" class="muted" font-size="11">READ_TOP_N 5 · HOT_FILES_TOP_N 10 · TASK_HEAD_MAX_CHARS 200 · grep pattern cut at 200 chars · per-node event cap — fixed in code (Q14).</text>

  <!-- buttons / preview -->
  <rect x="30" y="730" width="140" height="28" rx="4" fill="#111"/><text x="60" y="748" fill="#fff" font-size="11">Save for this repo</text>
  <rect x="180" y="730" width="120" height="28" rx="4" fill="#fff" stroke="#111"/><text x="198" y="748" font-size="11">Reset to defaults</text>
  <rect x="310" y="730" width="170" height="28" rx="4" fill="#fff" stroke="#d1d5db"/><text x="322" y="748" font-size="11" class="muted">Copy from team settings</text>
  <text x="500" y="748" class="muted" font-size="11">Saving writes only the fields that differ from the default; older clients ignore the section.</text>

  <rect x="30" y="776" width="1140" height="60" rx="4" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="44" y="796" font-size="11" font-weight="600">Preview of the verdict card chip when a value differs from the default</text>
  <rect x="44" y="806" width="110" height="20" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="54" y="820" font-size="11">custom thresholds</text>
  <text x="166" y="820" font-size="11" class="muted">ROUTING_MIN_SEARCHES 2 (default 3) · DEAD_POINTER_MIN_SHOWN 3 (default 4) — hover lists the differing fields; click opens this block.</text>
  <rect x="24" y="724" width="1150" height="118" rx="2" class="new"/><text x="1100" y="856" class="newlbl">Q14 · chip</text>

  <text x="30" y="884" class="muted" font-size="11">Defaults are the values calibrated on this repository's corpus (1188 transcripts); the calibration is recorded in docs/knowledgebase/algorithms/okf-verdict.md (Q14).</text>
  <text x="30" y="902" class="muted" font-size="11">Personal view resolves personal → team → default; the team view resolves team → default (same as the other repository analysis settings).</text>
  <rect x="16" y="946" width="22" height="12" class="new"/>
  <text x="46" y="956" class="muted" font-size="11">Dashed purple outline = new by this task (Q14). The two collapsed blocks above are the existing Settings tab.</text>
  <text x="16" y="978" class="muted" font-size="11">Real data: live hints computed over 213 root sessions / 1188 agent transcripts of this repo, 2026-10-20 → 2026-11-03, kb-probe scripts (regex matching, not the OKF extractor) — approximate.</text>
</svg>
