  <text x="28" y="770" class="cap">COLUMN LEGEND</text>
  <text x="28" y="788" font-size="11" class="muted">Yield — share of KB reads after which the same agent opened, searched or edited a code path first seen in that read (FR-1).</text>
  <text x="28" y="806" font-size="11" class="muted">Expl. after — code searches/reads in the article's area by the same agent after reading it; redundancy signal (FR-2).</text>
  <text x="28" y="824" font-size="11" class="muted">Route miss — code searches in the article's area by agents that never opened it (FR-3).</text>
  <text x="28" y="842" font-size="11" class="muted">upkeep — reads by an agent that also edits the article; excluded from Read, Sess., shares, hot files and verdict (FR-5).</text>
  <text x="28" y="860" font-size="11" class="muted">§ section reads — Read offset/limit or sed -n range; not a coarse_article finding (FR-4). stale — article changed since the snapshot (FR-10).</text>
