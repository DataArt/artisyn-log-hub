  <rect x="32" y="69" width="246" height="24" rx="6" fill="#f3f4f6"/>
  <rect x="34" y="71" width="56" height="20" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <text x="44" y="85" font-size="12" font-weight="600" class="fg">All</text>
  <text x="66" y="85" font-size="11" class="mono muted">44</text>
  <text x="102" y="85" font-size="12" class="fg">Bash</text>
  <text x="134" y="85" font-size="11" class="mono muted">27</text>
  <text x="166" y="85" font-size="12" class="fg">PowerShell</text>
