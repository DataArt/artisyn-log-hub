  <rect x="1036" y="327" width="106" height="20" rx="4" fill="#f3f4f6"/>
  <text x="1089" y="341" font-size="11" text-anchor="middle" class="mono muted">⧉ Copy original</text>

  <rect x="378" y="356" width="122" height="18" rx="9" fill="#ffffff" stroke="#d1d5db"/>
  <text x="439" y="369" font-size="10" text-anchor="middle" class="mono muted">▸ block 1: 6 lines</text>
  <text x="512" y="369" class="note">FR-6: here-string @'…'@ folded like a heredoc</text>

  <!-- code box -->
  <rect x="378" y="384" width="764" height="196" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <line x1="408" y1="384" x2="408" y2="580" stroke="#f3f4f6"/>
  <g font-size="12" class="mono">
    <g class="muted" text-anchor="end">
      <text x="400" y="406">1</text><text x="400" y="426">2</text><text x="400" y="446">3</text>
      <text x="400" y="466">4</text><text x="400" y="486">5</text><text x="400" y="506">6</text>
      <text x="400" y="526">7</text><text x="400" y="546">8</text><text x="400" y="566">9</text>
    </g>
    <text x="418" y="406"><tspan class="var">$header</tspan><tspan class="kw"> = </tspan><tspan class="str">@'</tspan></text>
    <text x="418" y="426" class="cmt"># ▼ block 1: 6 lines, shown below</text>
    <text x="418" y="446" class="str">'@</text>
    <text x="418" y="466"><tspan class="cmd">Get-Content</tspan><tspan class="fg"> a.json </tspan><tspan class="kw">|</tspan></text>
    <text x="433" y="486"><tspan class="cmd">ConvertFrom-Json</tspan><tspan class="fg"> </tspan><tspan class="kw">|</tspan></text>
    <text x="433" y="506"><tspan class="cmd">ForEach-Object</tspan><tspan class="fg"> { </tspan><tspan class="var">$_</tspan><tspan class="fg">.items } </tspan><tspan class="kw">|</tspan></text>
    <text x="433" y="526"><tspan class="cmd">Set-Content</tspan><tspan class="fg"> </tspan><tspan class="flag">-Path</tspan><tspan class="fg"> out\b.json</tspan></text>
    <text x="418" y="546"><tspan class="cmd">Remove-Item</tspan><tspan class="fg"> tmp\x</tspan></text>
    <text x="418" y="566"><tspan class="kw">if</tspan><tspan class="fg"> (</tspan><tspan class="var">$?</tspan><tspan class="fg">) { </tspan><tspan class="cmd">npm</tspan><tspan class="fg"> run build </tspan><tspan class="redir">2&gt;&amp;1</tspan><tspan class="fg"> }</tspan></text>
  </g>
  <text x="760" y="446" class="note">FR-6: one statement per line, pipeline broken</text>
  <text x="760" y="462" class="note">at "|", blocks indented, line numbers;</text>
  <text x="760" y="478" class="note">unparseable command → raw text only</text>

