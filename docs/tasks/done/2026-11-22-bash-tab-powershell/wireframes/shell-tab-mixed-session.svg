  <text x="34" y="658" class="note">FR-4: filter with counts — only when the session</text>
  <text x="34" y="674" class="note">has both shells; kept in the URL</text>
  <text x="34" y="692" class="note">Badge bash / pwsh only on mixed sessions (shell=…)</text>

