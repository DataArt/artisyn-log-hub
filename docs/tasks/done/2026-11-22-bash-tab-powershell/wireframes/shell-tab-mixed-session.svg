    <text x="56" y="493" class="mono muted">12:46:45 PM  ⏱ 653ms</text>
    <rect x="34" y="502" width="36" height="16" rx="3" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="52" y="514" font-size="10" text-anchor="middle" class="mono muted">bash</text>
    <text x="78" y="514" class="mono fg">Check existing service query patt…</text>
