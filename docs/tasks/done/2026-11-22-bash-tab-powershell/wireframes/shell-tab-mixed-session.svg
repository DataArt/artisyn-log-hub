    <text x="512" y="600" class="redir">redirect</text>
    <text x="578" y="600" class="str">string</text>
    <text x="630" y="600" class="var">variable</text>
    <text x="696" y="600" class="flag">flag</text>
    <text x="734" y="600" class="cmt">comment</text>
