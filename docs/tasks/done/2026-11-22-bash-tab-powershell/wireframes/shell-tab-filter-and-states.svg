<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" font-family="Inter, Segoe UI, Arial, sans-serif">
  <style>
    .mono { font-family: Consolas, 'JetBrains Mono', monospace; }
    .muted { fill: #6b7280; }
    .fg { fill: #111827; }
    .title { fill: #111827; font-size: 13px; font-weight: 600; }
    .note { fill: #b45309; font-size: 11px; font-style: italic; }
  </style>
  <rect width="1180" height="470" fill="#ffffff"/>

  <!-- ============ A: filter = PowerShell ============ -->
  <text x="20" y="30" class="title">A. Filter = PowerShell (mixed session)</text>
  <rect x="20" y="44" width="360" height="26" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="30" y="61" font-size="11" class="mono muted">…?tab=bash&amp;shell=powershell&amp;bashCall=toolu_…</text>

  <rect x="20" y="82" width="340" height="296" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="20" y="82" width="340" height="42" fill="#fafafa" stroke="#e5e7eb"/>
  <rect x="32" y="91" width="246" height="24" rx="6" fill="#f3f4f6"/>
  <text x="44" y="107" font-size="12" class="fg">All</text>
  <text x="66" y="107" font-size="11" class="mono muted">44</text>
  <text x="102" y="107" font-size="12" class="fg">Bash</text>
  <text x="134" y="107" font-size="11" class="mono muted">27</text>
  <rect x="158" y="93" width="118" height="20" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <text x="166" y="107" font-size="12" font-weight="600" class="fg">PowerShell</text>
  <text x="240" y="107" font-size="11" class="mono muted">17</text>

  <g font-size="12">
    <rect x="20" y="124" width="340" height="53" fill="#eff6ff"/>
    <rect x="20" y="124" width="3" height="53" fill="#3b82f6"/>
    <text x="34" y="144" class="mono fg" font-weight="700">#2</text>
    <text x="56" y="144" class="mono muted">12:45:48 PM  ⏱ 522ms</text>
    <rect x="34" y="153" width="36" height="16" rx="3" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="52" y="165" font-size="10" text-anchor="middle" class="mono" fill="#0369a1">pwsh</text>
    <text x="78" y="165" class="mono fg">Get-ChildItem server/src -Recurse…</text>
    <line x1="20" y1="177" x2="360" y2="177" stroke="#e5e7eb"/>

    <text x="34" y="197" class="mono fg" font-weight="700">#4</text>
    <text x="56" y="197" class="mono muted">12:46:04 PM  ⏱ 1.7s</text>
    <rect x="206" y="184" width="76" height="18" rx="3" fill="#ffedd5"/>
    <text x="244" y="197" text-anchor="middle" class="mono" fill="#c2410c">changes 2</text>
    <rect x="34" y="206" width="36" height="16" rx="3" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="52" y="218" font-size="10" text-anchor="middle" class="mono" fill="#0369a1">pwsh</text>
    <text x="78" y="218" class="mono fg">Rebuild items file, drop temp</text>
    <line x1="20" y1="230" x2="360" y2="230" stroke="#e5e7eb"/>

    <text x="34" y="250" class="mono fg" font-weight="700">#6</text>
    <text x="56" y="250" class="mono muted">12:46:34 PM  ⏱ 2.1s</text>
    <text x="206" y="250" class="mono" fill="#dc2626" font-weight="700">✗</text>
    <rect x="34" y="259" width="36" height="16" rx="3" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="52" y="271" font-size="10" text-anchor="middle" class="mono" fill="#0369a1">pwsh</text>
    <text x="78" y="271" class="mono fg">npm run typecheck</text>
    <line x1="20" y1="283" x2="360" y2="283" stroke="#e5e7eb"/>

    <text x="34" y="303" class="mono fg" font-weight="700">#7</text>
    <text x="56" y="303" class="mono muted">12:46:40 PM  ⏱ 464ms</text>
    <rect x="256" y="290" width="92" height="18" rx="3" fill="#ede9fe"/>
    <text x="302" y="303" text-anchor="middle" fill="#6d28d9">code-reviewer</text>
    <rect x="34" y="312" width="36" height="16" rx="3" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="52" y="324" font-size="10" text-anchor="middle" class="mono" fill="#0369a1">pwsh</text>
    <text x="78" y="324" class="mono fg">Select-String -Path src/*.ts -Pat…</text>
    <line x1="20" y1="336" x2="360" y2="336" stroke="#e5e7eb"/>

    <text x="34" y="356" class="mono fg" font-weight="700">#9</text>
    <text x="56" y="356" class="mono muted">12:47:05 PM  ⏱ 8.1s</text>
  </g>

  <text x="20" y="398" class="note">FR-4: only PowerShell rows; numbers stay #2, #4, #6…</text>
  <text x="20" y="414" class="note">(not renumbered); tab count stays 44; choice survives</text>
  <text x="20" y="430" class="note">a reload. A bashCall link to a hidden row resets the</text>
  <text x="20" y="446" class="note">filter to All. URL param: shell=bash|powershell.</text>

  <!-- ============ B: single-shell session ============ -->
  <text x="420" y="30" class="title">B. Single-shell session (Bash only)</text>
  <rect x="420" y="44" width="340" height="34" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="434" y="66" font-size="13" class="muted">Context Growth</text>
  <text x="548" y="66" font-size="13" class="muted">More ⌄</text>
  <line x1="610" y1="44" x2="610" y2="78" stroke="#e5e7eb"/>
  <text x="628" y="66" font-size="13" font-weight="600" class="fg">Shell</text>
  <text x="668" y="66" font-size="11" class="mono muted">12</text>
  <line x1="616" y1="77" x2="694" y2="77" stroke="#2563eb" stroke-width="2"/>

  <rect x="420" y="82" width="340" height="296" fill="#ffffff" stroke="#e5e7eb"/>
  <g font-size="12">
    <rect x="420" y="82" width="340" height="53" fill="#eff6ff"/>
    <rect x="420" y="82" width="3" height="53" fill="#3b82f6"/>
    <text x="434" y="102" class="mono fg" font-weight="700">#1</text>
    <text x="456" y="102" class="mono muted">12:45:41 PM  ⏱ 581ms</text>
    <text x="434" y="123" class="mono fg">Read plan, requirements, configs, tracker…</text>
    <line x1="420" y1="135" x2="760" y2="135" stroke="#e5e7eb"/>

    <text x="434" y="155" class="mono fg" font-weight="700">#2</text>
    <text x="456" y="155" class="mono muted">12:45:48 PM  ⏱ 522ms</text>
    <text x="434" y="176" class="mono fg">Inspect server structure and schema</text>
    <line x1="420" y1="188" x2="760" y2="188" stroke="#e5e7eb"/>

    <text x="434" y="208" class="mono fg" font-weight="700">#3</text>
    <text x="456" y="208" class="mono muted">12:46:04 PM  ⏱ 1.7s</text>
    <rect x="606" y="195" width="76" height="18" rx="3" fill="#ffedd5"/>
    <text x="644" y="208" text-anchor="middle" class="mono" fill="#c2410c">changes 2</text>
    <text x="434" y="229" class="mono fg">Create schema, relations, generate migrat…</text>
    <line x1="420" y1="241" x2="760" y2="241" stroke="#e5e7eb"/>

    <text x="434" y="261" class="mono fg" font-weight="700">#4</text>
    <text x="456" y="261" class="mono muted">12:46:14 PM  ⏱ 11.1s</text>
    <text x="434" y="282" class="mono fg">Install multer types, add header helper…</text>
    <line x1="420" y1="294" x2="760" y2="294" stroke="#e5e7eb"/>
  </g>

  <text x="420" y="398" class="note">FR-4 / FR-5: no filter bar when the session has one</text>
  <text x="420" y="414" class="note">shell — looks as today apart from the "Shell" label.</text>
  <text x="420" y="430" class="note">No bash / pwsh badge on a single-shell session.</text>
  <text x="420" y="446" class="note">A PowerShell-only session lists its calls the same way.</text>

  <!-- ============ C: empty state ============ -->
  <text x="820" y="30" class="title">C. No shell calls</text>
  <rect x="820" y="44" width="340" height="34" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="834" y="66" font-size="13" class="muted">Context Growth</text>
  <text x="948" y="66" font-size="13" class="muted">More ⌄</text>
  <line x1="1010" y1="44" x2="1010" y2="78" stroke="#e5e7eb"/>
  <text x="1028" y="66" font-size="13" font-weight="600" class="fg">Shell</text>
  <text x="1068" y="66" font-size="11" class="mono muted">0</text>
  <line x1="1016" y1="77" x2="1088" y2="77" stroke="#2563eb" stroke-width="2"/>

  <rect x="820" y="82" width="340" height="296" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="990" y="234" font-size="13" text-anchor="middle" class="muted">No shell commands in this session</text>

  <text x="820" y="398" class="note">FR-5: empty-state text replaces today's</text>
  <text x="820" y="414" class="note">"No Bash commands in this session".</text>
</svg>
