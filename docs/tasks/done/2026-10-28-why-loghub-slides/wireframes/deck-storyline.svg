<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title>Why Log Hub deck - storyline overview (FR-6)</title>
  <rect width="1440" height="820" fill="#f3f4f6"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#111827">Deck storyline - overview (reveal-style grid, Esc key)</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Order fixed by FR-6: Problem -&gt; A -&gt; B -&gt; C -&gt; D -&gt; E -&gt; F. 10-15 slides in total, 1-2 per block. Thumbnails are candidates - the strongest are kept.</text>

  <defs>
    <g id="thumb">
      <rect width="190" height="107" fill="#ffffff" stroke="#d1d5db"/>
      <rect x="14" y="40" width="80" height="6" fill="#d1d5db"/>
      <rect x="14" y="54" width="70" height="6" fill="#d1d5db"/>
      <rect x="14" y="68" width="76" height="6" fill="#d1d5db"/>
      <rect x="104" y="36" width="72" height="54" fill="#fafafa" stroke="#9ca3af" stroke-dasharray="4 3"/>
    </g>
  </defs>

  <!-- Row helper: label column at x=40, thumbs from x=300 -->
  <g font-size="12">
    <!-- Problem -->
    <g transform="translate(40,100)">
      <rect width="240" height="107" rx="6" fill="#1e3a5f"/>
      <text x="16" y="30" font-size="14" font-weight="700" fill="#ffffff">Problem</text>
      <text x="16" y="54" fill="#dbe4ef">You control the cost - right.</text>
      <text x="16" y="72" fill="#dbe4ef">But is $8 a session good,</text>
      <text x="16" y="90" fill="#dbe4ef">and how to change it?</text>
      <g transform="translate(260,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">Title</text></g>
      <g transform="translate(470,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">$8 a session. Is that good?</text></g>
    </g>
    <!-- A -->
    <g transform="translate(40,222)">
      <rect width="240" height="107" rx="6" fill="#ffffff" stroke="#1e3a5f"/>
      <text x="16" y="30" font-size="14" font-weight="700" fill="#1e3a5f">A · Why it costs this much</text>
      <text x="16" y="54" fill="#374151">session scale: tokens, context,</text>
      <text x="16" y="72" fill="#374151">detectors, sub-agents, advisor</text>
      <g transform="translate(260,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">Context drives the bill</text></g>
      <g transform="translate(470,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">Detectors name the cause</text></g>
      <g transform="translate(680,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">Advisor: what to change</text></g>
    </g>
    <!-- B -->
    <g transform="translate(40,344)">
      <rect width="240" height="107" rx="6" fill="#ffffff" stroke="#1e3a5f"/>
      <text x="16" y="30" font-size="14" font-weight="700" fill="#1e3a5f">B · Harness works as designed?</text>
      <text x="16" y="54" fill="#374151">system context tax, harness</text>
      <text x="16" y="72" fill="#374151">usage, OKF, permissions,</text>
      <text x="16" y="90" fill="#374151">Tools/MCP</text>
      <g transform="translate(260,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">The harness tax per turn</text></g>
      <g transform="translate(470,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">What is really used</text></g>
      <g transform="translate(680,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">Every tool call visible</text></g>
    </g>
    <!-- C -->
    <g transform="translate(40,466)">
      <rect width="240" height="107" rx="6" fill="#ffffff" stroke="#1e3a5f"/>
      <text x="16" y="30" font-size="14" font-weight="700" fill="#1e3a5f">C · What it really brings</text>
      <text x="16" y="54" fill="#374151">change surface, productivity,</text>
      <text x="16" y="72" fill="#374151">session attributes</text>
      <g transform="translate(260,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">What each dollar produced</text></g>
      <g transform="translate(470,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">Group by task and outcome</text></g>
    </g>
    <!-- D -->
    <g transform="translate(40,588)">
      <rect width="240" height="107" rx="6" fill="#ffffff" stroke="#1e3a5f"/>
      <text x="16" y="30" font-size="14" font-weight="700" fill="#1e3a5f">D · Team scale, anomalies</text>
      <text x="16" y="54" fill="#374151">analytics, rankings, reports,</text>
      <text x="16" y="72" fill="#374151">anomalies, teams and roles</text>
      <g transform="translate(260,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">Trends across the team</text></g>
      <g transform="translate(470,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">Outliers surface early</text></g>
      <g transform="translate(680,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">Reports for management</text></g>
    </g>
    <!-- E and F: right column -->
    <g transform="translate(980,222)">
      <rect width="400" height="107" rx="6" fill="#ffffff" stroke="#1e3a5f"/>
      <text x="16" y="30" font-size="14" font-weight="700" fill="#1e3a5f">E · Tools: authors and admins</text>
      <text x="16" y="54" fill="#374151">Tool authors: how the agent really uses the tool</text>
      <text x="16" y="72" fill="#374151">Admins: "I rolled it out - does it work?"</text>
      <text x="16" y="90" fill="#374151">keep / tune / remove</text>
    </g>
    <g transform="translate(980,344)">
      <g><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">For tool authors</text></g>
      <g transform="translate(210,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">For admins / leads</text></g>
    </g>
    <g transform="translate(980,466)">
      <rect width="400" height="107" rx="6" fill="#ffffff" stroke="#1e3a5f"/>
      <text x="16" y="30" font-size="14" font-weight="700" fill="#1e3a5f">F · How to install</text>
      <text x="16" y="54" fill="#374151">self-hosted Docker + Postgres, one command,</text>
      <text x="16" y="72" fill="#374151">hook via npx, data stays in-house</text>
    </g>
    <g transform="translate(980,588)">
      <g><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">Your data stays yours</text></g>
      <g transform="translate(210,0)"><use href="#thumb"/><text x="14" y="24" font-weight="700" fill="#111827">Install in one command</text></g>
    </g>
  </g>

  <g transform="translate(40,730)" font-size="13" fill="#374151">
    <text font-size="15" font-weight="600" fill="#111827">Notes</text>
    <text y="26">Thumbnail titles are placeholder headlines that map to the feature inventory (A-F). The inventory is a pool; leftover detail goes to speaker notes.</text>
    <text y="50">Tools/MCP (T-26) slides in B and E are presented as shipped, with no "coming soon" mark. Dashed box in each thumbnail = visual slot.</text>
  </g>
</svg>
