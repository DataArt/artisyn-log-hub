="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text xml:space="preserve" x="54" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Out of the tree: a file dragged to the computer is downloaded there (in browsers that allow it).</text><circle cx="36" cy="850" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text xml:space="preserve" x="54" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Inside the tree: dragging a file or folder onto another folder moves it.</text><circle cx="36" cy="872" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><text xml:space="preserve" x="54" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Fallback that works in every browser: "Download" on a file, and on a folder (as an archive).</text>
