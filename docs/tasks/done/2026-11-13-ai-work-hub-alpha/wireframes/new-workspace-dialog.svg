<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="876" viewBox="0 0 1200 876">
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="876" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="56" fill="#f4f4f5"/><line x1="0" y1="56" x2="1200" y2="56" stroke="#e4e4e7" stroke-width="1"/>
<text xml:space="preserve" x="24" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#c2410c" font-weight="700">WIREFRAME</text><text xml:space="preserve" x="112" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#18181b" font-weight="700">Workspaces › New workspace dialog</text>
<text xml:space="preserve" x="24" y="45" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#71717a">Two ways to get a workspace: start empty with no remote, or clone a repository after authorizing in git. 1200 px, light theme.</text>
<rect x="24" y="72" width="1152" height="40" rx="0" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="40" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#18181b" font-weight="700">Artisyn AI Work Hub</text><text xml:space="preserve" x="204" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#52525b">› Workspaces</text><text xml:space="preserve" x="846" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">History</text><text xml:space="preserve" x="906" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Settings</text><text xml:space="preserve" x="1160" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#52525b" text-anchor="end">dt@dataart.com · Logout</text><text xml:space="preserve" x="48" y="152" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#18181b" font-weight="700">My workspaces</text><rect x="420" y="132" width="140" height="28" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="490" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" text-anchor="middle">+ New workspace</text><rect x="48" y="182" width="512" height="84" rx="8" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="66" y="210" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#18181b" font-weight="700">expenses-dashboard</text><text xml:space="preserve" x="66" y="230" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">started empty · no remote repository</text><text xml:space="preserve" x="66" y="250" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">working branch main · 2 open workstreams</text><rect x="460" y="210" width="76" height="28" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/><text xml:space="preserve" x="498" y="228" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Open</text><rect x="48" y="278" width="512" height="84" rx="8" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="66" y="306" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#18181b" font-weight="700">payroll-reports</text><text xml:space="preserve" x="66" y="326" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">cloned from git@github.com:acme/payroll-reports.git</text><text xml:space="preserve" x="66" y="346" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">working branch main · no open workstreams</text><rect x="460" y="306" width="76" height="28" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="498" y="324" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" text-anchor="middle">Open</text><rect x="24" y="72" width="1152" height="704" rx="0" fill="none" stroke="#a1a1aa" stroke-width="1"/><rect x="24" y="72" width="1152" height="704" fill="#18181b" opacity="0.35"/><rect x="340" y="190" width="520" height="420" rx="10" fill="#fff" stroke="#d4d4d8" stroke-width="1" filter="url(#shadow)"/><text xml:space="preserve" x="364" y="226" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#18181b" font-weight="700">New workspace</text><text xml:space="preserve" x="364" y="256" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#52525b" font-weight="700">Name</text><rect x="364" y="264" width="472" height="34" rx="6" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><text xml:space="preserve" x="376" y="286" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b">expenses-dashboard▍</text><rect x="364" y="316" width="472" height="74" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="384" cy="338" r="7" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="384" cy="338" r="3.5" fill="#4f46e5"/><text xml:space="preserve" x="402" y="342" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#18181b" font-weight="700">Start empty</text><text xml:space="preserve" x="402" y="362" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">A new project with nothing in it. No repository to connect — just start working.</text><rect x="364" y="402" width="472" height="138" rx="8" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><circle cx="384" cy="424" r="7" fill="#fff" stroke="#a1a1aa" stroke-width="1.5"/><text xml:space="preserve" x="402" y="428" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#18181b" font-weight="700">Use an existing git repository</text><text xml:space="preserve" x="402" y="448" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">Work Hub makes a copy (clone) of it. You will be asked to authorize in git.</text><rect x="402" y="472" width="280" height="32" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="414" y="493" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#a1a1aa">Repository address…</text><rect x="692" y="474" width="130" height="28" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="757" y="492" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" text-anchor="middle">Authorize in git</text><rect x="634" y="564" width="84" height="28" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="676" y="582" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" text-anchor="middle">Cancel</text><rect x="726" y="564" width="110" height="28" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/><text xml:space="preserve" x="781" y="582" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Create</text><circle cx="848" cy="353" r="10" fill="#c2410c"/><text xml:space="preserve" x="848" y="357" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="848" cy="440" r="10" fill="#c2410c"/><text xml:space="preserve" x="848" y="444" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="848" cy="578" r="10" fill="#c2410c"/><text xml:space="preserve" x="848" y="582" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="36" cy="806" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text xml:space="preserve" x="54" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Default, "for the lazy": a new local repository with no remote. Nothing about git has to be known.</text><circle cx="36" cy="828" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text xml:space="preserve" x="54" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Clone: the user gives the repository address and authorizes in git; then the workspace shows its files.</text><circle cx="36" cy="850" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text xml:space="preserve" x="54" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">"Create" prepares the workspace container (the repository’s devcontainer, or Work Hub’s default), then asks for the Claude login of the workspace.</text>
</svg>
