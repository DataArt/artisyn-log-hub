<text xml:space="preserve" x="24" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#c2410c" font-weight="700">WIREFRAME</text><text xml:space="preserve" x="112" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#18181b" font-weight="700">Workspace › History of workstreams</text>
<text xml:space="preserve" x="24" y="45" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#71717a">Reached from "History" in the top bar: every workstream of the workspace with its state and stored chat; a kept one can be reopened. 1200 px, light theme.</text>
<rect x="24" y="72" width="1152" height="40" rx="0" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="40" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#18181b" font-weight="700">Artisyn AI Work Hub</text><text xml:space="preserve" x="204" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#52525b">› expenses-dashboard › History</text><text xml:space="preserve" x="846" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">History</text><text xml:space="preserve" x="906" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Settings</text><text xml:space="preserve" x="1160" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#52525b" text-anchor="end">dt@dataart.com · Logout</text><rect x="24" y="112" width="400" height="664" rx="0" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="40" y="138" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#18181b" font-weight="700">Workstream history</text><rect x="40" y="152" width="368" height="30" rx="6" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="52" y="172" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#a1a1aa">Filter by name…</text><rect x="36" y="196" width="376" height="54" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/><text xml:space="preserve" x="50" y="218" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" font-weight="700">Q3 dashboard</text><text xml:space="preserve" x="50" y="237" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">closed 13 Nov 11:20 · added to main · 38 min</text><rect x="328" y="206" width="68" height="18" rx="9" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1"/><text xml:space="preserve" x="362" y="219" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#52525b" text-anchor="middle">closed</text><rect x="36" y="258" width="376" height="54" rx="6" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="50" y="280" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" font-weight="700">Add travel costs</text><text xml:space="preserve" x="50" y="299" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">opened 13 Nov 11:40 · running</text><rect x="328" y="268" width="68" height="18" rx="9" fill="#dcfce7" stroke="#dcfce7" stroke-width="1"/><text xml:space="preserve" x="362" y="281" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">open</text><rect x="36" y="320" width="376" height="54" rx="6" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="50" y="342" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" font-weight="700">First try</text><text xml:space="preserve" x="50" y="361" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">discarded 12 Nov 17:05 · 2 h 10 min</text><rect x="328" y="330" width="68" height="18" rx="9" fill="#fee2e2" stroke="#fee2e2" stroke-width="1"/><text xml:space="preserve" x="362" y="343" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">discarded</text><rect x="36" y="382" width="376" height="54" rx="6" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="50" y="404" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" font-weight="700">Import bank statement</text><text xml:space="preserve" x="50" y="423" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">closed 11 Nov 09:48 · not added to main · 25 min</text><rect x="328" y="392" width="68" height="18" rx="9" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1"/><text xml:space="preserve" x="362" y="405" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#52525b" text-anchor="middle">closed</text><rect x="424" y="112" width="752" height="664" rx="0" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="424" y="112" width="752" height="48" rx="0" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="440" y="134" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#18181b" font-weight="700">Q3 dashboard</text><text xml:space="preserve" x="440" y="151" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#71717a">opened 13 Nov 10:42 · closed 11:20 · kept · added to main</text><rect x="1060" y="122" width="100" height="28" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/><text xml:space="preserve" x="1110" y="140" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Reopen</text><rect x="424" y="160" width="752" height="540" rx="0" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="444" y="188" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#b45309">✻ Claude Code</text><text xml:space="preserve" x="444" y="207" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#71717a">  /workspace/expenses-dashboard  ·  workstream Q3 dashboard</text><text xml:space="preserve" x="444" y="226" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b"></text><text xml:space="preserve" x="444" y="245" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#1d4ed8">&gt; Make a dashboard of Q3 expenses by department from the Excel file in data.</text><text xml:space="preserve" x="444" y="264" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b"></text><text xml:space="preserve" x="444" y="283" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b">● I’ll read data/expenses-q3.xlsx and build the page.</text><text xml:space="preserve" x="444" y="302" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#b45309">● Write(build-dashboard.js)</text><text xml:space="preserve" x="444" y="321" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#71717a">  ⎿  Wrote 84 lines</text><text xml:space="preserve" x="444" y="340" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#b45309">● Bash(node build-dashboard.js)</text><text xml:space="preserve" x="444" y="359" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#71717a">  ⎿  output/dashboard.html and output/summary.xlsx written</text><text xml:space="preserve" x="444" y="378" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b"></text><text xml:space="preserve" x="444" y="397" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#15803d">● Done. The page has a chart by department and a table of the ten largest costs.</text><text xml:space="preserve" x="444" y="416" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b"></text><text xml:space="preserve" x="444" y="435" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#1d4ed8">&gt; Use EUR.</text><text xml:space="preserve" x="444" y="454" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#15803d">● Totals are in EUR now.</text><rect x="448" y="712" width="704" height="44" rx="8" fill="#fafafa" stroke="#e4e4e7" stroke-width="1" stroke-dasharray="4 3"/><text xml:space="preserve" x="464" y="739" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#71717a" font-style="italic">This workstream is closed. Reopen it to continue in the same context.</text><rect x="24" y="72" width="1152" height="704" rx="0" fill="none" stroke="#a1a1aa" stroke-width="1"/><circle cx="410" cy="138" r="10" fill="#c2410c"/><text xml:space="preserve" x="410" y="142" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="1048" cy="136" r="10" fill="#c2410c"/><text xml:space="preserve" x="1048" y="140" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="410" cy="360" r="10" fill="#c2410c"/><text xml:space="preserve" x="410" y="364" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="464" cy="716" r="10" fill="#c2410c"/><text xml:space="preserve" x="464" y="720" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><circle cx="36" cy="806" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text xml:space="preserve" x="54" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Every chat is kept. The list shows all workstreams of this workspace with their state: open, closed, discarded.</text><circle cx="36" cy="828" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text xml:space="preserve" x="54" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">"Reopen" brings a closed, not discarded workstream back: same chat, same agent conversation, same files — work continues where it was left.</text><circle cx="36" cy="850" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text xml:space="preserve" x="54" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">A discarded workstream has no files to return to, so no "Reopen" — only its chat can be read.</text><circle cx="36" cy="872" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><text xml:space="preserve" x="54" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">The stored chat is the terminal session as it looked — same colours and layout, scrollable, read-only while the workstream is closed.</text>
</svg>
