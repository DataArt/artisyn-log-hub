<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="916" viewBox="0 0 1200 916">
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="916" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="56" fill="#f4f4f5"/><line x1="0" y1="56" x2="1200" y2="56" stroke="#e4e4e7" stroke-width="1"/>
<text xml:space="preserve" x="24" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#c2410c" font-weight="700">WIREFRAME</text><text xml:space="preserve" x="112" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#18181b" font-weight="700">Workspace › Configure (container configuration session)</text>
<text xml:space="preserve" x="24" y="45" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#71717a">The wrench "Configure" opens a service terminal: the workspace’s agent installs tools into the workspace container on request. 1200 px, light theme.</text>
<rect x="24" y="72" width="1152" height="40" rx="0" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="40" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#18181b" font-weight="700">Artisyn AI Work Hub</text><text xml:space="preserve" x="204" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#52525b">› expenses-dashboard</text><text xml:space="preserve" x="726" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">History</text><text xml:space="preserve" x="786" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Settings</text><rect x="846" y="82" width="132" height="24" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text xml:space="preserve" x="912" y="98" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3730a3" font-weight="700" text-anchor="middle">[wrench] Configure</text><text xml:space="preserve" x="1160" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#52525b" text-anchor="end">dt@dataart.com · Logout</text><rect x="24" y="112" width="1152" height="44" rx="0" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="40" y="139" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#71717a" font-weight="700">WORKSTREAM</text><rect x="128" y="120" width="184.4" height="28" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text xml:space="preserve" x="220.2" y="138" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3730a3" font-weight="700" text-anchor="middle">main  (working branch)</text><rect x="324.4" y="120" width="138" height="28" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/><text xml:space="preserve" x="393.4" y="138" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">+ Open workstream</text><rect x="24" y="156" width="260" height="620" rx="0" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="38" y="178" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#71717a" font-weight="700">PROJECT</text><text xml:space="preserve" x="272" y="178" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#a1a1aa" text-anchor="end">main</text><line x1="24" y1="188" x2="284" y2="188" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="38" y="210" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46" font-weight="700">▾ expenses-dashboard</text><text xml:space="preserve" x="54" y="234" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">▾ data</text><text xml:space="preserve" x="70" y="258" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">expenses-q3.xlsx</text><text xml:space="preserve" x="54" y="282" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">▾ docs</text><text xml:space="preserve" x="70" y="306" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">requirements.md</text><text xml:space="preserve" x="54" y="330" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">README.md</text>
<rect x="284" y="156" width="892" height="34" rx="0" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/><rect x="284" y="156" width="220" height="34" rx="0" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="284" y="156" width="220" height="2.5" fill="#4f46e5"/><text xml:space="preserve" x="296" y="178" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" font-weight="700">[wrench] Configure container</text><text xml:space="preserve" x="488" y="178" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#a1a1aa">×</text><rect x="504" y="156" width="142" height="34" rx="0" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="516" y="178" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#52525b">requirements.md</text><text xml:space="preserve" x="630" y="178" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#a1a1aa">×</text><rect x="284" y="190" width="892" height="30" rx="0" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="296" y="209" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">Configuration session · agent in the workspace container · changes are saved as a checkpoint when it ends</text><rect x="1032" y="194" width="132" height="22" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4 3"/><text xml:space="preserve" x="1098" y="209" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46" text-anchor="middle">Finish configuration</text><rect x="284" y="220" width="892" height="556" rx="0" fill="#fdfdfc" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="300" y="250" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#c2410c" font-weight="700">✻ Claude Code</text><text xml:space="preserve" x="300" y="270" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#71717a">  /workspace/expenses-dashboard  ·  configuration session</text><text xml:space="preserve" x="300" y="290" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#71717a">  This session configures the container — do what the user asks.</text><text xml:space="preserve" x="300" y="310" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#27272a"></text><text xml:space="preserve" x="300" y="330" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b" font-weight="700">&gt; I want to save the dashboard as a PDF report too. Please add what is needed.</text><text xml:space="preserve" x="300" y="350" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#27272a"></text><text xml:space="preserve" x="300" y="370" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#27272a">● I’ll add a PDF converter to the workspace container.</text><text xml:space="preserve" x="300" y="390" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#27272a">● Bash(sudo apt-get install -y wkhtmltopdf)</text><text xml:space="preserve" x="300" y="410" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#71717a">  ⎿  Setting up wkhtmltopdf …  done</text><text xml:space="preserve" x="300" y="430" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#27272a">● Bash(wkhtmltopdf --version)</text><text xml:space="preserve" x="300" y="450" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#71717a">  ⎿  wkhtmltopdf 0.12.6</text><text xml:space="preserve" x="300" y="470" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#27272a"></text><text xml:space="preserve" x="300" y="490" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#27272a">● Done. The PDF converter is installed. Workstreams you open from now on</text><text xml:space="preserve" x="300" y="510" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#27272a">  will have it; workstreams that are already open keep what they had.</text><text xml:space="preserve" x="300" y="530" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#27272a"></text><text xml:space="preserve" x="300" y="550" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b" font-weight="700">&gt; ▍</text><rect x="300" y="600" width="560" height="120" rx="8" fill="#fafafa" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="316" y="624" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" font-weight="700">When the session ends</text><text xml:space="preserve" x="316" y="646" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">Saving the container setup…</text><rect x="316" y="656" width="528" height="6" rx="3" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="1"/><rect x="316" y="656" width="340" height="6" rx="3" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/><text xml:space="preserve" x="316" y="684" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#15803d">✓ Saved. New workstreams start with this setup.</text><text xml:space="preserve" x="316" y="704" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#a1a1aa" font-style="italic">No “undo to an earlier setup” in the alpha.</text><circle cx="990" cy="94" r="10" fill="#c2410c"/><text xml:space="preserve" x="990" y="98" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="670" cy="173" r="10" fill="#c2410c"/><text xml:space="preserve" x="670" y="177" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="900" cy="342" r="10" fill="#c2410c"/><text xml:space="preserve" x="900" y="346" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="1020" cy="205" r="10" fill="#c2410c"/><text xml:space="preserve" x="1020" y="209" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><circle cx="870" cy="660" r="10" fill="#c2410c"/><text xml:space="preserve" x="870" y="664" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">5</text>
<rect x="24" y="72" width="1152" height="704" rx="0" fill="none" stroke="#a1a1aa" stroke-width="1"/>
<circle cx="36" cy="806" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text xml:space="preserve" x="54" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">"Configure" (wrench) in the workspace header; available on the working-branch view, uses the workspace’s Claude login.</text><circle cx="36" cy="828" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text xml:space="preserve" x="54" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">The session is a terminal tab of its own, next to the file tabs — the same light-theme terminal as the workstream chat.</text><circle cx="36" cy="850" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text xml:space="preserve" x="54" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">The user asks in plain words; the agent, started with "this session configures the container", installs tools, libraries or settings into the workspace container.</text><circle cx="36" cy="872" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><text xml:space="preserve" x="54" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">How a session ends (an explicit button, the agent exiting, closing the tab) is still an open question — the dashed button is a placeholder.</text><circle cx="36" cy="894" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="898" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">5</text><text xml:space="preserve" x="54" y="898" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">On end the container’s own filesystem (not the repository/profile volumes) is saved as a checkpoint; workstreams opened later start from it. No rollback in the alpha.</text>
</svg>
