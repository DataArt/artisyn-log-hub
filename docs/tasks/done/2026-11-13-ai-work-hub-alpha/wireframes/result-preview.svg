ce="preserve" x="36" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text xml:space="preserve" x="54" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">"Download" saves the result to the user’s computer. The same file can also be dragged out of the tree.</text><circle cx="36" cy="850" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text xml:space="preserve" x="54" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Result files are ordinary files of the workstream: the user finds them in the tree, under the folder the agent named in the chat.</text>
