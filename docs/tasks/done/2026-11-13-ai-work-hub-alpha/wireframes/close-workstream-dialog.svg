<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="942" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="56" fill="#f4f4f5"/><line x1="0" y1="56" x2="1200" y2="56" stroke="#e4e4e7" stroke-width="1"/>
<text xml:space="preserve" x="24" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#c2410c" font-weight="700">WIREFRAME</text><text xml:space="preserve" x="112" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#18181b" font-weight="700">Workspace › Close workstream dialog</text>
<text xml:space="preserve" x="24" y="45" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#71717a">Closing is a button: bring the work into main, close it as already merged elsewhere, close for now, or discard everything after a confirmation. 1200 px, light theme.</text>
<rect x="24" y="72" width="1152" height="40" rx="0" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="40" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#18181b" font-weight="700">Artisyn AI Work Hub</text><text xml:space="preserve" x="204" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#52525b">› expenses-dashboard</text><text xml:space="preserve" x="846" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">History</text><text xml:space="preserve" x="906" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Settings</text><text xml:space="preserve" x="1160" y="97" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#52525b" text-anchor="end">dt@dataart.com · Logout</text><rect x="24" y="112" width="1152" height="44" rx="0" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="40" y="139" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#71717a" font-weight="700">WORKSTREAM</text><rect x="128" y="120" width="184.4" height="28" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="220.2" y="138" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46" text-anchor="middle">main  (working branch)</text><rect x="320.4" y="120" width="112.4" height="28" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text xml:space="preserve" x="376.59999999999997" y="138" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3730a3" font-weight="700" text-anchor="middle">Q3 dashboard</text><rect x="440.79999999999995" y="120" width="141.2" height="28" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="511.4" y="138" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46" text-anchor="middle">Add travel costs</text><rect x="594" y="120" width="138" height="28" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/><text xml:space="preserve" x="663" y="138" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">+ Open workstream</text><rect x="24" y="156" width="260" height="620" rx="0" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="38" y="178" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#71717a" font-weight="700">PROJECT</text><text xml:space="preserve" x="272" y="178" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#a1a1aa" text-anchor="end">Q3 dashboard</text><line x1="24" y1="188" x2="284" y2="188" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="38" y="210" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46" font-weight="700">▾ expenses-dashboard</text><text xml:space="preserve" x="54" y="234" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">▾ data</text><text xml:space="preserve" x="70" y="258" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">expenses-q3.xlsx</text><text xml:space="preserve" x="54" y="282" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">▾ docs</text><text xml:space="preserve" x="70" y="306" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">requirements.md</text><text xml:space="preserve" x="54" y="330" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">▾ output</text><text xml:space="preserve" x="70" y="354" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">dashboard.html</text><text xml:space="preserve" x="70" y="378" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">summary.xlsx</text><text xml:space="preserve" x="54" y="402" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">build-dashboard.js</text><text xml:space="preserve" x="54" y="426" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#3f3f46">README.md</text><rect x="284" y="156" width="892" height="34" rx="0" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/><rect x="284" y="156" width="180.8" height="34" rx="0" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="284" y="156" width="180.8" height="2.5" fill="#4f46e5"/><text xml:space="preserve" x="296" y="178" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" font-weight="700">📌 Chat · Q3 dashboard</text><rect x="464.8" y="156" width="134.8" height="34" rx="0" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="476.8" y="178" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#52525b">dashboard.html</text><text xml:space="preserve" x="583.6" y="178" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#a1a1aa">×</text><rect x="284" y="190" width="892" height="586" rx="0" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="284" y="190" width="892" height="36" rx="0" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="300" y="213" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">Claude is working on the server · workstream Q3 dashboard</text><rect x="1026" y="194" width="134" height="28" rx="6" fill="#fff" stroke="#dc2626" stroke-width="1"/><text xml:space="preserve" x="1093" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">Close workstream</text><rect x="284" y="226" width="892" height="550" rx="0" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/><text xml:space="preserve" x="304" y="254" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#b45309">✻ Claude Code</text><text xml:space="preserve" x="304" y="273" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#71717a">  /workspace/expenses-dashboard  ·  workstream Q3 dashboard</text><text xml:space="preserve" x="304" y="292" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b"></text><text xml:space="preserve" x="304" y="311" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#1d4ed8">&gt; Make a dashboard of Q3 expenses by department from the Excel file in data.</text><text xml:space="preserve" x="304" y="330" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b"></text><text xml:space="preserve" x="304" y="349" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b">● I’ll read data/expenses-q3.xlsx and build the page.</text><text xml:space="preserve" x="304" y="368" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#b45309">● Write(build-dashboard.js)</text><text xml:space="preserve" x="304" y="387" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#71717a">  ⎿  Wrote 84 lines</text><text xml:space="preserve" x="304" y="406" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#b45309">● Bash(node build-dashboard.js)</text><text xml:space="preserve" x="304" y="425" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#71717a">  ⎿  output/dashboard.html and output/summary.xlsx written</text><text xml:space="preserve" x="304" y="444" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b"></text><text xml:space="preserve" x="304" y="463" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#15803d">● Done. The page has a chart by department and a table of the ten largest costs.</text><text xml:space="preserve" x="304" y="482" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b"></text><text xml:space="preserve" x="304" y="501" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b">╭─ Which currency should the totals use? ───────────────────────────────╮</text><text xml:space="preserve" x="304" y="520" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#4338ca">│ ❯ 1. EUR                                                              │</text><text xml:space="preserve" x="304" y="539" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b">│   2. USD                                                              │</text><text xml:space="preserve" x="304" y="558" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b">│   3. Keep it as in the file                                           │</text><text xml:space="preserve" x="304" y="577" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b">╰───────────────────────────────────────────────────────────────────────╯</text><text xml:space="preserve" x="304" y="596" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#71717a">  ↑/↓ to choose · Enter to confirm · Esc to cancel</text><rect x="300" y="716" width="860" height="36" rx="4" fill="#ffffff" stroke="#a1a1aa" stroke-width="1"/><text xml:space="preserve" x="314" y="739" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#18181b">&gt; ▍</text><rect x="24" y="72" width="1152" height="704" rx="0" fill="none" stroke="#a1a1aa" stroke-width="1"/><rect x="24" y="72" width="1152" height="704" fill="#18181b" opacity="0.35"/><rect x="300" y="170" width="500" height="400" rx="10" fill="#fff" stroke="#d4d4d8" stroke-width="1" filter="url(#shadow)"/><text xml:space="preserve" x="324" y="206" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#18181b" font-weight="700">Close workstream “Q3 dashboard”</text><text xml:space="preserve" x="324" y="230" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#71717a">What should happen with the work made here?</text><rect x="324" y="248" width="452" height="150" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="344" cy="270" r="7" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><circle cx="344" cy="270" r="3.5" fill="#4f46e5"/><text xml:space="preserve" x="362" y="274" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#18181b" font-weight="700">Keep the work</text><text xml:space="preserve" x="362" y="294" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">Everything made here is saved. You can come back and continue later.</text><rect x="362" y="320" width="16" height="16" rx="3" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/><text xml:space="preserve" x="365" y="333" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700">✓</text><text xml:space="preserve" x="388" y="333" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" font-weight="700">Bring it into the main version now</text><text xml:space="preserve" x="388" y="352" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#71717a">or: Already merged elsewhere · Close for now</text><text xml:space="preserve" x="362" y="380" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#a1a1aa">Saved as: branch ws/q3-dashboard</text><rect x="324" y="410" width="452" height="84" rx="8" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><circle cx="344" cy="432" r="7" fill="#fff" stroke="#a1a1aa" stroke-width="1.5"/><text xml:space="preserve" x="362" y="436" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#18181b" font-weight="700">Discard everything</text><text xml:space="preserve" x="362" y="456" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">It came out wrong — delete all files made in this workstream.</text><text xml:space="preserve" x="362" y="473" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#52525b">You will be asked to confirm.</text><rect x="538" y="524" width="84" height="28" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="580" y="542" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" text-anchor="middle">Cancel</text><rect x="630" y="524" width="146" height="28" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1"/><text xml:space="preserve" x="703" y="542" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Close and keep</text><rect x="830" y="420" width="330" height="170" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1" filter="url(#shadow)"/><text xml:space="preserve" x="850" y="452" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#18181b" font-weight="700">Delete everything?</text><text xml:space="preserve" x="850" y="476" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#52525b">All files made in “Q3 dashboard” will be</text><text xml:space="preserve" x="850" y="494" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#52525b">deleted. This cannot be undone.</text><rect x="902" y="544" width="84" height="28" rx="6" fill="#fff" stroke="#d4d4d8" stroke-width="1"/><text xml:space="preserve" x="944" y="562" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#18181b" text-anchor="middle">Cancel</text><rect x="994" y="544" width="146" height="28" rx="6" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text xml:space="preserve" x="1067" y="562" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Delete everything</text><circle cx="788" cy="274" r="10" fill="#c2410c"/><text xml:space="preserve" x="788" y="278" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="788" cy="328" r="10" fill="#c2410c"/><text xml:space="preserve" x="788" y="332" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="788" cy="452" r="10" fill="#c2410c"/><text xml:space="preserve" x="788" y="456" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="1148" cy="440" r="10" fill="#c2410c"/><text xml:space="preserve" x="1148" y="444" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><circle cx="36" cy="806" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text xml:space="preserve" x="54" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Main path "Bring into main": Work Hub merges the branch into main; on a conflict main is unchanged and main is brought into the workstream for Claude.</text><circle cx="36" cy="828" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text xml:space="preserve" x="54" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Every close first checks for files not saved in the project: it lists them with "Back to chat" / "Close anyway". "Already merged elsewhere" removes the container.</text><circle cx="36" cy="850" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text xml:space="preserve" x="54" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">The other path: the user says the result is rubbish. Branch, worktree and container are deleted.</text><circle cx="36" cy="872" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><text xml:space="preserve" x="54" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Discard always asks for an explicit confirmation first; cancelling changes nothing.</text>
<circle cx="36" cy="894" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="898" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">5</text><text xml:space="preserve" x="54" y="898" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Closing while the agent is still working first asks "Claude is still working — close anyway?", then runs the same check.</text><circle cx="36" cy="916" r="9" fill="#c2410c"/><text xml:space="preserve" x="36" y="920" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">6</text><text xml:space="preserve" x="54" y="920" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#3f3f46">Keep stops the workstream container and keeps it with its files; "Reopen" in History starts it again with the same chat.</text>
</svg>
