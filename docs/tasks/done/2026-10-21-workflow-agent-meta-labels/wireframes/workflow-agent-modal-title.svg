  <line x1="160" y1="104" x2="780" y2="104" stroke="#f59e0b" stroke-dasharray="3 3"/>
  <text x="784" y="100" class="note">Title = agentRowLabel(agent): the</text>
  <text x="784" y="114" class="note">description when non-empty, else the</text>
  <text x="784" y="128" class="note">prompt-derived label (FR-4).</text>
