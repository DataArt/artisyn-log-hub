  <text x="135" y="145" class="muted" font-size="13" text-anchor="middle">Raw logs</text>

  <!-- body (unchanged) -->
  <text x="48" y="190" fill="#0ea5e9" font-size="13">✦</text>
  <text x="64" y="190" class="muted" font-size="12">2026-10-21 20:04:57</text>
  <text x="48" y="214" class="fg" font-size="13">›  2026-10-21-workflow-session-readability …</text>
  <line x1="44" y1="230" x2="744" y2="230" stroke="#e5e7eb"/>
  <text x="48" y="254" fill="#0ea5e9" font-size="13">✦</text>
  <text x="64" y="254" class="muted" font-size="12">2026-10-21 20:04:57   0:00:31</text>
  <text x="48" y="278" class="fg" font-size="13">›  [Workflow harness — computed task] The task text below was computed at runtime…</text>
  <text x="62" y="302" class="mono" font-size="12"><tspan fill="#059669">In</tspan> 18  <tspan fill="#e11d48">Out</tspan> 2,657  <tspan fill="#0284c7">cache_r</tspan> 30,951  <tspan fill="#7c3aed">cache_w</tspan> 35,086  <tspan fill="#7c3aed">Cost</tspan> $0.0603</text>
