  <text x="740" y="108" class="muted" font-size="16" text-anchor="end">✕</text>

  <!-- tabs -->
  <rect x="44" y="124" width="128" height="34" rx="6" fill="#f3f4f6"/>
  <rect x="48" y="128" width="50" height="26" rx="5" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
