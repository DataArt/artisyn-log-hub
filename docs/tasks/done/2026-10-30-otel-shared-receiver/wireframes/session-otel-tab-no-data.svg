<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <!-- Wireframe: session detail pane, OTEL tab, when the session has no OTEL data (FR-C7, FR-G5, AC-C1, AC-C3) -->
  <rect width="1200" height="860" fill="#ffffff"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="44" fill="#fafafa" stroke="#e4e4e7"/>
  <circle cx="22" cy="22" r="7" fill="#4f46e5"/>
  <text x="40" y="27" font-size="14" font-weight="600" fill="#18181b">Artisyn Log Hub</text>
  <text x="1040" y="27" fill="#71717a">user@example.com</text>
  <text x="1150" y="27" font-weight="600" fill="#18181b">Edit email</text>

  <!-- repo header -->
  <text x="20" y="72" font-family="Consolas, monospace" font-size="14" fill="#18181b">https://github.com/acme/repo-b</text>
  <line x1="0" y1="86" x2="1200" y2="86" stroke="#e4e4e7"/>
  <text x="20" y="110" font-weight="600" fill="#18181b">Sessions</text>
  <rect x="18" y="118" width="62" height="2" fill="#18181b"/>
  <text x="100" y="110" fill="#52525b">Analytics</text>
  <text x="180" y="110" fill="#52525b">Reports</text>
  <text x="250" y="110" fill="#52525b">Tools/MCP</text>
  <text x="335" y="110" fill="#52525b">OKF</text>
  <text x="380" y="110" fill="#52525b">OTEL</text>
  <text x="430" y="110" fill="#52525b">Settings</text>
  <line x1="0" y1="124" x2="1200" y2="124" stroke="#e4e4e7"/>

  <!-- session list (left) -->
  <rect x="0" y="124" width="300" height="736" fill="#ffffff" stroke="#e4e4e7"/>
  <rect x="0" y="140" width="300" height="80" fill="#f4f4f5"/>
  <rect x="0" y="140" width="3" height="80" fill="#2563eb"/>
  <text x="14" y="164" font-family="Consolas, monospace" font-weight="700" fill="#18181b">2026-10-30 10:12:04 | $4.2150</text>
  <text x="14" y="186" fill="#52525b">/adlc-lh:review add search filter</text>
  <rect x="14" y="196" width="40" height="16" rx="3" fill="#ecfdf5"/>
  <text x="20" y="208" font-family="Consolas, monospace" font-size="11" fill="#047857">main</text>
  <text x="14" y="250" font-family="Consolas, monospace" font-weight="700" fill="#18181b">2026-10-30 09:40:51 | $1.0832</text>
  <text x="14" y="272" fill="#52525b">fix flaky test in upload path</text>
  <text x="14" y="322" font-family="Consolas, monospace" font-weight="700" fill="#18181b">2026-10-29 17:03:22 | $7.9014</text>
  <text x="14" y="344" fill="#52525b">refactor receiver routing</text>

  <!-- session meta strip -->
  <rect x="300" y="124" width="900" height="100" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="316" y="146" font-size="10" fill="#71717a">START</text>
  <text x="316" y="164" font-family="Consolas, monospace" fill="#18181b">2026-10-30 09:58:11</text>
  <text x="476" y="146" font-size="10" fill="#71717a">END</text>
  <text x="476" y="164" font-family="Consolas, monospace" fill="#18181b">2026-10-30 10:12:04</text>
  <text x="636" y="146" font-size="10" fill="#71717a">COST</text>
  <text x="636" y="164" font-family="Consolas, monospace" font-weight="700" fill="#18181b">$4.2150</text>
  <!-- NEW: cost marker -->
  <rect x="704" y="152" width="178" height="18" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text x="714" y="165" font-size="11" fill="#9a3412">excl. utility calls (no OTEL) ⓘ</text>
  <text x="900" y="146" font-size="10" fill="#71717a">MODEL</text>
  <text x="900" y="164" font-family="Consolas, monospace" fill="#18181b">claude-opus-5-5</text>
  <text x="316" y="200" fill="#71717a" font-size="11">Hover ⓘ: "Log Hub-computed cost. Claude Code utility calls are not in the transcript and are only visible via OTEL. Why no OTEL? →"</text>

  <!-- session tabs -->
  <text x="330" y="252" fill="#52525b">Summary</text>
  <text x="404" y="252" fill="#52525b">Info</text>
  <text x="446" y="252" fill="#52525b">Logs</text>
  <text x="494" y="252" fill="#52525b">Bash</text>
  <text x="544" y="252" fill="#52525b">Charts</text>
  <text x="606" y="252" fill="#52525b">Statistics</text>
  <text x="690" y="252" fill="#52525b">Change surface</text>
  <text x="330" y="284" fill="#52525b">Tools/MCP</text>
  <text x="414" y="284" fill="#52525b">Raw Logs</text>
  <text x="490" y="284" fill="#52525b">System context anatomy</text>
  <text x="662" y="284" font-weight="600" fill="#18181b">OTEL</text>
  <rect x="656" y="292" width="44" height="2" fill="#18181b"/>
  <line x1="300" y1="296" x2="1200" y2="296" stroke="#e4e4e7"/>

  <!-- status line -->
  <text x="320" y="326" fill="#3f3f46">OTEL status:</text>
  <rect x="402" y="312" width="50" height="20" rx="10" fill="#f4f4f5" stroke="#a1a1aa"/>
  <text x="414" y="326" font-size="12" font-weight="600" fill="#3f3f46">none</text>
  <text x="464" y="326" fill="#71717a">reason managed-endpoint · hook 2.29.0 · Claude Code 2.1.314 · forward off</text>

  <!-- reason panel (dashed, like existing empty state) -->
  <rect x="380" y="350" width="740" height="330" rx="6" fill="#ffffff" stroke="#3f3f46" stroke-dasharray="4 3"/>
  <circle cx="750" cy="384" r="12" fill="none" stroke="#3f3f46" stroke-width="1.5"/>
  <line x1="742" y1="392" x2="758" y2="376" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="750" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#18181b">OTEL is managed by your organization</text>
  <text x="750" y="448" text-anchor="middle" fill="#52525b">Your admin's managed settings send Claude Code telemetry to another collector,</text>
  <text x="750" y="466" text-anchor="middle" fill="#52525b">so Log Hub received no OTEL data for this session. This is by design — nothing to fix on your side.</text>

  <rect x="420" y="488" width="320" height="120" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="434" y="510" font-weight="600" fill="#166534">Still works</text>
  <text x="434" y="532" fill="#166534">✓ Sessions, prompts, tools, files</text>
  <text x="434" y="552" fill="#166534">✓ Attribution, change surface</text>
  <text x="434" y="572" fill="#166534">✓ Log Hub-computed cost</text>

  <rect x="760" y="488" width="320" height="120" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <text x="774" y="510" font-weight="600" fill="#991b1b">Not available</text>
  <text x="774" y="532" fill="#991b1b">✗ OTEL cost chart, traces</text>
  <text x="774" y="552" fill="#991b1b">✗ Telemetry cost reconciliation</text>
  <text x="774" y="572" fill="#991b1b">✗ Utility-call cost</text>

  <rect x="568" y="626" width="200" height="34" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="668" y="648" text-anchor="middle" fill="#1d4ed8">Help: admin-managed OTEL</text>
  <rect x="780" y="626" width="160" height="34" rx="4" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="860" y="648" text-anchor="middle" fill="#18181b">Ask your admin…</text>

  <!-- details row -->
  <text x="380" y="712" font-size="12" fill="#71717a">Received by the receiver at Stop: logs 0 · metrics 0 · spans 0 · first record —</text>

  <!-- annotations -->
  <rect x="320" y="740" width="860" height="104" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="334" y="762" font-size="12" font-weight="600" fill="#92400e">Notes</text>
  <text x="334" y="782" font-size="12" fill="#92400e">• Title, body and help link change per reason (see otel-reason-messages.svg). "Still works / Not available" boxes appear for every reason.</text>
  <text x="334" y="800" font-size="12" fill="#92400e">• Session without otel_status (older hook): generic "No OTEL data for this session" + link to the troubleshooting checklist; no status line.</text>
  <text x="334" y="818" font-size="12" fill="#92400e">• state = partial: the chart renders as today, with a slim amber banner above it naming the missing signals + reason + help link.</text>
  <text x="334" y="836" font-size="12" fill="#92400e">• Cost marker in the meta strip (and the Summary "Cost" tile) shows only when the session has no OTEL cost data.</text>
</svg>
