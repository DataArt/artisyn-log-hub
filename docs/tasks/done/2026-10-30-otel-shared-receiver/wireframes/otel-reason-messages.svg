<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <!-- Wireframe: catalogue of "no OTEL data" messages per otel_status reason (FR-C3, FR-C7, FR-G4, FR-G5, AC-C3, AC-G2) -->
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="20" y="32" font-size="16" font-weight="700" fill="#18181b">OTEL tab — reason-specific messages (title / one-line body / help link)</text>
  <text x="20" y="52" font-size="12" fill="#71717a">Rendered inside the dashed empty-state panel (session) or as the coverage-banner tooltip (repository / team). Each link opens the matching in-app help section in user-docs/otel-tab.md.</text>

  <!-- header row -->
  <rect x="20" y="68" width="1160" height="32" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="32" y="89" font-size="12" font-weight="600" fill="#3f3f46">REASON</text>
  <text x="200" y="89" font-size="12" font-weight="600" fill="#3f3f46">TITLE</text>
  <text x="500" y="89" font-size="12" font-weight="600" fill="#3f3f46">BODY</text>
  <text x="1010" y="89" font-size="12" font-weight="600" fill="#3f3f46">HELP LINK</text>

  <g>
    <rect x="20" y="100" width="1160" height="56" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="32" y="118" width="128" height="20" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="42" y="132" font-family="Consolas, monospace" font-size="11" fill="#991b1b">managed-endpoint</text>
    <text x="200" y="133" font-weight="600" fill="#18181b">OTEL is managed by your organization</text>
    <text x="500" y="125" font-size="12" fill="#52525b">Managed settings send telemetry to another collector. Nothing to fix</text>
    <text x="500" y="143" font-size="12" fill="#52525b">on your side — only an admin can route it to Log Hub.</text>
    <text x="1010" y="133" font-size="12" fill="#1d4ed8" text-decoration="underline">Admin-managed OTEL</text>
  </g>
  <g>
    <rect x="20" y="156" width="1160" height="56" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="32" y="174" width="128" height="20" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="42" y="188" font-family="Consolas, monospace" font-size="11" fill="#991b1b">managed-disabled</text>
    <text x="200" y="189" font-weight="600" fill="#18181b">Telemetry is disabled by your organization</text>
    <text x="500" y="181" font-size="12" fill="#52525b">Managed settings turn Claude Code telemetry off. Everything except</text>
    <text x="500" y="199" font-size="12" fill="#52525b">OTEL tabs and utility-call cost keeps working.</text>
    <text x="1010" y="189" font-size="12" fill="#1d4ed8" text-decoration="underline">Admin-managed OTEL</text>
  </g>
  <g>
    <rect x="20" y="212" width="1160" height="56" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="32" y="230" width="128" height="20" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="48" y="244" font-family="Consolas, monospace" font-size="11" fill="#92400e">project-only</text>
    <text x="200" y="245" font-weight="600" fill="#18181b">OTEL keys are only in project settings</text>
    <text x="500" y="237" font-size="12" fill="#52525b">Claude Code 2.1.282+ ignores them there. Re-run the Log Hub installer</text>
    <text x="500" y="255" font-size="12" fill="#52525b">(it writes ~/.claude/settings.json) and restart Claude Code.</text>
    <text x="1010" y="245" font-size="12" fill="#1d4ed8" text-decoration="underline">Claude Code 2.1.282 change</text>
  </g>
  <g>
    <rect x="20" y="268" width="1160" height="56" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="32" y="286" width="128" height="20" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="44" y="300" font-family="Consolas, monospace" font-size="11" fill="#92400e">not-configured</text>
    <text x="200" y="301" font-weight="600" fill="#18181b">OTEL is not configured</text>
    <text x="500" y="293" font-size="12" fill="#52525b">No telemetry keys in user settings, or an existing collector was kept</text>
    <text x="500" y="311" font-size="12" fill="#52525b">("keep"). Re-run the installer and choose proxy or replace.</text>
    <text x="1010" y="301" font-size="12" fill="#1d4ed8" text-decoration="underline">Enable OTEL</text>
  </g>
  <g>
    <rect x="20" y="324" width="1160" height="56" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="32" y="342" width="128" height="20" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="48" y="356" font-family="Consolas, monospace" font-size="11" fill="#92400e">receiver-down</text>
    <text x="200" y="357" font-weight="600" fill="#18181b">The local OTEL receiver was not reachable</text>
    <text x="500" y="349" font-size="12" fill="#52525b">Check hook.log and ~/.artisyn/otel/receiver.log (port conflict, crash).</text>
    <text x="500" y="367" font-size="12" fill="#52525b">A new session usually restarts it.</text>
    <text x="1010" y="357" font-size="12" fill="#1d4ed8" text-decoration="underline">Troubleshooting</text>
  </g>
  <g>
    <rect x="20" y="380" width="1160" height="56" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="32" y="398" width="128" height="20" rx="10" fill="#f4f4f5" stroke="#a1a1aa"/>
    <text x="72" y="412" font-family="Consolas, monospace" font-size="11" fill="#3f3f46">unknown</text>
    <text x="200" y="413" font-weight="600" fill="#18181b">No OTEL data — cause not determined</text>
    <text x="500" y="405" font-size="12" fill="#52525b">Settings look right but nothing arrived. Run /status or claude doctor</text>
    <text x="500" y="423" font-size="12" fill="#52525b">and follow the checklist.</text>
    <text x="1010" y="413" font-size="12" fill="#1d4ed8" text-decoration="underline">Troubleshooting</text>
  </g>
  <g>
    <rect x="20" y="436" width="1160" height="56" fill="#fafafa" stroke="#e4e4e7"/>
    <text x="32" y="468" font-size="12" font-style="italic" fill="#71717a">(no otel_status)</text>
    <text x="200" y="469" font-weight="600" fill="#18181b">No OTEL data for this session</text>
    <text x="500" y="461" font-size="12" fill="#52525b">This session was uploaded by an older hook that does not report why.</text>
    <text x="500" y="479" font-size="12" fill="#52525b">Upgrade the hook to see the reason.</text>
    <text x="1010" y="469" font-size="12" fill="#1d4ed8" text-decoration="underline">OTEL tab is empty</text>
  </g>

  <text x="20" y="520" font-size="12" fill="#92400e">Chip colours: red = organization-managed (no user fix) · amber = user can fix · grey = unknown / not reported.</text>
  <text x="20" y="540" font-size="12" fill="#92400e">state = partial adds an amber banner above the normal chart: "Only logs and metrics arrived — spans missing (reason …). Help →".</text>
</svg>
