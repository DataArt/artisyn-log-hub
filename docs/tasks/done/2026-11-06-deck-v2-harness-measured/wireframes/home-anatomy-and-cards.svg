nomalies.</text><text x='860' y='540' font-family='Segoe UI, Arial, sans-serif' font-size='15' fill='#333333'></text><text x='860' y='588' font-family='Segoe UI, Arial, sans-serif' font-size='15' fill='#1f5a43'>Features → D</text><line x1='860' y1='592' x2='946.4' y2='592' stroke='#1f5a43' stroke-width='1'/><text x='64' y='646' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'>one card per dimension (5) + team scale (6th, ochre) — six cards; speed and autonomy both link to block I</text><text x='64' y='662' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'></text><line x1='64' y1='690' x2='1216' y2='690' stroke='#d9d4c7' stroke-width='1'/><text x='64' y='720' font-family='Segoe UI, Arial, sans-serif' font-size='15' fill='#333333'>Self-hosted · Docker + Postgres · one-command install · hook via npx · your data stays in-house. Get started →</text></svg>