<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='720' viewBox='0 0 1280 720'><rect x='0' y='0' width='1280' height='720' rx='0' fill='#e7e4da' stroke='none' stroke-width='1.5'/><rect x='26' y='16' width='1228' height='688' rx='0' fill='#faf8f3' stroke='#d9d4c7' stroke-width='1.5'/><rect x='16' y='14' width='122' height='28' rx='2' fill='#fff' stroke='#bbb' stroke-width='1.5'/><text x='28' y='33' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#1a1a1a'>← Log Hub site</text><rect x='800' y='60' width='36' height='22' rx='11' fill='#1f5a43' stroke='none' stroke-width='1.5'/><text x='818' y='76' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#fff' font-weight='700' text-anchor='middle'>P</text><rect x='840' y='60' width='36' height='22' rx='11' fill='#e6e2d6' stroke='none' stroke-width='1.5'/><text x='858' y='76' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#6b6b6b' font-weight='700' text-anchor='middle'>H</text><rect x='880' y='60' width='36' height='22' rx='11' fill='#e6e2d6' stroke='none' stroke-width='1.5'/><text x='898' y='76' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#6b6b6b' font-weight='700' text-anchor='middle'>Q</text><rect x='920' y='60' width='36' height='22' rx='11' fill='#e6e2d6' stroke='none' stroke-width='1.5'/><text x='938' y='76' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#6b6b6b' font-weight='700' text-anchor='middle'>$</text><rect x='960' y='60' width='36' height='22' rx='11' fill='#e6e2d6' stroke='none' stroke-width='1.5'/><text x='978' y='76' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#6b6b6b' font-weight='700' text-anchor='middle'>S</text><rect x='1000' y='60' width='36' height='22' rx='11' fill='#e6e2d6' stroke='none' stroke-width='1.5'/><text x='1018' y='76' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#6b6b6b' font-weight='700' text-anchor='middle'>A</text><rect x='1040' y='60' width='36' height='22' rx='11' fill='#e6e2d6' stroke='none' stroke-width='1.5'/><text x='1058' y='76' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#6b6b6b' font-weight='700' text-anchor='middle'>K</text><rect x='1080' y='60' width='36' height='22' rx='11' fill='#e6e2d6' stroke='none' stroke-width='1.5'/><text x='1098' y='76' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#6b6b6b' font-weight='700' text-anchor='middle'>T</text><rect x='1120' y='60' width='36' height='22' rx='11' fill='#e6e2d6' stroke='none' stroke-width='1.5'/><text x='1138' y='76' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#6b6b6b' font-weight='700' text-anchor='middle'>X</text><rect x='1160' y='60' width='36' height='22' rx='11' fill='#e6e2d6' stroke='none' stroke-width='1.5'/><text x='1178' y='76' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#6b6b6b' font-weight='700' text-anchor='middle'>F</text><text x='800' y='52' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'>storyline pills: exact letters set in implementation</text><text x='80' y='76' font-family='Segoe UI, Arial, sans-serif' font-size='15' fill='#1f5a43' letter-spacing='1.5'>THE HOOK</text><text x='80' y='112' font-family='JetBrains Mono, Consolas, monospace' font-size='32' fill='#1a1a1a' font-weight='700'>It ran alone for 10 minutes, cost $8</text><text x='80' y='154' font-family='JetBrains Mono, Consolas, monospace' font-size='32' fill='#1a1a1a' font-weight='700'>and shipped the feature. All good?</text><g transform='translate(0,18)'><text x='80' y='488' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'>thesis-slide structure (exempt from ≤3 bullets); figures from dataset: {{ds:session.durationMin}}, {{ds:session.total|usd0}}</text><rect x='80' y='168' width='300' height='300' rx='0' fill='#faf8f3' stroke='#1a1a1a' stroke-width='1.5'/><text x='104' y='204' font-family='JetBrains Mono, Consolas, monospace' font-size='20' fill='#1a1a1a' font-weight='700'>You already control</text><text x='104' y='228' font-family='Segoe UI, Arial, sans-serif' font-size='14' fill='#6b6b6b'>right and useful</text><text x='124' y='268' font-family='Segoe UI, Arial, sans-serif' font-size='19' fill='#333333'>$2,880 / month</text><text x='124' y='298' font-family='Segoe UI, Arial, sans-serif' font-size='19' fill='#333333'>$144 / day</text><text x='124' y='346' font-family='Segoe UI, Arial, sans-serif' font-size='40' fill='#1f5a43' font-weight='700'>$8</text><text x='178' y='346' font-family='Segoe UI, Arial, sans-serif' font-size='19' fill='#333333'>/ session</text><text x='104' y='380' font-family='Segoe UI, Arial, sans-serif' font-size='14' fill='#1f5a43'>✓ cost is tracked</text><text x='104' y='420' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#6b6b6b'>10 min · 65 turns · feature shipped</text><text x='104' y='448' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'>no "Illustrative example" label (FR-1a)</text><text x='395' y='324' font-family='Segoe UI, Arial, sans-serif' font-size='22' fill='#6b6b6b'>→</text><rect x='420' y='168' width='780' height='300' rx='0' fill='#faf8f3' stroke='#b5b0a3' stroke-width='1.5' stroke-dasharray='6 4'/><text x='444' y='204' font-family='JetBrains Mono, Consolas, monospace' font-size='20' fill='#1a1a1a' font-weight='700'>The number does not say</text><rect x='444' y='228' width='140' height='150' rx='3' fill='#eceee6' stroke='#1f5a43' stroke-width='1'/><text x='456' y='252' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#a0700f' font-weight='700'>01</text><text x='456' y='274' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700' letter-spacing='1'>QUALITY</text><text x='456' y='312' font-family='Segoe UI, Arial, sans-serif' font-size='16' fill='#1a1a1a'>Did it build</text><text x='456' y='336' font-family='Segoe UI, Arial, sans-serif' font-size='16' fill='#1a1a1a'>the right thing?</text><rect x='593' y='228' width='140' height='150' rx='3' fill='#eceee6' stroke='#1f5a43' stroke-width='1'/><text x='605' y='252' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#a0700f' font-weight='700'>02</text><text x='605' y='274' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700' letter-spacing='1'>COST</text><text x='605' y='312' font-family='Segoe UI, Arial, sans-serif' font-size='16' fill='#1a1a1a'>Was $8</text><text x='605' y='336' font-family='Segoe UI, Arial, sans-serif' font-size='16' fill='#1a1a1a'>a lot?</text><rect x='742' y='228' width='140' height='150' rx='3' fill='#eceee6' stroke='#1f5a43' stroke-width='1'/><text x='754' y='252' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#a0700f' font-weight='700'>03</text><text x='754' y='274' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700' letter-spacing='1'>SPEED</text><text x='754' y='312' font-family='Segoe UI, Arial, sans-serif' font-size='16' fill='#1a1a1a'>Was it</text><text x='754' y='336' font-family='Segoe UI, Arial, sans-serif' font-size='16' fill='#1a1a1a'>fast?</text><rect x='891' y='228' width='140' height='150' rx='3' fill='#eceee6' stroke='#1f5a43' stroke-width='1'/><text x='903' y='252' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#a0700f' font-weight='700'>04</text><text x='903' y='274' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700' letter-spacing='1'>AUTONOMY</text><text x='903' y='312' font-family='Segoe UI, Arial, sans-serif' font-size='16' fill='#1a1a1a'>How far could</text><text x='903' y='336' font-family='Segoe UI, Arial, sans-serif' font-size='16' fill='#1a1a1a'>it go alone?</text><rect x='1040' y='228' width='140' height='150' rx='3' fill='#eceee6' stroke='#1f5a43' stroke-width='1'/><text x='1052' y='252' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#a0700f' font-weight='700'>05</text><text x='1052' y='274' font-family='JetBrains Mono, Consolas, monospace' font-size='12' fill='#1f5a43' font-weight='700' letter-spacing='1'>SAFETY</text><text x='1052' y='312' font-family='Segoe UI, Arial, sans-serif' font-size='16' fill='#1a1a1a'>What did it</text><text x='1052' y='336' font-family='Segoe UI, Arial, sans-serif' font-size='16' fill='#1a1a1a'>read and send?</text><text x='444' y='410' font-family='Segoe UI, Arial, sans-serif' font-size='15' fill='#6b6b6b'>Answered one dimension at a time on the next slides — in this order.</text><text x='444' y='444' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'>tiles in dimension order: quality → cost → speed → autonomy → safety</text><rect x='80' y='500' width='1120' height='120' rx='0' fill='#eceee6' stroke='#1f5a43' stroke-width='1'/><text x='104' y='540' font-family='Segoe UI, Arial, sans-serif' font-size='20' fill='#1a1a1a'>Log Hub answers each question per session and across the team —</text><text x='104' y='572' font-family='Segoe UI, Arial, sans-serif' font-size='20' fill='#1a1a1a'>by harness element: CLAUDE.md, rules, skills, hooks, agents, MCP, KB, memory.</text><text x='104' y='604' font-family='Segoe UI, Arial, sans-serif' font-size='11' fill='#7a4fb5' font-style='italic'>replaces old "Log Hub answers" column; text kept within ≤40-word rule or step-10 exemption</text></g><line x1='80' y1='654' x2='1200' y2='654' stroke='#d9d4c7' stroke-width='1'/><text x='80' y='680' font-family='Segoe UI, Arial, sans-serif' font-size='13' fill='#6b6b6b'>https://dataart.github.io/artisyn-log-hub/</text><text x='1130' y='690' font-family='Segoe UI, Arial, sans-serif' font-size='15' fill='#6b6b6b' text-anchor='middle'>2 / 21</text><text x='1196' y='693' font-family='Segoe UI, Arial, sans-serif' font-size='44' fill='#b8c9bf'>‹</text><text x='1240' y='693' font-family='Segoe UI, Arial, sans-serif' font-size='44' fill='#1f5a43'>›</text></svg>