ont-size="10.5" fill="#111827">hasAdvisorResult</text><text x="800" y="388" font-size="10.5" fill="#6b7280">greyed</text><text x="862" y="388" font-size="10.5" fill="#6b7280">hidden</text><text x="930" y="388" font-size="10.5" fill="#6b7280">hidden</text><text x="32" y="432" font-size="12.5" fill="#111827" font-weight="700">Three doors into the map</text><rect x="32" y="442" width="300" height="92" rx="8" fill="#ffffff" stroke="#e5e7eb"/><circle cx="50" cy="462" r="10" fill="#2563eb"/><text x="50" y="466" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="66" y="466" font-size="12" fill="#111827" font-weight="600">Top nav "☰ All views"</text><text x="44" y="488" font-size="11" fill="#6b7280">always visible, shows Ctrl K;</text><text x="44" y="503" font-size="11" fill="#6b7280">opens #/map with the context of the page</text><text x="44" y="518" font-size="11" fill="#6b7280">you are on</text><rect x="352" y="442" width="300" height="92" rx="8" fill="#ffffff" stroke="#e5e7eb"/><circle cx="370" cy="462" r="10" fill="#2563eb"/><text x="370" y="466" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="386" y="466" font-size="12" fill="#111827" font-weight="600">Ctrl/Cmd+K from any page</text><text x="364" y="488" font-size="11" fill="#6b7280">also inside text inputs; opens the map</text><text x="364" y="503" font-size="11" fill="#6b7280">with the filter focused and the rail</text><text x="364" y="518" font-size="11" fill="#6b7280">prefilled from the current page</text><rect x="672" y="442" width="300" height="92" rx="8" fill="#ffffff" stroke="#e5e7eb"/><circle cx="690" cy="462" r="10" fill="#2563eb"/><text x="690" y="466" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="706" y="466" font-size="12" fill="#111827" font-weight="600">Home: "All views →" and per-repo</text><text x="684" y="488" font-size="11" fill="#6b7280">"All views of this repo" under each</text><text x="684" y="