<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" font-family="ui-monospace, Consolas, monospace">
  <rect width="1280" height="620" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#17201b">Wireframe: link preview built from Open Graph / Twitter card tags (FR4 candidate)</text>
  <text x="20" y="50" font-size="12" fill="#555">How a shared site URL (e.g. docs/install-hook.html) would look in a chat / social app once og:* tags exist. Today: bare URL, no card.</text>

  <!-- Chat message mock -->
  <rect x="20" y="70" width="700" height="530" fill="#f3f1ea" stroke="#b8b5a8"/>
  <circle cx="52" cy="104" r="16" fill="#d9d6ca"/>
  <text x="78" y="100" font-size="13" font-weight="bold" fill="#17201b" font-family="system-ui, Segoe UI, sans-serif">A teammate</text>
  <text x="78" y="118" font-size="13" fill="#17201b" font-family="system-ui, Segoe UI, sans-serif">How to install the hook:</text>
  <text x="78" y="138" font-size="13" fill="#1f5c45" text-decoration="underline" font-family="system-ui, Segoe UI, sans-serif">https://dataart.github.io/artisyn-log-hub/docs/install-hook.html</text>

  <!-- Card -->
  <rect x="78" y="154" width="600" height="420" fill="#faf9f4" stroke="#b8b5a8"/>
  <rect x="78" y="154" width="4" height="420" fill="#1f5c45"/>
  <!-- og:image area -->
  <rect x="94" y="168" width="572" height="300" fill="#e8e5db" stroke="#b8b5a8" stroke-dasharray="6 4"/>
  <line x1="94" y1="168" x2="666" y2="468" stroke="#d9d6ca"/>
  <line x1="666" y1="168" x2="94" y2="468" stroke="#d9d6ca"/>
  <rect x="226" y="296" width="308" height="44" fill="#faf9f4" stroke="#9a6614"/>
  <text x="380" y="316" font-size="12" fill="#9a6614" text-anchor="middle">og:image = assets/og-image.png (1200×630)</text>
  <text x="380" y="332" font-size="12" fill="#9a6614" text-anchor="middle">twitter:card = summary_large_image</text>
  <!-- favicon + site name -->
  <g transform="translate(94,480) scale(0.5)">
    <rect width="32" height="32" rx="16" fill="#3352cc"/>
    <rect x="8" y="11" width="16" height="2.4" rx="1.2" fill="#ffffff"/>
    <rect x="8" y="15" width="11" height="2.4" rx="1.2" fill="#c3cdfa"/>
    <rect x="8" y="19" width="14" height="2.4" rx="1.2" fill="#ffffff"/>
  </g>
  <text x="118" y="493" font-size="12" fill="#555">Artisyn Log Hub</text>
  <text x="94" y="520" font-size="15" font-weight="bold" fill="#1f5c45" font-family="system-ui, Segoe UI, sans-serif">Install the hook — Artisyn Log Hub</text>
  <text x="94" y="544" font-size="13" fill="#17201b" font-family="system-ui, Segoe UI, sans-serif">Install the Log Hub hook into a repository so Claude Code sessions are</text>
  <text x="94" y="562" font-size="13" fill="#17201b" font-family="system-ui, Segoe UI, sans-serif">sent to your Log Hub server…</text>

  <!-- Tag mapping panel -->
  <rect x="750" y="70" width="510" height="530" fill="#ffffff" stroke="#9a6614" stroke-dasharray="5 3"/>
  <text x="766" y="96" font-size="13" font-weight="bold" fill="#9a6614">Card field  ←  &lt;head&gt; tag (per page)</text>
  <text x="766" y="126" font-size="12" fill="#17201b">site name   ← og:site_name = SITE_NAME</text>
  <text x="766" y="150" font-size="12" fill="#17201b">icon        ← &lt;link rel="icon"&gt; assets/favicon.svg</text>
  <text x="766" y="174" font-size="12" fill="#17201b">title       ← og:title / twitter:title</text>
  <text x="766" y="192" font-size="12" fill="#555">              = the page &lt;title&gt;</text>
  <text x="766" y="216" font-size="12" fill="#17201b">description ← og:description / twitter:</text>
  <text x="766" y="234" font-size="12" fill="#17201b">              description = &lt;meta name=</text>
  <text x="766" y="252" font-size="12" fill="#17201b">              "description"&gt; (nav.json description)</text>
  <text x="766" y="276" font-size="12" fill="#17201b">link target ← og:url = &lt;link rel="canonical"&gt;</text>
  <text x="766" y="294" font-size="12" fill="#555">              = SITE_URL + output path</text>
  <text x="766" y="318" font-size="12" fill="#17201b">image       ← og:image (absolute URL) =</text>
  <text x="766" y="336" font-size="12" fill="#17201b">              SITE_URL + assets/og-image.png (1200×630)</text>
  <text x="766" y="354" font-size="12" fill="#17201b">              (twitter:card = summary_large_image)</text>

  <line x1="766" y1="380" x2="1244" y2="380" stroke="#d9d6ca"/>
  <text x="766" y="406" font-size="12" fill="#17201b">• Without og:image the card collapses to the</text>
  <text x="766" y="424" font-size="12" fill="#17201b">  lower part only (icon, site name, title,</text>
  <text x="766" y="442" font-size="12" fill="#17201b">  description).</text>
  <text x="766" y="466" font-size="12" fill="#17201b">• Deck (site/deck/index.html) gets the same</text>
  <text x="766" y="484" font-size="12" fill="#17201b">  tags hand-edited, using {{site:url}}.</text>
  <text x="766" y="508" font-size="12" fill="#17201b">• 404.html carries none of these (noindex).</text>
  <text x="766" y="532" font-size="12" fill="#17201b">• Exact card rendering is up to the consumer</text>
  <text x="766" y="550" font-size="12" fill="#17201b">  app; this shows only which tag feeds which</text>
  <text x="766" y="568" font-size="12" fill="#17201b">  field.</text>
</svg>
