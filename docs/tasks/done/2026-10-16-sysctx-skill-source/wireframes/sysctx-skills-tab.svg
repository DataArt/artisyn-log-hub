<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Inter, Segoe UI, Arial, sans-serif">
  <style>
    .mono { font-family: Consolas, 'JetBrains Mono', monospace; }
    .muted { fill: #6b7280; }
    .fg { fill: #1f2937; }
    .project { fill: #0284c7; }
    .user { fill: #d97706; }
    .plugin { fill: #7c3aed; }
    .note { fill: #b45309; font-size: 11px; font-style: italic; }
  </style>
  <rect width="1000" height="660" fill="#ffffff"/>

  <!-- panel -->
  <rect x="20" y="20" width="640" height="620" fill="#f7f5fd" stroke="#e5e7eb"/>
  <rect x="38" y="40" width="10" height="13" rx="2" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="58" y="52" font-size="14" font-weight="600" class="fg">System Context</text>
  <text x="178" y="52" font-size="12" class="muted">6 MCP · 23 tools · 41 skills · 6 agents</text>
  <text x="40" y="78" font-size="12" class="muted">⌄  Hide details</text>
  <line x1="38" y1="92" x2="642" y2="92" stroke="#e5e7eb"/>

  <!-- tabs -->
  <rect x="38" y="104" width="300" height="32" rx="6" fill="#ece9f3"/>
  <text x="52" y="125" font-size="12" class="fg">Files</text>
  <text x="96" y="125" font-size="12" class="fg">MCP</text>
  <text x="138" y="125" font-size="12" class="fg">Tools</text>
  <rect x="180" y="108" width="54" height="24" rx="4" fill="#ffffff"/>
  <text x="190" y="125" font-size="12" font-weight="600" class="fg">Skills</text>
  <text x="246" y="125" font-size="12" class="fg">Agents</text>
  <text x="298" y="125" font-size="12" class="fg">Rules</text>

  <!-- table header -->
  <text x="38" y="162" font-size="12" font-weight="500" class="muted">Name</text>
  <text x="330" y="162" font-size="12" font-weight="500" class="muted">Source</text>
  <text x="470" y="162" font-size="12" font-weight="500" class="muted" text-anchor="end">Tokens</text>
  <line x1="38" y1="170" x2="480" y2="170" stroke="#e5e7eb"/>

  <!-- rows -->
  <g font-size="12">
    <text x="38" y="192" class="mono fg">adlc-scripting</text>
    <text x="330" y="192" class="project">project</text>
    <text x="470" y="192" class="mono muted" text-anchor="end">~412 tok</text>

    <text x="38" y="216" class="mono fg">use-playwright</text>
    <text x="330" y="216" class="project">project</text>
    <text x="470" y="216" class="mono muted" text-anchor="end">~96 tok</text>

    <text x="38" y="240" class="mono fg">task-check-health</text>
    <text x="330" y="240" class="project">project</text>
    <text x="470" y="240" class="mono muted" text-anchor="end">~2.1K tok</text>

    <rect x="34" y="250" width="450" height="22" fill="#ede9f6"/>
    <text x="38" y="265" class="mono fg">my-skill</text>
    <text x="330" y="265" class="user">user</text>
    <text x="470" y="265" class="mono muted" text-anchor="end">~1.4K tok</text>

    <text x="38" y="289" class="mono fg">deploy-helper</text>
    <text x="330" y="289" class="user">user</text>
    <text x="470" y="289" class="mono muted" text-anchor="end">~3.8K tok</text>

    <text x="38" y="313" class="mono fg">deploy-helper-ci</text>
    <text x="330" y="313" class="user">user</text>
    <text x="470" y="313" class="mono muted" text-anchor="end">~1.2K tok</text>

    <text x="38" y="337" class="mono fg">adlc-lh:tracker</text>
    <text x="330" y="337" class="plugin">plugin</text>
    <text x="470" y="337" class="mono muted" text-anchor="end">~2.6K tok</text>

    <text x="38" y="361" class="mono fg">adlc-lh:review-deep</text>
    <text x="330" y="361" class="plugin">plugin</text>
    <text x="470" y="361" class="mono muted" text-anchor="end">~980 tok</text>

    <text x="38" y="385" class="mono fg">adlc-lh:check-health-wf</text>
    <text x="330" y="385" class="plugin">plugin</text>
    <text x="470" y="385" class="mono muted" text-anchor="end">~540 tok</text>

    <text x="38" y="409" class="mono muted">…</text>
  </g>

  <!-- hidden rows box -->
  <rect x="38" y="440" width="604" height="180" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <text x="52" y="462" font-size="12" font-weight="600" class="fg">Not shown (not in the session snapshot)</text>
  <text x="52" y="486" font-size="12" class="mono muted">loop · simplify · update-config · claude-api · run · init …</text>
  <text x="52" y="504" font-size="11" class="muted">Claude Code built-ins — never in the snapshot</text>
  <text x="52" y="530" font-size="12" class="mono muted">anthropic-skills:*</text>
  <text x="52" y="548" font-size="11" class="muted">also filtered out explicitly (FR-13)</text>
  <text x="52" y="574" font-size="12" class="mono muted">adlc:*</text>
  <text x="52" y="592" font-size="11" class="muted">plugin disabled in .claude/settings.json — not in the catalog (FR-1)</text>

  <!-- annotations -->
  <g class="note">
    <line x1="490" y1="192" x2="690" y2="192" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <text x="696" y="188">project = .claude/skills, .claude/workflows,</text>
    <text x="696" y="202">.claude/commands of the repo (sky, unchanged)</text>

    <line x1="490" y1="265" x2="690" y2="265" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <text x="696" y="261">NEW source "user" (~/.claude/…) — own color</text>
    <text x="696" y="275">in SourceBadge, e.g. amber (FR-15)</text>
    <text x="696" y="295">Highlighted row = hover; every row is</text>
    <text x="696" y="309">clickable → SkillDetailModal (FR-16)</text>

    <line x1="490" y1="337" x2="690" y2="337" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <text x="696" y="333">plugin names keep the namespace</text>
    <text x="696" y="347">&lt;plugin&gt;:&lt;skill&gt;, incl. workflow skills (*-wf);</text>
    <text x="696" y="361">version is shown in the modal, not here</text>

    <line x1="490" y1="216" x2="690" y2="226" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <text x="696" y="230">Tokens filled for every row</text>
    <text x="696" y="244">(bytes from snapshot, FR-16)</text>

    <line x1="380" y1="52" x2="690" y2="60" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <text x="696" y="56">"N skills" = rows actually shown (snapshot AND</text>
    <text x="696" y="70">skill_listing, or all snapshot rows if no listing)</text>

    <line x1="370" y1="125" x2="690" y2="125" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <text x="696" y="121">Files / MCP / Skills / Agents / Rules all come</text>
    <text x="696" y="135">from the one session snapshot (FR-13, FR-18)</text>
  </g>
</svg>
