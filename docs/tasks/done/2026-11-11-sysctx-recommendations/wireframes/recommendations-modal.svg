<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Inter, Arial, sans-serif">
  <style>
    .t{fill:#0f172a;font-size:12px}
    .b{fill:#0f172a;font-size:13px;font-weight:600}
    .m{fill:#64748b;font-size:12px}
    .s{fill:#64748b;font-size:11px}
    .hd{fill:#64748b;font-size:11px;font-weight:600}
    .num{fill:#0f172a;font-size:13px;text-anchor:end}
    .nm{fill:#94a3b8;font-size:12px;font-style:italic;text-anchor:end}
    .mono{font-family:Consolas, 'JetBrains Mono', monospace;fill:#334155;font-size:11px}
    .note{fill:#b45309;font-size:12px}
    .line{stroke:#e2e8f0;stroke-width:1}
    .badge{font-size:11px;font-weight:600}
  </style>
  <rect width="1120" height="1120" fill="#ffffff"/>
  <rect width="1120" height="1120" fill="#0f172a" opacity="0.35"/>
  <text x="20" y="24" fill="#ffffff" font-size="11" font-weight="600">WIREFRAME · Recommendations modal (FR-2 … FR-7) · data: local prod, repo 5389, session 2f225416-… (48,856 tokens)</text>

  <rect x="40" y="40" width="1040" height="1060" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="1040" y="56" width="24" height="24" rx="5" fill="#fff" stroke="#cbd5e1"/>
  <text x="1047" y="73" fill="#0f172a" font-size="14">✕</text>

  <!-- header -->
  <text x="64" y="80" fill="#0f172a" font-size="18" font-weight="600">Startup context recommendations</text>
  <text x="64" y="102" class="m">7 matched · measured rows ≈ 6,869 tokens (14.1 % of 48,856) · 2 rows not measured · Claude Code 2.1.314 · catalog v1</text>

  <!-- disclaimer (FR-6) -->
  <rect x="64" y="116" width="992" height="40" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="78" y="134" fill="#92400e" font-size="12">Curated notes about the current Claude Code version — they may be out of date. Verify every "how to disable" step on a new</text>
  <text x="78" y="149" fill="#92400e" font-size="12">session: open this tab again and check that the row is gone.</text>

  <!-- table header -->
  <text x="72" y="184" class="hd">GROUP</text>
  <text x="300" y="184" class="hd">WHAT IT IS FOR</text>
  <text x="660" y="184" class="hd" text-anchor="end">≈ TOKENS</text>
  <text x="680" y="184" class="hd">CONTROLLED BY</text>
  <text x="800" y="184" class="hd">HOW TO DISABLE OR REDUCE</text>
  <line x1="64" y1="194" x2="1056" y2="194" class="line"/>

  <!-- row 1: rarely needed built-in tools -->
  <g>
    <text x="72" y="216" class="b">Rarely needed built-in tools</text>
    <text x="72" y="234" class="s">6 tools: Artifact, Workflow,</text>
    <text x="72" y="249" class="s">ScheduleWakeup, SendFeedback,</text>
    <text x="72" y="264" class="s">ShareOnboardingGuide, ReportFindings</text>
    <text x="300" y="216" class="t">Tool JSON schemas Claude Code sends with</text>
    <text x="300" y="232" class="t">every request: pages, workflows, wake-ups,</text>
    <text x="300" y="248" class="t">feedback. Rarely used in a coding session.</text>
    <text x="660" y="216" class="nm">not measured</text>
    <text x="660" y="232" class="s" text-anchor="end">in Harness internals</text>
    <rect x="680" y="204" width="112" height="18" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/><text x="736" y="217" class="badge" fill="#334155" text-anchor="middle">Claude Code built-in</text>
    <text x="800" y="216" class="t">Deny in ~/.claude/settings.json:</text>
    <rect x="800" y="224" width="256" height="44" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="808" y="240" class="mono">"permissions": { "deny": [</text>
    <text x="808" y="256" class="mono">  "Artifact", "Workflow", … ] }</text>
    <rect x="1030" y="229" width="20" height="18" rx="3" fill="#fff" stroke="#cbd5e1"/><text x="1035" y="242" fill="#475569" font-size="11">⧉</text>
  </g>
  <line x1="64" y1="280" x2="1056" y2="280" class="line"/>

  <!-- row 2: Bash + PowerShell -->
  <g>
    <text x="72" y="302" class="b">Two shell tools</text>
    <text x="72" y="320" class="s">Bash + PowerShell</text>
    <text x="300" y="302" class="t">Both shells are offered on Windows; one of</text>
    <text x="300" y="318" class="t">them is usually enough.</text>
    <text x="660" y="302" class="nm">not measured</text>
    <rect x="680" y="290" width="112" height="18" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/><text x="736" y="303" class="badge" fill="#334155" text-anchor="middle">Claude Code built-in</text>
    <text x="800" y="302" class="t">permissions.deny the unused one:</text>
    <rect x="800" y="310" width="256" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="808" y="327" class="mono">"deny": ["PowerShell"]</text>
    <rect x="1030" y="314" width="20" height="18" rx="3" fill="#fff" stroke="#cbd5e1"/><text x="1035" y="327" fill="#475569" font-size="11">⧉</text>
  </g>
  <line x1="64" y1="348" x2="1056" y2="348" class="line"/>

  <!-- row 3: unauthenticated claude.ai connectors -->
  <g>
    <text x="72" y="370" class="b">claude.ai connectors, not signed in</text>
    <text x="72" y="388" class="s">22 connectors · 44 names</text>
    <text x="72" y="403" class="s">(authenticate / complete_authentication)</text>
    <text x="72" y="418" class="s">Gmail, Slack, Notion, Figma, … ▾</text>
    <text x="300" y="370" class="t">Connectors of your claude.ai account. Not</text>
    <text x="300" y="386" class="t">authorised, so each only adds two sign-in</text>
    <text x="300" y="402" class="t">stub tools — in every session of every project.</text>
    <text x="660" y="370" class="num">719</text>
    <text x="660" y="386" class="s" text-anchor="end">1.5 % · 1,942 B</text>
    <rect x="680" y="358" width="112" height="18" rx="9" fill="#ecfeff" stroke="#a5f3fc"/><text x="736" y="371" class="badge" fill="#0e7490" text-anchor="middle">claude.ai account</text>
    <text x="800" y="370" class="t">Turn claude.ai connectors off for Claude Code:</text>
    <rect x="800" y="378" width="256" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="808" y="395" class="mono">ENABLE_CLAUDEAI_MCP_SERVERS=false</text>
    <rect x="1030" y="382" width="20" height="18" rx="3" fill="#fff" stroke="#cbd5e1"/><text x="1035" y="395" fill="#475569" font-size="11">⧉</text>
    <text x="800" y="420" class="m">or remove them in claude.ai connector settings</text>
  </g>
  <line x1="64" y1="432" x2="1056" y2="432" class="line"/>

  <!-- row 4: Claude Docs / Claude Data instructions -->
  <g>
    <text x="72" y="454" class="b">Claude Docs / Claude Data</text>
    <text x="72" y="472" class="s">2 connectors · 19 tools</text>
    <text x="72" y="487" class="s">MCP instructions 2,979 B</text>
    <text x="300" y="454" class="t">claude.ai connectors with their own instruction</text>
    <text x="300" y="470" class="t">text in the prompt. Side effect: the model may</text>
    <text x="300" y="486" class="t">create a claude.ai doc instead of a repo file.</text>
    <text x="660" y="454" class="num">1,103</text>
    <text x="660" y="470" class="s" text-anchor="end">2.3 % · instr. only</text>
    <rect x="680" y="442" width="112" height="18" rx="9" fill="#ecfeff" stroke="#a5f3fc"/><text x="736" y="455" class="badge" fill="#0e7490" text-anchor="middle">claude.ai account</text>
    <text x="800" y="454" class="t">Same switch as above:</text>
    <rect x="800" y="462" width="256" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="808" y="479" class="mono">ENABLE_CLAUDEAI_MCP_SERVERS=false</text>
    <rect x="1030" y="466" width="20" height="18" rx="3" fill="#fff" stroke="#cbd5e1"/><text x="1035" y="479" fill="#475569" font-size="11">⧉</text>
    <text x="800" y="504" class="m">or disconnect Claude Docs / Data in claude.ai</text>
  </g>
  <line x1="64" y1="516" x2="1056" y2="516" class="line"/>

  <!-- row 5: org-synced skills -->
  <g>
    <text x="72" y="538" class="b">Organisation skills</text>
    <text x="72" y="556" class="s">15 skills · anthropic-skills:*</text>
    <text x="72" y="571" class="s">~/.claude/skills/synced/&lt;org&gt;/</text>
    <text x="300" y="538" class="t">Skills your claude.ai organisation pushes to</text>
    <text x="300" y="554" class="t">every member (docs, pptx, xlsx, aws-funding, …).</text>
    <text x="300" y="570" class="t">Only their listing lines are loaded at startup.</text>
    <text x="660" y="538" class="num">3,946</text>
    <text x="660" y="554" class="s" text-anchor="end">8.1 % · 10,654 B</text>
    <rect x="680" y="526" width="112" height="18" rx="9" fill="#f5f3ff" stroke="#ddd6fe"/><text x="736" y="539" class="badge" fill="#6d28d9" text-anchor="middle">organisation</text>
    <text x="800" y="538" class="t">Managed by your organisation — not</text>
    <text x="800" y="554" class="t">removable locally. Ask the claude.ai org</text>
    <text x="800" y="570" class="t">admin if most members do not need them.</text>
  </g>
  <line x1="64" y1="584" x2="1056" y2="584" class="line"/>

  <!-- row 6: user-level MCP servers -->
  <g>
    <text x="72" y="606" class="b">User-level MCP servers</text>
    <text x="72" y="624" class="s">playwright · 25 tools · connected</text>
    <text x="300" y="606" class="t">Declared in your user profile, so loaded in every</text>
    <text x="300" y="622" class="t">project — even ones that never use them.</text>
    <text x="660" y="606" class="num">326</text>
    <text x="660" y="622" class="s" text-anchor="end">0.7 % · 881 B</text>
    <rect x="680" y="594" width="112" height="18" rx="9" fill="#f0fdf4" stroke="#bbf7d0"/><text x="736" y="607" class="badge" fill="#15803d" text-anchor="middle">user profile</text>
    <text x="800" y="606" class="t">If only one project needs it, move it to that</text>
    <text x="800" y="622" class="t">project's .mcp.json and remove the user copy:</text>
    <rect x="800" y="630" width="256" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="808" y="647" class="mono">claude mcp remove playwright -s user</text>
    <rect x="1030" y="634" width="20" height="18" rx="3" fill="#fff" stroke="#cbd5e1"/><text x="1035" y="647" fill="#475569" font-size="11">⧉</text>
  </g>
  <line x1="64" y1="668" x2="1056" y2="668" class="line"/>

  <!-- row 7: auto-memory -->
  <g>
    <text x="72" y="690" class="b">Auto-memory</text>
    <text x="72" y="708" class="s"># Memory block + MEMORY.md index</text>
    <text x="300" y="690" class="t">Instructions that let Claude save notes across</text>
    <text x="300" y="706" class="t">sessions, plus the memory index it reads at start.</text>
    <text x="660" y="690" class="num">775</text>
    <text x="660" y="706" class="s" text-anchor="end">1.6 % · 2,092 B</text>
    <rect x="680" y="678" width="112" height="18" rx="9" fill="#f0fdf4" stroke="#bbf7d0"/><text x="736" y="691" class="badge" fill="#15803d" text-anchor="middle">user profile</text>
    <text x="800" y="690" class="t">Turn auto-memory off in Claude Code</text>
    <text x="800" y="706" class="t">settings (exact switch: verify — OQ).</text>
  </g>
  <line x1="64" y1="720" x2="1056" y2="720" class="line"/>

  <!-- annotations -->
  <text x="64" y="748" class="note">• One row per catalog entry (OQ: or one per item); matched items listed in the GROUP cell, long lists collapsed behind "… ▾".</text>
  <text x="64" y="766" class="note">• ≈ tokens = bytes / 2.7 like the rest of the tab; share of the session total. Measured rows equal the anatomy drill-down numbers</text>
  <text x="64" y="782" class="note">  (stub row = sum of claude_ai_* server rows; skills row = sum of org-synced skill rows). No row counts the same bytes twice.</text>
  <text x="64" y="800" class="note">• "not measured": tool schemas live in Harness internals today (OQ: take sizes from the prompt_snapshot tools → then a number).</text>
  <text x="64" y="818" class="note">• Only catalog text, names, counts and sizes in the DOM — no prompt, file or system-prompt text (FR-7). No network request (FR-3).</text>
  <text x="64" y="836" class="note">• ⧉ copies the snippet; a short "Copied" toast as elsewhere in the app. data-testid="sysctx-reco-row" data-reco-id="…" per row.</text>

  <!-- possible extra rows (open questions) -->
  <rect x="64" y="856" width="992" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="78" y="878" class="s" font-weight="600">OPTIONAL ROWS (open question — not in FR-4) · seen on repo 1, session b58f581a-…</text>
  <text x="78" y="904" class="b">Plugin skills</text>
  <text x="300" y="904" class="t">adlc-lh@1.3.1 · skills and workflows of one plugin</text>
  <rect x="680" y="892" width="112" height="18" rx="9" fill="#f0fdf4" stroke="#bbf7d0"/><text x="736" y="905" class="badge" fill="#15803d" text-anchor="middle">user / project</text>
  <rect x="800" y="890" width="256" height="22" rx="4" fill="#fff" stroke="#e2e8f0"/>
  <text x="808" y="905" class="mono">enabledPlugins: {"adlc-lh@artisyn": false}</text>
  <text x="78" y="940" class="b">MCP server failed to connect</text>
  <text x="300" y="940" class="t">comfyui · failed (CONNECTION_CLOSED) · 0 tools · 0 B</text>
  <rect x="680" y="928" width="112" height="18" rx="9" fill="#f0fdf4" stroke="#bbf7d0"/><text x="736" y="941" class="badge" fill="#15803d" text-anchor="middle">user / project</text>
  <text x="800" y="940" class="t">Fix it or remove it from the MCP config</text>
  <text x="78" y="976" class="b">Large user-level IDE servers</text>
  <text x="300" y="976" class="t">webstorm · 44 tools · 1,516 B (repo 1 and repo 56)</text>
  <text x="800" y="976" class="t">Same advice as "User-level MCP servers"</text>
  <text x="78" y="1004" class="s">Repo 5421 (Linux, WSL) has none of the stub / user-level rows: only Claude Docs / Data, org skills and memory would match.</text>

  <!-- footer -->
  <line x1="40" y1="1036" x2="1080" y2="1036" class="line"/>
  <text x="64" y="1068" class="m">Changes take effect in the next Claude Code session.</text>
  <rect x="980" y="1050" width="76" height="30" rx="6" fill="#0f172a"/>
  <text x="1018" y="1070" fill="#ffffff" font-size="13" text-anchor="middle">Close</text>
</svg>
