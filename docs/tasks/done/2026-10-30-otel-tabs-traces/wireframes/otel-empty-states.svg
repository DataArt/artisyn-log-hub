<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
<title>OTEL tabs empty states</title>
<rect x="0" y="0" width="1440" height="820" rx="0" fill="#ffffff"/>
<text x="24" y="36" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="#111827">OTEL tabs — empty and degraded states (old hooks, FR-22, AC-10, AC-11)</text><text x="24" y="58" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6b7280">The state is chosen from the session’s own data (no OTEL records / OTEL logs but no spans); the repository hook_version is used only for the upgrade hint. Never shown as an error.</text><rect x="24" y="80" width="452" height="720" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/><rect x="24" y="80" width="452" height="52" rx="8" fill="#f9fafb"/><line x1="24" y1="132" x2="476" y2="132" stroke="#e5e7eb" stroke-width="1"/><text x="38" y="102" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">A · Session without OTEL</text><text x="38" y="121" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6b7280">hook with OTEL disabled, or a pre-OTEL hook (AC-11)</text><text x="38" y="156" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Summary   Info   Logs   …   OKF</text><text x="254" y="156" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827">OTEL</text><rect x="250" y="162" width="38" height="2.5" rx="0" fill="#111827"/><line x1="24" y1="168" x2="476" y2="168" stroke="#e5e7eb" stroke-width="1"/><rect x="38" y="184" width="424" height="300" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" stroke-dasharray="5 4"/><circle cx="250" cy="228" r="22" fill="#eef0f3"/><text x="250" y="235" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#6b7280" text-anchor="middle">∅</text><text x="250" y="274" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">No OTEL data for this session</text><text x="250" y="296" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">This session was recorded without OpenTelemetry,</text><text x="250" y="313" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">so there are no cost charts or traces here.</text><text x="250" y="330" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">Cost, logs and every other tab work as before.</text><rect x="103" y="434" width="146" height="30" rx="6" fill="#111827"/><text x="176" y="454" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">How to enable OTEL</text><rect x="257" y="434" width="132" height="30" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/><text x="323" y="454" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">Upgrade the hook</text><text x="38" y="510" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6b7280">Both buttons open the in-app help (offline, no external link).</text><text x="38" y="528" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6b7280">Repository hook: 2.12.0 (reported) — used for the upgrade hint only.</text><circle cx="46" cy="566" r="9" fill="#7c3aed"/><text x="46" y="570" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="60" y="570" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#7c3aed">Neutral tone, no red, no error icon:</text><text x="60" y="584" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#7c3aed">an old-hook session is not "broken".</text><rect x="494" y="80" width="452" height="720" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/><rect x="494" y="80" width="452" height="52" rx="8" fill="#f9fafb"/><line x1="494" y1="132" x2="946" y2="132" stroke="#e5e7eb" stroke-width="1"/><text x="508" y="102" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">B · OTEL logs, no traces</text><text x="508" y="121" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6b7280">hook with OTEL logs/metrics only (AC-10)</text><text x="508" y="156" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Summary   Info   Logs   …   OKF</text><text x="724" y="156" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827">OTEL</text><rect x="720" y="162" width="38" height="2.5" rx="0" fill="#111827"/><line x1="494" y1="168" x2="946" y2="168" stroke="#e5e7eb" stroke-width="1"/><rect x="508" y="180" width="268" height="24" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><circle cx="521" cy="192" r="4" fill="#d97706"/><circle cx="521" cy="192" r="7" fill="none" stroke="#d97706" stroke-opacity=".35"/><text x="532" y="196" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#92400e">Slow updates · data at turn end / 60 s</text><rect x="508" y="214" width="424" height="150" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/><text x="520" y="234" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827">Session cost over time</text><line x1="548" y1="332" x2="916" y2="332" stroke="#9ca3af" stroke-width="1"/><text x="542" y="336" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="end">$0</text><line x1="548" y1="290" x2="916" y2="290" stroke="#eef0f3" stroke-width="1"/><text x="542" y="294" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="end">$1</text><line x1="548" y1="248" x2="916" y2="248" stroke="#eef0f3" stroke-width="1"/><text x="542" y="252" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="end">$2</text><rect x="561.8" y="315.2" width="46" height="16.8" rx="0" fill="#2f6fdb"/><rect x="561.8" y="314.4" width="46" height="0.8" rx="0" fill="#d9534f"/><text x="584.8" y="347" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">10:00</text><rect x="635.4" y="294.2" width="46" height="37.8" rx="0" fill="#2f6fdb"/><rect x="635.4" y="273.2" width="46" height="21" rx="0" fill="#3aa17e"/><rect x="635.4" y="271.1" width="46" height="2.1" rx="0" fill="#d9534f"/><text x="658.4" y="347" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">10:05</text><rect x="709" y="319.4" width="46" height="12.6" rx="0" fill="#2f6fdb"/><rect x="709" y="269" width="46" height="50.4" rx="0" fill="#3aa17e"/><rect x="709" y="267.3" width="46" height="1.7" rx="0" fill="#d9534f"/><text x="732" y="347" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">10:10</text><rect x="782.6" y="302.6" width="46" height="29.4" rx="0" fill="#2f6fdb"/><rect x="782.6" y="285.8" width="46" height="16.8" rx="0" fill="#3aa17e"/><rect x="782.6" y="282.4" width="46" height="3.4" rx="0" fill="#d9534f"/><text x="805.6" y="347" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">10:15</text><rect x="856.2" y="311" width="46" height="21" rx="0" fill="#2f6fdb"/><rect x="856.2" y="306.8" width="46" height="4.2" rx="0" fill="#3aa17e"/><rect x="856.2" y="304.3" width="46" height="2.5" rx="0" fill="#d9534f"/><text x="879.2" y="347" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">10:20</text><rect x="508" y="376" width="134.66666666666666" height="58" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/><text x="520" y="396" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#6b7280">OTEL cost</text><text x="520" y="422" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="700" fill="#111827">$5.12</text><rect x="652.6666666666666" y="376" width="134.66666666666666" height="58" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/><text x="664.6666666666666" y="396" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#6b7280">Hidden cost</text><text x="664.6666666666666" y="422" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="700" fill="#d9534f">$0.25</text><rect x="797.3333333333333" y="376" width="134.66666666666666" height="58" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/><text x="809.3333333333333" y="396" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#6b7280">API calls</text><text x="809.3333333333333" y="422" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="700" fill="#111827">141</text><text x="508" y="452" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b7280">Cost by query_source …</text><rect x="508" y="466" width="424" height="236" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/><text x="520" y="488" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">Traces</text><rect x="520" y="500" width="400" height="190" rx="8" fill="#fffdf7" stroke="#fde68a" stroke-width="1" stroke-dasharray="5 4"/><circle cx="720" cy="544" r="22" fill="#fef3c7"/><text x="720" y="551" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">⧗</text><text x="720" y="590" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">No traces for this session</text><text x="720" y="612" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">Recorded by a hook without trace support.</text><text x="720" y="629" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">Charts and hidden calls above come from OTEL logs.</text><rect x="650" y="640" width="132" height="30" rx="6" fill="#111827"/><text x="716" y="660" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Upgrade the hook</text><circle cx="516" cy="732" r="9" fill="#7c3aed"/><text x="516" y="736" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="530" y="736" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#7c3aed">Charts, KPIs and the hidden breakdown are full (FR-19);</text><text x="530" y="750" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#7c3aed">only the waterfall is replaced, live says "slow".</text><rect x="964" y="80" width="452" height="720" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/><rect x="964" y="80" width="452" height="52" rx="8" fill="#f9fafb"/><line x1="964" y1="132" x2="1416" y2="132" stroke="#e5e7eb" stroke-width="1"/><text x="978" y="102" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#111827">C · Repository OTEL tab, no data</text><text x="978" y="121" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6b7280">no OTEL record in the selected period / filters</text><text x="978" y="156" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Summary   Info   Logs   …   OKF</text><text x="1194" y="156" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827">OTEL</text><rect x="1190" y="162" width="38" height="2.5" rx="0" fill="#111827"/><line x1="964" y1="168" x2="1416" y2="168" stroke="#e5e7eb" stroke-width="1"/><rect x="978" y="180" width="424" height="40" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/><text x="990" y="205" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#374151">Period 1w · All models · All versions · Calls: All</text><rect x="978" y="236" width="424" height="270" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" stroke-dasharray="5 4"/><circle cx="1190" cy="280" r="22" fill="#eef0f3"/><text x="1190" y="287" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#6b7280" text-anchor="middle">∅</text><text x="1190" y="326" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">No OTEL data in this period</text><text x="1190" y="348" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">None of the 12 sessions in this period carries</text><text x="1190" y="365" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">OTEL records. 3 older sessions do —</text><text x="1190" y="382" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">widen the period to see them.</text><rect x="1057" y="456" width="104" height="30" rx="6" fill="#111827"/><text x="1109" y="476" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Show 1 month</text><rect x="1169" y="456" width="146" height="30" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/><text x="1242" y="476" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">How to enable OTEL</text><text x="978" y="534" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6b7280">If OTEL exists but no session has traces, the tab works fully;</text><text x="978" y="551" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6b7280">the sessions table shows traces = "no" and an upgrade hint.</text><circle cx="986" cy="590" r="9" fill="#7c3aed"/><text x="986" y="594" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1000" y="594" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#7c3aed">Mixed hooks (several machines, upgrades mid-way)</text><text x="1000" y="608" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#7c3aed">are normal: each session decides its own state.</text>
</svg>
