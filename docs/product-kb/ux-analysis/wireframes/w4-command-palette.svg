<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:13px;fill:#1f2937}
    .s{font-size:12px;fill:#6b7280}
    .g{font-size:10px;font-weight:700;fill:#6b7280;letter-spacing:.06em}
    .note{font-size:12px;fill:#b45309}
  </style>
  <rect width="900" height="480" fill="#e5e7eb"/>
  <text x="20" y="28" class="s">(app dimmed behind the overlay)</text>

  <rect x="150" y="40" width="600" height="400" rx="8" fill="#fff" stroke="#d1d5db" filter="drop-shadow(0 6px 14px rgba(0,0,0,.18))"/>
  <text x="170" y="74" font-size="15" fill="#111827">🔍  cost</text>
  <rect x="226" y="60" width="1.5" height="18" fill="#2563eb"/>
  <line x1="150" y1="92" x2="750" y2="92" stroke="#e5e7eb"/>

  <text x="170" y="116" class="g">SESSION TABS · current session 3f2a…</text>
  <rect x="158" y="124" width="584" height="26" rx="4" fill="#dbeafe"/>
  <text x="176" y="142" class="t" font-weight="600">Statistics</text><text x="420" y="142" class="s">tokens, cache, cost by turn</text>
  <text x="176" y="170" class="t">Charts › Call tree</text><text x="420" y="170" class="s">cost per call</text>
  <text x="176" y="196" class="t">OTEL</text><text x="420" y="196" class="s">hidden-call cost</text>

  <text x="170" y="228" class="g">REPOSITORY · log-hub</text>
  <text x="176" y="252" class="t">Reports › Cost by User</text>
  <text x="176" y="278" class="t">Reports › Cost by Branch</text>
  <text x="176" y="304" class="t">Analytics › Cost</text>

  <text x="170" y="336" class="g">HELP</text>
  <text x="176" y="360" class="t">How cost is calculated</text>

  <line x1="150" y1="400" x2="750" y2="400" stroke="#e5e7eb"/>
  <text x="170" y="424" class="s">↑↓ move   ·   Enter open   ·   Esc close</text>

  <text x="20" y="466" class="note">Entries come from the tab registry (label + description + synonyms), the left-nav data and user-docs/nav.json. No backend.</text>
</svg>
