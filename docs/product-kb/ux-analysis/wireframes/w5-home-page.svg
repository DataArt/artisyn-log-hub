<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:13px;fill:#1f2937}
    .s{font-size:11px;fill:#6b7280}
    .h{font-size:12px;font-weight:600;fill:#374151}
    .q{font-size:14px;font-weight:600;fill:#111827}
    .lnk{font-size:12px;fill:#2563eb}
    .box{fill:#fff;stroke:#d1d5db}
    .panel{fill:#f9fafb;stroke:#d1d5db}
    .note{font-size:12px;fill:#b45309}
  </style>
  <rect width="1200" height="700" fill="#fff"/>
  <rect x="0" y="0" width="1200" height="44" fill="#1f2937"/>
  <text x="16" y="28" font-size="15" font-weight="700" fill="#fff">Log Hub</text>
  <rect x="820" y="10" width="230" height="24" rx="4" fill="#374151"/>
  <text x="832" y="27" font-size="12" fill="#d1d5db">🔍 Jump to…            Ctrl+K</text>

  <rect x="0" y="44" width="170" height="656" class="panel"/>
  <text x="16" y="74" class="h">Teams</text>
  <text x="16" y="102" class="h">My Repos</text>
  <text x="16" y="130" class="h">API Keys</text>
  <text x="16" y="158" class="h">Installed Hooks</text>
  <circle cx="140" cy="154" r="8" fill="#f59e0b"/><text x="137" y="158" font-size="10" fill="#fff">1</text>
  <text x="16" y="186" class="h">Admin</text>

  <text x="196" y="82" font-size="20" font-weight="600" fill="#111827">What do you want to find?</text>

  <!-- question cards -->
  <g>
    <rect x="196" y="100" width="300" height="92" rx="8" class="box"/>
    <text x="214" y="130" class="q">Why was a session expensive?</text>
    <text x="214" y="174" class="lnk">→ lens Cost</text>
    <rect x="510" y="100" width="300" height="92" rx="8" class="box"/>
    <text x="528" y="130" class="q">Which tools fail most?</text>
    <text x="528" y="174" class="lnk">→ Tools/MCP, failed only</text>
    <rect x="824" y="100" width="300" height="92" rx="8" class="box"/>
    <text x="842" y="130" class="q">Is my hook healthy?</text>
    <text x="842" y="174" class="lnk">→ Hook state</text>
    <rect x="196" y="204" width="300" height="92" rx="8" class="box"/>
    <text x="214" y="234" class="q">What does Claude load at startup?</text>
    <text x="214" y="278" class="lnk">→ lens Harness</text>
    <rect x="510" y="204" width="300" height="92" rx="8" class="box"/>
    <text x="528" y="234" class="q">Is my CLAUDE.md being used?</text>
    <text x="528" y="278" class="lnk">→ OKF / Harness usage</text>
  </g>

  <!-- needs attention -->
  <rect x="196" y="320" width="456" height="150" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="214" y="346" class="h">Needs attention</text>
  <text x="214" y="376" class="t">⚠  hook on dt-laptop: 2 errors</text>
  <text x="214" y="404" class="t">●  3f2a: 3 failed tool calls</text>
  <text x="214" y="432" class="t">●  2 sessions with advisor tips</text>
  <text x="214" y="458" class="s">each line opens the exact view</text>

  <!-- this week -->
  <rect x="668" y="320" width="456" height="150" rx="8" class="box"/>
  <text x="686" y="346" class="h">This week</text>
  <text x="686" y="378" class="t">log-hub</text><text x="840" y="378" class="t">$38.20</text>
  <g fill="#93c5fd"><rect x="940" y="366" width="10" height="12"/><rect x="954" y="360" width="10" height="18"/><rect x="968" y="354" width="10" height="24"/><rect x="982" y="368" width="10" height="10"/><rect x="996" y="350" width="10" height="28"/></g>
  <text x="686" y="410" class="t">platform-api</text><text x="840" y="410" class="t">$12.05</text>
  <g fill="#93c5fd"><rect x="940" y="400" width="10" height="10"/><rect x="954" y="400" width="10" height="10"/><rect x="968" y="396" width="10" height="14"/><rect x="982" y="404" width="10" height="6"/><rect x="996" y="400" width="10" height="10"/></g>
  <text x="686" y="442" class="t" font-weight="600">team Platform</text><text x="840" y="442" class="t" font-weight="600">$50.25</text>
  <text x="686" y="462" class="s">from session_stats, no transcript scans</text>

  <!-- recent / pinned -->
  <rect x="196" y="486" width="456" height="120" rx="8" class="box"/>
  <text x="214" y="512" class="h">Recent</text>
  <text x="214" y="542" class="t">3f2a · log-hub · Summary</text>
  <text x="214" y="568" class="t">91bc · log-hub · Logs</text>
  <text x="214" y="592" class="s">per viewer, localStorage</text>

  <rect x="668" y="486" width="456" height="120" rx="8" class="box"/>
  <text x="686" y="512" class="h">Pinned</text>
  <text x="686" y="542" class="t">★ log-hub › Reports › Executive Summary</text>
  <text x="686" y="568" class="t">★ Analytics › Cost by user, 30 days</text>
  <text x="686" y="592" class="s">per user, user settings (follows across devices)</text>

  <text x="196" y="640" class="note">Every card is a deep link into an existing view, with the matching lens and filters preset. Nothing new to learn — the home page teaches the UI.</text>
  <text x="196" y="662" class="note">Respects private-repo and team visibility. A new aggregate endpoint, if needed, gets a contract registry row.</text>
</svg>
