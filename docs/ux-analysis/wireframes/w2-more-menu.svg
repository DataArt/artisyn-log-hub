<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:13px;fill:#1f2937}
    .s{font-size:11px;fill:#6b7280}
    .g{font-size:10px;font-weight:700;fill:#6b7280;letter-spacing:.06em}
    .box{fill:#fff;stroke:#d1d5db}
    .note{font-size:12px;fill:#b45309}
  </style>
  <rect width="820" height="470" fill="#fff"/>
  <!-- tab bar fragment -->
  <line x1="10" y1="20" x2="810" y2="20" stroke="#e5e7eb"/>
  <text x="20" y="38" class="g">TRANSCRIPT</text>
  <text x="220" y="38" class="g">EFFECTS</text>
  <line x1="208" y1="28" x2="208" y2="68" stroke="#d1d5db"/>
  <text x="20" y="60" class="t">Logs</text>
  <text x="66" y="60" class="t">Bash</text>
  <rect x="100" y="48" width="24" height="16" rx="8" fill="#e5e7eb"/><text x="105" y="60" font-size="10" fill="#374151">34</text>
  <text x="220" y="60" class="t">Change surface</text>
  <rect x="420" y="44" width="74" height="24" rx="4" fill="#eff6ff" stroke="#2563eb"/><text x="432" y="61" class="t">More ▴</text>
  <line x1="10" y1="72" x2="810" y2="72" stroke="#e5e7eb"/>

  <!-- dropdown -->
  <rect x="300" y="78" width="300" height="370" rx="6" class="box" filter="drop-shadow(0 4px 8px rgba(0,0,0,.12))"/>
  <text x="316" y="102" class="g">COST &amp; CONTEXT</text>
  <text x="332" y="126" class="t">Statistics</text>
  <text x="332" y="150" class="t">Charts</text>
  <text x="332" y="174" class="t">System context anatomy</text>
  <text x="332" y="198" class="t">Harness usage</text>
  <text x="332" y="222" class="t">OTEL</text>
  <text x="316" y="252" class="g">EFFECTS</text>
  <text x="332" y="276" class="t">Tools/MCP</text>
  <text x="510" y="276" font-size="12" fill="#b45309">3 failed ⚠</text>
  <text x="332" y="300" class="t" fill="#9ca3af">OKF</text>
  <text x="510" y="300" class="s">(empty)</text>
  <text x="316" y="330" class="g">TRANSCRIPT</text>
  <text x="332" y="354" class="t">Raw Logs</text>
  <line x1="310" y1="372" x2="590" y2="372" stroke="#e5e7eb"/>
  <text x="316" y="398" font-size="13" fill="#2563eb">Show all tabs (lens: All)</text>
  <text x="316" y="428" class="s">Every existing tab is still one click away.</text>

  <text x="620" y="130" class="note">Opening a tab from More</text>
  <text x="620" y="148" class="note">keeps the lens.</text>
  <text x="620" y="180" class="note">tab= in the URL always</text>
  <text x="620" y="198" class="note">wins over the lens.</text>
  <text x="620" y="230" class="note">Scenarios reach tabs here</text>
  <text x="620" y="248" class="note">via a helper that opens</text>
  <text x="620" y="266" class="note">the menu first.</text>
</svg>
