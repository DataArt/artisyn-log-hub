server.modules = ("mod_alias", "mod_cgi")
server.document-root = "/var/www"
server.port = 80
server.username = "lighttpd"
server.groupname = "lighttpd"
# no accesslog module: the proxy never logs request headers or bodies
alias.url = ("/git" => "/usr/local/bin/wh-git-cgi", "/msg" => "/usr/local/bin/wh-msg-cgi")
$HTTP["url"] =~ "^/(git|msg)" {
  cgi.assign = ("" => "")
}
