# tmux is the server-side session holder: invisible to the user, no status bar, no prefix key
# that could swallow a Ctrl combination the CLI needs.
set -g status off
set -g prefix None
unbind-key C-b
set -g escape-time 0
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g extended-keys on
set -g allow-passthrough on
set -g window-size latest
set -g remain-on-exit on
set -g mouse off
