<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Work Hub terminal PoC</title>
  <!-- PoC only: from a CDN. The product bundles xterm.js via npm (offline first). -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; font-family: sans-serif; }
    #bar { padding: 6px 10px; border-bottom: 1px solid #ddd; font-size: 13px; color: #333; }
    #term { position: absolute; top: 32px; left: 0; right: 0; bottom: 0; padding: 4px; }
  </style>
</head>
<body>
<div id="bar">session: <b id="name"></b> <span id="state"></span></div>
<div id="term"></div>
<script>
  // Light theme: light background, dark text, ANSI colours mapped to a light palette.
  const lightTheme = {
    background: '#ffffff', foreground: '#1f2328', cursor: '#1f2328', cursorAccent: '#ffffff',
    selectionBackground: '#b6d6fd',
    black: '#24292f', red: '#cf222e', green: '#116329', yellow: '#7d4e00', blue: '#0969da',
    magenta: '#8250df', cyan: '#1b7c83', white: '#6e7781',
    brightBlack: '#57606a', brightRed: '#a40e26', brightGreen: '#1a7f37', brightYellow: '#633c01',
    brightBlue: '#218bff', brightMagenta: '#a475f9', brightCyan: '#3192aa', brightWhite: '#8c959f',
  };
  const params = new URLSearchParams(location.search);
  const session = params.get('session') || 'demo';
  const historyMode = params.has('history');
  document.getElementById('name').textContent = session + (historyMode ? ' (history, read-only)' : '');

  const term = new Terminal({ theme: lightTheme, fontFamily: 'Consolas, monospace', fontSize: 14,
    scrollback: 10000, disableStdin: historyMode, allowProposedApi: true });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));
  fit.fit();
  window.term = term; // for automated checks

  if (historyMode) {
    fetch('/history?session=' + encodeURIComponent(session))
      .then(r => r.arrayBuffer())
      .then(buf => term.write(new Uint8Array(buf)));
  } else {
    const ws = new WebSocket(`ws://${location.host}/ws?session=${encodeURIComponent(session)}`);
    ws.binaryType = 'arraybuffer';
    const enc = new TextEncoder();
    const sendResize = () => ws.readyState === 1 &&
      ws.send(JSON.stringify({ cols: term.cols, rows: term.rows }));
    ws.onopen = () => { document.getElementById('state').textContent = 'connected'; sendResize(); };
    ws.onclose = () => { document.getElementById('state').textContent = 'disconnected'; };
    ws.onmessage = e => term.write(new Uint8Array(e.data));
    term.onData(d => ws.readyState === 1 && ws.send(enc.encode(d)));
    term.onBinary(d => ws.readyState === 1 &&
      ws.send(Uint8Array.from(d, c => c.charCodeAt(0) & 0xff)));
    term.onResize(sendResize);
    window.addEventListener('resize', () => fit.fit());
  }
</script>
</body>
</html>
