<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Session Map — Artisyn Log Hub</title>
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --line: #e2e8f0; --line2: #cbd5e1; --text: #0f172a; --muted: #64748b; --soft: #94a3b8;
    --blue: #3b82f6; --green: #22c55e; --orange: #f97316; --red: #ef4444; --amber: #f59e0b;
    --f-explore: #0ea5e9; --f-edit: #10b981; --f-shell: #f59e0b; --f-mcp: #8b5cf6; --f-orch: #ec4899; --f-other: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  .mono { font-family: Consolas, "Cascadia Code", monospace; }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }

  header { display: flex; align-items: center; gap: 22px; padding: 10px 18px; background: var(--card); border-bottom: 1px solid var(--line); }
  header .title { font-weight: 600; } header .prompt { color: var(--muted); font-size: 12px; }
  header .kpi { display: flex; gap: 22px; margin-left: auto; }
  header .kpi div { text-align: right; } header .kpi b { display: block; font-size: 16px; } header .kpi span { font-size: 11px; color: var(--muted); }
  header .kpi .err b { color: var(--red); }

  main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  #mapWrap { overflow: auto; position: relative; }
  #map { position: relative; padding: 18px 24px 40px; min-width: max-content; }
  #wires { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; font-size: 12px; color: var(--muted); }
  .chip { border: 1px solid var(--line2); background: var(--card); border-radius: 999px; padding: 3px 10px; cursor: pointer; font: inherit; color: var(--text); }
  .chip.on { border-color: var(--blue); background: #eff6ff; color: #1d4ed8; }
  .zone { display: inline-flex; gap: 10px; margin-left: auto; }
  .zone i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer;
    transition: opacity .25s, box-shadow .15s, border-color .15s; position: relative; }
  .card:hover { border-color: var(--line2); box-shadow: 0 2px 8px rgba(15, 23, 42, .06); }
  .card.sel { border-color: var(--blue); box-shadow: 0 0 0 2px #bfdbfe; }
  .card.future { opacity: .38; border-style: dashed; }
  .card.running::after { content: "running"; position: absolute; top: -8px; right: 8px; background: var(--blue); color: #fff;
    font-size: 10px; padding: 0 6px; border-radius: 999px; animation: pulse 1.4s infinite; }
  .card.dim { opacity: .3; }
  @keyframes pulse { 50% { opacity: .55; } }
  .card .h { display: flex; gap: 6px; align-items: baseline; }
  .card .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .card .badge { font-size: 11px; color: var(--red); white-space: nowrap; }
  .card .meta { color: var(--muted); font-size: 11px; display: flex; gap: 8px; }
  .bar { height: 6px; background: #f1f5f9; border-radius: 3px; overflow: hidden; display: flex; margin: 4px 0 2px; }
  .bar > span { display: block; height: 100%; }
  .row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .row .bar { flex: 1; margin: 0; }
  .row b { color: var(--text); font-weight: 600; }

  #root { width: 520px; margin: 0 auto 34px; padding: 10px 14px; }
  #root .name { font-size: 14px; }
  #cols { display: flex; gap: 22px; align-items: flex-start; }
  .col { width: 250px; }
  .group { border-left: 3px solid var(--f-mcp); margin-bottom: 10px; }
  .group.direct { border-left-color: var(--f-orch); }
  .agents { position: relative; padding-left: 16px; display: flex; flex-direction: column; gap: 8px; }
  .agents::before { content: ""; position: absolute; left: 6px; top: -10px; bottom: 18px; border-left: 1px solid var(--line2); }
  .agents .card::before { content: ""; position: absolute; left: -11px; top: 18px; width: 10px; border-top: 1px solid var(--line2); }

  aside { border-left: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; min-height: 0; }
  aside .head { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  aside .head .name { font-weight: 600; font-size: 14px; }
  aside .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 8px; font-size: 12px; }
  aside .stats span { color: var(--muted); }
  aside .fam { padding: 8px 14px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; }
  aside .log { overflow: auto; flex: 1; }
  aside .log div { display: grid; grid-template-columns: 62px 96px 1fr 14px; gap: 6px; padding: 3px 14px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
  aside .log div:hover { background: #f8fafc; }
  aside .log div.past { color: var(--text); } aside .log div.fut { color: var(--soft); }
  aside .log div.now { background: #eff6ff; }
  aside .log .t { color: var(--muted); } aside .log .tool { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside .log .x { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } aside .log .e { color: var(--red); font-weight: 700; }
  aside .empty { padding: 20px 14px; color: var(--muted); }

  footer { background: var(--card); border-top: 1px solid var(--line); padding: 8px 18px 10px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; }
  footer .ctl { display: flex; gap: 6px; align-items: center; }
  footer button { border: 1px solid var(--line2); background: var(--card); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  footer button.on { border-color: var(--blue); color: #1d4ed8; background: #eff6ff; }
  #now { min-width: 150px; color: var(--muted); }
  #tl { width: 100%; height: 64px; display: block; cursor: col-resize; }
  footer .legend { grid-column: 2; display: flex; gap: 12px; font-size: 11px; color: var(--muted); }
  footer .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Session map</div>
    <div class="prompt mono" id="prompt"></div>
  </div>
  <div class="kpi">
    <div><b class="mono" id="kCost">$0</b><span>cost so far / total</span></div>
    <div><b class="mono" id="kAgents">0</b><span>agents</span></div>
    <div><b class="mono" id="kCalls">0</b><span>tool calls</span></div>
    <div class="err"><b class="mono" id="kErr">0</b><span>failed calls</span></div>
    <div><b class="mono" id="kDur">0</b><span>wall time</span></div>
  </div>
</header>

<main>
  <div id="mapWrap">
    <div id="map">
      <svg id="wires"></svg>
      <div class="toolbar">
        <span>Highlight:</span>
        <button class="chip on" data-hl="none">none</button>
        <button class="chip" data-hl="errors">with failed calls</button>
        <button class="chip" data-hl="top">top 5 by cost</button>
        <span style="margin-left:14px">Order:</span>
        <button class="chip on" data-sort="time">start time</button>
        <button class="chip" data-sort="cost">cost</button>
        <span class="zone">Cost bar:
          <span><i style="background:var(--green)"></i>&lt; 25 % of max</span>
          <span><i style="background:var(--blue)"></i>25–75 %</span>
          <span><i style="background:var(--orange)"></i>&gt; 75 %</span>
        </span>
      </div>
      <div id="root" class="card"></div>
      <div id="cols"></div>
    </div>
  </div>
  <aside id="side"><div class="empty">Click a card to see the agent's calls.</div></aside>
</main>

<footer>
  <div class="ctl">
    <button id="play">▶ Play</button>
    <button data-speed="60">60×</button><button data-speed="300" class="on">300×</button><button data-speed="1200">1200×</button>
    <button id="end">End</button>
    <span id="now" class="mono"></span>
  </div>
  <canvas id="tl"></canvas>
  <div></div>
  <div class="legend">
    <span><i style="background:var(--f-explore)"></i>Read · Grep · Glob</span>
    <span><i style="background:var(--f-edit)"></i>Edit · Write</span>
    <span><i style="background:var(--f-shell)"></i>Bash · PowerShell</span>
    <span><i style="background:var(--f-mcp)"></i>MCP</span>
    <span><i style="background:var(--f-orch)"></i>Skill · Agent · Workflow</span>
    <span><i style="background:var(--f-other)"></i>other</span>
    <span><i style="background:var(--red)"></i>failed call</span>
    <span><i style="background:var(--amber);height:2px"></i>cumulative cost</span>
  </div>
</footer>

<script src="../2026-11-01-2137-session-galaxy-3d/data.js"></script>
<script>
'use strict';
const DATA = window.SESSION_GALAXY;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = (v) => '$' + (v || 0).toFixed(2);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// ---------- tool families ----------
const FAMILIES = [
  ['explore', /^(Read|Grep|Glob)$/], ['edit', /^(Edit|Write|MultiEdit|NotebookEdit)$/], ['shell', /^(Bash|PowerShell|Monitor)$/],
  ['mcp', /^mcp:/], ['orch', /^(Skill|Agent|Task|Workflow|ToolSearch|TaskStop|CronCreate|CronDelete)$/],
];
const family = (n) => (FAMILIES.find(([, re]) => re.test(n)) || ['other'])[0];
const FAM_ORDER = ['explore', 'edit', 'shell', 'mcp', 'orch', 'other'];
const famColor = (f) => css('--f-' + f);

// ---------- model ----------
const nodes = DATA.nodes.map((n) => ({ ...n, ev: (n.ev || []).slice().sort((a, b) => a.t - b.t) }));
const byId = new Map(nodes.map((n) => [n.id, n]));
const root = nodes.find((n) => n.kind === 'root');
for (const n of nodes) {
  const sumW = n.ev.reduce((a, e) => a + (e.w || 0), 0);
  let acc = 0;
  for (const e of n.ev) { acc += (n.cost || 0) * (sumW > 0 ? (e.w || 0) / sumW : 1 / n.ev.length); e.acc = acc; }
  n.tools = n.ev.filter((e) => e.k === 'tool');
  n.t0 = n.ev.length ? n.ev[0].t : n.t0; n.t1 = n.ev.length ? n.ev[n.ev.length - 1].t : n.t0;
}
const agents = nodes.filter((n) => n.kind === 'agent');
const allEv = nodes.flatMap((n) => n.ev.map((e) => ({ ...e, node: n.id })) ).sort((a, b) => a.t - b.t);
const T0 = allEv[0].t; const T1 = allEv[allEv.length - 1].t;
const totalCost = nodes.reduce((a, n) => a + (n.cost || 0), 0);
const maxAgentCost = Math.max(...agents.map((a) => a.cost || 0));

// groups: workflow runs in start order + agents spawned directly by the root
const groups = nodes.filter((n) => n.kind === 'wf').map((w) => ({ id: w.id, label: w.label.replace(/ · \d+ agents$/, ''), kind: 'wf', members: agents.filter((a) => a.parent === w.id) }));
const direct = agents.filter((a) => a.parent === root.id);
if (direct.length) groups.push({ id: 'direct', label: 'Agents spawned by the main session', kind: 'direct', members: direct });
for (const g of groups) {
  g.cost = g.members.reduce((a, m) => a + (m.cost || 0), 0);
  g.t0 = Math.min(...g.members.map((m) => m.t0)); g.t1 = Math.max(...g.members.map((m) => m.t1));
  g.err = g.members.reduce((a, m) => a + m.tools.filter((e) => e.err).length, 0);
  g.calls = g.members.reduce((a, m) => a + m.tools.length, 0);
}
groups.sort((a, b) => a.t0 - b.t0);

// ---------- state ----------
let now = T1; let playing = false; let speed = 300; let selected = null; let hl = 'none'; let sortBy = 'time';
let famFilter = null;

function zoneColor(v, max) { const r = max > 0 ? v / max : 0; return r < 0.25 ? css('--green') : r <= 0.75 ? css('--blue') : css('--orange'); }
function dur(ms) { const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }
function clock(t) { const d = new Date(t); return d.toISOString().slice(11, 16); }
function costAt(n, t) { let c = 0; for (const e of n.ev) { if (e.t > t) break; c = e.acc; } return c; }
function callsAt(n, t) { return n.tools.filter((e) => e.t <= t); }
function ctxLimit(n) { return n.ctx > 200000 ? 1000000 : 200000; }

function mixBar(calls) {
  const counts = {}; for (const e of calls) counts[family(e.n)] = (counts[family(e.n)] || 0) + 1;
  const total = calls.length || 1;
  return '<div class="bar">' + FAM_ORDER.filter((f) => counts[f]).map((f) => `<span style="width:${(counts[f] / total) * 100}%;background:${famColor(f)}" title="${f}: ${counts[f]}"></span>`).join('') + '</div>';
}
function topTools(calls, k) {
  const c = {}; for (const e of calls) c[e.n] = (c[e.n] || 0) + 1;
  return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, k).map(([n, v]) => `${esc(n)} ${v}`).join(' · ');
}

function cardState(n) {
  if (n.t0 > now) return 'future';
  if (n.t1 >= now && n.t0 <= now) return 'running';
  return 'done';
}

function agentCard(n) {
  const calls = callsAt(n, now); const errs = calls.filter((e) => e.err).length;
  const spent = costAt(n, now); const share = totalCost ? (n.cost / totalCost) * 100 : 0;
  const zc = zoneColor(n.cost, maxAgentCost);
  const ctxPct = Math.min(100, (n.ctx / ctxLimit(n)) * 100);
  return `
    <div class="h"><span class="name" title="${esc(n.label)}">${esc(n.label)}</span>${errs ? `<span class="badge">✗ ${errs} failed</span>` : ''}</div>
    <div class="row"><b class="mono">${money(n.cost)}</b><div class="bar"><span style="width:${(spent / maxAgentCost) * 100}%;background:${zc}"></span><span style="width:${((n.cost - spent) / maxAgentCost) * 100}%;background:${zc};opacity:.25"></span></div><span>${share.toFixed(0)}%</span></div>
    ${mixBar(calls)}
    <div class="meta"><span>${calls.length} calls</span><span>${esc(topTools(calls, 2))}</span></div>
    <div class="row" title="peak context ${Math.round(n.ctx / 1000)}k of ${ctxLimit(n) / 1000}k"><span>ctx</span><div class="bar"><span style="width:${ctxPct}%;background:var(--blue)"></span></div><span class="mono">${Math.round(n.ctx / 1000)}k</span><span>${dur(n.t1 - n.t0)}</span></div>`;
}

function groupCard(g) {
  const calls = g.members.flatMap((m) => callsAt(m, now)); const errs = calls.filter((e) => e.err).length;
  return `
    <div class="h"><span class="name">${esc(g.label)}</span>${errs ? `<span class="badge">✗ ${errs}</span>` : ''}</div>
    <div class="meta"><span><b class="mono" style="color:var(--text)">${money(g.cost)}</b></span><span>${g.members.length} agents</span><span>${calls.length} calls</span><span>${dur(g.t1 - g.t0)}</span></div>
    ${mixBar(calls)}`;
}

function rootCard() {
  const calls = callsAt(root, now); const errs = calls.filter((e) => e.err).length;
  const ctxPct = Math.min(100, (root.ctx / ctxLimit(root)) * 100);
  return `
    <div class="h"><span class="name">Main session</span>${errs ? `<span class="badge">✗ ${errs} failed</span>` : ''}<span class="mono" style="color:var(--muted)">${esc(root.model || '')}</span></div>
    <div class="row"><span>own cost</span><b class="mono">${money(root.cost)}</b><span>· whole tree</span><b class="mono">${money(totalCost)}</b><span>· own share ${((root.cost / totalCost) * 100).toFixed(0)}%</span></div>
    ${mixBar(calls)}
    <div class="meta"><span>${calls.length} calls</span><span>${esc(topTools(calls, 4))}</span></div>
    <div class="row"><span>peak ctx</span><div class="bar"><span style="width:${ctxPct}%;background:var(--blue)"></span></div><span class="mono">${Math.round(root.ctx / 1000)}k / ${ctxLimit(root) / 1000}k</span></div>`;
}

function highlightClass(n) {
  if (hl === 'errors') return n.tools.some((e) => e.err) ? '' : ' dim';
  if (hl === 'top') { const top = agents.slice().sort((a, b) => b.cost - a.cost).slice(0, 5); return top.includes(n) ? '' : ' dim'; }
  return '';
}

function render() {
  $('root').className = 'card ' + cardState(root) + (selected === root.id ? ' sel' : '');
  $('root').innerHTML = rootCard();
  $('root').onclick = () => select(root.id);
  const cols = $('cols'); cols.innerHTML = '';
  for (const g of groups) {
    const col = document.createElement('div'); col.className = 'col';
    const gc = document.createElement('div');
    gc.className = 'card group' + (g.kind === 'direct' ? ' direct' : '') + (g.t0 > now ? ' future' : '');
    gc.dataset.group = g.id; gc.innerHTML = groupCard(g);
    col.appendChild(gc);
    const list = document.createElement('div'); list.className = 'agents';
    const members = g.members.slice().sort(sortBy === 'cost' ? (a, b) => b.cost - a.cost : (a, b) => a.t0 - b.t0);
    for (const m of members) {
      const c = document.createElement('div');
      c.className = 'card ' + cardState(m) + (selected === m.id ? ' sel' : '') + highlightClass(m);
      c.innerHTML = agentCard(m); c.onclick = () => select(m.id);
      list.appendChild(c);
    }
    col.appendChild(list); cols.appendChild(col);
  }
  const calls = allEv.filter((e) => e.k === 'tool' && e.t <= now);
  $('kCost').textContent = money(nodes.reduce((a, n) => a + costAt(n, now), 0)) + ' / ' + money(totalCost);
  $('kAgents').textContent = agents.filter((a) => a.t0 <= now).length + ' / ' + agents.length;
  $('kCalls').textContent = calls.length;
  $('kErr').textContent = calls.filter((e) => e.err).length;
  $('kDur').textContent = dur(Math.max(0, Math.min(now, T1) - T0));
  $('now').textContent = clock(now) + ' UTC · ' + (now >= T1 ? 'end' : dur(now - T0) + ' in');
  wires(); renderSide(); drawTimeline();
}

function wires() {
  const svg = $('wires'); const map = $('map').getBoundingClientRect();
  const r = $('root').getBoundingClientRect();
  const x0 = r.left + r.width / 2 - map.left; const y0 = r.bottom - map.top;
  let d = '';
  document.querySelectorAll('[data-group]').forEach((el) => {
    const b = el.getBoundingClientRect(); const x1 = b.left + 24 - map.left; const y1 = b.top - map.top; const ym = y0 + (y1 - y0) / 2;
    d += `M${x0},${y0} V${ym} H${x1} V${y1} `;
  });
  svg.setAttribute('width', $('map').scrollWidth); svg.setAttribute('height', $('map').scrollHeight);
  svg.innerHTML = `<path d="${d}" fill="none" stroke="${css('--line2')}" stroke-width="1.2"/>`;
}

function select(id) { selected = id; famFilter = null; render(); }

function renderSide() {
  const side = $('side');
  if (!selected) { side.innerHTML = '<div class="empty">Click a card to see its calls. Click a call to move the timeline there.</div>'; return; }
  const n = byId.get(selected);
  const calls = n.tools; const errs = calls.filter((e) => e.err).length;
  const counts = {}; for (const e of calls) counts[family(e.n)] = (counts[family(e.n)] || 0) + 1;
  const rows = calls.filter((e) => !famFilter || (famFilter === 'err' ? e.err : family(e.n) === famFilter));
  side.innerHTML = `
    <div class="head">
      <div class="name">${esc(n.kind === 'root' ? 'Main session' : n.label)}</div>
      <div class="stats">
        <span>Cost</span><b class="mono">${money(n.cost)} (${((n.cost / totalCost) * 100).toFixed(0)}%)</b>
        <span>Model</span><b class="mono">${esc(n.model || '—')}</b>
        <span>Calls</span><b class="mono">${calls.length}${errs ? ` · <span style="color:var(--red)">${errs} failed</span>` : ''}</b>
        <span>Peak context</span><b class="mono">${Math.round(n.ctx / 1000)}k / ${ctxLimit(n) / 1000}k</b>
        <span>Active</span><b class="mono">${clock(n.t0)}–${clock(n.t1)} (${dur(n.t1 - n.t0)})</b>
        <span>Cost per call</span><b class="mono">${calls.length ? money(n.cost / calls.length) : '—'}</b>
      </div>
    </div>
    <div class="fam">
      <button class="chip ${famFilter ? '' : 'on'}" data-fam="">all ${calls.length}</button>
      ${FAM_ORDER.filter((f) => counts[f]).map((f) => `<button class="chip ${famFilter === f ? 'on' : ''}" data-fam="${f}"><span style="color:${famColor(f)}">●</span> ${f} ${counts[f]}</button>`).join('')}
      ${errs ? `<button class="chip ${famFilter === 'err' ? 'on' : ''}" data-fam="err"><span style="color:var(--red)">●</span> failed ${errs}</button>` : ''}
    </div>
    <div class="log mono">${rows.map((e) => `<div class="${e.t <= now ? 'past' : 'fut'}" data-t="${e.t}"><span class="t">${new Date(e.t).toISOString().slice(11, 19)}</span><span class="tool" style="color:${e.err ? css('--red') : famColor(family(e.n))}">${esc(e.n)}</span><span class="x" title="${esc(e.x)}">${esc(e.x || '')}</span><span class="e">${e.err ? '✗' : ''}</span></div>`).join('') || '<div class="empty">no calls</div>'}</div>`;
  side.querySelectorAll('[data-fam]').forEach((b) => b.onclick = () => { famFilter = b.dataset.fam || null; renderSide(); });
  side.querySelectorAll('[data-t]').forEach((r) => r.onclick = () => { now = Number(r.dataset.t); playing = false; setPlay(); render(); });
}

// ---------- timeline: stacked calls per bin by family, failures, cumulative cost ----------
const tl = $('tl');
function drawTimeline() {
  const w = tl.clientWidth; const h = tl.clientHeight; tl.width = w * devicePixelRatio; tl.height = h * devicePixelRatio;
  const ctx = tl.getContext('2d'); ctx.scale(devicePixelRatio, devicePixelRatio);
  const nb = Math.max(20, Math.floor(w / 5)); const span = T1 - T0 || 1; const bins = Array.from({ length: nb }, () => ({}));
  const errs = new Array(nb).fill(0);
  for (const e of allEv) { if (e.k !== 'tool') continue; const b = Math.min(nb - 1, Math.floor(((e.t - T0) / span) * nb)); bins[b][family(e.n)] = (bins[b][family(e.n)] || 0) + 1; if (e.err) errs[b]++; }
  const mx = Math.max(1, ...bins.map((b) => Object.values(b).reduce((a, v) => a + v, 0)));
  const bw = w / nb; const top = 8; const hh = h - top - 14;
  bins.forEach((b, i) => {
    let y = h - 14;
    for (const f of FAM_ORDER) { if (!b[f]) continue; const bh = (b[f] / mx) * hh; ctx.fillStyle = famColor(f); ctx.globalAlpha = (T0 + (i / nb) * span) <= now ? 0.9 : 0.25; ctx.fillRect(i * bw, y - bh, bw - 1, bh); y -= bh; }
    if (errs[i]) { ctx.globalAlpha = 1; ctx.fillStyle = css('--red'); ctx.fillRect(i * bw, 0, bw - 1, 4); }
  });
  ctx.globalAlpha = 1;
  // cumulative cost line
  ctx.strokeStyle = css('--amber'); ctx.lineWidth = 1.5; ctx.beginPath();
  const costEv = nodes.flatMap((n) => { let prev = 0; return n.ev.map((e) => { const d = e.acc - prev; prev = e.acc; return { t: e.t, d }; }); }).sort((a, b) => a.t - b.t);
  let c = 0; ctx.moveTo(0, h - 14);
  for (const e of costEv) { c += e.d; ctx.lineTo(((e.t - T0) / span) * w, h - 14 - (c / totalCost) * hh); }
  ctx.stroke();
  // hour ticks
  ctx.fillStyle = css('--muted'); ctx.font = '10px Segoe UI';
  const firstHour = Math.ceil(T0 / 1800000) * 1800000;
  for (let t = firstHour; t < T1; t += 1800000) { const x = ((t - T0) / span) * w; ctx.fillRect(x, h - 13, 1, 3); ctx.fillText(clock(t), x + 2, h - 2); }
  // playhead
  const px = ((Math.min(now, T1) - T0) / span) * w; ctx.fillStyle = css('--text'); ctx.fillRect(px - 1, 0, 2, h - 12);
}
function seek(ev) { const r = tl.getBoundingClientRect(); now = T0 + Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * (T1 - T0); render(); }
let dragging = false;
tl.addEventListener('pointerdown', (e) => { dragging = true; playing = false; setPlay(); seek(e); });
addEventListener('pointermove', (e) => { if (dragging) seek(e); });
addEventListener('pointerup', () => { dragging = false; });

// ---------- controls ----------
function setPlay() { $('play').textContent = playing ? '❚❚ Pause' : '▶ Play'; }
$('play').onclick = () => { if (now >= T1) now = T0; playing = !playing; setPlay(); };
$('end').onclick = () => { now = T1; playing = false; setPlay(); render(); };
document.querySelectorAll('[data-speed]').forEach((b) => b.onclick = () => { speed = Number(b.dataset.speed); document.querySelectorAll('[data-speed]').forEach((x) => x.classList.toggle('on', x === b)); });
document.querySelectorAll('[data-hl]').forEach((b) => b.onclick = () => { hl = b.dataset.hl; document.querySelectorAll('[data-hl]').forEach((x) => x.classList.toggle('on', x === b)); render(); });
document.querySelectorAll('[data-sort]').forEach((b) => b.onclick = () => { sortBy = b.dataset.sort; document.querySelectorAll('[data-sort]').forEach((x) => x.classList.toggle('on', x === b)); render(); });
addEventListener('resize', render);

let last = performance.now(); let acc = 0;
function tick(t) {
  const dt = t - last; last = t;
  if (playing) {
    now = Math.min(T1, now + dt * speed);
    acc += dt;
    if (acc > 120 || now >= T1) { acc = 0; render(); }
    if (now >= T1) { playing = false; setPlay(); }
  }
  requestAnimationFrame(tick);
}

$('prompt').textContent = root.label;
const q = new URLSearchParams(location.search);
if (q.get('at')) now = T0 + Number(q.get('at')) * (T1 - T0);
if (q.get('select')) selected = agents.slice().sort((a, b) => b.cost - a.cost)[0].id;
render();
requestAnimationFrame(tick);
</script>
