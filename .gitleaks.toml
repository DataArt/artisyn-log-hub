# gitleaks config — used by the git hooks (scripts/gitleaks-scan.js) and the CI workflow
# (.github/workflows/gitleaks.yml). The default rule set plus an allowlist of reviewed false
# positives. Add an entry only for a value that is verifiably not a secret, keep it as narrow as
# possible and say what it is. See docs/knowledgebase/git-hooks.md.

title = "Artisyn Log Hub"

[extend]
useDefault = true

# Content rules miss a bare token with no keyword or provider prefix around it (e.g. a file
# holding only a 64-char API key), so a key/keystore file is a finding by its name alone.
[[rules]]
id = "key-file"
description = "Private key, keystore or bare API key file committed"
path = '''(?i)(?:^|/)(?:[^/]+\.(?:key|pem|p12|pfx|jks|keystore|ppk)|id_(?:rsa|dsa|ecdsa|ed25519))$'''

[[allowlists]]
description = "Public PGP fingerprint of the git-core PPA signing key (docker-dev/Dockerfile)"
regexTarget = "match"
regexes = ['''^GIT_PPA_KEY_FPR=[0-9A-F]{40}$''']

[[allowlists]]
description = "Prose read as a generic API key (docs/qaa-overview/scenarios/03-session-view-reports-golden.md)"
regexes = ['''^glob/categories$''']

[[allowlists]]
description = "Fake OTEL collector header value used by the installer scenario to prove it never leaks (tests/scenarios/installer/s-inst-04.spec.ts)"
paths = ['''^tests/scenarios/installer/s-inst-04\.spec\.ts$''']
regexes = ['''^scn-collector-secret-7f3a91$''']
